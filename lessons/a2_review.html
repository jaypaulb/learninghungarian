<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 26: A2 Review & Extended Dialogue - Learning Hungarian</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; }
        th, td { border: 1px solid #e2e8f0; padding: 0.5rem 1rem; text-align: center; }
        th { background: #f1f5f9; }
    </style>
</head>
<body class="bg-slate-100 p-4 md:p-8">
    <header class="text-center mb-8">
        <div class="mb-4">
            <a href="../index.html" class="inline-flex items-center px-4 py-2 bg-slate-600 text-white text-sm font-medium rounded-lg hover:bg-slate-700 transition-colors">
                <svg class="mr-2 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                Back to Lessons
            </a>
        </div>
        <h1 class="text-3xl md:text-4xl font-bold text-slate-700">Lesson 26: A2 Review & Extended Dialogue <span class="block text-xl text-slate-500 font-normal">(A2 Attekintas es bovitett parbeszedek)</span></h1>
        <p class="text-slate-600 mt-2 max-w-2xl mx-auto">Consolidate your A2 Hungarian skills with this comprehensive review. Test yourself before advancing to B1!</p>
        <div class="mt-4 inline-flex gap-2">
            <span class="bg-indigo-100 text-indigo-800 px-3 py-1 rounded-full text-sm font-medium">CEFR Level: A2</span>
            <span class="bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm font-medium">Review Lesson</span>
        </div>
    </header>
    <main class="max-w-3xl mx-auto bg-white rounded-xl shadow-md p-6" id="main-content">
        <!-- Content will be generated by JavaScript -->
    </main>
    <footer class="text-center mt-12 py-4 border-t border-slate-300">
        <p class="text-sm text-slate-500">&copy; 2024 Hungarian Language Lessons</p>
    </footer>
    <script>
    const main = document.getElementById('main-content');

    // Helper function for accent-insensitive comparison
    function removeAccents(str) {
        return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[oOuUaAeEiI]/gi, function(m) {
            const map = { 'a':'a','A':'A','e':'e','E':'E','i':'i','I':'I','o':'o','O':'O','u':'u','U':'U' };
            return map[m] || m;
        }).toLowerCase();
    }

    // ==================== SECTION 1: MIXED GRAMMAR REVIEW ====================
    const grammarSection = document.createElement('section');
    grammarSection.className = 'mb-10';
    grammarSection.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4 border-b-2 border-indigo-500 pb-2">Section 1: Mixed Grammar Review</h2>
        <p class="mb-4 text-slate-600">Test your knowledge of A2 grammar concepts including verb conjugation, negation, and cases.</p>
        <div class="bg-indigo-50 p-4 rounded-lg mb-6">
            <h3 class="font-semibold text-indigo-800 mb-2">Grammar Topics Covered:</h3>
            <ul class="text-sm text-indigo-700 space-y-1">
                <li>- Definite and indefinite verb conjugation</li>
                <li>- Negation with nem and nincs</li>
                <li>- Accusative case (-t)</li>
                <li>- Location cases (inessive, superessive, adessive)</li>
                <li>- Present, past, and future verb tenses</li>
            </ul>
        </div>
        <h3 class="text-lg font-semibold text-slate-700 mb-3">Exercise 1.1: Grammar Fill-in-the-Blank</h3>
        <p class="mb-4 text-sm text-slate-500">Complete each sentence with the correct form. Press Enter to check.</p>
        <div id="grammar-exercise" class="space-y-3"></div>
        <div id="grammar-score" class="mt-4 text-slate-700 font-medium"></div>
    `;
    main.appendChild(grammarSection);

    const grammarQuestions = [
        { sentence: 'En ___ a konyvet. (I read the book - definite)', answer: 'olvasom', translation: 'I read the book.' },
        { sentence: 'Te ___ egy konyvet. (You read a book - indefinite)', answer: 'olvasol', translation: 'You read a book.' },
        { sentence: 'O ___ latja a hazat. (He doesn\'t see the house)', answer: 'nem', translation: 'He doesn\'t see the house.' },
        { sentence: '___ ido. (There is no time)', answer: 'nincs', translation: 'There is no time.' },
        { sentence: 'Latom a kuty___. (I see the dog - accusative)', answer: 'at', translation: 'I see the dog.' },
        { sentence: 'A konyv az asztal___. (The book is on the table)', answer: 'on', translation: 'The book is on the table.' },
        { sentence: 'Budapesten ___. (I live in Budapest)', answer: 'lakom', translation: 'I live in Budapest.' },
        { sentence: 'Tegnap moziba ___. (Yesterday I went to the cinema)', answer: 'mentem', translation: 'Yesterday I went to the cinema.' },
        { sentence: 'Holnap ___ utazom. (I will travel tomorrow)', answer: 'fogok', translation: 'I will travel tomorrow.' },
        { sentence: 'A gyerekek az iskolaban ___. (The children are in school)', answer: 'vannak', translation: 'The children are in school.' },
        { sentence: 'A hazban ___ emberek. (There are no people in the house)', answer: 'nincsenek', translation: 'There are no people in the house.' },
        { sentence: 'Kerem a viz___! (The water, please - accusative)', answer: 'et', translation: 'The water, please!' },
        { sentence: 'O Magyarorszagon ___. (She was born in Hungary)', answer: 'szuletett', translation: 'She was born in Hungary.' },
        { sentence: 'Mi ___ magyarul. (We are learning Hungarian)', answer: 'tanulunk', translation: 'We are learning Hungarian.' },
        { sentence: 'A vonat a peronon ___. (The train is at the platform)', answer: 'van', translation: 'The train is at the platform.' }
    ];

    const grammarDiv = document.getElementById('grammar-exercise');
    const grammarScoreDiv = document.getElementById('grammar-score');

    grammarQuestions.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col md:flex-row items-start md:items-center gap-2';
        const label = document.createElement('span');
        label.className = 'min-w-[280px] text-slate-800';
        label.textContent = q.sentence;
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-3 py-1 w-32 text-center focus:ring-2 focus:ring-indigo-500';
        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold';
        input.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') checkGrammarAnswer(idx);
        });
        wrapper.appendChild(label);
        wrapper.appendChild(input);
        wrapper.appendChild(feedback);
        grammarDiv.appendChild(wrapper);
    });

    function checkGrammarAnswer(idx) {
        const wrapper = grammarDiv.children[idx];
        const input = wrapper.querySelector('input');
        const feedback = wrapper.querySelector('span:last-child');
        const correct = grammarQuestions[idx].answer;
        const userAnswer = input.value.trim().toLowerCase();

        if (userAnswer === correct.toLowerCase()) {
            feedback.textContent = `Correct!`;
            feedback.className = 'text-sm font-semibold text-green-600';
        } else if (removeAccents(userAnswer) === removeAccents(correct)) {
            feedback.textContent = `Watch accents!`;
            feedback.className = 'text-sm font-semibold text-yellow-600';
        } else if (userAnswer === '') {
            feedback.textContent = '';
        } else {
            feedback.textContent = `Answer: ${correct}`;
            feedback.className = 'text-sm font-semibold text-red-600';
        }
        updateGrammarScore();
    }

    function updateGrammarScore() {
        let correct = 0;
        for (let i = 0; i < grammarQuestions.length; i++) {
            const feedback = grammarDiv.children[i].querySelector('span:last-child');
            if (feedback.textContent === 'Correct!') correct++;
        }
        grammarScoreDiv.textContent = `Score: ${correct} / ${grammarQuestions.length}`;
    }
    grammarScoreDiv.textContent = `Score: 0 / ${grammarQuestions.length}`;

    // ==================== SECTION 2: VOCABULARY CHALLENGE ====================
    const vocabSection = document.createElement('section');
    vocabSection.className = 'mb-10';
    vocabSection.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4 border-b-2 border-indigo-500 pb-2">Section 2: Vocabulary Challenge</h2>
        <p class="mb-4 text-slate-600">Test your vocabulary from A2 topics: transportation, weather, health, and daily life.</p>
        <h3 class="text-lg font-semibold text-slate-700 mb-3">Exercise 2.1: Translate to Hungarian</h3>
        <p class="mb-4 text-sm text-slate-500">Type the Hungarian translation for each word or phrase.</p>
        <div id="vocab-exercise" class="space-y-3"></div>
        <div id="vocab-score" class="mt-4 text-slate-700 font-medium"></div>
    `;
    main.appendChild(vocabSection);

    const vocabQuestions = [
        { english: 'train station', hungarian: 'palyaudvar', alternatives: ['allomos'] },
        { english: 'sunny', hungarian: 'napos', alternatives: [] },
        { english: 'headache', hungarian: 'fejfajas', alternatives: ['faj a fejem'] },
        { english: 'ticket', hungarian: 'jegy', alternatives: [] },
        { english: 'cold (weather)', hungarian: 'hideg', alternatives: [] },
        { english: 'doctor', hungarian: 'orvos', alternatives: [] },
        { english: 'bus stop', hungarian: 'buszmegallo', alternatives: ['megallo'] },
        { english: 'spring (season)', hungarian: 'tavasz', alternatives: [] },
        { english: 'pharmacy', hungarian: 'gyogyszertar', alternatives: ['patika'] },
        { english: 'tram', hungarian: 'villamos', alternatives: [] },
        { english: 'rainy', hungarian: 'esos', alternatives: [] },
        { english: 'medicine', hungarian: 'gyogyszer', alternatives: [] },
        { english: 'direction', hungarian: 'irany', alternatives: [] },
        { english: 'winter', hungarian: 'tel', alternatives: [] },
        { english: 'hospital', hungarian: 'korhaz', alternatives: [] }
    ];

    const vocabDiv = document.getElementById('vocab-exercise');
    const vocabScoreDiv = document.getElementById('vocab-score');

    vocabQuestions.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col md:flex-row items-start md:items-center gap-2';
        const label = document.createElement('span');
        label.className = 'min-w-[150px] text-slate-800 font-medium';
        label.textContent = q.english;
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = 'Hungarian...';
        input.className = 'border border-slate-300 rounded-md px-3 py-1 w-44 focus:ring-2 focus:ring-indigo-500';
        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold';
        input.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') checkVocabAnswer(idx);
        });
        wrapper.appendChild(label);
        wrapper.appendChild(input);
        wrapper.appendChild(feedback);
        vocabDiv.appendChild(wrapper);
    });

    function checkVocabAnswer(idx) {
        const wrapper = vocabDiv.children[idx];
        const input = wrapper.querySelector('input');
        const feedback = wrapper.querySelector('span:last-child');
        const q = vocabQuestions[idx];
        const userAnswer = input.value.trim().toLowerCase();
        const allCorrect = [q.hungarian, ...q.alternatives];

        const isExact = allCorrect.some(a => userAnswer === a.toLowerCase());
        const isAccent = allCorrect.some(a => removeAccents(userAnswer) === removeAccents(a));

        if (isExact) {
            feedback.textContent = 'Correct!';
            feedback.className = 'text-sm font-semibold text-green-600';
        } else if (isAccent) {
            feedback.textContent = 'Watch accents!';
            feedback.className = 'text-sm font-semibold text-yellow-600';
        } else if (userAnswer === '') {
            feedback.textContent = '';
        } else {
            feedback.textContent = `Answer: ${q.hungarian}`;
            feedback.className = 'text-sm font-semibold text-red-600';
        }
        updateVocabScore();
    }

    function updateVocabScore() {
        let correct = 0;
        for (let i = 0; i < vocabQuestions.length; i++) {
            const feedback = vocabDiv.children[i].querySelector('span:last-child');
            if (feedback.textContent === 'Correct!') correct++;
        }
        vocabScoreDiv.textContent = `Score: ${correct} / ${vocabQuestions.length}`;
    }
    vocabScoreDiv.textContent = `Score: 0 / ${vocabQuestions.length}`;

    // ==================== SECTION 3: EXTENDED DIALOGUE COMPLETION ====================
    const dialogueSection = document.createElement('section');
    dialogueSection.className = 'mb-10';
    dialogueSection.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4 border-b-2 border-indigo-500 pb-2">Section 3: Extended Dialogue Completion</h2>
        <p class="mb-4 text-slate-600">Complete these realistic Hungarian conversations by filling in the missing parts.</p>
        <h3 class="text-lg font-semibold text-slate-700 mb-3">Exercise 3.1: Complete the Conversations</h3>
        <div id="dialogue-exercise" class="space-y-6"></div>
        <div id="dialogue-score" class="mt-4 text-slate-700 font-medium"></div>
    `;
    main.appendChild(dialogueSection);

    const dialogueScenarios = [
        {
            context: 'At the train station',
            lines: [
                { speaker: 'You', text: 'Jo napot! Egy jegyet kerek ___-re.', answer: 'szegedre', hint: 'to Szeged', translation: 'One ticket to Szeged, please.' },
                { speaker: 'Clerk', text: 'Oda-vissza vagy csak ___?', answer: 'oda', hint: 'one-way', translation: 'Return or one-way?' }
            ]
        },
        {
            context: 'At the doctor\'s office',
            lines: [
                { speaker: 'Doctor', text: 'Mi a ___?', answer: 'panasz', hint: 'complaint', translation: 'What is the problem?' },
                { speaker: 'You', text: 'Faj a ___ es lazas vagyok.', answer: 'fejem', hint: 'head', translation: 'My head hurts and I have a fever.' }
            ]
        },
        {
            context: 'Talking about weather',
            lines: [
                { speaker: 'Friend', text: 'Milyen ido van ___?', answer: 'ma', hint: 'today', translation: 'What is the weather like today?' },
                { speaker: 'You', text: 'Napos van, de este ___ lesz.', answer: 'esos', hint: 'rainy', translation: 'It\'s sunny, but it will be rainy in the evening.' }
            ]
        },
        {
            context: 'Asking for directions',
            lines: [
                { speaker: 'You', text: 'Elnezest, ___ van a metro allomos?', answer: 'hol', hint: 'where', translation: 'Excuse me, where is the metro station?' },
                { speaker: 'Person', text: 'Menjen egyenesen, majd forduljon ___.', answer: 'balra', hint: 'left', translation: 'Go straight, then turn left.' }
            ]
        },
        {
            context: 'At the pharmacy',
            lines: [
                { speaker: 'You', text: 'Van ___ fejfajasra?', answer: 'gyogyszere', hint: 'medicine', translation: 'Do you have medicine for headaches?' },
                { speaker: 'Pharmacist', text: 'Igen, ez a tabletta ___ hatekony.', answer: 'nagyon', hint: 'very', translation: 'Yes, this tablet is very effective.' }
            ]
        }
    ];

    const dialogueDiv = document.getElementById('dialogue-exercise');
    const dialogueScoreDiv = document.getElementById('dialogue-score');
    let totalDialogueItems = 0;

    dialogueScenarios.forEach((scenario, sIdx) => {
        const card = document.createElement('div');
        card.className = 'bg-slate-50 p-4 rounded-lg';
        card.innerHTML = `<div class="text-sm font-semibold text-indigo-600 mb-3">Scenario: ${scenario.context}</div>`;

        scenario.lines.forEach((line, lIdx) => {
            totalDialogueItems++;
            const lineDiv = document.createElement('div');
            lineDiv.className = 'mb-3';
            lineDiv.innerHTML = `<span class="font-medium text-slate-700">${line.speaker}:</span> `;

            const textSpan = document.createElement('span');
            textSpan.className = 'text-slate-800';
            textSpan.textContent = line.text.split('___')[0];

            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = line.hint;
            input.className = 'border border-slate-300 rounded px-2 py-1 w-28 mx-1 text-center focus:ring-2 focus:ring-indigo-500';
            input.dataset.sIdx = sIdx;
            input.dataset.lIdx = lIdx;
            input.addEventListener('keydown', function(event) {
                if (event.key === 'Enter') checkDialogueAnswer(sIdx, lIdx);
            });

            const textAfter = document.createElement('span');
            textAfter.className = 'text-slate-800';
            textAfter.textContent = line.text.split('___')[1] || '';

            const feedback = document.createElement('span');
            feedback.className = 'text-sm font-semibold ml-2';
            feedback.dataset.sIdx = sIdx;
            feedback.dataset.lIdx = lIdx;

            lineDiv.appendChild(textSpan);
            lineDiv.appendChild(input);
            lineDiv.appendChild(textAfter);
            lineDiv.appendChild(feedback);
            card.appendChild(lineDiv);
        });

        dialogueDiv.appendChild(card);
    });

    function checkDialogueAnswer(sIdx, lIdx) {
        const scenario = dialogueScenarios[sIdx];
        const line = scenario.lines[lIdx];
        const card = dialogueDiv.children[sIdx];
        const inputs = card.querySelectorAll('input');
        const input = inputs[lIdx];
        const feedbacks = card.querySelectorAll('span[data-s-idx]');
        const feedback = feedbacks[lIdx];

        const userAnswer = input.value.trim().toLowerCase();
        const correct = line.answer;

        if (userAnswer === correct.toLowerCase() || removeAccents(userAnswer) === removeAccents(correct)) {
            feedback.textContent = 'Correct!';
            feedback.className = 'text-sm font-semibold ml-2 text-green-600';
        } else if (userAnswer === '') {
            feedback.textContent = '';
        } else {
            feedback.textContent = `(${correct})`;
            feedback.className = 'text-sm font-semibold ml-2 text-red-600';
        }
        updateDialogueScore();
    }

    function updateDialogueScore() {
        let correct = 0;
        dialogueScenarios.forEach((scenario, sIdx) => {
            const card = dialogueDiv.children[sIdx];
            const feedbacks = card.querySelectorAll('span[data-s-idx]');
            feedbacks.forEach(f => {
                if (f.textContent === 'Correct!') correct++;
            });
        });
        dialogueScoreDiv.textContent = `Score: ${correct} / ${totalDialogueItems}`;
    }
    dialogueScoreDiv.textContent = `Score: 0 / ${totalDialogueItems}`;

    // ==================== SECTION 4: ROLE-PLAY SCENARIOS ====================
    const roleplaySection = document.createElement('section');
    roleplaySection.className = 'mb-10';
    roleplaySection.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4 border-b-2 border-indigo-500 pb-2">Section 4: Role-Play Scenarios</h2>
        <p class="mb-4 text-slate-600">Respond appropriately to these real-world scenarios in Hungarian.</p>
        <h3 class="text-lg font-semibold text-slate-700 mb-3">Exercise 4.1: Respond to the Situations</h3>
        <div id="roleplay-exercise" class="space-y-4"></div>
        <div id="roleplay-score" class="mt-4 text-slate-700 font-medium"></div>
    `;
    main.appendChild(roleplaySection);

    const roleplayScenarios = [
        {
            situation: 'You arrive at a restaurant and want a table for two.',
            hint: 'Ask for a table',
            answer: 'egy asztalt kerek kettonek',
            alternatives: ['kerek egy asztalt ket fore', 'kettonek kerek asztalt'],
            translation: 'A table for two, please.'
        },
        {
            situation: 'Your friend asks how you are. You feel great!',
            hint: 'Say you feel great',
            answer: 'nagyon jol vagyok',
            alternatives: ['jol vagyok', 'remekul vagyok'],
            translation: 'I feel great!'
        },
        {
            situation: 'You need to buy a metro ticket.',
            hint: 'Ask for a ticket',
            answer: 'egy metro jegyet kerek',
            alternatives: ['kerek egy metro jegyet', 'jegyet kerek'],
            translation: 'One metro ticket, please.'
        },
        {
            situation: 'Someone asks what the weather will be like tomorrow.',
            hint: 'Say it will rain',
            answer: 'holnap esni fog',
            alternatives: ['holnap esos lesz', 'esik az eso holnap'],
            translation: 'It will rain tomorrow.'
        },
        {
            situation: 'At the pharmacy, you need something for a cold.',
            hint: 'Ask for cold medicine',
            answer: 'megfazasra kerek gyogyszert',
            alternatives: ['van gyogyszere megfazasra', 'megfazas ellen kerek valamit'],
            translation: 'I want medicine for a cold.'
        },
        {
            situation: 'You\'re lost and need to find the city center.',
            hint: 'Ask for directions',
            answer: 'merre van a varos kozpontja',
            alternatives: ['hol van a belvaros', 'hogy jutok a kozpontba'],
            translation: 'Which way is the city center?'
        },
        {
            situation: 'A friend invites you to swim but it\'s too cold.',
            hint: 'Say it\'s too cold',
            answer: 'tul hideg van uszni',
            alternatives: ['nagyon hideg van', 'hideg van az uszashoz'],
            translation: 'It\'s too cold to swim.'
        },
        {
            situation: 'You want to know when the next train to Debrecen leaves.',
            hint: 'Ask about train time',
            answer: 'mikor indul a kovetkezo vonat debrecenbe',
            alternatives: ['mikor megy a vonat debrecenbe', 'debrecenbe mikor van vonat'],
            translation: 'When does the next train to Debrecen leave?'
        }
    ];

    const roleplayDiv = document.getElementById('roleplay-exercise');
    const roleplayScoreDiv = document.getElementById('roleplay-score');

    roleplayScenarios.forEach((scenario, idx) => {
        const card = document.createElement('div');
        card.className = 'bg-slate-50 p-4 rounded-lg';
        card.innerHTML = `
            <p class="text-slate-700 mb-2">${scenario.situation}</p>
            <p class="text-slate-500 text-sm italic mb-2">(${scenario.hint})</p>
        `;
        const inputRow = document.createElement('div');
        inputRow.className = 'flex flex-col md:flex-row items-start md:items-center gap-2';
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = 'Your response in Hungarian...';
        input.className = 'border border-slate-300 rounded-md px-3 py-2 w-full md:w-80 focus:ring-2 focus:ring-indigo-500';
        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold';
        input.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') checkRoleplayAnswer(idx);
        });
        inputRow.appendChild(input);
        inputRow.appendChild(feedback);
        card.appendChild(inputRow);
        roleplayDiv.appendChild(card);
    });

    function checkRoleplayAnswer(idx) {
        const card = roleplayDiv.children[idx];
        const input = card.querySelector('input');
        const feedback = card.querySelector('span');
        const scenario = roleplayScenarios[idx];
        const userAnswer = input.value.trim().toLowerCase().replace(/[?.!,]/g, '');
        const normalizedUser = removeAccents(userAnswer);

        const allCorrect = [scenario.answer, ...scenario.alternatives];
        const isExact = allCorrect.some(a => userAnswer === a.toLowerCase().replace(/[?.!,]/g, ''));
        const isAccent = allCorrect.some(a => normalizedUser === removeAccents(a.replace(/[?.!,]/g, '')));

        if (isExact) {
            feedback.textContent = `Correct! (${scenario.translation})`;
            feedback.className = 'text-sm font-semibold text-green-600';
        } else if (isAccent) {
            feedback.textContent = `Watch accents! (${scenario.translation})`;
            feedback.className = 'text-sm font-semibold text-yellow-600';
        } else if (userAnswer === '') {
            feedback.textContent = '';
        } else {
            feedback.textContent = `Try: ${scenario.answer}`;
            feedback.className = 'text-sm font-semibold text-red-600';
        }
        updateRoleplayScore();
    }

    function updateRoleplayScore() {
        let correct = 0;
        for (let i = 0; i < roleplayScenarios.length; i++) {
            const feedback = roleplayDiv.children[i].querySelector('span');
            if (feedback.textContent.startsWith('Correct!')) correct++;
        }
        roleplayScoreDiv.textContent = `Score: ${correct} / ${roleplayScenarios.length}`;
    }
    roleplayScoreDiv.textContent = `Score: 0 / ${roleplayScenarios.length}`;

    // ==================== SECTION 5: B1 READINESS SELF-ASSESSMENT ====================
    const assessmentSection = document.createElement('section');
    assessmentSection.className = 'mb-10';
    assessmentSection.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4 border-b-2 border-indigo-500 pb-2">Section 5: B1 Readiness Self-Assessment</h2>
        <p class="mb-4 text-slate-600">Check off the skills you feel confident about. Aim for at least 80% to move to B1!</p>
        <div id="assessment-checklist" class="space-y-3"></div>
        <div id="assessment-result" class="mt-6 p-4 bg-slate-50 rounded-lg"></div>
    `;
    main.appendChild(assessmentSection);

    const assessmentItems = [
        'I can use definite verb conjugation correctly',
        'I can use indefinite verb conjugation correctly',
        'I understand when to use nem vs nincs for negation',
        'I can form the accusative case (-t) correctly',
        'I can use location cases (on, in, at)',
        'I can describe the weather and seasons',
        'I can name body parts and describe symptoms',
        'I can have a basic conversation at a doctor\'s office',
        'I can buy tickets and ask for directions',
        'I can talk about daily activities in present tense',
        'I can talk about past events using past tense',
        'I can talk about future plans',
        'I understand simple written texts in Hungarian',
        'I can follow simple conversations',
        'I feel ready to learn more complex grammar'
    ];

    const assessmentDiv = document.getElementById('assessment-checklist');
    const assessmentResult = document.getElementById('assessment-result');

    assessmentItems.forEach((item, idx) => {
        const wrapper = document.createElement('label');
        wrapper.className = 'flex items-center gap-3 p-2 rounded hover:bg-slate-50 cursor-pointer';
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'w-5 h-5 text-indigo-600 rounded focus:ring-indigo-500';
        checkbox.addEventListener('change', updateAssessment);
        const text = document.createElement('span');
        text.className = 'text-slate-700';
        text.textContent = item;
        wrapper.appendChild(checkbox);
        wrapper.appendChild(text);
        assessmentDiv.appendChild(wrapper);
    });

    function updateAssessment() {
        const checkboxes = assessmentDiv.querySelectorAll('input[type="checkbox"]');
        let checked = 0;
        checkboxes.forEach(cb => { if (cb.checked) checked++; });
        const percentage = Math.round((checked / assessmentItems.length) * 100);

        let message, bgColor;
        if (percentage >= 80) {
            message = `Congratulations! You scored ${percentage}% - You're ready for B1! 🎉`;
            bgColor = 'bg-green-100 text-green-800';
        } else if (percentage >= 60) {
            message = `Good progress! You scored ${percentage}% - Review the unchecked areas before B1.`;
            bgColor = 'bg-yellow-100 text-yellow-800';
        } else {
            message = `You scored ${percentage}% - Keep practicing A2 material before moving on.`;
            bgColor = 'bg-red-100 text-red-800';
        }

        assessmentResult.innerHTML = `
            <p class="font-semibold mb-2">Your Score: ${checked}/${assessmentItems.length} (${percentage}%)</p>
            <p class="${bgColor} p-3 rounded">${message}</p>
        `;
    }
    updateAssessment();

    // ==================== LESSON SUMMARY ====================
    const summarySection = document.createElement('section');
    summarySection.className = 'mt-10 p-6 bg-indigo-50 rounded-xl';
    summarySection.innerHTML = `
        <h2 class="text-2xl font-bold text-indigo-800 mb-4">A2 Level Complete!</h2>
        <p class="text-indigo-700 mb-4">You've completed the A2 review. Here's what you've accomplished:</p>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
            <div class="bg-white p-3 rounded-lg">
                <p class="font-semibold text-indigo-800">Grammar Mastery:</p>
                <p class="text-slate-600">Verb conjugation, negation, cases, tenses</p>
            </div>
            <div class="bg-white p-3 rounded-lg">
                <p class="font-semibold text-indigo-800">Vocabulary Topics:</p>
                <p class="text-slate-600">Transport, weather, health, daily life</p>
            </div>
            <div class="bg-white p-3 rounded-lg">
                <p class="font-semibold text-indigo-800">Communication Skills:</p>
                <p class="text-slate-600">Dialogues, role-plays, real scenarios</p>
            </div>
            <div class="bg-white p-3 rounded-lg">
                <p class="font-semibold text-indigo-800">Next Steps:</p>
                <p class="text-slate-600">Continue to B1 for intermediate Hungarian!</p>
            </div>
        </div>
        <div class="mt-4 p-3 bg-white rounded-lg">
            <p class="font-semibold text-indigo-800">Total Exercises in This Review:</p>
            <p class="text-slate-600">50+ interactive exercises across 5 sections</p>
        </div>
    `;
    main.appendChild(summarySection);
    </script>
</body>
</html>
