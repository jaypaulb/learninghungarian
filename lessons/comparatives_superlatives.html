<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 33: Comparatives & Superlatives - Learning Hungarian</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; }
        th, td { border: 1px solid #e2e8f0; padding: 0.5rem 1rem; text-align: center; }
        th { background: #f1f5f9; }
        .grammar-note { background: linear-gradient(135deg, #f0fdfa 0%, #e0f2fe 100%); border-left: 4px solid #0f766e; }
        .warning-note { background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); border-left: 4px solid #d97706; }
    </style>
</head>
<body class="bg-slate-100 p-4 md:p-8">
    <header class="text-center mb-8">
        <div class="mb-4">
            <a href="../index.html" class="inline-flex items-center px-4 py-2 bg-slate-600 text-white text-sm font-medium rounded-lg hover:bg-slate-700 transition-colors">
                <svg class="mr-2 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                Back to Lessons
            </a>
        </div>
        <h1 class="text-3xl md:text-4xl font-bold text-slate-700">Lesson 33: Comparatives & Superlatives</h1>
        <p class="text-slate-600 mt-1 max-w-2xl mx-auto">Learn how to compare things in Hungarian - saying something is bigger, smaller, better, or the best!</p>
    </header>
    <main class="max-w-3xl mx-auto bg-white rounded-xl shadow-md p-6" id="main-content">
    </main>
    <footer class="text-center mt-12 py-4 border-t border-slate-300">
        <p class="text-sm text-slate-500">&copy; 2024 Hungarian Language Lessons</p>
    </footer>
    <script>
    const mainContent = document.getElementById('main-content');

    function removeAccents(str) {
        return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[oOuUaAeEiI]/g, m => ({ 'a':'a','A':'A','e':'e','E':'E','i':'i','I':'I','o':'o','O':'O','u':'u','U':'U' }[m] || m));
    }
    function normalizeHungarian(str) { return str.trim().toLowerCase(); }
    function checkWithAccentWarning(input, correct) {
        const i = normalizeHungarian(input), c = normalizeHungarian(correct);
        if (i === c) return 'correct';
        if (removeAccents(i) === removeAccents(c)) return 'accent-warning';
        return 'incorrect';
    }

    // ==================== SECTION 1: COMPARATIVES ====================
    const section1 = document.createElement('section');
    section1.className = 'mb-8';
    section1.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 1: Forming Comparatives</h2>
        <p class="mb-4 text-slate-600">In Hungarian, comparatives (bigger, faster, better) are formed by adding the suffix <strong>-bb</strong> to adjectives.</p>

        <h3 class="text-lg font-semibold text-slate-700 mb-2">Basic Pattern</h3>
        <table class="mb-4 w-full border text-sm">
            <tr><th class="border px-2">Adjective</th><th class="border px-2">Meaning</th><th class="border px-2">Comparative</th><th class="border px-2">Meaning</th></tr>
            <tr><td class="border px-2">nagy</td><td class="border px-2">big</td><td class="border px-2 font-medium">nagyobb</td><td class="border px-2">bigger</td></tr>
            <tr><td class="border px-2">kicsi</td><td class="border px-2">small</td><td class="border px-2 font-medium">kisebb</td><td class="border px-2">smaller</td></tr>
            <tr><td class="border px-2">szep</td><td class="border px-2">beautiful</td><td class="border px-2 font-medium">szebb</td><td class="border px-2">more beautiful</td></tr>
            <tr><td class="border px-2">jo</td><td class="border px-2">good</td><td class="border px-2 font-medium">jobb</td><td class="border px-2">better</td></tr>
            <tr><td class="border px-2">rossz</td><td class="border px-2">bad</td><td class="border px-2 font-medium">rosszabb</td><td class="border px-2">worse</td></tr>
            <tr><td class="border px-2">gyors</td><td class="border px-2">fast</td><td class="border px-2 font-medium">gyorsabb</td><td class="border px-2">faster</td></tr>
            <tr><td class="border px-2">lassu</td><td class="border px-2">slow</td><td class="border px-2 font-medium">lassabb</td><td class="border px-2">slower</td></tr>
            <tr><td class="border px-2">magas</td><td class="border px-2">tall</td><td class="border px-2 font-medium">magasabb</td><td class="border px-2">taller</td></tr>
        </table>

        <div class="grammar-note p-4 rounded-lg mb-4">
            <h4 class="font-semibold text-teal-800 mb-2">Vowel Changes</h4>
            <p class="text-slate-700 text-sm">Some adjectives drop their final vowel before -bb: <strong>kicsi → kisebb</strong> (not kicsib), <strong>szep → szebb</strong></p>
        </div>

        <h3 class="text-lg font-semibold text-slate-700 mb-2">Using "than" (mint)</h3>
        <p class="mb-4 text-slate-600">To make comparisons, use <strong>mint</strong> (than) or the ablative case <strong>-nal/-nel</strong>:</p>
        <ul class="list-disc pl-6 mb-4 text-slate-600">
            <li><strong>Peter magasabb, mint Maria.</strong> (Peter is taller than Maria.)</li>
            <li><strong>Peter magasabb Marianal.</strong> (Peter is taller than Maria. - using ablative)</li>
            <li><strong>Ez a haz nagyobb, mint az.</strong> (This house is bigger than that one.)</li>
        </ul>
    `;
    mainContent.appendChild(section1);

    // ==================== SECTION 2: SUPERLATIVES ====================
    const section2 = document.createElement('section');
    section2.className = 'mb-8';
    section2.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 2: Forming Superlatives</h2>
        <p class="mb-4 text-slate-600">Superlatives (biggest, fastest, best) are formed by adding <strong>leg-</strong> prefix to the comparative form.</p>

        <h3 class="text-lg font-semibold text-slate-700 mb-2">Superlative Formation</h3>
        <table class="mb-4 w-full border text-sm">
            <tr><th class="border px-2">Adjective</th><th class="border px-2">Comparative</th><th class="border px-2">Superlative</th><th class="border px-2">Meaning</th></tr>
            <tr><td class="border px-2">nagy</td><td class="border px-2">nagyobb</td><td class="border px-2 font-medium">legnagyobb</td><td class="border px-2">biggest</td></tr>
            <tr><td class="border px-2">kicsi</td><td class="border px-2">kisebb</td><td class="border px-2 font-medium">legkisebb</td><td class="border px-2">smallest</td></tr>
            <tr><td class="border px-2">jo</td><td class="border px-2">jobb</td><td class="border px-2 font-medium">legjobb</td><td class="border px-2">best</td></tr>
            <tr><td class="border px-2">rossz</td><td class="border px-2">rosszabb</td><td class="border px-2 font-medium">legrosszabb</td><td class="border px-2">worst</td></tr>
            <tr><td class="border px-2">szep</td><td class="border px-2">szebb</td><td class="border px-2 font-medium">legszebb</td><td class="border px-2">most beautiful</td></tr>
            <tr><td class="border px-2">gyors</td><td class="border px-2">gyorsabb</td><td class="border px-2 font-medium">leggyorsabb</td><td class="border px-2">fastest</td></tr>
            <tr><td class="border px-2">magas</td><td class="border px-2">magasabb</td><td class="border px-2 font-medium">legmagasabb</td><td class="border px-2">tallest</td></tr>
            <tr><td class="border px-2">draga</td><td class="border px-2">dragabb</td><td class="border px-2 font-medium">legdragabb</td><td class="border px-2">most expensive</td></tr>
        </table>

        <h3 class="text-lg font-semibold text-slate-700 mb-2">Examples</h3>
        <ul class="list-disc pl-6 mb-4 text-slate-600">
            <li><strong>Ez a legjobb film.</strong> (This is the best film.)</li>
            <li><strong>O a legmagasabb a csapatban.</strong> (He is the tallest in the team.)</li>
            <li><strong>Budapest a legnagyobb magyar varos.</strong> (Budapest is the biggest Hungarian city.)</li>
        </ul>
    `;
    mainContent.appendChild(section2);

    // ==================== SECTION 3: IRREGULAR FORMS ====================
    const section3 = document.createElement('section');
    section3.className = 'mb-8';
    section3.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 3: Irregular Comparatives & Superlatives</h2>
        <p class="mb-4 text-slate-600">Some common adjectives have irregular comparative and superlative forms:</p>

        <table class="mb-4 w-full border text-sm">
            <tr><th class="border px-2">Adjective</th><th class="border px-2">Meaning</th><th class="border px-2">Comparative</th><th class="border px-2">Superlative</th></tr>
            <tr><td class="border px-2 font-medium">jo</td><td class="border px-2">good</td><td class="border px-2 font-medium">jobb</td><td class="border px-2 font-medium">legjobb</td></tr>
            <tr><td class="border px-2 font-medium">sok</td><td class="border px-2">many/much</td><td class="border px-2 font-medium">tobb</td><td class="border px-2 font-medium">legtobb</td></tr>
            <tr><td class="border px-2 font-medium">keves</td><td class="border px-2">few/little</td><td class="border px-2 font-medium">kevesebb</td><td class="border px-2 font-medium">legkevesebb</td></tr>
            <tr><td class="border px-2 font-medium">kicsi</td><td class="border px-2">small</td><td class="border px-2 font-medium">kisebb</td><td class="border px-2 font-medium">legkisebb</td></tr>
            <tr><td class="border px-2 font-medium">szep</td><td class="border px-2">beautiful</td><td class="border px-2 font-medium">szebb</td><td class="border px-2 font-medium">legszebb</td></tr>
            <tr><td class="border px-2 font-medium">hosszu</td><td class="border px-2">long</td><td class="border px-2 font-medium">hosszabb</td><td class="border px-2 font-medium">leghosszabb</td></tr>
            <tr><td class="border px-2 font-medium">bator</td><td class="border px-2">brave</td><td class="border px-2 font-medium">batrabb</td><td class="border px-2 font-medium">legbatrabb</td></tr>
        </table>

        <div class="warning-note p-4 rounded-lg mb-4">
            <h4 class="font-semibold text-amber-800 mb-2">Common Mistakes</h4>
            <p class="text-slate-700 text-sm">
                - sok (many) → <strong>tobb</strong> (more), NOT sokabb<br>
                - jo (good) → <strong>jobb</strong> (better), NOT joabb<br>
                - kicsi (small) → <strong>kisebb</strong>, NOT kicsib
            </p>
        </div>
    `;
    mainContent.appendChild(section3);

    // ==================== SECTION 4: ADVERB COMPARISONS ====================
    const section4 = document.createElement('section');
    section4.className = 'mb-8';
    section4.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 4: Comparing Adverbs</h2>
        <p class="mb-4 text-slate-600">Adverbs follow the same pattern as adjectives:</p>

        <table class="mb-4 w-full border text-sm">
            <tr><th class="border px-2">Adverb</th><th class="border px-2">Meaning</th><th class="border px-2">Comparative</th><th class="border px-2">Superlative</th></tr>
            <tr><td class="border px-2">gyorsan</td><td class="border px-2">quickly</td><td class="border px-2 font-medium">gyorsabban</td><td class="border px-2 font-medium">leggyorsabban</td></tr>
            <tr><td class="border px-2">lassan</td><td class="border px-2">slowly</td><td class="border px-2 font-medium">lassabban</td><td class="border px-2 font-medium">leglassabban</td></tr>
            <tr><td class="border px-2">jol</td><td class="border px-2">well</td><td class="border px-2 font-medium">jobban</td><td class="border px-2 font-medium">legjobban</td></tr>
            <tr><td class="border px-2">rosszul</td><td class="border px-2">badly</td><td class="border px-2 font-medium">rosszabbul</td><td class="border px-2 font-medium">legrosszabbul</td></tr>
            <tr><td class="border px-2">szepen</td><td class="border px-2">beautifully</td><td class="border px-2 font-medium">szebben</td><td class="border px-2 font-medium">legszebben</td></tr>
        </table>

        <h3 class="text-lg font-semibold text-slate-700 mb-2">Examples</h3>
        <ul class="list-disc pl-6 mb-4 text-slate-600">
            <li><strong>O gyorsabban fut, mint en.</strong> (He runs faster than me.)</li>
            <li><strong>Maria a legszebben enekel.</strong> (Maria sings the most beautifully.)</li>
            <li><strong>Jobban ertem most.</strong> (I understand better now.)</li>
        </ul>
    `;
    mainContent.appendChild(section4);

    // ==================== STAGE 1: COMPARATIVE FORMATION (12 items) ====================
    const stage1Data = [
        { adj: 'nagy', answer: 'nagyobb', meaning: 'bigger' },
        { adj: 'kicsi', answer: 'kisebb', meaning: 'smaller' },
        { adj: 'jo', answer: 'jobb', meaning: 'better' },
        { adj: 'rossz', answer: 'rosszabb', meaning: 'worse' },
        { adj: 'gyors', answer: 'gyorsabb', meaning: 'faster' },
        { adj: 'lassu', answer: 'lassabb', meaning: 'slower' },
        { adj: 'szep', answer: 'szebb', meaning: 'more beautiful' },
        { adj: 'magas', answer: 'magasabb', meaning: 'taller' },
        { adj: 'draga', answer: 'dragabb', meaning: 'more expensive' },
        { adj: 'olcso', answer: 'olcsobb', meaning: 'cheaper' },
        { adj: 'hosszu', answer: 'hosszabb', meaning: 'longer' },
        { adj: 'rovid', answer: 'rovidebb', meaning: 'shorter' }
    ];

    const stage1Section = document.createElement('section');
    stage1Section.className = 'mb-8';
    stage1Section.innerHTML = `
        <h2 class="text-xl font-semibold text-slate-700 mb-2">Stage 1: Form the Comparative</h2>
        <p class="mb-4 text-slate-600">Write the comparative form of each adjective. Press Enter to check.</p>
        <div id="stage1-exercise" class="space-y-4"></div>
        <div id="stage1-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${stage1Data.length}</div>
    `;
    mainContent.appendChild(stage1Section);

    const stage1Exercise = document.getElementById('stage1-exercise');
    const stage1Score = document.getElementById('stage1-score');
    let stage1Results = new Array(stage1Data.length).fill(null);

    stage1Data.forEach((item, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col gap-2 bg-slate-50 p-4 rounded-lg';
        wrapper.innerHTML = `
            <p class="font-medium text-slate-700">${idx + 1}. ${item.adj} → "${item.meaning}"</p>
            <div class="flex flex-col md:flex-row items-start md:items-center gap-2">
                <input type="text" class="border border-slate-300 rounded-md px-3 py-2 w-full md:w-48 focus:ring-2 focus:ring-teal-500" placeholder="Type comparative...">
                <span class="text-sm font-semibold stage1-feedback"></span>
            </div>
        `;
        stage1Exercise.appendChild(wrapper);
        const input = wrapper.querySelector('input');
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkStage1(idx, input, wrapper); });
    });

    function checkStage1(idx, input, wrapper) {
        const feedback = wrapper.querySelector('.stage1-feedback');
        const item = stage1Data[idx];
        const result = checkWithAccentWarning(input.value, item.answer);
        if (result === 'correct') {
            feedback.textContent = `Correct! "${item.answer}"`;
            feedback.className = 'text-sm font-semibold text-green-600 stage1-feedback';
            stage1Results[idx] = true;
        } else if (result === 'accent-warning') {
            feedback.textContent = `Almost! "${item.answer}"`;
            feedback.className = 'text-sm font-semibold text-yellow-600 stage1-feedback';
            stage1Results[idx] = 'partial';
        } else if (input.value.trim() === '') {
            feedback.textContent = ''; stage1Results[idx] = null;
        } else {
            feedback.textContent = `Expected: "${item.answer}"`;
            feedback.className = 'text-sm font-semibold text-red-600 stage1-feedback';
            stage1Results[idx] = false;
        }
        stage1Score.textContent = `Score: ${stage1Results.filter(r => r === true).length} / ${stage1Data.length}`;
    }

    // ==================== STAGE 2: SUPERLATIVE FORMATION (10 items) ====================
    const stage2Data = [
        { adj: 'nagy', answer: 'legnagyobb', meaning: 'biggest' },
        { adj: 'kicsi', answer: 'legkisebb', meaning: 'smallest' },
        { adj: 'jo', answer: 'legjobb', meaning: 'best' },
        { adj: 'rossz', answer: 'legrosszabb', meaning: 'worst' },
        { adj: 'gyors', answer: 'leggyorsabb', meaning: 'fastest' },
        { adj: 'szep', answer: 'legszebb', meaning: 'most beautiful' },
        { adj: 'magas', answer: 'legmagasabb', meaning: 'tallest' },
        { adj: 'draga', answer: 'legdragabb', meaning: 'most expensive' },
        { adj: 'sok', answer: 'legtobb', meaning: 'most' },
        { adj: 'hosszu', answer: 'leghosszabb', meaning: 'longest' }
    ];

    const stage2Section = document.createElement('section');
    stage2Section.className = 'mb-8';
    stage2Section.innerHTML = `
        <h2 class="text-xl font-semibold text-slate-700 mb-2">Stage 2: Form the Superlative</h2>
        <p class="mb-4 text-slate-600">Write the superlative form of each adjective. Press Enter to check.</p>
        <div id="stage2-exercise" class="space-y-4"></div>
        <div id="stage2-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${stage2Data.length}</div>
    `;
    mainContent.appendChild(stage2Section);

    const stage2Exercise = document.getElementById('stage2-exercise');
    const stage2Score = document.getElementById('stage2-score');
    let stage2Results = new Array(stage2Data.length).fill(null);

    stage2Data.forEach((item, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col gap-2 bg-slate-50 p-4 rounded-lg';
        wrapper.innerHTML = `
            <p class="font-medium text-slate-700">${idx + 1}. ${item.adj} → "${item.meaning}"</p>
            <div class="flex flex-col md:flex-row items-start md:items-center gap-2">
                <input type="text" class="border border-slate-300 rounded-md px-3 py-2 w-full md:w-48 focus:ring-2 focus:ring-teal-500" placeholder="Type superlative...">
                <span class="text-sm font-semibold stage2-feedback"></span>
            </div>
        `;
        stage2Exercise.appendChild(wrapper);
        const input = wrapper.querySelector('input');
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkStage2(idx, input, wrapper); });
    });

    function checkStage2(idx, input, wrapper) {
        const feedback = wrapper.querySelector('.stage2-feedback');
        const item = stage2Data[idx];
        const result = checkWithAccentWarning(input.value, item.answer);
        if (result === 'correct') {
            feedback.textContent = `Correct! "${item.answer}"`;
            feedback.className = 'text-sm font-semibold text-green-600 stage2-feedback';
            stage2Results[idx] = true;
        } else if (result === 'accent-warning') {
            feedback.textContent = `Almost! "${item.answer}"`;
            feedback.className = 'text-sm font-semibold text-yellow-600 stage2-feedback';
            stage2Results[idx] = 'partial';
        } else if (input.value.trim() === '') {
            feedback.textContent = ''; stage2Results[idx] = null;
        } else {
            feedback.textContent = `Expected: "${item.answer}"`;
            feedback.className = 'text-sm font-semibold text-red-600 stage2-feedback';
            stage2Results[idx] = false;
        }
        stage2Score.textContent = `Score: ${stage2Results.filter(r => r === true).length} / ${stage2Data.length}`;
    }

    // ==================== STAGE 3: SENTENCE COMPLETION (10 items) ====================
    const stage3Data = [
        { sentence: 'Peter _____, mint Maria.', blank: 'magasabb', translation: 'Peter is taller than Maria.' },
        { sentence: 'Ez a _____ film.', blank: 'legjobb', translation: 'This is the best film.' },
        { sentence: 'Az auto _____ a biciklinel.', blank: 'gyorsabb', translation: 'The car is faster than the bicycle.' },
        { sentence: 'O a _____ tanar az iskolaban.', blank: 'legjobb', translation: 'He is the best teacher in the school.' },
        { sentence: 'Ez a konyv _____, mint az.', blank: 'erdekesebb', translation: 'This book is more interesting than that one.' },
        { sentence: 'Budapest a _____ magyar varos.', blank: 'legnagyobb', translation: 'Budapest is the biggest Hungarian city.' },
        { sentence: 'Ma _____ van, mint tegnap.', blank: 'melegebb', translation: 'Today is warmer than yesterday.' },
        { sentence: 'O _____ fut nalnam.', blank: 'gyorsabban', translation: 'He runs faster than me.' },
        { sentence: 'Ez a _____ eterem a varosban.', blank: 'legdragabb', translation: 'This is the most expensive restaurant in the city.' },
        { sentence: 'Maria _____ erti, mint en.', blank: 'jobban', translation: 'Maria understands better than me.' }
    ];

    const stage3Section = document.createElement('section');
    stage3Section.className = 'mb-8';
    stage3Section.innerHTML = `
        <h2 class="text-xl font-semibold text-slate-700 mb-2">Stage 3: Complete the Sentence</h2>
        <p class="mb-4 text-slate-600">Fill in the blank with the correct comparative or superlative. Press Enter to check.</p>
        <div id="stage3-exercise" class="space-y-4"></div>
        <div id="stage3-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${stage3Data.length}</div>
    `;
    mainContent.appendChild(stage3Section);

    const stage3Exercise = document.getElementById('stage3-exercise');
    const stage3Score = document.getElementById('stage3-score');
    let stage3Results = new Array(stage3Data.length).fill(null);

    stage3Data.forEach((item, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col gap-2 bg-slate-50 p-4 rounded-lg';
        wrapper.innerHTML = `
            <p class="font-medium text-slate-700">${idx + 1}. ${item.sentence}</p>
            <p class="text-sm text-slate-500">(${item.translation})</p>
            <div class="flex flex-col md:flex-row items-start md:items-center gap-2">
                <input type="text" class="border border-slate-300 rounded-md px-3 py-2 w-full md:w-48 focus:ring-2 focus:ring-teal-500" placeholder="Fill in blank...">
                <span class="text-sm font-semibold stage3-feedback"></span>
            </div>
        `;
        stage3Exercise.appendChild(wrapper);
        const input = wrapper.querySelector('input');
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkStage3(idx, input, wrapper); });
    });

    function checkStage3(idx, input, wrapper) {
        const feedback = wrapper.querySelector('.stage3-feedback');
        const item = stage3Data[idx];
        const result = checkWithAccentWarning(input.value, item.blank);
        if (result === 'correct') {
            feedback.textContent = `Correct!`;
            feedback.className = 'text-sm font-semibold text-green-600 stage3-feedback';
            stage3Results[idx] = true;
        } else if (result === 'accent-warning') {
            feedback.textContent = `Almost! "${item.blank}"`;
            feedback.className = 'text-sm font-semibold text-yellow-600 stage3-feedback';
            stage3Results[idx] = 'partial';
        } else if (input.value.trim() === '') {
            feedback.textContent = ''; stage3Results[idx] = null;
        } else {
            feedback.textContent = `Expected: "${item.blank}"`;
            feedback.className = 'text-sm font-semibold text-red-600 stage3-feedback';
            stage3Results[idx] = false;
        }
        stage3Score.textContent = `Score: ${stage3Results.filter(r => r === true).length} / ${stage3Data.length}`;
    }

    // ==================== STAGE 4: TRANSLATION (10 items) ====================
    const stage4Data = [
        { english: 'This house is bigger.', hungarian: 'Ez a haz nagyobb.' },
        { english: 'She is the best.', hungarian: 'O a legjobb.' },
        { english: 'Peter runs faster than Maria.', hungarian: 'Peter gyorsabban fut, mint Maria.' },
        { english: 'This is the most beautiful city.', hungarian: 'Ez a legszebb varos.' },
        { english: 'I understand better now.', hungarian: 'Most jobban ertem.' },
        { english: 'The train is faster than the bus.', hungarian: 'A vonat gyorsabb, mint a busz.' },
        { english: 'He is the tallest in the class.', hungarian: 'O a legmagasabb az osztalyban.' },
        { english: 'This is more expensive.', hungarian: 'Ez dragabb.' },
        { english: 'She sings more beautifully.', hungarian: 'O szebben enekel.' },
        { english: 'This is the worst film.', hungarian: 'Ez a legrosszabb film.' }
    ];

    const stage4Section = document.createElement('section');
    stage4Section.className = 'mb-8';
    stage4Section.innerHTML = `
        <h2 class="text-xl font-semibold text-slate-700 mb-2">Stage 4: Translation</h2>
        <p class="mb-4 text-slate-600">Translate each sentence into Hungarian. Press Enter to check.</p>
        <div id="stage4-exercise" class="space-y-4"></div>
        <div id="stage4-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${stage4Data.length}</div>
    `;
    mainContent.appendChild(stage4Section);

    const stage4Exercise = document.getElementById('stage4-exercise');
    const stage4Score = document.getElementById('stage4-score');
    let stage4Results = new Array(stage4Data.length).fill(null);

    stage4Data.forEach((item, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col gap-2 bg-slate-50 p-4 rounded-lg';
        wrapper.innerHTML = `
            <p class="font-medium text-slate-700">${idx + 1}. "${item.english}"</p>
            <div class="flex flex-col md:flex-row items-start md:items-center gap-2">
                <input type="text" class="border border-slate-300 rounded-md px-3 py-2 w-full focus:ring-2 focus:ring-teal-500" placeholder="Type Hungarian...">
                <span class="text-sm font-semibold stage4-feedback"></span>
            </div>
        `;
        stage4Exercise.appendChild(wrapper);
        const input = wrapper.querySelector('input');
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkStage4(idx, input, wrapper); });
    });

    function checkStage4(idx, input, wrapper) {
        const feedback = wrapper.querySelector('.stage4-feedback');
        const item = stage4Data[idx];
        const result = checkWithAccentWarning(input.value, item.hungarian);
        if (result === 'correct') {
            feedback.textContent = `Correct!`;
            feedback.className = 'text-sm font-semibold text-green-600 stage4-feedback';
            stage4Results[idx] = true;
        } else if (result === 'accent-warning') {
            feedback.textContent = `Almost!`;
            feedback.className = 'text-sm font-semibold text-yellow-600 stage4-feedback';
            stage4Results[idx] = 'partial';
        } else if (input.value.trim() === '') {
            feedback.textContent = ''; stage4Results[idx] = null;
        } else {
            feedback.textContent = `Expected: "${item.hungarian}"`;
            feedback.className = 'text-sm font-semibold text-red-600 stage4-feedback';
            stage4Results[idx] = false;
        }
        stage4Score.textContent = `Score: ${stage4Results.filter(r => r === true).length} / ${stage4Data.length}`;
    }

    // ==================== FINAL SUMMARY ====================
    const summarySection = document.createElement('section');
    summarySection.className = 'mb-8 mt-12 bg-gradient-to-r from-teal-50 to-slate-50 p-6 rounded-xl';
    summarySection.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Lesson Summary</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <h3 class="font-semibold text-teal-700 mb-2">Comparatives (-bb)</h3>
                <ul class="text-slate-700 space-y-1 text-sm">
                    <li>nagy → nagyobb (bigger)</li>
                    <li>jo → jobb (better)</li>
                    <li>Use "mint" or "-nal/-nel" for "than"</li>
                </ul>
            </div>
            <div>
                <h3 class="font-semibold text-teal-700 mb-2">Superlatives (leg- + -bb)</h3>
                <ul class="text-slate-700 space-y-1 text-sm">
                    <li>nagy → legnagyobb (biggest)</li>
                    <li>jo → legjobb (best)</li>
                    <li>Add leg- to comparative</li>
                </ul>
            </div>
        </div>
    `;
    mainContent.appendChild(summarySection);
    </script>
</body>
</html>
