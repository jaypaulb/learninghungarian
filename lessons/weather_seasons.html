<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 21: Weather & Seasons - Learning Hungarian</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; }
        th, td { border: 1px solid #e2e8f0; padding: 0.5rem 1rem; text-align: left; }
        th { background: #f1f5f9; }
        .flip-card {
            perspective: 1000px;
            cursor: pointer;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.5rem;
            padding: 1rem;
        }
        .flip-card-front {
            background: linear-gradient(135deg, #0f766e 0%, #14b8a6 100%);
            color: white;
        }
        .flip-card-back {
            background: linear-gradient(135deg, #475569 0%, #64748b 100%);
            color: white;
            transform: rotateY(180deg);
        }
        .season-card {
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .season-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.15);
        }
        .cultural-note {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border-left: 4px solid #f59e0b;
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 0 0.5rem 0.5rem 0;
        }
        .weather-icon {
            font-size: 2rem;
        }
    </style>
</head>
<body class="bg-slate-100 p-4 md:p-8">
    <header class="text-center mb-8">
        <div class="mb-4">
            <a href="../index.html" class="inline-flex items-center px-4 py-2 bg-slate-600 text-white text-sm font-medium rounded-lg hover:bg-slate-700 transition-colors">
                <svg class="mr-2 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                Back to Lessons
            </a>
        </div>
        <h1 class="text-3xl md:text-4xl font-bold text-slate-700">Lesson 21: Weather & Seasons <span class="block text-xl text-slate-500 font-normal">(Idojaras es evszakok)</span></h1>
        <p class="text-slate-600 mt-2 max-w-2xl mx-auto">Learn to talk about the weather and seasons in Hungarian. Master essential vocabulary for describing weather conditions and seasonal activities.</p>
    </header>

    <main class="max-w-4xl mx-auto bg-white rounded-xl shadow-md p-6" id="main-content">
        <!-- Content will be generated by JavaScript -->
    </main>

    <footer class="text-center mt-12 py-4 border-t border-slate-300">
        <p class="text-sm text-slate-500">&copy; 2024 Hungarian Language Lessons</p>
    </footer>

    <script>
    // ============================================
    // UTILITY FUNCTIONS
    // ============================================

    function removeAccents(str) {
        return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[\u0151\u0150\u0171\u0170]/g, function(m) {
            const map = { '\u0151':'o', '\u0150':'O', '\u0171':'u', '\u0170':'U' };
            return map[m] || m;
        });
    }

    function normalizeAnswer(str) {
        return str.trim().toLowerCase();
    }

    function checkAccentAware(userInput, correctAnswer) {
        const normalizedInput = normalizeAnswer(userInput);
        const normalizedCorrect = normalizeAnswer(correctAnswer);

        if (normalizedInput === normalizedCorrect) {
            return 'correct';
        } else if (removeAccents(normalizedInput) === removeAccents(normalizedCorrect)) {
            return 'accent-warning';
        } else {
            return 'incorrect';
        }
    }

    // ============================================
    // VOCABULARY DATA
    // ============================================

    const weatherVocabulary = [
        { hungarian: 'az ido', english: 'the weather' },
        { hungarian: 'az idojaras', english: 'the weather (conditions)' },
        { hungarian: 'az eso', english: 'the rain' },
        { hungarian: 'a nap', english: 'the sun' },
        { hungarian: 'a szel', english: 'the wind' },
        { hungarian: 'a ho', english: 'the snow' },
        { hungarian: 'a felho', english: 'the cloud' },
        { hungarian: 'a vihar', english: 'the storm' },
        { hungarian: 'a kod', english: 'the fog' },
        { hungarian: 'a jeg', english: 'the ice' }
    ];

    const weatherAdjectives = [
        { hungarian: 'hideg', english: 'cold' },
        { hungarian: 'meleg', english: 'warm/hot' },
        { hungarian: 'forro', english: 'hot (very)' },
        { hungarian: 'huvos', english: 'cool' },
        { hungarian: 'napfenyes', english: 'sunny' },
        { hungarian: 'felhos', english: 'cloudy' },
        { hungarian: 'esos', english: 'rainy' },
        { hungarian: 'szeles', english: 'windy' },
        { hungarian: 'havas', english: 'snowy' },
        { hungarian: 'kodos', english: 'foggy' }
    ];

    const seasons = [
        { hungarian: 'tavasz', english: 'spring', color: '#86efac', icon: '🌸' },
        { hungarian: 'nyar', english: 'summer', color: '#fcd34d', icon: '☀️' },
        { hungarian: 'osz', english: 'autumn/fall', color: '#fdba74', icon: '🍂' },
        { hungarian: 'tel', english: 'winter', color: '#93c5fd', icon: '❄️' }
    ];

    const weatherExpressions = [
        { hungarian: 'Milyen az ido?', english: 'What is the weather like?' },
        { hungarian: 'Milyen ido van?', english: 'What is the weather?' },
        { hungarian: 'Esik az eso.', english: 'It is raining.' },
        { hungarian: 'Esik a ho.', english: 'It is snowing.' },
        { hungarian: 'Sut a nap.', english: 'The sun is shining.' },
        { hungarian: 'Fuj a szel.', english: 'The wind is blowing.' },
        { hungarian: 'Hideg van.', english: 'It is cold.' },
        { hungarian: 'Meleg van.', english: 'It is warm/hot.' },
        { hungarian: 'Szep ido van.', english: 'The weather is nice.' },
        { hungarian: 'Rossz ido van.', english: 'The weather is bad.' }
    ];

    const seasonalPhrases = [
        { hungarian: 'tavasszal', english: 'in spring' },
        { hungarian: 'nyaron', english: 'in summer' },
        { hungarian: 'osszel', english: 'in autumn' },
        { hungarian: 'telen', english: 'in winter' }
    ];

    // ============================================
    // EXERCISE DATA
    // ============================================

    const vocabularyCards = [
        { hungarian: 'eso', english: 'rain' },
        { hungarian: 'nap', english: 'sun' },
        { hungarian: 'szel', english: 'wind' },
        { hungarian: 'ho', english: 'snow' },
        { hungarian: 'felho', english: 'cloud' },
        { hungarian: 'hideg', english: 'cold' },
        { hungarian: 'meleg', english: 'warm' },
        { hungarian: 'tavasz', english: 'spring' },
        { hungarian: 'nyar', english: 'summer' },
        { hungarian: 'osz', english: 'autumn' },
        { hungarian: 'tel', english: 'winter' },
        { hungarian: 'vihar', english: 'storm' }
    ];

    const matchingExercise = [
        { description: 'Water falling from clouds', answer: 'eso', options: ['eso', 'ho', 'szel', 'kod'] },
        { description: 'Frozen water falling from sky', answer: 'ho', options: ['eso', 'ho', 'jeg', 'felho'] },
        { description: 'Moving air', answer: 'szel', options: ['szel', 'nap', 'felho', 'vihar'] },
        { description: 'The hottest season', answer: 'nyar', options: ['tavasz', 'nyar', 'osz', 'tel'] },
        { description: 'The coldest season', answer: 'tel', options: ['tavasz', 'nyar', 'osz', 'tel'] },
        { description: 'Season when flowers bloom', answer: 'tavasz', options: ['tavasz', 'nyar', 'osz', 'tel'] },
        { description: 'Season when leaves fall', answer: 'osz', options: ['tavasz', 'nyar', 'osz', 'tel'] },
        { description: 'White fluffy things in the sky', answer: 'felho', options: ['felho', 'ho', 'nap', 'szel'] }
    ];

    const fillInBlanks = [
        { sentence: '___ az eso.', answer: 'Esik', english: 'It is raining.', hint: 'falls/is falling' },
        { sentence: '___ a nap.', answer: 'Sut', english: 'The sun is shining.', hint: 'shines' },
        { sentence: '___ a szel.', answer: 'Fuj', english: 'The wind is blowing.', hint: 'blows' },
        { sentence: 'Milyen az ___?', answer: 'ido', english: 'What is the weather like?', hint: 'weather' },
        { sentence: '___ van.', answer: 'Hideg', english: 'It is cold.', hint: 'cold' },
        { sentence: 'Szep ___ van.', answer: 'ido', english: 'The weather is nice.', hint: 'weather' },
        { sentence: '___ esik a ho.', answer: 'Telen', english: 'In winter it snows.', hint: 'in winter' },
        { sentence: '___ meleg van.', answer: 'Nyaron', english: 'In summer it is warm.', hint: 'in summer' }
    ];

    const translationExercise = [
        { english: 'It is raining.', answer: 'Esik az eso' },
        { english: 'The sun is shining.', answer: 'Sut a nap' },
        { english: 'It is cold.', answer: 'Hideg van' },
        { english: 'It is warm.', answer: 'Meleg van' },
        { english: 'What is the weather like?', answer: 'Milyen az ido' },
        { english: 'The weather is nice.', answer: 'Szep ido van' }
    ];

    const dialogueExercise = [
        {
            speaker: 'A',
            line: 'Milyen az ido ma?',
            response: 'Ma ___ ido van.',
            blank: 'szep',
            responseEnglish: 'Today the weather is nice.'
        },
        {
            speaker: 'A',
            line: 'Esik az eso?',
            response: 'Nem, ___ a nap.',
            blank: 'sut',
            responseEnglish: 'No, the sun is shining.'
        },
        {
            speaker: 'A',
            line: 'Hideg van kint?',
            response: 'Igen, nagyon ___ van.',
            blank: 'hideg',
            responseEnglish: 'Yes, it is very cold.'
        },
        {
            speaker: 'A',
            line: 'Milyen ido van nyaron?',
            response: '___ van nyaron.',
            blank: 'Meleg',
            responseEnglish: 'It is warm in summer.'
        },
        {
            speaker: 'A',
            line: 'Mit csinalsz, ha esik az eso?',
            response: 'Otthon maradok, ha ___ az eso.',
            blank: 'esik',
            responseEnglish: 'I stay home if it is raining.'
        }
    ];

    // ============================================
    // SCORE TRACKING
    // ============================================

    let scores = {
        stage1: { correct: 0, total: vocabularyCards.length },
        stage2: { correct: 0, total: matchingExercise.length },
        stage3: { correct: 0, total: fillInBlanks.length },
        stage4: { correct: 0, total: translationExercise.length },
        stage5: { correct: 0, total: dialogueExercise.length }
    };

    let stage1Revealed = new Set();

    function updateTotalScore() {
        const totalCorrect = Object.values(scores).reduce((sum, s) => sum + s.correct, 0);
        const totalQuestions = Object.values(scores).reduce((sum, s) => sum + s.total, 0);
        const totalScoreEl = document.getElementById('total-score');
        if (totalScoreEl) {
            totalScoreEl.textContent = `Total Score: ${totalCorrect} / ${totalQuestions}`;
        }
    }

    // ============================================
    // BUILD PAGE CONTENT
    // ============================================

    const mainContent = document.getElementById('main-content');

    // Learning Objectives
    const objectivesSection = document.createElement('section');
    objectivesSection.className = 'mb-8';
    objectivesSection.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Learning Objectives</h2>
        <ul class="list-disc pl-6 space-y-2 text-slate-600">
            <li>Learn essential weather vocabulary in Hungarian</li>
            <li>Name all four seasons and describe seasonal weather</li>
            <li>Ask and answer questions about the weather</li>
            <li>Use weather expressions in conversations</li>
        </ul>
    `;
    mainContent.appendChild(objectivesSection);

    // Cultural Note
    const culturalNote = document.createElement('div');
    culturalNote.className = 'cultural-note mb-8';
    culturalNote.innerHTML = `
        <h3 class="font-bold text-amber-800 mb-2">Cultural Note: Hungarian Weather Talk</h3>
        <p class="text-amber-900">Weather is a popular conversation topic in Hungary! Hungarians often start conversations with "Milyen ido van?" (What's the weather like?).
        Hungary has a continental climate with distinct seasons - hot summers (nyar) can reach 35C while cold winters (tel) can drop to -15C.
        The expression "Esik az eso" literally means "The rain is falling" - Hungarian uses specific verbs for weather phenomena.</p>
    `;
    mainContent.appendChild(culturalNote);

    // Section 1: Weather Vocabulary
    const section1 = document.createElement('section');
    section1.className = 'mb-8';
    section1.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 1: Weather Vocabulary (Idojaras szokincs)</h2>
        <table class="mb-4">
            <thead>
                <tr><th class="text-left">Hungarian</th><th class="text-left">English</th></tr>
            </thead>
            <tbody>
                ${weatherVocabulary.map(item => `<tr><td class="font-medium text-teal-700">${item.hungarian}</td><td>${item.english}</td></tr>`).join('')}
            </tbody>
        </table>
    `;
    mainContent.appendChild(section1);

    // Section 2: Weather Adjectives
    const section2 = document.createElement('section');
    section2.className = 'mb-8';
    section2.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 2: Weather Adjectives (Idojarasi melleknevek)</h2>
        <table class="mb-4">
            <thead>
                <tr><th class="text-left">Hungarian</th><th class="text-left">English</th></tr>
            </thead>
            <tbody>
                ${weatherAdjectives.map(item => `<tr><td class="font-medium text-teal-700">${item.hungarian}</td><td>${item.english}</td></tr>`).join('')}
            </tbody>
        </table>
        <div class="mt-4 p-4 bg-blue-50 rounded-lg border border-blue-200">
            <h4 class="font-semibold text-blue-800 mb-2">Pattern: -s/-os/-es/-as suffix</h4>
            <p class="text-blue-700 text-sm">Many weather adjectives are formed by adding -s/-os/-es/-as to nouns:
            <strong>nap</strong> (sun) + feny + es = <strong>napfenyes</strong> (sunny),
            <strong>felho</strong> (cloud) + s = <strong>felhos</strong> (cloudy),
            <strong>szel</strong> (wind) + es = <strong>szeles</strong> (windy)</p>
        </div>
    `;
    mainContent.appendChild(section2);

    // Section 3: Seasons
    const section3 = document.createElement('section');
    section3.className = 'mb-8';
    section3.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 3: The Four Seasons (A negy evszak)</h2>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
            ${seasons.map(s => `
                <div class="season-card rounded-xl p-4 text-center shadow-md" style="background-color: ${s.color}">
                    <div class="weather-icon mb-2">${s.icon}</div>
                    <div class="font-bold text-slate-800 text-lg">${s.hungarian}</div>
                    <div class="text-slate-600">${s.english}</div>
                </div>
            `).join('')}
        </div>
        <table class="mb-4">
            <thead>
                <tr><th class="text-left">Season</th><th class="text-left">"In [season]"</th><th class="text-left">Example</th></tr>
            </thead>
            <tbody>
                ${seasonalPhrases.map((item, idx) => `
                    <tr>
                        <td class="font-medium text-teal-700">${seasons[idx].hungarian}</td>
                        <td class="font-medium text-teal-700">${item.hungarian}</td>
                        <td class="text-slate-600">${item.english}</td>
                    </tr>
                `).join('')}
            </tbody>
        </table>
    `;
    mainContent.appendChild(section3);

    // Section 4: Common Expressions
    const section4 = document.createElement('section');
    section4.className = 'mb-8';
    section4.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 4: Common Weather Expressions</h2>
        <div class="bg-slate-50 rounded-lg p-4 space-y-3">
            ${weatherExpressions.map(item => `
                <div class="flex flex-col md:flex-row md:items-center gap-2 p-2 border-b border-slate-200 last:border-0">
                    <span class="font-medium text-teal-700 min-w-[200px]">${item.hungarian}</span>
                    <span class="text-slate-600">- ${item.english}</span>
                </div>
            `).join('')}
        </div>
    `;
    mainContent.appendChild(section4);

    // Total Score Display
    const totalScoreSection = document.createElement('div');
    totalScoreSection.className = 'bg-gradient-to-r from-teal-600 to-teal-700 text-white rounded-xl p-4 mb-8 text-center';
    totalScoreSection.innerHTML = `
        <h3 class="text-lg font-semibold mb-1">Interactive Exercises</h3>
        <p id="total-score" class="text-2xl font-bold">Total Score: 0 / ${Object.values(scores).reduce((sum, s) => sum + s.total, 0)}</p>
    `;
    mainContent.appendChild(totalScoreSection);

    // ============================================
    // STAGE 1: VOCABULARY CARDS
    // ============================================

    const stage1Section = document.createElement('section');
    stage1Section.className = 'mb-8';
    stage1Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 1: Vocabulary Cards</h2>
        <p class="text-slate-600 mb-4">Click each card to flip and reveal the English translation. Try to guess before flipping!</p>
        <div id="vocab-cards" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4"></div>
        <div id="stage1-score" class="text-slate-700 font-medium">Cards Revealed: 0 / ${vocabularyCards.length}</div>
    `;
    mainContent.appendChild(stage1Section);

    const vocabCardsContainer = document.getElementById('vocab-cards');
    vocabularyCards.forEach((card, idx) => {
        const cardDiv = document.createElement('div');
        cardDiv.className = 'flip-card h-24';
        cardDiv.setAttribute('data-idx', idx);
        cardDiv.innerHTML = `
            <div class="flip-card-inner">
                <div class="flip-card-front">
                    <span class="text-lg font-bold">${card.hungarian}</span>
                </div>
                <div class="flip-card-back">
                    <span class="text-lg font-semibold">${card.english}</span>
                </div>
            </div>
        `;
        cardDiv.addEventListener('click', function() {
            this.classList.toggle('flipped');
            if (!stage1Revealed.has(idx)) {
                stage1Revealed.add(idx);
                scores.stage1.correct = stage1Revealed.size;
                document.getElementById('stage1-score').textContent = `Cards Revealed: ${stage1Revealed.size} / ${vocabularyCards.length}`;
                updateTotalScore();
            }
        });
        vocabCardsContainer.appendChild(cardDiv);
    });

    // ============================================
    // STAGE 2: WEATHER MATCHING
    // ============================================

    const stage2Section = document.createElement('section');
    stage2Section.className = 'mb-8';
    stage2Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 2: Weather & Season Matching</h2>
        <p class="text-slate-600 mb-4">Match the English description to the correct Hungarian word.</p>
        <div id="matching-exercise" class="space-y-4"></div>
        <div id="stage2-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${matchingExercise.length}</div>
    `;
    mainContent.appendChild(stage2Section);

    const matchingContainer = document.getElementById('matching-exercise');
    matchingExercise.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col md:flex-row items-start md:items-center gap-2 p-3 bg-slate-50 rounded-lg';

        const label = document.createElement('span');
        label.className = 'min-w-[200px] text-slate-800 font-medium';
        label.textContent = q.description;

        const select = document.createElement('select');
        select.className = 'border border-slate-300 rounded-md px-3 py-2 w-48 focus:ring-2 focus:ring-teal-500 focus:border-teal-500';
        select.innerHTML = '<option value="">Select answer...</option>';

        const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);
        shuffledOptions.forEach(opt => {
            const option = document.createElement('option');
            option.value = opt;
            option.textContent = opt;
            select.appendChild(option);
        });

        const feedback = document.createElement('span');
        feedback.className = 'ml-2 text-sm font-semibold';

        select.addEventListener('change', function() {
            if (this.value === q.answer) {
                feedback.textContent = 'Correct!';
                feedback.className = 'ml-2 text-green-600 font-semibold';
                this.disabled = true;
                this.className = 'border border-green-500 bg-green-50 rounded-md px-3 py-2 w-48';
                scores.stage2.correct++;
                document.getElementById('stage2-score').textContent = `Score: ${scores.stage2.correct} / ${matchingExercise.length}`;
                updateTotalScore();
            } else if (this.value !== '') {
                feedback.textContent = 'Try again!';
                feedback.className = 'ml-2 text-red-600 font-semibold';
            }
        });

        wrapper.appendChild(label);
        wrapper.appendChild(select);
        wrapper.appendChild(feedback);
        matchingContainer.appendChild(wrapper);
    });

    // ============================================
    // STAGE 3: FILL IN THE BLANKS
    // ============================================

    const stage3Section = document.createElement('section');
    stage3Section.className = 'mb-8';
    stage3Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 3: Fill in the Blanks</h2>
        <p class="text-slate-600 mb-4">Complete the weather expressions by filling in the missing words.</p>
        <div id="fill-exercise" class="space-y-4"></div>
        <div id="stage3-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${fillInBlanks.length}</div>
    `;
    mainContent.appendChild(stage3Section);

    const fillContainer = document.getElementById('fill-exercise');
    const stage3Answers = new Array(fillInBlanks.length).fill(false);

    fillInBlanks.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col gap-2 p-3 bg-slate-50 rounded-lg';

        const row = document.createElement('div');
        row.className = 'flex flex-col md:flex-row items-start md:items-center gap-2';

        const sentenceParts = q.sentence.split('___');
        const sentenceSpan = document.createElement('span');
        sentenceSpan.className = 'text-slate-800';

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-2 py-1 w-32 mx-1 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 inline';
        input.setAttribute('aria-label', `Fill in blank for: ${q.sentence}`);

        sentenceSpan.appendChild(document.createTextNode(sentenceParts[0]));
        sentenceSpan.appendChild(input);
        if (sentenceParts[1]) {
            sentenceSpan.appendChild(document.createTextNode(sentenceParts[1]));
        }

        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold ml-2';

        const hint = document.createElement('div');
        hint.className = 'text-xs text-slate-500 italic';
        hint.textContent = `Hint: ${q.hint} | English: ${q.english}`;

        function checkAnswer() {
            const result = checkAccentAware(input.value, q.answer);

            if (result === 'correct') {
                feedback.textContent = 'Correct!';
                feedback.className = 'text-green-600 font-semibold ml-2';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-2 py-1 w-32 mx-1 inline';
                if (!stage3Answers[idx]) {
                    stage3Answers[idx] = true;
                    scores.stage3.correct++;
                    document.getElementById('stage3-score').textContent = `Score: ${scores.stage3.correct} / ${fillInBlanks.length}`;
                    updateTotalScore();
                }
            } else if (result === 'accent-warning') {
                feedback.textContent = 'Almost! Check accents.';
                feedback.className = 'text-yellow-600 font-semibold ml-2';
            } else if (input.value.trim() !== '') {
                feedback.textContent = 'Try again!';
                feedback.className = 'text-red-600 font-semibold ml-2';
            }
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkAnswer();
        });
        input.addEventListener('blur', checkAnswer);

        row.appendChild(sentenceSpan);
        row.appendChild(feedback);
        wrapper.appendChild(row);
        wrapper.appendChild(hint);
        fillContainer.appendChild(wrapper);
    });

    // ============================================
    // STAGE 4: TRANSLATION
    // ============================================

    const stage4Section = document.createElement('section');
    stage4Section.className = 'mb-8';
    stage4Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 4: Translation Practice</h2>
        <p class="text-slate-600 mb-4">Translate these English weather phrases into Hungarian.</p>
        <div id="translation-exercise" class="space-y-4"></div>
        <div id="stage4-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${translationExercise.length}</div>
    `;
    mainContent.appendChild(stage4Section);

    const translationContainer = document.getElementById('translation-exercise');
    const stage4Answers = new Array(translationExercise.length).fill(false);

    translationExercise.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'p-3 bg-slate-50 rounded-lg';
        wrapper.innerHTML = `
            <div class="text-slate-700 font-medium mb-2">${idx + 1}. ${q.english}</div>
            <div class="flex flex-col md:flex-row items-start md:items-center gap-2">
                <input type="text" class="border border-slate-300 rounded-md px-3 py-2 w-full md:w-64 focus:ring-2 focus:ring-teal-500 focus:border-teal-500" placeholder="Type Hungarian translation...">
                <span class="feedback text-sm font-semibold"></span>
            </div>
        `;

        const input = wrapper.querySelector('input');
        const feedback = wrapper.querySelector('.feedback');

        function checkTranslation() {
            const result = checkAccentAware(input.value, q.answer);

            if (result === 'correct') {
                feedback.textContent = 'Correct!';
                feedback.className = 'feedback text-green-600 font-semibold';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-3 py-2 w-full md:w-64';
                if (!stage4Answers[idx]) {
                    stage4Answers[idx] = true;
                    scores.stage4.correct++;
                    document.getElementById('stage4-score').textContent = `Score: ${scores.stage4.correct} / ${translationExercise.length}`;
                    updateTotalScore();
                }
            } else if (result === 'accent-warning') {
                feedback.textContent = 'Almost! Check accents.';
                feedback.className = 'feedback text-yellow-600 font-semibold';
            } else if (input.value.trim() !== '') {
                feedback.textContent = `Try again! Answer: ${q.answer}`;
                feedback.className = 'feedback text-red-600 font-semibold';
            }
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkTranslation();
        });
        input.addEventListener('blur', checkTranslation);

        translationContainer.appendChild(wrapper);
    });

    // ============================================
    // STAGE 5: DIALOGUE PRACTICE
    // ============================================

    const stage5Section = document.createElement('section');
    stage5Section.className = 'mb-8';
    stage5Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 5: Dialogue Practice</h2>
        <p class="text-slate-600 mb-4">Complete these weather-related conversations by filling in the missing word.</p>
        <div id="dialogue-exercise" class="space-y-6"></div>
        <div id="stage5-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${dialogueExercise.length}</div>
    `;
    mainContent.appendChild(stage5Section);

    const dialogueContainer = document.getElementById('dialogue-exercise');
    const stage5Answers = new Array(dialogueExercise.length).fill(false);

    dialogueExercise.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'bg-gradient-to-r from-slate-50 to-slate-100 rounded-lg p-4 border border-slate-200';

        const questionLine = document.createElement('div');
        questionLine.className = 'mb-3';
        questionLine.innerHTML = `
            <span class="inline-block bg-teal-600 text-white text-xs font-bold px-2 py-1 rounded mr-2">A</span>
            <span class="text-slate-800 font-medium">${q.line}</span>
        `;

        const responseLine = document.createElement('div');
        responseLine.className = 'flex flex-wrap items-center gap-2';

        const speakerB = document.createElement('span');
        speakerB.className = 'inline-block bg-slate-600 text-white text-xs font-bold px-2 py-1 rounded';
        speakerB.textContent = 'B';

        const responseText = q.response.split('___');
        const responseSpan = document.createElement('span');
        responseSpan.className = 'text-slate-800';

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-2 py-1 w-24 focus:ring-2 focus:ring-teal-500 focus:border-teal-500';

        responseSpan.appendChild(document.createTextNode(responseText[0]));
        responseSpan.appendChild(input);
        if (responseText[1]) {
            responseSpan.appendChild(document.createTextNode(responseText[1]));
        }

        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold';

        function checkAnswer() {
            const result = checkAccentAware(input.value, q.blank);

            if (result === 'correct') {
                feedback.textContent = 'Helyes! (Correct!)';
                feedback.className = 'text-green-600 font-semibold';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-2 py-1 w-24';
                if (!stage5Answers[idx]) {
                    stage5Answers[idx] = true;
                    scores.stage5.correct++;
                    document.getElementById('stage5-score').textContent = `Score: ${scores.stage5.correct} / ${dialogueExercise.length}`;
                    updateTotalScore();
                }
            } else if (result === 'accent-warning') {
                feedback.textContent = 'Majdnem! (Check accents)';
                feedback.className = 'text-yellow-600 font-semibold';
            } else if (input.value.trim() !== '') {
                feedback.textContent = 'Probald ujra! (Try again)';
                feedback.className = 'text-red-600 font-semibold';
            }
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkAnswer();
        });
        input.addEventListener('blur', checkAnswer);

        responseLine.appendChild(speakerB);
        responseLine.appendChild(responseSpan);
        responseLine.appendChild(feedback);

        const translationLine = document.createElement('div');
        translationLine.className = 'mt-2 text-xs text-slate-500 italic pl-8';
        translationLine.textContent = `(${q.responseEnglish})`;

        wrapper.appendChild(questionLine);
        wrapper.appendChild(responseLine);
        wrapper.appendChild(translationLine);
        dialogueContainer.appendChild(wrapper);
    });

    // ============================================
    // SUMMARY SECTION
    // ============================================

    const summarySection = document.createElement('section');
    summarySection.className = 'mt-8 p-6 bg-gradient-to-r from-teal-50 to-slate-50 rounded-xl border border-teal-200';
    summarySection.innerHTML = `
        <h2 class="text-xl font-bold text-teal-800 mb-4">Lesson Summary</h2>
        <div class="grid md:grid-cols-2 gap-4 text-sm">
            <div>
                <h3 class="font-semibold text-slate-700 mb-2">Weather Vocabulary:</h3>
                <ul class="list-disc pl-5 text-slate-600 space-y-1">
                    <li>eso (rain), ho (snow), szel (wind), nap (sun)</li>
                    <li>felho (cloud), vihar (storm), kod (fog)</li>
                    <li>hideg (cold), meleg (warm), napfenyes (sunny)</li>
                </ul>
            </div>
            <div>
                <h3 class="font-semibold text-slate-700 mb-2">Key Expressions:</h3>
                <ul class="list-disc pl-5 text-slate-600 space-y-1">
                    <li>"Milyen az ido?" - What's the weather like?</li>
                    <li>"Esik az eso." - It is raining.</li>
                    <li>"Sut a nap." - The sun is shining.</li>
                    <li>"Hideg/Meleg van." - It is cold/warm.</li>
                </ul>
            </div>
        </div>
        <div class="mt-4 grid md:grid-cols-4 gap-2">
            ${seasons.map((s, idx) => `
                <div class="text-center p-2 rounded-lg" style="background-color: ${s.color}">
                    <div class="font-bold text-slate-800">${s.hungarian}</div>
                    <div class="text-xs text-slate-600">${seasonalPhrases[idx].hungarian}</div>
                </div>
            `).join('')}
        </div>
        <div class="mt-4 p-3 bg-amber-50 rounded-lg border border-amber-200">
            <p class="text-amber-800 text-sm"><strong>Remember:</strong> Use "Esik" with eso (rain) and ho (snow), "Sut" with nap (sun), and "Fuj" with szel (wind). These verbs specifically describe weather phenomena in Hungarian!</p>
        </div>
    `;
    mainContent.appendChild(summarySection);

    // Initialize total score
    updateTotalScore();
    </script>
</body>
</html>
