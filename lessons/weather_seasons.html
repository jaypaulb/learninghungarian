<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 24: Weather & Seasons - Learning Hungarian</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; }
        th, td { border: 1px solid #e2e8f0; padding: 0.5rem 1rem; text-align: center; }
        th { background: #f1f5f9; }
        .weather-icon { font-size: 2rem; }
        .season-card { transition: transform 0.2s; }
        .season-card:hover { transform: scale(1.02); }
    </style>
</head>
<body class="bg-slate-100 p-4 md:p-8">
    <header class="text-center mb-8">
        <div class="mb-4">
            <a href="../index.html" class="inline-flex items-center px-4 py-2 bg-slate-600 text-white text-sm font-medium rounded-lg hover:bg-slate-700 transition-colors">
                <svg class="mr-2 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                Back to Lessons
            </a>
        </div>
        <h1 class="text-3xl md:text-4xl font-bold text-slate-700">Lesson 24: Weather & Seasons <span class="block text-xl text-slate-500 font-normal">(Idojaras es evszakok)</span></h1>
        <p class="text-slate-600 mt-2 max-w-2xl mx-auto">Learn to talk about the weather, describe seasons, and understand forecasts in Hungarian. Hungary has a continental climate with distinct seasons!</p>
        <div class="mt-4 inline-block bg-amber-100 text-amber-800 px-3 py-1 rounded-full text-sm font-medium">CEFR Level: A2</div>
    </header>
    <main class="max-w-3xl mx-auto bg-white rounded-xl shadow-md p-6" id="main-content">
        <!-- Content will be generated by JavaScript -->
    </main>
    <footer class="text-center mt-12 py-4 border-t border-slate-300">
        <p class="text-sm text-slate-500">&copy; 2024 Hungarian Language Lessons</p>
    </footer>
    <script>
    const main = document.getElementById('main-content');

    // Helper function for accent-insensitive comparison
    function removeAccents(str) {
        return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[oOuUaAeEiI]/gi, function(m) {
            const map = { 'a':'a','A':'A','e':'e','E':'E','i':'i','I':'I','o':'o','O':'O','u':'u','U':'U' };
            return map[m] || m;
        }).toLowerCase();
    }

    // ==================== SECTION 1: WEATHER VOCABULARY ====================
    const weatherSection = document.createElement('section');
    weatherSection.className = 'mb-10';
    weatherSection.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4 border-b-2 border-amber-500 pb-2">Section 1: Weather Vocabulary</h2>
        <p class="mb-4 text-slate-600">Learn the essential vocabulary for describing weather conditions in Hungarian.</p>
        <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-yellow-50 p-4 rounded-lg text-center">
                <div class="weather-icon">&#9728;</div>
                <p class="font-bold text-slate-800">napos</p>
                <p class="text-sm text-slate-600">sunny</p>
            </div>
            <div class="bg-gray-100 p-4 rounded-lg text-center">
                <div class="weather-icon">&#9729;</div>
                <p class="font-bold text-slate-800">felhoos</p>
                <p class="text-sm text-slate-600">cloudy</p>
            </div>
            <div class="bg-blue-50 p-4 rounded-lg text-center">
                <div class="weather-icon">&#127783;</div>
                <p class="font-bold text-slate-800">esos</p>
                <p class="text-sm text-slate-600">rainy</p>
            </div>
            <div class="bg-cyan-50 p-4 rounded-lg text-center">
                <div class="weather-icon">&#10052;</div>
                <p class="font-bold text-slate-800">havas</p>
                <p class="text-sm text-slate-600">snowy</p>
            </div>
            <div class="bg-slate-100 p-4 rounded-lg text-center">
                <div class="weather-icon">&#127787;</div>
                <p class="font-bold text-slate-800">szeles</p>
                <p class="text-sm text-slate-600">windy</p>
            </div>
            <div class="bg-gray-200 p-4 rounded-lg text-center">
                <div class="weather-icon">&#127786;</div>
                <p class="font-bold text-slate-800">kodos</p>
                <p class="text-sm text-slate-600">foggy</p>
            </div>
            <div class="bg-amber-50 p-4 rounded-lg text-center">
                <div class="weather-icon">&#127780;</div>
                <p class="font-bold text-slate-800">meleg</p>
                <p class="text-sm text-slate-600">warm/hot</p>
            </div>
            <div class="bg-blue-100 p-4 rounded-lg text-center">
                <div class="weather-icon">&#10054;</div>
                <p class="font-bold text-slate-800">hideg</p>
                <p class="text-sm text-slate-600">cold</p>
            </div>
            <div class="bg-yellow-100 p-4 rounded-lg text-center">
                <div class="weather-icon">&#9889;</div>
                <p class="font-bold text-slate-800">viharos</p>
                <p class="text-sm text-slate-600">stormy</p>
            </div>
            <div class="bg-indigo-50 p-4 rounded-lg text-center">
                <div class="weather-icon">&#127752;</div>
                <p class="font-bold text-slate-800">szivarvayny</p>
                <p class="text-sm text-slate-600">rainbow</p>
            </div>
            <div class="bg-sky-50 p-4 rounded-lg text-center">
                <div class="weather-icon">&#9681;</div>
                <p class="font-bold text-slate-800">borongos</p>
                <p class="text-sm text-slate-600">overcast</p>
            </div>
            <div class="bg-rose-50 p-4 rounded-lg text-center">
                <div class="weather-icon">&#127777;</div>
                <p class="font-bold text-slate-800">homerseklet</p>
                <p class="text-sm text-slate-600">temperature</p>
            </div>
        </div>
        <h3 class="text-lg font-semibold text-slate-700 mb-3">Exercise 1.1: Weather Vocabulary Flashcards</h3>
        <p class="mb-4 text-sm text-slate-500">Type the Hungarian word for each weather condition. Press Enter to check.</p>
        <div id="weather-vocab-exercise" class="space-y-3"></div>
        <div id="weather-vocab-score" class="mt-4 text-slate-700 font-medium"></div>
    `;
    main.appendChild(weatherSection);

    const weatherVocab = [
        { english: 'sunny', hungarian: 'napos' },
        { english: 'cloudy', hungarian: 'felhoos' },
        { english: 'rainy', hungarian: 'esos' },
        { english: 'snowy', hungarian: 'havas' },
        { english: 'windy', hungarian: 'szeles' },
        { english: 'foggy', hungarian: 'kodos' },
        { english: 'warm', hungarian: 'meleg' },
        { english: 'cold', hungarian: 'hideg' },
        { english: 'stormy', hungarian: 'viharos' },
        { english: 'overcast', hungarian: 'borongos' },
        { english: 'temperature', hungarian: 'homerseklet' },
        { english: 'weather', hungarian: 'idojaras' }
    ];

    const weatherVocabDiv = document.getElementById('weather-vocab-exercise');
    const weatherVocabScoreDiv = document.getElementById('weather-vocab-score');

    weatherVocab.forEach((item, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col md:flex-row items-start md:items-center gap-2';
        const label = document.createElement('span');
        label.className = 'min-w-[120px] text-slate-800 font-medium';
        label.textContent = item.english;
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = 'Hungarian word...';
        input.className = 'border border-slate-300 rounded-md px-3 py-1 w-40 focus:ring-2 focus:ring-amber-500 focus:border-amber-500';
        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold';
        input.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') checkWeatherVocab(idx);
        });
        wrapper.appendChild(label);
        wrapper.appendChild(input);
        wrapper.appendChild(feedback);
        weatherVocabDiv.appendChild(wrapper);
    });

    function checkWeatherVocab(idx) {
        const wrapper = weatherVocabDiv.children[idx];
        const input = wrapper.querySelector('input');
        const feedback = wrapper.querySelector('span:last-child');
        const correct = weatherVocab[idx].hungarian;
        const userAnswer = input.value.trim().toLowerCase();

        if (userAnswer === correct.toLowerCase()) {
            feedback.textContent = 'Correct!';
            feedback.className = 'text-sm font-semibold text-green-600';
        } else if (removeAccents(userAnswer) === removeAccents(correct)) {
            feedback.textContent = 'Watch your accents!';
            feedback.className = 'text-sm font-semibold text-yellow-600';
        } else if (userAnswer === '') {
            feedback.textContent = '';
        } else {
            feedback.textContent = `Try again! (${correct})`;
            feedback.className = 'text-sm font-semibold text-red-600';
        }
        updateWeatherVocabScore();
    }

    function updateWeatherVocabScore() {
        let correct = 0;
        for (let i = 0; i < weatherVocab.length; i++) {
            const feedback = weatherVocabDiv.children[i].querySelector('span:last-child');
            if (feedback.textContent === 'Correct!') correct++;
        }
        weatherVocabScoreDiv.textContent = `Score: ${correct} / ${weatherVocab.length}`;
    }
    weatherVocabScoreDiv.textContent = `Score: 0 / ${weatherVocab.length}`;

    // ==================== SECTION 2: SEASONS ====================
    const seasonsSection = document.createElement('section');
    seasonsSection.className = 'mb-10';
    seasonsSection.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4 border-b-2 border-amber-500 pb-2">Section 2: The Four Seasons</h2>
        <p class="mb-4 text-slate-600">Hungary has four distinct seasons. Learn their names and characteristics.</p>
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="season-card bg-green-50 p-4 rounded-lg border-2 border-green-200">
                <h3 class="font-bold text-green-800 text-lg">Tavasz</h3>
                <p class="text-green-700">Spring (March - May)</p>
                <p class="text-sm text-green-600 mt-2">Viragzik a fa. (The trees bloom.)</p>
            </div>
            <div class="season-card bg-yellow-50 p-4 rounded-lg border-2 border-yellow-200">
                <h3 class="font-bold text-yellow-800 text-lg">Nyar</h3>
                <p class="text-yellow-700">Summer (June - August)</p>
                <p class="text-sm text-yellow-600 mt-2">Meleg van. (It's warm.)</p>
            </div>
            <div class="season-card bg-orange-50 p-4 rounded-lg border-2 border-orange-200">
                <h3 class="font-bold text-orange-800 text-lg">Osz</h3>
                <p class="text-orange-700">Autumn (September - November)</p>
                <p class="text-sm text-orange-600 mt-2">Hullanak a levelek. (The leaves fall.)</p>
            </div>
            <div class="season-card bg-blue-50 p-4 rounded-lg border-2 border-blue-200">
                <h3 class="font-bold text-blue-800 text-lg">Tel</h3>
                <p class="text-blue-700">Winter (December - February)</p>
                <p class="text-sm text-blue-600 mt-2">Havazik. (It's snowing.)</p>
            </div>
        </div>
        <h3 class="text-lg font-semibold text-slate-700 mb-3">Exercise 2.1: Season Matching</h3>
        <p class="mb-4 text-sm text-slate-500">Match each month to its season in Hungarian.</p>
        <div id="season-matching" class="space-y-3"></div>
        <div id="season-score" class="mt-4 text-slate-700 font-medium"></div>
    `;
    main.appendChild(seasonsSection);

    const seasonQuestions = [
        { month: 'January (Januar)', season: 'tel', translation: 'winter' },
        { month: 'April (Aprilis)', season: 'tavasz', translation: 'spring' },
        { month: 'July (Julius)', season: 'nyar', translation: 'summer' },
        { month: 'October (Oktober)', season: 'osz', translation: 'autumn' },
        { month: 'December (December)', season: 'tel', translation: 'winter' },
        { month: 'March (Marcius)', season: 'tavasz', translation: 'spring' },
        { month: 'August (Augusztus)', season: 'nyar', translation: 'summer' },
        { month: 'November (November)', season: 'osz', translation: 'autumn' }
    ];

    const seasonMatchDiv = document.getElementById('season-matching');
    const seasonScoreDiv = document.getElementById('season-score');

    seasonQuestions.forEach((item, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col md:flex-row items-start md:items-center gap-2';
        const label = document.createElement('span');
        label.className = 'min-w-[180px] text-slate-800';
        label.textContent = item.month;
        const select = document.createElement('select');
        select.className = 'border border-slate-300 rounded-md px-3 py-1 w-40 focus:ring-2 focus:ring-amber-500';
        select.innerHTML = `
            <option value="">Select season...</option>
            <option value="tavasz">tavasz (spring)</option>
            <option value="nyar">nyar (summer)</option>
            <option value="osz">osz (autumn)</option>
            <option value="tel">tel (winter)</option>
        `;
        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold';
        select.addEventListener('change', function() {
            checkSeasonAnswer(idx);
        });
        wrapper.appendChild(label);
        wrapper.appendChild(select);
        wrapper.appendChild(feedback);
        seasonMatchDiv.appendChild(wrapper);
    });

    function checkSeasonAnswer(idx) {
        const wrapper = seasonMatchDiv.children[idx];
        const select = wrapper.querySelector('select');
        const feedback = wrapper.querySelector('span:last-child');
        const correct = seasonQuestions[idx].season;

        if (select.value === correct) {
            feedback.textContent = `Correct! (${seasonQuestions[idx].translation})`;
            feedback.className = 'text-sm font-semibold text-green-600';
        } else if (select.value === '') {
            feedback.textContent = '';
        } else {
            feedback.textContent = 'Try again!';
            feedback.className = 'text-sm font-semibold text-red-600';
        }
        updateSeasonScore();
    }

    function updateSeasonScore() {
        let correct = 0;
        for (let i = 0; i < seasonQuestions.length; i++) {
            const feedback = seasonMatchDiv.children[i].querySelector('span:last-child');
            if (feedback.textContent.startsWith('Correct!')) correct++;
        }
        seasonScoreDiv.textContent = `Score: ${correct} / ${seasonQuestions.length}`;
    }
    seasonScoreDiv.textContent = `Score: 0 / ${seasonQuestions.length}`;

    // ==================== SECTION 3: WEATHER DESCRIPTIONS ====================
    const descriptionSection = document.createElement('section');
    descriptionSection.className = 'mb-10';
    descriptionSection.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4 border-b-2 border-amber-500 pb-2">Section 3: Describing the Weather</h2>
        <p class="mb-4 text-slate-600">Learn how to describe current weather conditions in Hungarian.</p>
        <div class="bg-slate-50 p-4 rounded-lg mb-6">
            <h3 class="font-semibold text-slate-700 mb-2">Key Phrases:</h3>
            <ul class="space-y-1 text-sm">
                <li><strong>Milyen ido van?</strong> - What's the weather like?</li>
                <li><strong>Szep ido van.</strong> - The weather is nice.</li>
                <li><strong>Rossz ido van.</strong> - The weather is bad.</li>
                <li><strong>Esik az eso.</strong> - It's raining.</li>
                <li><strong>Esik a ho.</strong> / <strong>Havazik.</strong> - It's snowing.</li>
                <li><strong>Fut a szel.</strong> - The wind is blowing.</li>
                <li><strong>Sut a nap.</strong> - The sun is shining.</li>
                <li><strong>Hany fok van?</strong> - How many degrees is it?</li>
                <li><strong>Huszonot fok van.</strong> - It's 25 degrees.</li>
            </ul>
        </div>
        <h3 class="text-lg font-semibold text-slate-700 mb-3">Exercise 3.1: Complete the Weather Descriptions</h3>
        <p class="mb-4 text-sm text-slate-500">Fill in the missing word. Press Enter to check.</p>
        <div id="description-exercise" class="space-y-3"></div>
        <div id="description-score" class="mt-4 text-slate-700 font-medium"></div>
    `;
    main.appendChild(descriptionSection);

    const descriptionQuestions = [
        { sentence: 'Milyen ___ van ma?', answer: 'ido', translation: 'What is the weather like today?' },
        { sentence: 'Szep ido ___.', answer: 'van', translation: 'The weather is nice.' },
        { sentence: 'Esik az ___.', answer: 'eso', translation: "It's raining." },
        { sentence: '___ a nap.', answer: 'sut', translation: 'The sun is shining.' },
        { sentence: 'Fut a ___.', answer: 'szel', translation: 'The wind is blowing.' },
        { sentence: 'Ma nagyon ___ van.', answer: 'meleg', translation: "It's very warm today." },
        { sentence: 'Telen ___ van.', answer: 'hideg', translation: "It's cold in winter." },
        { sentence: 'Hany ___ van?', answer: 'fok', translation: 'How many degrees is it?' },
        { sentence: 'Harminc fok ___.', answer: 'van', translation: "It's 30 degrees." },
        { sentence: '___ az eso.', answer: 'esik', translation: "It's raining." }
    ];

    const descriptionDiv = document.getElementById('description-exercise');
    const descriptionScoreDiv = document.getElementById('description-score');

    descriptionQuestions.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col md:flex-row items-start md:items-center gap-2';
        const label = document.createElement('span');
        label.className = 'min-w-[200px] text-slate-800';
        label.textContent = q.sentence;
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-3 py-1 w-32 text-center focus:ring-2 focus:ring-amber-500';
        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold';
        input.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') checkDescriptionAnswer(idx);
        });
        wrapper.appendChild(label);
        wrapper.appendChild(input);
        wrapper.appendChild(feedback);
        descriptionDiv.appendChild(wrapper);
    });

    function checkDescriptionAnswer(idx) {
        const wrapper = descriptionDiv.children[idx];
        const input = wrapper.querySelector('input');
        const feedback = wrapper.querySelector('span:last-child');
        const correct = descriptionQuestions[idx].answer;
        const userAnswer = input.value.trim().toLowerCase();

        if (userAnswer === correct.toLowerCase()) {
            feedback.textContent = `Correct! (${descriptionQuestions[idx].translation})`;
            feedback.className = 'text-sm font-semibold text-green-600';
        } else if (removeAccents(userAnswer) === removeAccents(correct)) {
            feedback.textContent = `Watch your accents! (${descriptionQuestions[idx].translation})`;
            feedback.className = 'text-sm font-semibold text-yellow-600';
        } else if (userAnswer === '') {
            feedback.textContent = '';
        } else {
            feedback.textContent = `Try again! (${descriptionQuestions[idx].translation})`;
            feedback.className = 'text-sm font-semibold text-red-600';
        }
        updateDescriptionScore();
    }

    function updateDescriptionScore() {
        let correct = 0;
        for (let i = 0; i < descriptionQuestions.length; i++) {
            const feedback = descriptionDiv.children[i].querySelector('span:last-child');
            if (feedback.textContent.startsWith('Correct!')) correct++;
        }
        descriptionScoreDiv.textContent = `Score: ${correct} / ${descriptionQuestions.length}`;
    }
    descriptionScoreDiv.textContent = `Score: 0 / ${descriptionQuestions.length}`;

    // ==================== SECTION 4: WEATHER FORECAST ====================
    const forecastSection = document.createElement('section');
    forecastSection.className = 'mb-10';
    forecastSection.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4 border-b-2 border-amber-500 pb-2">Section 4: Weather Forecast Comprehension</h2>
        <p class="mb-4 text-slate-600">Read this Hungarian weather forecast and answer the questions.</p>
        <div class="bg-blue-50 p-4 rounded-lg mb-6 border border-blue-200">
            <h3 class="font-bold text-blue-800 mb-2">Idojaras-elorejelzes (Weather Forecast)</h3>
            <p class="text-blue-900 mb-2"><strong>Hetfo:</strong> Napos ido, 22 fok. Nem esik az eso.</p>
            <p class="text-blue-900 mb-2"><strong>Kedd:</strong> Felhoos, 18 fok. Delutan esik az eso.</p>
            <p class="text-blue-900 mb-2"><strong>Szerda:</strong> Szeles ido, 15 fok. Reggel kodos.</p>
            <p class="text-blue-900 mb-2"><strong>Csutortok:</strong> Viharos, 12 fok. Egesz nap esik.</p>
            <p class="text-blue-900"><strong>Pentek:</strong> Szep ido, 20 fok. Sut a nap.</p>
        </div>
        <h3 class="text-lg font-semibold text-slate-700 mb-3">Exercise 4.1: Forecast Comprehension</h3>
        <p class="mb-4 text-sm text-slate-500">Answer the questions based on the forecast above.</p>
        <div id="forecast-exercise" class="space-y-4"></div>
        <div id="forecast-score" class="mt-4 text-slate-700 font-medium"></div>
    `;
    main.appendChild(forecastSection);

    const forecastQuestions = [
        { question: 'Milyen az ido hetfon? (What is the weather like on Monday?)', answer: 'napos', hint: 'sunny/napos' },
        { question: 'Hany fok van kedden? (How many degrees on Tuesday?)', answer: '18', hint: 'number' },
        { question: 'Mikor esik az eso kedden? (When does it rain on Tuesday?)', answer: 'delutan', hint: 'afternoon' },
        { question: 'Milyen az ido szerdan reggel? (What is the weather like Wednesday morning?)', answer: 'kodos', hint: 'foggy' },
        { question: 'Melyik nap a leghidegebb? (Which day is the coldest?)', answer: 'csutortok', hint: 'day name' },
        { question: 'Hany fok van penteken? (How many degrees on Friday?)', answer: '20', hint: 'number' },
        { question: 'Melyik nap sut a nap? (Which day does the sun shine?)', answer: 'pentek', hint: 'Friday' },
        { question: 'Melyik napon van vihar? (Which day is there a storm?)', answer: 'csutortok', hint: 'Thursday' }
    ];

    const forecastDiv = document.getElementById('forecast-exercise');
    const forecastScoreDiv = document.getElementById('forecast-score');

    forecastQuestions.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col gap-1';
        const label = document.createElement('span');
        label.className = 'text-slate-800';
        label.textContent = `${idx + 1}. ${q.question}`;
        const inputRow = document.createElement('div');
        inputRow.className = 'flex items-center gap-2';
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = q.hint;
        input.className = 'border border-slate-300 rounded-md px-3 py-1 w-40 focus:ring-2 focus:ring-amber-500';
        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold';
        input.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') checkForecastAnswer(idx);
        });
        inputRow.appendChild(input);
        inputRow.appendChild(feedback);
        wrapper.appendChild(label);
        wrapper.appendChild(inputRow);
        forecastDiv.appendChild(wrapper);
    });

    function checkForecastAnswer(idx) {
        const wrapper = forecastDiv.children[idx];
        const input = wrapper.querySelector('input');
        const feedback = wrapper.querySelector('span');
        const correct = forecastQuestions[idx].answer;
        const userAnswer = input.value.trim().toLowerCase();

        if (userAnswer === correct.toLowerCase() || removeAccents(userAnswer) === removeAccents(correct)) {
            feedback.textContent = 'Correct!';
            feedback.className = 'text-sm font-semibold text-green-600';
        } else if (userAnswer === '') {
            feedback.textContent = '';
        } else {
            feedback.textContent = `Answer: ${correct}`;
            feedback.className = 'text-sm font-semibold text-red-600';
        }
        updateForecastScore();
    }

    function updateForecastScore() {
        let correct = 0;
        for (let i = 0; i < forecastQuestions.length; i++) {
            const feedback = forecastDiv.children[i].querySelector('span');
            if (feedback.textContent === 'Correct!') correct++;
        }
        forecastScoreDiv.textContent = `Score: ${correct} / ${forecastQuestions.length}`;
    }
    forecastScoreDiv.textContent = `Score: 0 / ${forecastQuestions.length}`;

    // ==================== SECTION 5: SEASONAL ACTIVITIES ====================
    const activitiesSection = document.createElement('section');
    activitiesSection.className = 'mb-10';
    activitiesSection.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4 border-b-2 border-amber-500 pb-2">Section 5: Seasonal Activities</h2>
        <p class="mb-4 text-slate-600">Learn to talk about activities associated with each season.</p>
        <div class="bg-slate-50 p-4 rounded-lg mb-6">
            <h3 class="font-semibold text-slate-700 mb-2">Common Seasonal Activities:</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                <div>
                    <p class="font-semibold text-green-700">Tavasz (Spring):</p>
                    <p>kerekparozni - to cycle</p>
                    <p>kirndulni - to go on excursion</p>
                </div>
                <div>
                    <p class="font-semibold text-yellow-700">Nyar (Summer):</p>
                    <p>uszni - to swim</p>
                    <p>napozni - to sunbathe</p>
                </div>
                <div>
                    <p class="font-semibold text-orange-700">Osz (Autumn):</p>
                    <p>gombazni - to pick mushrooms</p>
                    <p>setalni - to walk</p>
                </div>
                <div>
                    <p class="font-semibold text-blue-700">Tel (Winter):</p>
                    <p>korcsolyazni - to ice skate</p>
                    <p>sielni - to ski</p>
                </div>
            </div>
        </div>
        <h3 class="text-lg font-semibold text-slate-700 mb-3">Exercise 5.1: Seasonal Activity Dialogues</h3>
        <p class="mb-4 text-sm text-slate-500">Complete the dialogues about seasonal activities.</p>
        <div id="activities-exercise" class="space-y-4"></div>
        <div id="activities-score" class="mt-4 text-slate-700 font-medium"></div>
    `;
    main.appendChild(activitiesSection);

    const activityDialogues = [
        {
            prompt: 'A: Mit csinalsz nyaron? (What do you do in summer?)',
            yourLine: 'B: I swim in the lake.',
            answer: 'uszom a toban',
            alternatives: ['a toban uszom', 'uszni megyek'],
            translation: 'I swim in the lake.'
        },
        {
            prompt: 'A: Szeretsz sielni? (Do you like to ski?)',
            yourLine: 'B: Yes, I ski in winter.',
            answer: 'igen telen sielek',
            alternatives: ['igen sielek telen', 'sielek telen'],
            translation: 'Yes, I ski in winter.'
        },
        {
            prompt: 'A: Mi a kedvenc evszakod? (What is your favorite season?)',
            yourLine: 'B: My favorite season is spring.',
            answer: 'a kedvenc evszakom a tavasz',
            alternatives: ['tavasz a kedvenc evszakom', 'a tavasz'],
            translation: 'My favorite season is spring.'
        },
        {
            prompt: 'A: Mit csinalsz oszel? (What do you do in autumn?)',
            yourLine: 'B: I go for walks in the forest.',
            answer: 'setalok az erdoben',
            alternatives: ['az erdoben setalok', 'setalni megyek'],
            translation: 'I go for walks in the forest.'
        },
        {
            prompt: 'A: Korcsolyazol telen? (Do you ice skate in winter?)',
            yourLine: 'B: Yes, I love ice skating.',
            answer: 'igen szeretem a korcsolyazast',
            alternatives: ['igen szeretek korcsolyazni', 'igen korcsolyazom'],
            translation: 'Yes, I love ice skating.'
        },
        {
            prompt: 'A: Milyen ido van odakint? (What is the weather like outside?)',
            yourLine: 'B: It is sunny and warm.',
            answer: 'napos es meleg van',
            alternatives: ['meleg es napos', 'napos van es meleg'],
            translation: 'It is sunny and warm.'
        },
        {
            prompt: 'A: Esik az eso? (Is it raining?)',
            yourLine: 'B: No, the sun is shining.',
            answer: 'nem sut a nap',
            alternatives: ['nem a nap sut', 'nem nem esik'],
            translation: 'No, the sun is shining.'
        },
        {
            prompt: 'A: Mikor megy a Balatonra? (When do you go to Lake Balaton?)',
            yourLine: 'B: I go in summer.',
            answer: 'nyaron megyek',
            alternatives: ['megyek nyaron', 'nyaron'],
            translation: 'I go in summer.'
        }
    ];

    const activitiesDiv = document.getElementById('activities-exercise');
    const activitiesScoreDiv = document.getElementById('activities-score');

    activityDialogues.forEach((dialog, idx) => {
        const card = document.createElement('div');
        card.className = 'bg-slate-50 p-4 rounded-lg';
        card.innerHTML = `
            <p class="text-slate-700 mb-1">${dialog.prompt}</p>
            <p class="text-slate-500 text-sm italic mb-2">${dialog.yourLine}</p>
        `;
        const inputRow = document.createElement('div');
        inputRow.className = 'flex flex-col md:flex-row items-start md:items-center gap-2';
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = 'Your response in Hungarian...';
        input.className = 'border border-slate-300 rounded-md px-3 py-2 w-full md:w-72 focus:ring-2 focus:ring-amber-500';
        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold';
        input.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') checkActivityAnswer(idx);
        });
        inputRow.appendChild(input);
        inputRow.appendChild(feedback);
        card.appendChild(inputRow);
        activitiesDiv.appendChild(card);
    });

    function checkActivityAnswer(idx) {
        const card = activitiesDiv.children[idx];
        const input = card.querySelector('input');
        const feedback = card.querySelector('span');
        const dialog = activityDialogues[idx];
        const userAnswer = input.value.trim().toLowerCase().replace(/[?.!,]/g, '');
        const normalizedUser = removeAccents(userAnswer);

        const allCorrect = [dialog.answer, ...dialog.alternatives];
        const isExactMatch = allCorrect.some(a => userAnswer === a.toLowerCase().replace(/[?.!,]/g, ''));
        const isAccentMatch = allCorrect.some(a => normalizedUser === removeAccents(a.replace(/[?.!,]/g, '')));

        if (isExactMatch) {
            feedback.textContent = `Correct! (${dialog.translation})`;
            feedback.className = 'text-sm font-semibold text-green-600';
        } else if (isAccentMatch) {
            feedback.textContent = `Watch your accents! (${dialog.translation})`;
            feedback.className = 'text-sm font-semibold text-yellow-600';
        } else if (userAnswer === '') {
            feedback.textContent = '';
        } else {
            feedback.textContent = `Try: ${dialog.answer}`;
            feedback.className = 'text-sm font-semibold text-red-600';
        }
        updateActivitiesScore();
    }

    function updateActivitiesScore() {
        let correct = 0;
        for (let i = 0; i < activityDialogues.length; i++) {
            const feedback = activitiesDiv.children[i].querySelector('span');
            if (feedback.textContent.startsWith('Correct!')) correct++;
        }
        activitiesScoreDiv.textContent = `Score: ${correct} / ${activityDialogues.length}`;
    }
    activitiesScoreDiv.textContent = `Score: 0 / ${activityDialogues.length}`;

    // ==================== TOTAL SCORE SUMMARY ====================
    const summarySection = document.createElement('section');
    summarySection.className = 'mt-10 p-6 bg-amber-50 rounded-xl';
    summarySection.innerHTML = `
        <h2 class="text-2xl font-bold text-amber-800 mb-4">Lesson Summary</h2>
        <p class="text-amber-700 mb-4">Excellent work! You've learned essential weather and season vocabulary in Hungarian.</p>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
            <div class="bg-white p-3 rounded-lg">
                <p class="font-semibold text-amber-800">Weather Vocabulary:</p>
                <p class="text-slate-600">12 weather conditions and terms</p>
            </div>
            <div class="bg-white p-3 rounded-lg">
                <p class="font-semibold text-amber-800">Seasons:</p>
                <p class="text-slate-600">tavasz, nyar, osz, tel</p>
            </div>
            <div class="bg-white p-3 rounded-lg">
                <p class="font-semibold text-amber-800">Key Phrases:</p>
                <p class="text-slate-600">Milyen ido van? Hany fok van?</p>
            </div>
            <div class="bg-white p-3 rounded-lg">
                <p class="font-semibold text-amber-800">Cultural Note:</p>
                <p class="text-slate-600">Lake Balaton is a popular summer destination!</p>
            </div>
        </div>
        <div class="mt-4 p-3 bg-white rounded-lg">
            <p class="font-semibold text-amber-800">Total Exercises Completed:</p>
            <p class="text-slate-600">46 interactive exercises across 5 sections</p>
        </div>
    `;
    main.appendChild(summarySection);
    </script>
</body>
</html>
