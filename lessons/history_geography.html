<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 49: Hungarian History & Geography - Learning Hungarian</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; }
        th, td { border: 1px solid #e2e8f0; padding: 0.5rem 1rem; text-align: left; }
        th { background: #f1f5f9; }
        .cultural-note {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border-left: 4px solid #f59e0b;
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 0 0.5rem 0.5rem 0;
        }
        .history-card {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            border: 1px solid #0ea5e9;
            border-radius: 0.5rem;
            padding: 1rem;
        }
        .geo-highlight { color: #0f766e; font-weight: 600; }
        .stage-complete { background: linear-gradient(to right, #d1fae5, #ecfdf5); }
    </style>
</head>
<body class="bg-slate-100 p-4 md:p-8">
    <header class="text-center mb-8">
        <div class="mb-4">
            <a href="../index.html" class="inline-flex items-center px-4 py-2 bg-slate-600 text-white text-sm font-medium rounded-lg hover:bg-slate-700 transition-colors">
                <svg class="mr-2 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                Back to Lessons
            </a>
        </div>
        <h1 class="text-3xl md:text-4xl font-bold text-slate-700">Lesson 49: Hungarian History & Geography <span class="block text-xl text-slate-500 font-normal mt-2">(Magyar tortenelem es foldrajz)</span></h1>
        <p class="text-slate-600 mt-2 max-w-2xl mx-auto">Explore Hungary's rich history, geography, and famous figures. Learn vocabulary for discussing historical events, landmarks, and the geography of this fascinating country.</p>
    </header>

    <main class="max-w-4xl mx-auto bg-white rounded-xl shadow-md p-6" id="main-content">
    </main>

    <footer class="text-center mt-12 py-4 border-t border-slate-300">
        <p class="text-sm text-slate-500">&copy; 2024 Hungarian Language Lessons</p>
    </footer>

    <script>
    // ============================================
    // UTILITY FUNCTIONS
    // ============================================
    function removeAccents(str) {
        return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    }

    function normalizeAnswer(str) {
        return str.trim().toLowerCase();
    }

    function checkAccentAware(userInput, correctAnswer) {
        const normalizedInput = normalizeAnswer(userInput);
        const normalizedCorrect = normalizeAnswer(correctAnswer);

        if (normalizedInput === normalizedCorrect) {
            return 'correct';
        } else if (removeAccents(normalizedInput) === removeAccents(normalizedCorrect)) {
            return 'accent-warning';
        } else {
            return 'incorrect';
        }
    }

    // ============================================
    // VOCABULARY DATA
    // ============================================
    const geographyVocab = [
        { hungarian: 'Magyarorszag', english: 'Hungary', note: 'The country name' },
        { hungarian: 'Budapest', english: 'Budapest', note: 'The capital city' },
        { hungarian: 'Duna', english: 'Danube River', note: 'Major river' },
        { hungarian: 'Balaton', english: 'Lake Balaton', note: 'Largest lake in Central Europe' },
        { hungarian: 'Tisza', english: 'Tisza River', note: 'Second largest river' },
        { hungarian: 'hegyseg', english: 'mountain range', note: '' },
        { hungarian: 'sikcsag', english: 'plain/flatland', note: '' },
        { hungarian: 'Alfold', english: 'Great Hungarian Plain', note: '' },
        { hungarian: 'hatar', english: 'border', note: '' },
        { hungarian: 'megye', english: 'county', note: '' }
    ];

    const historicalTerms = [
        { hungarian: 'tortenelem', english: 'history', note: '' },
        { hungarian: 'kiraly', english: 'king', note: '' },
        { hungarian: 'kiralyno', english: 'queen', note: '' },
        { hungarian: 'birodalom', english: 'empire', note: '' },
        { hungarian: 'haboru', english: 'war', note: '' },
        { hungarian: 'forradalom', english: 'revolution', note: '' },
        { hungarian: 'szabadsag', english: 'freedom/liberty', note: '' },
        { hungarian: 'honfoglalas', english: 'Hungarian Conquest (896 AD)', note: 'Settlement of Magyars' },
        { hungarian: 'Szent Istvan', english: 'Saint Stephen', note: 'First King of Hungary' },
        { hungarian: 'korona', english: 'crown', note: '' }
    ];

    const famousHungarians = [
        { hungarian: 'Kossuth Lajos', english: 'Lajos Kossuth', note: 'Revolutionary leader (1848)' },
        { hungarian: 'Petofi Sandor', english: 'Sandor Petofi', note: 'National poet' },
        { hungarian: 'Liszt Ferenc', english: 'Franz Liszt', note: 'Composer and pianist' },
        { hungarian: 'Bartok Bela', english: 'Bela Bartok', note: 'Composer' },
        { hungarian: 'Rubik Erno', english: 'Erno Rubik', note: 'Inventor of Rubik\'s Cube' },
        { hungarian: 'Puskas Ferenc', english: 'Ferenc Puskas', note: 'Legendary footballer' }
    ];

    const landmarks = [
        { hungarian: 'Parlament', english: 'Parliament Building', note: 'Budapest' },
        { hungarian: 'Halaszbastya', english: 'Fisherman\'s Bastion', note: 'Budapest' },
        { hungarian: 'Matyas-templom', english: 'Matthias Church', note: 'Budapest' },
        { hungarian: 'Lancgid', english: 'Chain Bridge', note: 'Budapest' },
        { hungarian: 'Hosok tere', english: 'Heroes\' Square', note: 'Budapest' },
        { hungarian: 'Eger var', english: 'Eger Castle', note: 'Famous for 1552 siege' }
    ];

    // ============================================
    // EXERCISE DATA
    // ============================================
    const matchingExercise = [
        { hungarian: 'Duna', options: ['Danube River', 'Lake Balaton', 'Great Plain', 'Border'], correct: 0 },
        { hungarian: 'kiraly', options: ['queen', 'king', 'crown', 'empire'], correct: 1 },
        { hungarian: 'forradalom', options: ['freedom', 'war', 'revolution', 'history'], correct: 2 },
        { hungarian: 'Balaton', options: ['river', 'mountain', 'lake', 'plain'], correct: 2 },
        { hungarian: 'haboru', options: ['peace', 'war', 'king', 'border'], correct: 1 },
        { hungarian: 'Parlament', options: ['Church', 'Castle', 'Parliament', 'Bridge'], correct: 2 },
        { hungarian: 'szabadsag', options: ['slavery', 'freedom', 'empire', 'county'], correct: 1 },
        { hungarian: 'hegyseg', options: ['plain', 'river', 'lake', 'mountain range'], correct: 3 },
        { hungarian: 'megye', options: ['country', 'county', 'city', 'village'], correct: 1 },
        { hungarian: 'hatar', options: ['center', 'border', 'capital', 'crown'], correct: 1 }
    ];

    const fillInBlanks = [
        { sentence: 'A ___ Magyarorszag fovasa.', answer: 'Budapest', english: 'Budapest is the capital of Hungary.' },
        { sentence: 'A ___ a legnagyobb to Kozep-Europaban.', answer: 'Balaton', english: 'Lake Balaton is the largest lake in Central Europe.' },
        { sentence: 'Szent Istvan volt az elso magyar ___.', answer: 'kiraly', english: 'Saint Stephen was the first Hungarian king.' },
        { sentence: 'A ___ Budapesten van.', answer: 'Parlament', english: 'The Parliament is in Budapest.' },
        { sentence: 'Az 1848-as ___ fontos esemeny volt.', answer: 'forradalom', english: 'The 1848 revolution was an important event.' },
        { sentence: 'A ___ folyik Budapesten keresztul.', answer: 'Duna', english: 'The Danube flows through Budapest.' },
        { sentence: 'Puskas Ferenc hires magyar ___ volt.', answer: 'focista', english: 'Ferenc Puskas was a famous Hungarian footballer.' },
        { sentence: 'A magyar ___ 896-ban tortent.', answer: 'honfoglalas', english: 'The Hungarian Conquest happened in 896.' }
    ];

    const trueFalseQuestions = [
        { statement: 'Budapest a Duna mellett fekszik.', answer: true, english: 'Budapest is located on the Danube.' },
        { statement: 'A Balaton egy folyo.', answer: false, english: 'Lake Balaton is a river.' },
        { statement: 'Szent Istvan volt az elso magyar kiraly.', answer: true, english: 'Saint Stephen was the first Hungarian king.' },
        { statement: 'Liszt Ferenc festomuvesz volt.', answer: false, english: 'Franz Liszt was a painter.' },
        { statement: 'Az Alfold egy sikcsag.', answer: true, english: 'The Great Plain is a flatland.' },
        { statement: 'Magyarorszagnak nincs tengerpartja.', answer: true, english: 'Hungary has no coastline.' },
        { statement: 'Eger varosa Budapesten van.', answer: false, english: 'The city of Eger is in Budapest.' },
        { statement: 'A Tisza Magyarorszag masodik legnagyobb folyoja.', answer: true, english: 'The Tisza is Hungary\'s second largest river.' }
    ];

    const famousPeopleQuiz = [
        { question: 'Ki talalta fel a Rubik-kockat?', options: ['Liszt Ferenc', 'Rubik Erno', 'Puskas Ferenc', 'Petofi Sandor'], correct: 1 },
        { question: 'Ki volt a hires magyar zeneszerzo?', options: ['Kossuth Lajos', 'Szent Istvan', 'Bartok Bela', 'Rubik Erno'], correct: 2 },
        { question: 'Ki volt az 1848-as forradalom vezetoje?', options: ['Petofi Sandor', 'Kossuth Lajos', 'Puskas Ferenc', 'Liszt Ferenc'], correct: 1 },
        { question: 'Ki a nemzeti kolto?', options: ['Bartok Bela', 'Liszt Ferenc', 'Petofi Sandor', 'Kossuth Lajos'], correct: 2 },
        { question: 'Ki volt a legendas focista?', options: ['Rubik Erno', 'Puskas Ferenc', 'Bartok Bela', 'Szent Istvan'], correct: 1 },
        { question: 'Ki volt az elso magyar kiraly?', options: ['Matyas kiraly', 'Szent Istvan', 'Kossuth Lajos', 'Petofi Sandor'], correct: 1 }
    ];

    // ============================================
    // SCORE TRACKING
    // ============================================
    let scores = {
        stage1: { correct: 0, total: matchingExercise.length },
        stage2: { correct: 0, total: fillInBlanks.length },
        stage3: { correct: 0, total: trueFalseQuestions.length },
        stage4: { correct: 0, total: famousPeopleQuiz.length }
    };

    function updateTotalScore() {
        const totalCorrect = Object.values(scores).reduce((sum, s) => sum + s.correct, 0);
        const totalQuestions = Object.values(scores).reduce((sum, s) => sum + s.total, 0);
        const totalScoreEl = document.getElementById('total-score');
        if (totalScoreEl) {
            totalScoreEl.textContent = `Total Score: ${totalCorrect} / ${totalQuestions}`;
        }
    }

    // ============================================
    // BUILD PAGE CONTENT
    // ============================================
    const mainContent = document.getElementById('main-content');

    // Learning Objectives
    const objectivesSection = document.createElement('section');
    objectivesSection.className = 'mb-8 p-4 bg-teal-50 rounded-lg border border-teal-200';
    objectivesSection.innerHTML = `
        <h2 class="text-xl font-semibold text-teal-800 mb-3">Learning Objectives</h2>
        <ul class="list-disc pl-6 text-teal-700 space-y-1">
            <li>Learn geographical vocabulary for Hungary</li>
            <li>Master historical terms and concepts</li>
            <li>Know famous Hungarians and their achievements</li>
            <li>Discuss landmarks and cultural sites</li>
        </ul>
    `;
    mainContent.appendChild(objectivesSection);

    // Cultural Note
    const culturalNote = document.createElement('div');
    culturalNote.className = 'cultural-note mb-8';
    culturalNote.innerHTML = `
        <h3 class="font-bold text-amber-800 mb-2">Cultural Note: Hungarian National Identity</h3>
        <p class="text-amber-900">Hungary has a rich history spanning over 1,100 years since the <strong>honfoglalas</strong> (Hungarian Conquest) in 896 AD.
        The nation has survived invasions, occupations, and revolutions while maintaining its unique language and cultural identity.
        March 15th commemorates the 1848 Revolution, and August 20th celebrates <strong>Szent Istvan</strong> (Saint Stephen), the founder of the Hungarian state.</p>
    `;
    mainContent.appendChild(culturalNote);

    // Section 1: Geography Vocabulary
    const section1 = document.createElement('section');
    section1.className = 'mb-8';
    section1.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4 pb-2 border-b-2 border-teal-500">Section 1: Geography Vocabulary (Foldrajzi szokincs)</h2>
        <table class="mb-4">
            <thead>
                <tr><th>Hungarian</th><th>English</th><th>Notes</th></tr>
            </thead>
            <tbody>
                ${geographyVocab.map(item => `<tr><td class="geo-highlight">${item.hungarian}</td><td>${item.english}</td><td class="text-sm text-slate-500">${item.note}</td></tr>`).join('')}
            </tbody>
        </table>
    `;
    mainContent.appendChild(section1);

    // Section 2: Historical Terms
    const section2 = document.createElement('section');
    section2.className = 'mb-8';
    section2.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4 pb-2 border-b-2 border-teal-500">Section 2: Historical Terms (Tortenelmi kifejezesek)</h2>
        <table class="mb-4">
            <thead>
                <tr><th>Hungarian</th><th>English</th><th>Notes</th></tr>
            </thead>
            <tbody>
                ${historicalTerms.map(item => `<tr><td class="geo-highlight">${item.hungarian}</td><td>${item.english}</td><td class="text-sm text-slate-500">${item.note}</td></tr>`).join('')}
            </tbody>
        </table>
    `;
    mainContent.appendChild(section2);

    // Section 3: Famous Hungarians
    const section3 = document.createElement('section');
    section3.className = 'mb-8';
    section3.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4 pb-2 border-b-2 border-teal-500">Section 3: Famous Hungarians (Hires magyarok)</h2>
        <div class="grid md:grid-cols-2 gap-4">
            ${famousHungarians.map(person => `
                <div class="history-card">
                    <h3 class="font-bold text-blue-800">${person.hungarian}</h3>
                    <p class="text-slate-600">${person.english}</p>
                    <p class="text-sm text-slate-500 italic">${person.note}</p>
                </div>
            `).join('')}
        </div>
    `;
    mainContent.appendChild(section3);

    // Section 4: Landmarks
    const section4 = document.createElement('section');
    section4.className = 'mb-8';
    section4.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4 pb-2 border-b-2 border-teal-500">Section 4: Landmarks (Leatnivalok)</h2>
        <table class="mb-4">
            <thead>
                <tr><th>Hungarian</th><th>English</th><th>Location</th></tr>
            </thead>
            <tbody>
                ${landmarks.map(item => `<tr><td class="geo-highlight">${item.hungarian}</td><td>${item.english}</td><td class="text-sm text-slate-500">${item.note}</td></tr>`).join('')}
            </tbody>
        </table>
    `;
    mainContent.appendChild(section4);

    // Total Score Display
    const totalScoreSection = document.createElement('div');
    totalScoreSection.className = 'bg-gradient-to-r from-teal-600 to-teal-700 text-white rounded-xl p-4 mb-8 text-center';
    totalScoreSection.innerHTML = `
        <h3 class="text-lg font-semibold mb-1">Interactive Exercises</h3>
        <p id="total-score" class="text-2xl font-bold">Total Score: 0 / ${matchingExercise.length + fillInBlanks.length + trueFalseQuestions.length + famousPeopleQuiz.length}</p>
    `;
    mainContent.appendChild(totalScoreSection);

    // ============================================
    // STAGE 1: Vocabulary Matching
    // ============================================
    const stage1Section = document.createElement('section');
    stage1Section.className = 'mb-8 p-4 bg-slate-50 rounded-lg';
    stage1Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 1: Vocabulary Matching (10 items)</h2>
        <p class="text-slate-600 mb-4">Match each Hungarian word with its correct English meaning.</p>
        <div id="stage1-exercises" class="space-y-4"></div>
        <div id="stage1-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${matchingExercise.length}</div>
    `;
    mainContent.appendChild(stage1Section);

    const stage1Container = document.getElementById('stage1-exercises');
    const stage1Answers = new Array(matchingExercise.length).fill(false);

    matchingExercise.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col md:flex-row items-start md:items-center gap-3 p-3 bg-white rounded-lg border';

        const label = document.createElement('span');
        label.className = 'min-w-[120px] font-semibold text-teal-700';
        label.textContent = q.hungarian;

        const select = document.createElement('select');
        select.className = 'border border-slate-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-teal-500';
        select.innerHTML = '<option value="">Select...</option>' + q.options.map((opt, i) => `<option value="${i}">${opt}</option>`).join('');

        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold';

        select.addEventListener('change', function() {
            if (parseInt(this.value) === q.correct) {
                feedback.textContent = 'Correct!';
                feedback.className = 'text-sm font-semibold text-green-600';
                this.disabled = true;
                this.className = 'border border-green-500 bg-green-50 rounded-md px-3 py-2';
                if (!stage1Answers[idx]) {
                    stage1Answers[idx] = true;
                    scores.stage1.correct++;
                    document.getElementById('stage1-score').textContent = `Score: ${scores.stage1.correct} / ${matchingExercise.length}`;
                    updateTotalScore();
                }
            } else if (this.value !== '') {
                feedback.textContent = 'Try again!';
                feedback.className = 'text-sm font-semibold text-red-600';
            }
        });

        wrapper.appendChild(label);
        wrapper.appendChild(select);
        wrapper.appendChild(feedback);
        stage1Container.appendChild(wrapper);
    });

    // ============================================
    // STAGE 2: Fill in the Blanks
    // ============================================
    const stage2Section = document.createElement('section');
    stage2Section.className = 'mb-8 p-4 bg-slate-50 rounded-lg';
    stage2Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 2: Fill in the Blanks (8 items)</h2>
        <p class="text-slate-600 mb-4">Complete each sentence with the correct Hungarian word.</p>
        <div id="stage2-exercises" class="space-y-4"></div>
        <div id="stage2-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${fillInBlanks.length}</div>
    `;
    mainContent.appendChild(stage2Section);

    const stage2Container = document.getElementById('stage2-exercises');
    const stage2Answers = new Array(fillInBlanks.length).fill(false);

    fillInBlanks.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'p-3 bg-white rounded-lg border';

        const sentenceParts = q.sentence.split('___');
        const row = document.createElement('div');
        row.className = 'flex flex-wrap items-center gap-2 mb-2';

        row.innerHTML = `<span class="text-slate-700">${sentenceParts[0]}</span>`;

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-3 py-1 w-32 text-center focus:ring-2 focus:ring-teal-500';

        const span2 = document.createElement('span');
        span2.className = 'text-slate-700';
        span2.textContent = sentenceParts[1] || '';

        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold ml-2';

        row.appendChild(input);
        row.appendChild(span2);
        row.appendChild(feedback);

        const translation = document.createElement('div');
        translation.className = 'text-xs text-slate-500 italic';
        translation.textContent = `(${q.english})`;

        function checkAnswer() {
            const result = checkAccentAware(input.value, q.answer);
            if (result === 'correct') {
                feedback.textContent = 'Correct!';
                feedback.className = 'text-sm font-semibold text-green-600 ml-2';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-3 py-1 w-32 text-center';
                if (!stage2Answers[idx]) {
                    stage2Answers[idx] = true;
                    scores.stage2.correct++;
                    document.getElementById('stage2-score').textContent = `Score: ${scores.stage2.correct} / ${fillInBlanks.length}`;
                    updateTotalScore();
                }
            } else if (result === 'accent-warning') {
                feedback.textContent = 'Check accents!';
                feedback.className = 'text-sm font-semibold text-yellow-600 ml-2';
            } else if (input.value.trim() !== '') {
                feedback.textContent = 'Try again!';
                feedback.className = 'text-sm font-semibold text-red-600 ml-2';
            }
        }

        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkAnswer(); });
        input.addEventListener('blur', checkAnswer);

        wrapper.appendChild(row);
        wrapper.appendChild(translation);
        stage2Container.appendChild(wrapper);
    });

    // ============================================
    // STAGE 3: True or False
    // ============================================
    const stage3Section = document.createElement('section');
    stage3Section.className = 'mb-8 p-4 bg-slate-50 rounded-lg';
    stage3Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 3: True or False (8 items)</h2>
        <p class="text-slate-600 mb-4">Determine if each statement about Hungary is true (Igaz) or false (Hamis).</p>
        <div id="stage3-exercises" class="space-y-4"></div>
        <div id="stage3-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${trueFalseQuestions.length}</div>
    `;
    mainContent.appendChild(stage3Section);

    const stage3Container = document.getElementById('stage3-exercises');
    const stage3Answers = new Array(trueFalseQuestions.length).fill(false);

    trueFalseQuestions.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'p-3 bg-white rounded-lg border';

        wrapper.innerHTML = `
            <div class="mb-2">
                <p class="text-slate-800 font-medium">${q.statement}</p>
                <p class="text-xs text-slate-500 italic">(${q.english})</p>
            </div>
            <div class="flex gap-4 items-center">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="radio" name="tf-${idx}" value="true" class="text-teal-600">
                    <span>Igaz (True)</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="radio" name="tf-${idx}" value="false" class="text-teal-600">
                    <span>Hamis (False)</span>
                </label>
                <span class="feedback text-sm font-semibold"></span>
            </div>
        `;

        wrapper.querySelectorAll('input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const feedback = wrapper.querySelector('.feedback');
                const isCorrect = (this.value === 'true') === q.answer;
                if (isCorrect) {
                    feedback.textContent = 'Correct!';
                    feedback.className = 'feedback text-sm font-semibold text-green-600';
                    wrapper.querySelectorAll('input[type="radio"]').forEach(r => r.disabled = true);
                    if (!stage3Answers[idx]) {
                        stage3Answers[idx] = true;
                        scores.stage3.correct++;
                        document.getElementById('stage3-score').textContent = `Score: ${scores.stage3.correct} / ${trueFalseQuestions.length}`;
                        updateTotalScore();
                    }
                } else {
                    feedback.textContent = 'Try again!';
                    feedback.className = 'feedback text-sm font-semibold text-red-600';
                }
            });
        });

        stage3Container.appendChild(wrapper);
    });

    // ============================================
    // STAGE 4: Famous Hungarians Quiz
    // ============================================
    const stage4Section = document.createElement('section');
    stage4Section.className = 'mb-8 p-4 bg-slate-50 rounded-lg';
    stage4Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 4: Famous Hungarians Quiz (6 items)</h2>
        <p class="text-slate-600 mb-4">Test your knowledge of famous Hungarians and their achievements.</p>
        <div id="stage4-exercises" class="space-y-4"></div>
        <div id="stage4-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${famousPeopleQuiz.length}</div>
    `;
    mainContent.appendChild(stage4Section);

    const stage4Container = document.getElementById('stage4-exercises');
    const stage4Answers = new Array(famousPeopleQuiz.length).fill(false);

    famousPeopleQuiz.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'p-4 bg-white rounded-lg border';

        let optionsHtml = q.options.map((opt, i) => `
            <label class="flex items-center gap-2 cursor-pointer p-2 rounded hover:bg-slate-50">
                <input type="radio" name="quiz-${idx}" value="${i}" class="text-teal-600">
                <span>${opt}</span>
            </label>
        `).join('');

        wrapper.innerHTML = `
            <p class="text-slate-800 font-medium mb-3">${idx + 1}. ${q.question}</p>
            <div class="grid grid-cols-2 gap-2">${optionsHtml}</div>
            <span class="feedback text-sm font-semibold mt-2 block"></span>
        `;

        wrapper.querySelectorAll('input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const feedback = wrapper.querySelector('.feedback');
                if (parseInt(this.value) === q.correct) {
                    feedback.textContent = 'Correct!';
                    feedback.className = 'feedback text-sm font-semibold text-green-600 mt-2 block';
                    wrapper.querySelectorAll('input[type="radio"]').forEach(r => r.disabled = true);
                    if (!stage4Answers[idx]) {
                        stage4Answers[idx] = true;
                        scores.stage4.correct++;
                        document.getElementById('stage4-score').textContent = `Score: ${scores.stage4.correct} / ${famousPeopleQuiz.length}`;
                        updateTotalScore();
                    }
                } else {
                    feedback.textContent = 'Try again!';
                    feedback.className = 'feedback text-sm font-semibold text-red-600 mt-2 block';
                }
            });
        });

        stage4Container.appendChild(wrapper);
    });

    // ============================================
    // SUMMARY SECTION
    // ============================================
    const summarySection = document.createElement('section');
    summarySection.className = 'mt-8 p-6 bg-gradient-to-r from-teal-50 to-blue-50 rounded-xl border border-teal-200';
    summarySection.innerHTML = `
        <h2 class="text-xl font-bold text-teal-800 mb-4">Lesson Summary</h2>
        <div class="grid md:grid-cols-2 gap-4 text-sm">
            <div>
                <h3 class="font-semibold text-slate-700 mb-2">Key Geography Terms:</h3>
                <ul class="list-disc pl-5 text-slate-600 space-y-1">
                    <li><strong>Magyarorszag</strong> - Hungary</li>
                    <li><strong>Budapest</strong> - Capital city</li>
                    <li><strong>Duna</strong> - Danube River</li>
                    <li><strong>Balaton</strong> - Lake Balaton</li>
                    <li><strong>Alfold</strong> - Great Hungarian Plain</li>
                </ul>
            </div>
            <div>
                <h3 class="font-semibold text-slate-700 mb-2">Key Historical Terms:</h3>
                <ul class="list-disc pl-5 text-slate-600 space-y-1">
                    <li><strong>kiraly</strong> - king</li>
                    <li><strong>forradalom</strong> - revolution</li>
                    <li><strong>szabadsag</strong> - freedom</li>
                    <li><strong>honfoglalas</strong> - Hungarian Conquest (896)</li>
                    <li><strong>Szent Istvan</strong> - Saint Stephen</li>
                </ul>
            </div>
        </div>
        <div class="mt-4 p-3 bg-amber-50 rounded-lg border border-amber-200">
            <p class="text-amber-800 text-sm"><strong>Remember:</strong> Hungary has a rich cultural heritage. Learning about its history and geography helps you understand the language and connect with Hungarian speakers on a deeper level!</p>
        </div>
    `;
    mainContent.appendChild(summarySection);

    // Initialize total score
    updateTotalScore();
    </script>
</body>
</html>
