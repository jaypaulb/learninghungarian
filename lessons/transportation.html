    <script>
    // ============================================
    // UTILITY FUNCTIONS
    // ============================================

    function removeAccents(str) {
        return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[\u0151\u0150\u0171\u0170]/g, function(m) {
            const map = { '\u0151':'o', '\u0150':'O', '\u0171':'u', '\u0170':'U' };
            return map[m] || m;
        });
    }

    function normalizeAnswer(str) {
        return str.trim().toLowerCase();
    }

    function checkAccentAware(userInput, correctAnswer) {
        const normalizedInput = normalizeAnswer(userInput);
        const normalizedCorrect = normalizeAnswer(correctAnswer);

        if (normalizedInput === normalizedCorrect) {
            return 'correct';
        } else if (removeAccents(normalizedInput) === removeAccents(normalizedCorrect)) {
            return 'accent-warning';
        } else {
            return 'incorrect';
        }
    }

    // ============================================

    // ============================================

        { hungarian: 'a bicikli', english: 'the bicycle', icon: '🚲' },

        { hungarian: 'a taxi', english: 'the taxi', icon: '🚕' },
        { hungarian: 'a hajo', english: 'the ship/boat', icon: '🚢' },
        { hungarian: 'a motor', english: 'the motorcycle', icon: '🏍️' }

    const travelPlaces = [
        { hungarian: 'a megallo', english: 'the stop (bus/tram)' },

        { hungarian: 'jobbra', english: 'to the right', icon: '➡️' },

        { hungarian: 'hatra', english: 'backward', icon: '⬇️' },
        { hungarian: 'itt', english: 'here', icon: '📍' },
        { hungarian: 'ott', english: 'there', icon: '📍' },
        { hungarian: 'kozel', english: 'near/close', icon: '📍' },
        { hungarian: 'messze', english: 'far', icon: '📍' },
        { hungarian: 'szemben', english: 'opposite/across', icon: '↔️' }
    ];

    const travelPhrases = [
        { hungarian: 'Hol van a megallo?', english: 'Where is the stop?' },
        { hungarian: 'Mikor indul a busz?', english: 'When does the bus leave?' },
        { hungarian: 'Mikor erkezik a vonat?', english: 'When does the train arrive?' },
        { hungarian: 'Mennyibe kerul a jegy?', english: 'How much does the ticket cost?' },
        { hungarian: 'Kerek egy jegyet.', english: 'I would like a ticket.' },
        { hungarian: 'Hol kell leszallni?', english: 'Where should I get off?' },
        { hungarian: 'Melyik vaganyrol indul?', english: 'Which platform does it leave from?' },
        { hungarian: 'Merre van a centrum?', english: 'Which way is the center?' },
        { hungarian: 'Messze van innen?', english: 'Is it far from here?' },
        { hungarian: 'Gyalog vagy busszal?', english: 'On foot or by bus?' }
    ];

    const askingDirections = [
        { hungarian: 'Elnezest, hol van...?', english: 'Excuse me, where is...?' },
        { hungarian: 'Hogy jutok el...?', english: 'How do I get to...?' },
        { hungarian: 'Merre kell menni?', english: 'Which way should I go?' },
        { hungarian: 'Menjen egyenesen!', english: 'Go straight!' },
        { hungarian: 'Forduljon balra/jobbra!', english: 'Turn left/right!' },
        { hungarian: 'A kovetkezo sarkon.', english: 'At the next corner.' }
    ];

    // ============================================
    // EXERCISE DATA
    // ============================================

    const vocabularyCards = [
        { hungarian: 'auto', english: 'car' },
        { hungarian: 'busz', english: 'bus' },
        { hungarian: 'vonat', english: 'train' },
        { hungarian: 'repulo', english: 'airplane' },
        { hungarian: 'bicikli', english: 'bicycle' },
        { hungarian: 'villamos', english: 'tram' },
        { hungarian: 'metro', english: 'metro' },
        { hungarian: 'taxi', english: 'taxi' },
        { hungarian: 'megallo', english: 'stop' },
        { hungarian: 'jegy', english: 'ticket' },
        { hungarian: 'balra', english: 'left' },
        { hungarian: 'jobbra', english: 'right' }
    ];

    const matchingExercise = [
        { description: 'Public transport on rails in the city', answer: 'villamos', options: ['villamos', 'vonat', 'busz', 'metro'] },
        { description: 'Underground train system', answer: 'metro', options: ['metro', 'vonat', 'villamos', 'busz'] },
        { description: 'Place where you buy tickets', answer: 'jegypenztар', options: ['jegypenztар', 'megallo', 'allomas', 'vagany'] },
        { description: 'Monthly or yearly transport pass', answer: 'berlet', options: ['berlet', 'jegy', 'auto', 'megallo'] },
        { description: 'Where trains depart from', answer: 'palyaudvar', options: ['palyaudvar', 'repuloter', 'megallo', 'allomas'] },
        { description: 'Where planes land', answer: 'repuloter', options: ['repuloter', 'palyaudvar', 'megallo', 'allomas'] },
        { description: 'Opposite of "balra"', answer: 'jobbra', options: ['jobbra', 'elore', 'egyenesen', 'hatra'] },
        { description: 'Opposite of "messze"', answer: 'kozel', options: ['kozel', 'itt', 'ott', 'szemben'] }
    ];

    const fillInBlanks = [
        { sentence: 'Hol van a ___?', answer: 'megallo', english: 'Where is the stop?', hint: 'stop' },
        { sentence: 'Mikor ___ a busz?', answer: 'indul', english: 'When does the bus leave?', hint: 'leaves/departs' },
        { sentence: '___ kerul a jegy?', answer: 'Mennyibe', english: 'How much does the ticket cost?', hint: 'How much' },
        { sentence: 'Menjen ___!', answer: 'egyenesen', english: 'Go straight!', hint: 'straight' },
        { sentence: 'Forduljon ___!', answer: 'balra', english: 'Turn left!', hint: 'left' },
        { sentence: 'Kerek egy ___.', answer: 'jegyet', english: 'I would like a ticket.', hint: 'ticket (accusative)' },
        { sentence: 'Merre van a ___?', answer: 'centrum', english: 'Which way is the center?', hint: 'center' },
        { sentence: '___ van innen?', answer: 'Messze', english: 'Is it far from here?', hint: 'Far' }
    ];

    const translationExercise = [
        { english: 'Where is the bus stop?', answer: 'Hol van a buszmegallo' },
        { english: 'When does the train arrive?', answer: 'Mikor erkezik a vonat' },
        { english: 'Turn right!', answer: 'Forduljon jobbra' },
        { english: 'Go straight!', answer: 'Menjen egyenesen' },
        { english: 'I would like a ticket.', answer: 'Kerek egy jegyet' },
        { english: 'Is it far from here?', answer: 'Messze van innen' }
    ];

    const scenarioExercise = [
        {
            scenario: 'You are at a train station and want to know when the next train to Budapest leaves.',
            question: 'What do you ask?',
            answer: 'Mikor indul a vonat Budapestre',
            alternatives: ['mikor indul a vonat', 'mikor indul a kovetkezo vonat']
        },
        {
            scenario: 'You need to buy a bus ticket.',
            question: 'What do you say?',
            answer: 'Kerek egy buszjegyet',
            alternatives: ['kerek egy jegyet', 'egy jegyet kerek']
        },
        {
            scenario: 'You are lost and want to find the city center.',
            question: 'What do you ask?',
            answer: 'Elnezest, merre van a centrum',
            alternatives: ['hol van a centrum', 'merre van a centrum', 'hogy jutok el a centrumba']
        },
        {
            scenario: 'You want to know where to get off the bus.',
            question: 'What do you ask?',
            answer: 'Hol kell leszallni',
            alternatives: ['hol szalljak le']
        }
    ];

    const dialogueExercise = [
        {
            speaker: 'Turista',
            line: 'Elnezest, hol van a legkozelebbi megallo?',
            response: '___ egyenesen, es a sarkon balra.',
            blank: 'Menjen',
            responseEnglish: 'Go straight, and turn left at the corner.'
        },
        {
            speaker: 'Turista',
            line: 'Mikor indul a kovetkezo busz?',
            response: 'Tiz ___ mulva indul.',
            blank: 'perc',
            responseEnglish: 'It leaves in ten minutes.'
        },
        {
            speaker: 'Turista',
            line: 'Mennyibe kerul a jegy?',
            response: 'Egy jegy haromszaz ___ kerul.',
            blank: 'forint',
            responseEnglish: 'A ticket costs three hundred forints.'
        },
        {
            speaker: 'Turista',
            line: 'Messze van a palyaudvar?',
            response: 'Nem, nagyon ___ van.',
            blank: 'kozel',
            responseEnglish: 'No, it is very close.'
        },
        {
            speaker: 'Turista',
            line: 'Melyik vaganyrol indul a vonat?',
            response: 'A ___ vaganyrol.',
            blank: 'harmadik',
            responseEnglish: 'From platform three.'
        }
    ];

    // ============================================
    // SCORE TRACKING
    // ============================================

    let scores = {
        stage1: { correct: 0, total: vocabularyCards.length },
        stage2: { correct: 0, total: matchingExercise.length },
        stage3: { correct: 0, total: fillInBlanks.length },
        stage4: { correct: 0, total: translationExercise.length },
        stage5: { correct: 0, total: scenarioExercise.length },
        stage6: { correct: 0, total: dialogueExercise.length }
    };

    let stage1Revealed = new Set();

    function updateTotalScore() {
        const totalCorrect = Object.values(scores).reduce((sum, s) => sum + s.correct, 0);
        const totalQuestions = Object.values(scores).reduce((sum, s) => sum + s.total, 0);
        const totalScoreEl = document.getElementById('total-score');
        if (totalScoreEl) {
            totalScoreEl.textContent = `Total Score: ${totalCorrect} / ${totalQuestions}`;
        }
    }

    // ============================================
    // BUILD PAGE CONTENT
    // ============================================

    const mainContent = document.getElementById('main-content');

    // Learning Objectives
    const objectivesSection = document.createElement('section');
    objectivesSection.className = 'mb-8';
    objectivesSection.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Learning Objectives</h2>
        <ul class="list-disc pl-6 space-y-2 text-slate-600">
            <li>Learn names of common vehicles and transportation methods</li>
            <li>Ask about schedules, tickets, and directions</li>
            <li>Understand and give basic directions</li>
            <li>Navigate public transportation in Hungary</li>
        </ul>
    `;
    mainContent.appendChild(objectivesSection);

    // Cultural Note
    const culturalNote = document.createElement('div');
    culturalNote.className = 'cultural-note mb-8';
    culturalNote.innerHTML = `
        <h3 class="font-bold text-amber-800 mb-2">Cultural Note: Public Transport in Hungary</h3>
        <p class="text-amber-900">Budapest has an excellent public transport system including buses (busz), trams (villamos), metro lines, and trolleybuses.
        You need to validate your ticket (jegy) when boarding, or use a "berlet" (monthly pass).
        The famous yellow trams (like line 4-6) and the historic metro line 1 (the oldest in continental Europe!) are iconic.
        Always have a valid ticket - ticket inspectors (ellenor) regularly check!</p>
    `;
    mainContent.appendChild(culturalNote);

    // Section 1: Vehicles
    const section1 = document.createElement('section');
    section1.className = 'mb-8';
    section1.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 1: Vehicles (Jarmuvek)</h2>
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-4">
            ${vehicles.map(v => `
                <div class="transport-card bg-slate-50 rounded-xl p-4 text-center shadow-sm">
                    <div class="vehicle-icon">${v.icon}</div>
                    <div class="font-bold text-teal-700">${v.hungarian}</div>
                    <div class="text-sm text-slate-600">${v.english}</div>
                </div>
            `).join('')}
        </div>
    `;
    mainContent.appendChild(section1);

    // Section 2: Travel Places
    const section2 = document.createElement('section');
    section2.className = 'mb-8';
    section2.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 2: Travel Places & Tickets</h2>
        <table class="mb-4">
            <thead>
                <tr><th class="text-left">Hungarian</th><th class="text-left">English</th></tr>
            </thead>
            <tbody>
                ${travelPlaces.map(item => `<tr><td class="font-medium text-teal-700">${item.hungarian}</td><td>${item.english}</td></tr>`).join('')}
            </tbody>
        </table>
    `;
    mainContent.appendChild(section2);

    // Section 3: Directions
    const section3 = document.createElement('section');
    section3.className = 'mb-8';
    section3.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 3: Directions (Iranyok)</h2>
        <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-4">
            ${directions.map(d => `
                <div class="bg-slate-50 rounded-lg p-3 text-center">
                    <div class="text-2xl mb-1">${d.icon}</div>
                    <div class="font-bold text-teal-700">${d.hungarian}</div>
                    <div class="text-xs text-slate-600">${d.english}</div>
                </div>
            `).join('')}
        </div>
        <div class="mt-4 p-4 bg-blue-50 rounded-lg border border-blue-200">
            <h4 class="font-semibold text-blue-800 mb-2">Giving Directions</h4>
            <p class="text-blue-700 text-sm">Use the formal imperative for polite directions:
            <strong>Menjen</strong> (Go!), <strong>Forduljon</strong> (Turn!).
            Example: "Menjen egyenesen, es forduljon balra." (Go straight and turn left.)</p>
        </div>
    `;
    mainContent.appendChild(section3);

    // Section 4: Useful Phrases
    const section4 = document.createElement('section');
    section4.className = 'mb-8';
    section4.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 4: Useful Travel Phrases</h2>
        <div class="bg-slate-50 rounded-lg p-4 space-y-3 mb-4">
            ${travelPhrases.map(item => `
                <div class="flex flex-col md:flex-row md:items-center gap-2 p-2 border-b border-slate-200 last:border-0">
                    <span class="font-medium text-teal-700 min-w-[250px]">${item.hungarian}</span>
                    <span class="text-slate-600">- ${item.english}</span>
                </div>
            `).join('')}
        </div>
        <h3 class="text-lg font-semibold text-slate-700 mb-2">Asking for Directions</h3>
        <div class="bg-slate-50 rounded-lg p-4 space-y-3">
            ${askingDirections.map(item => `
                <div class="flex flex-col md:flex-row md:items-center gap-2 p-2 border-b border-slate-200 last:border-0">
                    <span class="font-medium text-teal-700 min-w-[250px]">${item.hungarian}</span>
                    <span class="text-slate-600">- ${item.english}</span>
                </div>
            `).join('')}
        </div>
    `;
    mainContent.appendChild(section4);

    // Total Score Display
    const totalScoreSection = document.createElement('div');
    totalScoreSection.className = 'bg-gradient-to-r from-teal-600 to-teal-700 text-white rounded-xl p-4 mb-8 text-center';
    totalScoreSection.innerHTML = `
        <h3 class="text-lg font-semibold mb-1">Interactive Exercises</h3>
        <p id="total-score" class="text-2xl font-bold">Total Score: 0 / ${Object.values(scores).reduce((sum, s) => sum + s.total, 0)}</p>
    `;
    mainContent.appendChild(totalScoreSection);

    // ============================================
    // STAGE 1: VOCABULARY CARDS
    // ============================================

    const stage1Section = document.createElement('section');
    stage1Section.className = 'mb-8';
    stage1Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 1: Vocabulary Cards</h2>
        <p class="text-slate-600 mb-4">Click each card to flip and reveal the English translation.</p>
        <div id="vocab-cards" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4"></div>
        <div id="stage1-score" class="text-slate-700 font-medium">Cards Revealed: 0 / ${vocabularyCards.length}</div>
    `;
    mainContent.appendChild(stage1Section);

    const vocabCardsContainer = document.getElementById('vocab-cards');
    vocabularyCards.forEach((card, idx) => {
        const cardDiv = document.createElement('div');
        cardDiv.className = 'flip-card h-24';
        cardDiv.innerHTML = `
            <div class="flip-card-inner">
                <div class="flip-card-front">
                    <span class="text-lg font-bold">${card.hungarian}</span>
                </div>
                <div class="flip-card-back">
                    <span class="text-lg font-semibold">${card.english}</span>
                </div>
            </div>
        `;
        cardDiv.addEventListener('click', function() {
            this.classList.toggle('flipped');
            if (!stage1Revealed.has(idx)) {
                stage1Revealed.add(idx);
                scores.stage1.correct = stage1Revealed.size;
                document.getElementById('stage1-score').textContent = `Cards Revealed: ${stage1Revealed.size} / ${vocabularyCards.length}`;
                updateTotalScore();
            }
        });
        vocabCardsContainer.appendChild(cardDiv);
    });

    // ============================================
    // STAGE 2: MATCHING EXERCISE
    // ============================================

    const stage2Section = document.createElement('section');
    stage2Section.className = 'mb-8';
    stage2Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 2: Vocabulary Matching</h2>
        <p class="text-slate-600 mb-4">Match the description to the correct Hungarian word.</p>
        <div id="matching-exercise" class="space-y-4"></div>
        <div id="stage2-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${matchingExercise.length}</div>
    `;
    mainContent.appendChild(stage2Section);

    const matchingContainer = document.getElementById('matching-exercise');
    matchingExercise.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col md:flex-row items-start md:items-center gap-2 p-3 bg-slate-50 rounded-lg';

        const label = document.createElement('span');
        label.className = 'min-w-[250px] text-slate-800 font-medium';
        label.textContent = q.description;

        const select = document.createElement('select');
        select.className = 'border border-slate-300 rounded-md px-3 py-2 w-48 focus:ring-2 focus:ring-teal-500 focus:border-teal-500';
        select.innerHTML = '<option value="">Select answer...</option>';

        const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);
        shuffledOptions.forEach(opt => {
            const option = document.createElement('option');
            option.value = opt;
            option.textContent = opt;
            select.appendChild(option);
        });

        const feedback = document.createElement('span');
        feedback.className = 'ml-2 text-sm font-semibold';

        select.addEventListener('change', function() {
            if (this.value === q.answer) {
                feedback.textContent = 'Correct!';
                feedback.className = 'ml-2 text-green-600 font-semibold';
                this.disabled = true;
                this.className = 'border border-green-500 bg-green-50 rounded-md px-3 py-2 w-48';
                scores.stage2.correct++;
                document.getElementById('stage2-score').textContent = `Score: ${scores.stage2.correct} / ${matchingExercise.length}`;
                updateTotalScore();
            } else if (this.value !== '') {
                feedback.textContent = 'Try again!';
                feedback.className = 'ml-2 text-red-600 font-semibold';
            }
        });

        wrapper.appendChild(label);
        wrapper.appendChild(select);
        wrapper.appendChild(feedback);
        matchingContainer.appendChild(wrapper);
    });

    // ============================================
    // STAGE 3: FILL IN THE BLANKS
    // ============================================

    const stage3Section = document.createElement('section');
    stage3Section.className = 'mb-8';
    stage3Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 3: Fill in the Blanks</h2>
        <p class="text-slate-600 mb-4">Complete the travel phrases with the correct word.</p>
        <div id="fill-exercise" class="space-y-4"></div>
        <div id="stage3-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${fillInBlanks.length}</div>
    `;
    mainContent.appendChild(stage3Section);

    const fillContainer = document.getElementById('fill-exercise');
    const stage3Answers = new Array(fillInBlanks.length).fill(false);

    fillInBlanks.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col gap-2 p-3 bg-slate-50 rounded-lg';

        const row = document.createElement('div');
        row.className = 'flex flex-col md:flex-row items-start md:items-center gap-2';

        const sentenceParts = q.sentence.split('___');
        const sentenceSpan = document.createElement('span');
        sentenceSpan.className = 'text-slate-800';

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-2 py-1 w-32 mx-1 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 inline';

        sentenceSpan.appendChild(document.createTextNode(sentenceParts[0]));
        sentenceSpan.appendChild(input);
        if (sentenceParts[1]) {
            sentenceSpan.appendChild(document.createTextNode(sentenceParts[1]));
        }

        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold ml-2';

        const hint = document.createElement('div');
        hint.className = 'text-xs text-slate-500 italic';
        hint.textContent = `Hint: ${q.hint} | English: ${q.english}`;

        function checkAnswer() {
            const result = checkAccentAware(input.value, q.answer);

            if (result === 'correct') {
                feedback.textContent = 'Correct!';
                feedback.className = 'text-green-600 font-semibold ml-2';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-2 py-1 w-32 mx-1 inline';
                if (!stage3Answers[idx]) {
                    stage3Answers[idx] = true;
                    scores.stage3.correct++;
                    document.getElementById('stage3-score').textContent = `Score: ${scores.stage3.correct} / ${fillInBlanks.length}`;
                    updateTotalScore();
                }
            } else if (result === 'accent-warning') {
                feedback.textContent = 'Almost! Check accents.';
                feedback.className = 'text-yellow-600 font-semibold ml-2';
            } else if (input.value.trim() !== '') {
                feedback.textContent = 'Try again!';
                feedback.className = 'text-red-600 font-semibold ml-2';
            }
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkAnswer();
        });
        input.addEventListener('blur', checkAnswer);

        row.appendChild(sentenceSpan);
        row.appendChild(feedback);
        wrapper.appendChild(row);
        wrapper.appendChild(hint);
        fillContainer.appendChild(wrapper);
    });

    // ============================================
    // STAGE 4: TRANSLATION
    // ============================================

    const stage4Section = document.createElement('section');
    stage4Section.className = 'mb-8';
    stage4Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 4: Translation Practice</h2>
        <p class="text-slate-600 mb-4">Translate these travel phrases into Hungarian.</p>
        <div id="translation-exercise" class="space-y-4"></div>
        <div id="stage4-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${translationExercise.length}</div>
    `;
    mainContent.appendChild(stage4Section);

    const translationContainer = document.getElementById('translation-exercise');
    const stage4Answers = new Array(translationExercise.length).fill(false);

    translationExercise.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'p-3 bg-slate-50 rounded-lg';
        wrapper.innerHTML = `
            <div class="text-slate-700 font-medium mb-2">${idx + 1}. ${q.english}</div>
            <div class="flex flex-col md:flex-row items-start md:items-center gap-2">
                <input type="text" class="border border-slate-300 rounded-md px-3 py-2 w-full md:w-72 focus:ring-2 focus:ring-teal-500 focus:border-teal-500" placeholder="Type Hungarian translation...">
                <span class="feedback text-sm font-semibold"></span>
            </div>
        `;

        const input = wrapper.querySelector('input');
        const feedback = wrapper.querySelector('.feedback');

        function checkTranslation() {
            const result = checkAccentAware(input.value, q.answer);

            if (result === 'correct') {
                feedback.textContent = 'Correct!';
                feedback.className = 'feedback text-green-600 font-semibold';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-3 py-2 w-full md:w-72';
                if (!stage4Answers[idx]) {
                    stage4Answers[idx] = true;
                    scores.stage4.correct++;
                    document.getElementById('stage4-score').textContent = `Score: ${scores.stage4.correct} / ${translationExercise.length}`;
                    updateTotalScore();
                }
            } else if (result === 'accent-warning') {
                feedback.textContent = 'Almost! Check accents.';
                feedback.className = 'feedback text-yellow-600 font-semibold';
            } else if (input.value.trim() !== '') {
                feedback.textContent = `Try again! Answer: ${q.answer}`;
                feedback.className = 'feedback text-red-600 font-semibold';
            }
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkTranslation();
        });
        input.addEventListener('blur', checkTranslation);

        translationContainer.appendChild(wrapper);
    });

    // ============================================
    // STAGE 5: SCENARIO PRACTICE
    // ============================================

    const stage5Section = document.createElement('section');
    stage5Section.className = 'mb-8';
    stage5Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 5: Real-Life Scenarios</h2>
        <p class="text-slate-600 mb-4">What would you say in these travel situations?</p>
        <div id="scenario-exercise" class="space-y-6"></div>
        <div id="stage5-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${scenarioExercise.length}</div>
    `;
    mainContent.appendChild(stage5Section);

    const scenarioContainer = document.getElementById('scenario-exercise');
    const stage5Answers = new Array(scenarioExercise.length).fill(false);

    scenarioExercise.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'p-4 bg-gradient-to-r from-slate-50 to-slate-100 rounded-lg border border-slate-200';
        wrapper.innerHTML = `
            <div class="text-slate-700 mb-2"><strong>Scenario:</strong> ${q.scenario}</div>
            <div class="text-teal-700 font-medium mb-3">${q.question}</div>
            <div class="flex flex-col md:flex-row items-start md:items-center gap-2">
                <input type="text" class="border border-slate-300 rounded-md px-3 py-2 w-full md:w-80 focus:ring-2 focus:ring-teal-500 focus:border-teal-500" placeholder="Type your answer in Hungarian...">
                <span class="feedback text-sm font-semibold"></span>
            </div>
        `;

        const input = wrapper.querySelector('input');
        const feedback = wrapper.querySelector('.feedback');

        function checkScenario() {
            const userAnswer = normalizeAnswer(input.value);
            const mainAnswer = normalizeAnswer(q.answer);
            const alternativeAnswers = q.alternatives.map(a => normalizeAnswer(a));
            const allAnswers = [mainAnswer, ...alternativeAnswers];

            const isCorrect = allAnswers.some(ans => {
                return userAnswer === ans || removeAccents(userAnswer) === removeAccents(ans);
            });

            const isAccentIssue = allAnswers.some(ans => {
                return removeAccents(userAnswer) === removeAccents(ans) && userAnswer !== ans;
            });

            if (isCorrect && !isAccentIssue) {
                feedback.textContent = 'Correct!';
                feedback.className = 'feedback text-green-600 font-semibold';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-3 py-2 w-full md:w-80';
                if (!stage5Answers[idx]) {
                    stage5Answers[idx] = true;
                    scores.stage5.correct++;
                    document.getElementById('stage5-score').textContent = `Score: ${scores.stage5.correct} / ${scenarioExercise.length}`;
                    updateTotalScore();
                }
            } else if (isAccentIssue) {
                feedback.textContent = 'Almost! Check accents.';
                feedback.className = 'feedback text-yellow-600 font-semibold';
            } else if (input.value.trim() !== '') {
                feedback.textContent = `Try again! Example: ${q.answer}`;
                feedback.className = 'feedback text-red-600 font-semibold';
            }
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkScenario();
        });
        input.addEventListener('blur', checkScenario);

        scenarioContainer.appendChild(wrapper);
    });

    // ============================================
    // STAGE 6: DIALOGUE PRACTICE
    // ============================================

    const stage6Section = document.createElement('section');
    stage6Section.className = 'mb-8';
    stage6Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 6: Dialogue Practice</h2>
        <p class="text-slate-600 mb-4">Complete these travel conversations by filling in the missing word.</p>
        <div id="dialogue-exercise" class="space-y-6"></div>
        <div id="stage6-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${dialogueExercise.length}</div>
    `;
    mainContent.appendChild(stage6Section);

    const dialogueContainer = document.getElementById('dialogue-exercise');
    const stage6Answers = new Array(dialogueExercise.length).fill(false);

    dialogueExercise.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'bg-gradient-to-r from-slate-50 to-slate-100 rounded-lg p-4 border border-slate-200';

        const questionLine = document.createElement('div');
        questionLine.className = 'mb-3';
        questionLine.innerHTML = `
            <span class="inline-block bg-teal-600 text-white text-xs font-bold px-2 py-1 rounded mr-2">${q.speaker}</span>
            <span class="text-slate-800 font-medium">${q.line}</span>
        `;

        const responseLine = document.createElement('div');
        responseLine.className = 'flex flex-wrap items-center gap-2';

        const speakerB = document.createElement('span');
        speakerB.className = 'inline-block bg-slate-600 text-white text-xs font-bold px-2 py-1 rounded';
        speakerB.textContent = 'Helyi';

        const responseText = q.response.split('___');
        const responseSpan = document.createElement('span');
        responseSpan.className = 'text-slate-800';

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-2 py-1 w-28 focus:ring-2 focus:ring-teal-500 focus:border-teal-500';

        responseSpan.appendChild(document.createTextNode(responseText[0]));
        responseSpan.appendChild(input);
        if (responseText[1]) {
            responseSpan.appendChild(document.createTextNode(responseText[1]));
        }

        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold';

        function checkAnswer() {
            const result = checkAccentAware(input.value, q.blank);

            if (result === 'correct') {
                feedback.textContent = 'Helyes!';
                feedback.className = 'text-green-600 font-semibold';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-2 py-1 w-28';
                if (!stage6Answers[idx]) {
                    stage6Answers[idx] = true;
                    scores.stage6.correct++;
                    document.getElementById('stage6-score').textContent = `Score: ${scores.stage6.correct} / ${dialogueExercise.length}`;
                    updateTotalScore();
                }
            } else if (result === 'accent-warning') {
                feedback.textContent = 'Majdnem!';
                feedback.className = 'text-yellow-600 font-semibold';
            } else if (input.value.trim() !== '') {
                feedback.textContent = 'Probald ujra!';
                feedback.className = 'text-red-600 font-semibold';
            }
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkAnswer();
        });
        input.addEventListener('blur', checkAnswer);

        responseLine.appendChild(speakerB);
        responseLine.appendChild(responseSpan);
        responseLine.appendChild(feedback);

        const translationLine = document.createElement('div');
        translationLine.className = 'mt-2 text-xs text-slate-500 italic pl-12';
        translationLine.textContent = `(${q.responseEnglish})`;

        wrapper.appendChild(questionLine);
        wrapper.appendChild(responseLine);
        wrapper.appendChild(translationLine);
        dialogueContainer.appendChild(wrapper);
    });

    // ============================================
    // SUMMARY SECTION
    // ============================================

    const summarySection = document.createElement('section');
    summarySection.className = 'mt-8 p-6 bg-gradient-to-r from-teal-50 to-slate-50 rounded-xl border border-teal-200';
    summarySection.innerHTML = `
        <h2 class="text-xl font-bold text-teal-800 mb-4">Lesson Summary</h2>
        <div class="grid md:grid-cols-2 gap-4 text-sm">
            <div>
                <h3 class="font-semibold text-slate-700 mb-2">Vehicle Vocabulary:</h3>
                <ul class="list-disc pl-5 text-slate-600 space-y-1">
                    <li>auto (car), busz (bus), vonat (train)</li>
                    <li>villamos (tram), metro (subway), taxi</li>
                    <li>repulo (airplane), bicikli (bicycle)</li>
                </ul>
            </div>
            <div>
                <h3 class="font-semibold text-slate-700 mb-2">Key Phrases:</h3>
                <ul class="list-disc pl-5 text-slate-600 space-y-1">
                    <li>"Hol van a megallo?" - Where is the stop?</li>
                    <li>"Mikor indul?" - When does it leave?</li>
                    <li>"Kerek egy jegyet." - I'd like a ticket.</li>
                    <li>"Menjen egyenesen!" - Go straight!</li>
                </ul>
            </div>
        </div>
        <div class="mt-4 grid md:grid-cols-3 gap-2">
            <div class="text-center p-2 rounded-lg bg-blue-100">
                <div class="text-2xl">⬅️</div>
                <div class="font-bold text-slate-800">balra</div>
                <div class="text-xs text-slate-600">left</div>
            </div>
            <div class="text-center p-2 rounded-lg bg-green-100">
                <div class="text-2xl">⬆️</div>
                <div class="font-bold text-slate-800">egyenesen</div>
                <div class="text-xs text-slate-600">straight</div>
            </div>
            <div class="text-center p-2 rounded-lg bg-blue-100">
                <div class="text-2xl">➡️</div>
                <div class="font-bold text-slate-800">jobbra</div>
                <div class="text-xs text-slate-600">right</div>
            </div>
        </div>
        <div class="mt-4 p-3 bg-amber-50 rounded-lg border border-amber-200">
            <p class="text-amber-800 text-sm"><strong>Remember:</strong> In Hungary, always validate your ticket when boarding public transport. Buy a "berlet" (pass) if staying longer - it's more convenient than individual "jegy" (tickets)!</p>
        </div>
    `;
    mainContent.appendChild(summarySection);

    // Initialize total score
    updateTotalScore();
    </script>
</body>
</html>
