    // UTILITY FUNCTIONS

    function removeAccents(str) {
        return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[\u0151\u0150\u0171\u0170]/g, function(m) {
            const map = { '\u0151':'o', '\u0150':'O', '\u0171':'u', '\u0170':'U' };
            return map[m] || m;
        });
    }

    function normalizeAnswer(str) {
        return str.trim().toLowerCase();
    }

    function checkAccentAware(userInput, correctAnswer) {
        const normalizedInput = normalizeAnswer(userInput);
        const normalizedCorrect = normalizeAnswer(correctAnswer);

        if (normalizedInput === normalizedCorrect) {
            return 'correct';
        } else if (removeAccents(normalizedInput) === removeAccents(normalizedCorrect)) {
            return 'accent-warning';
        } else {
            return 'incorrect';
        }
    }

    // ============================================
    // EXERCISE DATA
    // ============================================

        { hungarian: 'fej', english: 'head' },
        { hungarian: 'kez', english: 'hand' },
        { hungarian: 'lab', english: 'leg/foot' },
        { hungarian: 'szem', english: 'eye' },

        { hungarian: 'szaj', english: 'mouth' },

        { hungarian: 'orr', english: 'nose' },

        { hungarian: 'has', english: 'stomach' },
        { hungarian: 'sziv', english: 'heart' }
    ];

    const matchingExercise = [
        { description: 'You use these to see', answer: 'szem', options: ['szem', 'ful', 'orr', 'szaj'] },
        { description: 'You use these to hear', answer: 'ful', options: ['szem', 'ful', 'orr', 'szaj'] },
        { description: 'You use this to smell', answer: 'orr', options: ['szem', 'ful', 'orr', 'szaj'] },
        { description: 'You use this to eat and speak', answer: 'szaj', options: ['szem', 'ful', 'orr', 'szaj'] },
        { description: 'You walk with these', answer: 'lab', options: ['lab', 'kez', 'kar', 'fej'] },
        { description: 'You write with this', answer: 'kez', options: ['lab', 'kez', 'kar', 'fej'] },
        { description: 'This pumps blood', answer: 'sziv', options: ['sziv', 'tudo', 'gyomor', 'agy'] },
        { description: 'You think with this', answer: 'agy', options: ['sziv', 'tudo', 'gyomor', 'agy'] }

    const fillInBlanks = [

        { sentence: 'Faj a ___.', answer: 'gyomrom', english: 'My stomach hurts.', hint: 'my stomach' },
        { sentence: '___ vagyok.', answer: 'Beteg', english: 'I am sick.', hint: 'sick' },
        { sentence: 'Rosszul erzem ___.', answer: 'magam', english: 'I feel unwell.', hint: 'myself' },
        { sentence: '___ van.', answer: 'Lazam', english: 'I have a fever.', hint: 'I have fever' },
        { sentence: 'Orvoshoz ___ mennem.', answer: 'kell', english: 'I need to go to the doctor.', hint: 'need/must' },
        { sentence: 'Hol ___?', answer: 'faj', english: 'Where does it hurt?', hint: 'hurts' },
        { sentence: 'Kerek egy ___.', answer: 'receptet', english: 'I need a prescription.', hint: 'prescription (acc.)' }
    ];

    const translationExercise = [
        { english: 'My head hurts.', answer: 'Faj a fejem' },
        { english: 'I am sick.', answer: 'Beteg vagyok' },
        { english: 'I feel unwell.', answer: 'Rosszul erzem magam' },
        { english: 'I have a fever.', answer: 'Lazam van' },
        { english: 'Where does it hurt?', answer: 'Hol faj' },
        { english: 'Call an ambulance!', answer: 'Hivjon mentot' }
    ];

    const bodyPartToHungarianExercise = [
        { english: 'head', answer: 'fej' },
        { english: 'hand', answer: 'kez' },
        { english: 'eye', answer: 'szem' },
        { english: 'ear', answer: 'ful' },
        { english: 'mouth', answer: 'szaj' },
        { english: 'leg', answer: 'lab' },
        { english: 'arm', answer: 'kar' },
        { english: 'back', answer: 'hat' }
    ];

    const dialogueExercise = [
        {
            speaker: 'Orvos',
            line: 'Jo napot! Mi a problema?',
            response: '___ a fejem es lazam van.',
            blank: 'Faj',
            responseEnglish: 'My head hurts and I have a fever.'
        },
        {
            speaker: 'Orvos',
            line: 'Mioта faj?',
            response: 'Ket ___ ota.',
            blank: 'napja',
            responseEnglish: 'For two days.'
        },
        {
            speaker: 'Orvos',
            line: 'Van mas panasza?',
            response: 'Igen, faj a ___ is.',
            blank: 'torkom',
            responseEnglish: 'Yes, my throat hurts too.'
        },
        {
            speaker: 'Orvos',
            line: 'Szed valamilyen gyogyszert?',
            response: 'Nem, nem ___ gyogyszert.',
            blank: 'szedek',
            responseEnglish: 'No, I am not taking any medication.'
        },
        {
            speaker: 'Orvos',
            line: 'Allergiаs valamire?',
            response: 'Igen, ___ vagyok penicillinre.',
            blank: 'allergias',
            responseEnglish: 'Yes, I am allergic to penicillin.'
        }
    ];

    // ============================================
    // SCORE TRACKING
    // ============================================

    let scores = {
        stage1: { correct: 0, total: vocabularyCards.length },
        stage2: { correct: 0, total: matchingExercise.length },
        stage3: { correct: 0, total: fillInBlanks.length },
        stage4: { correct: 0, total: bodyPartToHungarianExercise.length },
        stage5: { correct: 0, total: translationExercise.length },
        stage6: { correct: 0, total: dialogueExercise.length }
    };

    let stage1Revealed = new Set();

    function updateTotalScore() {
        const totalCorrect = Object.values(scores).reduce((sum, s) => sum + s.correct, 0);
        const totalQuestions = Object.values(scores).reduce((sum, s) => sum + s.total, 0);
        const totalScoreEl = document.getElementById('total-score');
        if (totalScoreEl) {
            totalScoreEl.textContent = `Total Score: ${totalCorrect} / ${totalQuestions}`;
        }
    }

    // ============================================
    // BUILD PAGE CONTENT
    // ============================================

    const mainContent = document.getElementById('main-content');

        <p class="text-amber-900">Hungary has a public healthcare system. For non-emergencies, you'll typically visit a "haziorvos" (GP/family doctor).
        Pharmacies ("patika" or "gyogyszertar") are common, and pharmacists can often recommend over-the-counter remedies.
        The expression "Faj a..." (My... hurts) is used with possessive suffixes: fejem (my head), gyomrom (my stomach), etc.</p>
    `;
    mainContent.appendChild(culturalNote);

    // Section 1: Head & Face
    const section1 = document.createElement('section');
    section1.className = 'mb-8';
    section1.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 1: Head & Face (Fej es arc)</h2>
        <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-4">
            ${headBodyParts.map(p => `
                <div class="body-part-card bg-slate-50 rounded-lg p-3 text-center shadow-sm">

        </div>
    `;
    mainContent.appendChild(section1);

    // Section 2: Upper Body
    const section2 = document.createElement('section');
    section2.className = 'mb-8';
    section2.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 2: Upper Body (Felsotеst)</h2>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
            ${upperBodyParts.map(p => `
                <div class="body-part-card bg-slate-50 rounded-lg p-3 text-center shadow-sm">
                    <div class="body-icon mb-1">${p.icon}</div>
                    <div class="font-bold text-teal-700 text-sm">${p.hungarian}</div>
                    <div class="text-xs text-slate-600">${p.english}</div>
                </div>
            `).join('')}
        </div>
    `;
    mainContent.appendChild(section2);

    // Section 3: Lower Body
    const section3 = document.createElement('section');
    section3.className = 'mb-8';
    section3.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 3: Lower Body (Alsoteт)</h2>
        <div class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-4">
            ${lowerBodyParts.map(p => `
                <div class="body-part-card bg-slate-50 rounded-lg p-3 text-center shadow-sm">
                    <div class="body-icon mb-1">${p.icon}</div>
                    <div class="font-bold text-teal-700 text-sm">${p.hungarian}</div>
                    <div class="text-xs text-slate-600">${p.english}</div>
                </div>
            `).join('')}
        </div>
        <div class="mt-4 p-4 bg-blue-50 rounded-lg border border-blue-200">
            <h4 class="font-semibold text-blue-800 mb-2">Note: "Lab" in Hungarian</h4>
            <p class="text-blue-700 text-sm">The word "lab" in Hungarian can mean both "leg" and "foot". For specifically "foot", use "labfej" (literally "leg-head"). Similarly, "kez" means "hand" but can sometimes refer to the entire arm in casual speech.</p>
        </div>
    `;
    mainContent.appendChild(section3);

    // Section 4: Health Expressions
    const section4 = document.createElement('section');
    section4.className = 'mb-8';
    section4.innerHTML = `

        <div class="bg-slate-50 rounded-lg p-4 space-y-3 mb-4">
            ${healthExpressions.map(item => `
                <div class="flex flex-col md:flex-row md:items-center gap-2 p-2 border-b border-slate-200 last:border-0">

                    <span class="text-slate-600">- ${item.english}</span>
                </div>
            `).join('')}
        </div>
        <div class="mt-4 p-4 bg-teal-50 rounded-lg border border-teal-200">
            <h4 class="font-semibold text-teal-800 mb-2">The "Faj" Pattern</h4>
            <p class="text-teal-700 text-sm">To say something hurts, use: <strong>Faj a [body part with possessive]</strong><br>
            The body part takes a possessive suffix: fej → fejem (my head), gyomor → gyomrom (my stomach), lab → labam (my leg)<br>
            Examples: "Faj a fejem" (My head hurts), "Faj a labam" (My leg hurts)</p>
        </div>
    `;
    mainContent.appendChild(section4);

    section5.className = 'mb-8';
    section5.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 5: At the Doctor (Az orvosnáл)</h2>

            </tbody>

    `;
    mainContent.appendChild(section5);

    // Total Score Display
    const totalScoreSection = document.createElement('div');

    totalScoreSection.innerHTML = `

        <p id="total-score" class="text-2xl font-bold">Total Score: 0 / ${Object.values(scores).reduce((sum, s) => sum + s.total, 0)}</p>
    `;

    // ============================================
    // STAGE 1: VOCABULARY CARDS
    // ============================================

    const stage1Section = document.createElement('section');
    stage1Section.className = 'mb-8';
    stage1Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 1: Body Part Vocabulary Cards</h2>
        <p class="text-slate-600 mb-4">Click each card to flip and reveal the English translation.</p>
        <div id="vocab-cards" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4"></div>
        <div id="stage1-score" class="text-slate-700 font-medium">Cards Revealed: 0 / ${vocabularyCards.length}</div>
    `;
    mainContent.appendChild(stage1Section);

    const vocabCardsContainer = document.getElementById('vocab-cards');
    vocabularyCards.forEach((card, idx) => {
        const cardDiv = document.createElement('div');
        cardDiv.className = 'flip-card h-24';
        cardDiv.innerHTML = `
            <div class="flip-card-inner">

                    <span class="text-lg font-bold">${card.hungarian}</span>
                </div>
                <div class="flip-card-back">
                    <span class="text-lg font-semibold">${card.english}</span>
                </div>

        `;
        cardDiv.addEventListener('click', function() {
            this.classList.toggle('flipped');
            if (!stage1Revealed.has(idx)) {
                stage1Revealed.add(idx);
                scores.stage1.correct = stage1Revealed.size;
                document.getElementById('stage1-score').textContent = `Cards Revealed: ${stage1Revealed.size} / ${vocabularyCards.length}`;
                updateTotalScore();
            }
        });
        vocabCardsContainer.appendChild(cardDiv);
    });

    // ============================================
    // STAGE 2: BODY PART MATCHING
    // ============================================

    const stage2Section = document.createElement('section');
    stage2Section.className = 'mb-8';
    stage2Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 2: Body Part Functions</h2>
        <p class="text-slate-600 mb-4">Match the function to the correct body part.</p>
        <div id="matching-exercise" class="space-y-4"></div>
        <div id="stage2-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${matchingExercise.length}</div>
    `;
    mainContent.appendChild(stage2Section);

    const matchingContainer = document.getElementById('matching-exercise');
    matchingExercise.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col md:flex-row items-start md:items-center gap-2 p-3 bg-slate-50 rounded-lg';

        const label = document.createElement('span');
        label.className = 'min-w-[200px] text-slate-800 font-medium';
        label.textContent = q.description;

        const select = document.createElement('select');
        select.className = 'border border-slate-300 rounded-md px-3 py-2 w-40 focus:ring-2 focus:ring-teal-500 focus:border-teal-500';
        select.innerHTML = '<option value="">Select...</option>';

        const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);
        shuffledOptions.forEach(opt => {
            const option = document.createElement('option');
            option.value = opt;
            option.textContent = opt;
            select.appendChild(option);
        });

        const feedback = document.createElement('span');
        feedback.className = 'ml-2 text-sm font-semibold';

        select.addEventListener('change', function() {
            if (this.value === q.answer) {
                feedback.textContent = 'Correct!';
                feedback.className = 'ml-2 text-green-600 font-semibold';
                this.disabled = true;
                this.className = 'border border-green-500 bg-green-50 rounded-md px-3 py-2 w-40';
                scores.stage2.correct++;
                document.getElementById('stage2-score').textContent = `Score: ${scores.stage2.correct} / ${matchingExercise.length}`;
                updateTotalScore();
            } else if (this.value !== '') {
                feedback.textContent = 'Try again!';
                feedback.className = 'ml-2 text-red-600 font-semibold';
            }
        });

        wrapper.appendChild(label);
        wrapper.appendChild(select);
        wrapper.appendChild(feedback);
        matchingContainer.appendChild(wrapper);
    });

    // ============================================
    // STAGE 3: FILL IN THE BLANKS (Health)
    // ============================================

    const stage3Section = document.createElement('section');
    stage3Section.className = 'mb-8';
    stage3Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 3: Health Expression Fill-in</h2>
        <p class="text-slate-600 mb-4">Complete the health expressions with the correct word.</p>
        <div id="fill-exercise" class="space-y-4"></div>
        <div id="stage3-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${fillInBlanks.length}</div>
    `;
    mainContent.appendChild(stage3Section);

    const fillContainer = document.getElementById('fill-exercise');
    const stage3Answers = new Array(fillInBlanks.length).fill(false);

    fillInBlanks.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col gap-2 p-3 bg-slate-50 rounded-lg';

        const row = document.createElement('div');
        row.className = 'flex flex-col md:flex-row items-start md:items-center gap-2';

        const sentenceParts = q.sentence.split('___');
        const sentenceSpan = document.createElement('span');
        sentenceSpan.className = 'text-slate-800';

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-2 py-1 w-32 mx-1 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 inline';

        sentenceSpan.appendChild(document.createTextNode(sentenceParts[0]));
        sentenceSpan.appendChild(input);
        if (sentenceParts[1]) {
            sentenceSpan.appendChild(document.createTextNode(sentenceParts[1]));
        }

        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold ml-2';

        const hint = document.createElement('div');
        hint.className = 'text-xs text-slate-500 italic';
        hint.textContent = `Hint: ${q.hint} | English: ${q.english}`;

        function checkAnswer() {
            const result = checkAccentAware(input.value, q.answer);

            if (result === 'correct') {
                feedback.textContent = 'Correct!';
                feedback.className = 'text-green-600 font-semibold ml-2';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-2 py-1 w-32 mx-1 inline';
                if (!stage3Answers[idx]) {
                    stage3Answers[idx] = true;
                    scores.stage3.correct++;
                    document.getElementById('stage3-score').textContent = `Score: ${scores.stage3.correct} / ${fillInBlanks.length}`;
                    updateTotalScore();
                }
            } else if (result === 'accent-warning') {
                feedback.textContent = 'Almost! Check accents.';
                feedback.className = 'text-yellow-600 font-semibold ml-2';
            } else if (input.value.trim() !== '') {
                feedback.textContent = 'Try again!';
                feedback.className = 'text-red-600 font-semibold ml-2';
            }
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkAnswer();
        });
        input.addEventListener('blur', checkAnswer);

        row.appendChild(sentenceSpan);
        row.appendChild(feedback);
        wrapper.appendChild(row);
        wrapper.appendChild(hint);
        fillContainer.appendChild(wrapper);
    });

    // ============================================
    // STAGE 4: BODY PARTS RECALL
    // ============================================

    const stage4Section = document.createElement('section');
    stage4Section.className = 'mb-8';
    stage4Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 4: Body Parts Recall</h2>
        <p class="text-slate-600 mb-4">Type the Hungarian word for each body part.</p>
        <div id="recall-exercise" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        <div id="stage4-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${bodyPartToHungarianExercise.length}</div>
    `;
    mainContent.appendChild(stage4Section);

    const recallContainer = document.getElementById('recall-exercise');
    const stage4Answers = new Array(bodyPartToHungarianExercise.length).fill(false);

    bodyPartToHungarianExercise.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'p-3 bg-slate-50 rounded-lg flex items-center gap-3';
        wrapper.innerHTML = `
            <span class="font-medium text-slate-700 min-w-[80px]">${q.english}:</span>
            <input type="text" class="border border-slate-300 rounded-md px-3 py-1 w-32 focus:ring-2 focus:ring-teal-500 focus:border-teal-500" placeholder="Hungarian...">
            <span class="feedback text-sm font-semibold"></span>
        `;

        const input = wrapper.querySelector('input');
        const feedback = wrapper.querySelector('.feedback');

        function checkRecall() {
            const result = checkAccentAware(input.value, q.answer);

            if (result === 'correct') {
                feedback.textContent = 'Correct!';
                feedback.className = 'feedback text-green-600 font-semibold';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-3 py-1 w-32';
                if (!stage4Answers[idx]) {
                    stage4Answers[idx] = true;
                    scores.stage4.correct++;
                    document.getElementById('stage4-score').textContent = `Score: ${scores.stage4.correct} / ${bodyPartToHungarianExercise.length}`;
                    updateTotalScore();
                }
            } else if (result === 'accent-warning') {
                feedback.textContent = 'Check accents!';
                feedback.className = 'feedback text-yellow-600 font-semibold';
            } else if (input.value.trim() !== '') {
                feedback.textContent = `Answer: ${q.answer}`;
                feedback.className = 'feedback text-red-600 font-semibold';
            }
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkRecall();
        });
        input.addEventListener('blur', checkRecall);

        recallContainer.appendChild(wrapper);
    });

    // ============================================
    // STAGE 5: TRANSLATION
    // ============================================

    const stage5Section = document.createElement('section');
    stage5Section.className = 'mb-8';
    stage5Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 5: Health Phrase Translation</h2>
        <p class="text-slate-600 mb-4">Translate these health phrases into Hungarian.</p>
        <div id="translation-exercise" class="space-y-4"></div>
        <div id="stage5-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${translationExercise.length}</div>
    `;
    mainContent.appendChild(stage5Section);

    const translationContainer = document.getElementById('translation-exercise');
    const stage5Answers = new Array(translationExercise.length).fill(false);

    translationExercise.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'p-3 bg-slate-50 rounded-lg';
        wrapper.innerHTML = `
            <div class="text-slate-700 font-medium mb-2">${idx + 1}. ${q.english}</div>
            <div class="flex flex-col md:flex-row items-start md:items-center gap-2">
                <input type="text" class="border border-slate-300 rounded-md px-3 py-2 w-full md:w-64 focus:ring-2 focus:ring-teal-500 focus:border-teal-500" placeholder="Type Hungarian...">
                <span class="feedback text-sm font-semibold"></span>
            </div>
        `;

        const input = wrapper.querySelector('input');
        const feedback = wrapper.querySelector('.feedback');

        function checkTranslation() {
            const result = checkAccentAware(input.value, q.answer);

            if (result === 'correct') {
                feedback.textContent = 'Correct!';
                feedback.className = 'feedback text-green-600 font-semibold';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-3 py-2 w-full md:w-64';
                if (!stage5Answers[idx]) {
                    stage5Answers[idx] = true;
                    scores.stage5.correct++;
                    document.getElementById('stage5-score').textContent = `Score: ${scores.stage5.correct} / ${translationExercise.length}`;
                    updateTotalScore();
                }
            } else if (result === 'accent-warning') {
                feedback.textContent = 'Almost! Check accents.';
                feedback.className = 'feedback text-yellow-600 font-semibold';
            } else if (input.value.trim() !== '') {
                feedback.textContent = `Answer: ${q.answer}`;
                feedback.className = 'feedback text-red-600 font-semibold';
            }
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkTranslation();
        });
        input.addEventListener('blur', checkTranslation);

        translationContainer.appendChild(wrapper);
    });

    // ============================================
    // STAGE 6: DOCTOR DIALOGUE
    // ============================================

    const stage6Section = document.createElement('section');
    stage6Section.className = 'mb-8';
    stage6Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 6: At the Doctor's Office</h2>
        <p class="text-slate-600 mb-4">Complete this conversation with a doctor by filling in the missing words.</p>
        <div id="dialogue-exercise" class="space-y-6"></div>
        <div id="stage6-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${dialogueExercise.length}</div>
    `;
    mainContent.appendChild(stage6Section);

    const dialogueContainer = document.getElementById('dialogue-exercise');
    const stage6Answers = new Array(dialogueExercise.length).fill(false);

    dialogueExercise.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'bg-gradient-to-r from-slate-50 to-slate-100 rounded-lg p-4 border border-slate-200';

        const questionLine = document.createElement('div');
        questionLine.className = 'mb-3';
        questionLine.innerHTML = `
            <span class="inline-block bg-teal-600 text-white text-xs font-bold px-2 py-1 rounded mr-2">${q.speaker}</span>
            <span class="text-slate-800 font-medium">${q.line}</span>
        `;

        const responseLine = document.createElement('div');
        responseLine.className = 'flex flex-wrap items-center gap-2';

        const speakerB = document.createElement('span');
        speakerB.className = 'inline-block bg-slate-600 text-white text-xs font-bold px-2 py-1 rounded';
        speakerB.textContent = 'Beteg';

        const responseText = q.response.split('___');
        const responseSpan = document.createElement('span');
        responseSpan.className = 'text-slate-800';

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-2 py-1 w-28 focus:ring-2 focus:ring-teal-500 focus:border-teal-500';

        responseSpan.appendChild(document.createTextNode(responseText[0]));
        responseSpan.appendChild(input);
        if (responseText[1]) {
            responseSpan.appendChild(document.createTextNode(responseText[1]));
        }

        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold';

        function checkAnswer() {
            const result = checkAccentAware(input.value, q.blank);

            if (result === 'correct') {
                feedback.textContent = 'Helyes!';
                feedback.className = 'text-green-600 font-semibold';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-2 py-1 w-28';
                if (!stage6Answers[idx]) {
                    stage6Answers[idx] = true;
                    scores.stage6.correct++;
                    document.getElementById('stage6-score').textContent = `Score: ${scores.stage6.correct} / ${dialogueExercise.length}`;
                    updateTotalScore();
                }
            } else if (result === 'accent-warning') {
                feedback.textContent = 'Majdnem!';
                feedback.className = 'text-yellow-600 font-semibold';
            } else if (input.value.trim() !== '') {
                feedback.textContent = 'Probald ujra!';
                feedback.className = 'text-red-600 font-semibold';
            }
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkAnswer();
        });
        input.addEventListener('blur', checkAnswer);

        responseLine.appendChild(speakerB);
        responseLine.appendChild(responseSpan);
        responseLine.appendChild(feedback);

        const translationLine = document.createElement('div');
        translationLine.className = 'mt-2 text-xs text-slate-500 italic pl-12';
        translationLine.textContent = `(${q.responseEnglish})`;

        wrapper.appendChild(questionLine);
        wrapper.appendChild(responseLine);
        wrapper.appendChild(translationLine);
        dialogueContainer.appendChild(wrapper);
    });

    // ============================================
    // SUMMARY SECTION
    // ============================================

    const summarySection = document.createElement('section');
    summarySection.className = 'mt-8 p-6 bg-gradient-to-r from-teal-50 to-slate-50 rounded-xl border border-teal-200';
    summarySection.innerHTML = `
        <h2 class="text-xl font-bold text-teal-800 mb-4">Lesson Summary</h2>
        <div class="grid md:grid-cols-2 gap-4 text-sm">
            <div>
                <h3 class="font-semibold text-slate-700 mb-2">Body Parts:</h3>
                <ul class="list-disc pl-5 text-slate-600 space-y-1">
                    <li>fej (head), szem (eye), ful (ear), orr (nose)</li>
                    <li>kez (hand), kar (arm), lab (leg/foot)</li>
                    <li>has (stomach), hat (back), sziv (heart)</li>
                </ul>
            </div>
            <div>
                <h3 class="font-semibold text-slate-700 mb-2">Key Health Phrases:</h3>
                <ul class="list-disc pl-5 text-slate-600 space-y-1">
                    <li>"Faj a fejem." - My head hurts.</li>
                    <li>"Beteg vagyok." - I am sick.</li>
                    <li>"Lazam van." - I have a fever.</li>
                    <li>"Hol faj?" - Where does it hurt?</li>
                </ul>
            </div>
        </div>
        <div class="mt-4 p-3 bg-red-50 rounded-lg border border-red-200">
            <p class="text-red-800 text-sm"><strong>Emergency:</strong> "Segitseg!" (Help!), "Hivjon mentot!" (Call an ambulance!) - Emergency: 112 or 104</p>
        </div>
        <div class="mt-2 p-3 bg-amber-50 rounded-lg border border-amber-200">
            <p class="text-amber-800 text-sm"><strong>Remember:</strong> The pattern "Faj a [body part + possessive]" is essential. Add possessive suffixes: fejem (my head), kezem (my hand), labam (my leg).</p>
        </div>
    `;
    mainContent.appendChild(summarySection);

    // Initialize total score
    updateTotalScore();
    </script>
</body>
</html>
