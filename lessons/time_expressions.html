            transform-origin: bottom center;
            border-radius: 2px;
            margin-left: -1.5px;
        }
        .clock-mark {
            position: absolute;
            width: 2px;
            height: 8px;
            background: #94a3b8;
            left: 50%;
            margin-left: -1px;
            transform-origin: center 56px;
        }

            position: absolute;
            font-size: 12px;
            font-weight: 600;
            color: #334155;
        }

    <script>
    // Helper function to remove accents for comparison
    function removeAccents(str) {
        return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[oOuUaAeEiI]/g, function(m) {
            return m;
        }).replace(/[oOuUaAeEiIaAeEoOuU]/g, function(m) {
            const map = { 'a':'a','A':'A','e':'e','E':'E','i':'i','I':'I','o':'o','O':'O','u':'u','U':'U' };
            return map[m] || m;
        }).toLowerCase();
    }

    // Normalize Hungarian characters for flexible matching
    function normalizeHungarian(str) {
        return str.toLowerCase().trim()
            .replace(/[aA]/g, 'a').replace(/[eE]/g, 'e')
            .replace(/[iI]/g, 'i').replace(/[oO]/g, 'o').replace(/[uU]/g, 'u');
    }

    // Days of the week data

    // =====================
    // SECTION 1: Telling Time

    const section1 = document.createElement('section');
    section1.className = 'mb-8';
    section1.innerHTML = `
        <h2 class="text-xl font-semibold text-slate-700 mb-2">Section 1: Telling Time</h2>
        <p class="mb-4">In Hungarian, telling time follows a unique pattern. The question "What time is it?" is <b>Hany ora (van)?</b></p>

        <div class="bg-slate-50 p-4 rounded-lg mb-4">
            <p class="font-semibold mb-2">Full Hours:</p>
            <ul class="list-disc pl-6 space-y-1">
                <li><b>Egy ora</b> - 1:00 (one o'clock)</li>
                <li><b>Ket ora</b> - 2:00 (two o'clock)</li>
                <li><b>Harom ora</b> - 3:00 (three o'clock)</li>
                <li><b>Del</b> - 12:00 noon</li>
                <li><b>Ejfel</b> - 12:00 midnight</li>
            </ul>
        </div>

        <div class="bg-teal-50 p-4 rounded-lg mb-4">
            <p class="font-semibold mb-2 text-teal-800">Important: Hungarian Half Hours!</p>
            <p class="mb-2 text-teal-900">In Hungarian, half hours refer to the NEXT hour, not the current one:</p>
            <ul class="list-disc pl-6 space-y-1 text-teal-900">
                <li><b>Fel ketto</b> = 1:30 (literally "half two" = half TO two)</li>
                <li><b>Fel harom</b> = 2:30 (half TO three)</li>
                <li><b>Fel negy</b> = 3:30 (half TO four)</li>
            </ul>
            <p class="mt-2 text-sm text-teal-700">This is the opposite of English! "Half two" in Hungarian means 1:30, not 2:30.</p>
        </div>

        <div class="bg-slate-50 p-4 rounded-lg mb-4">
            <p class="font-semibold mb-2">Quarter Hours:</p>

        <table class="mb-2 w-full border text-sm">

            <tr><td class="border px-2">1:15</td><td class="border px-2 font-semibold">Negyed ketto</td><td class="border px-2">Quarter to two</td></tr>
            <tr><td class="border px-2">1:30</td><td class="border px-2 font-semibold">Fel ketto</td><td class="border px-2">Half to two</td></tr>
            <tr><td class="border px-2">1:45</td><td class="border px-2 font-semibold">Haromnegyed ketto</td><td class="border px-2">Three-quarters to two</td></tr>

        <h2 class="text-xl font-semibold text-slate-700 mb-2">Section 3: Months of the Year</h2>
        <p class="mb-4">Months in Hungarian are also not capitalized. To say "in [month]", add <b>-ban/-ben</b> (inessive case).</p>
        <table class="mb-2 w-full border text-sm">
            <tr><th class="border px-2">Hungarian</th><th class="border px-2">English</th><th class="border px-2">"In [month]"</th></tr>
            ${months.map(m => `<tr><td class="border px-2 font-semibold">${m.hungarian}</td><td class="border px-2">${m.english}</td><td class="border px-2">${m.suffix}</td></tr>`).join('')}
        </table>
    `;
    main.appendChild(section3);

    // =====================
    // SECTION 4: Dates and Time Expressions
    // =====================
    const section4 = document.createElement('section');
    section4.className = 'mb-8';
    section4.innerHTML = `
        <h2 class="text-xl font-semibold text-slate-700 mb-2">Section 4: Dates and Time Expressions</h2>
        <p class="mb-4">Hungarian date format is: <b>Year. Month Day.</b> (e.g., 2024. januar 15.)</p>

        <div class="bg-slate-50 p-4 rounded-lg mb-4">
            <p class="font-semibold mb-2">Common Time Words:</p>
            <table class="w-full border text-sm">
                <tr><th class="border px-2">Hungarian</th><th class="border px-2">English</th></tr>
                <tr><td class="border px-2 font-semibold">ma</td><td class="border px-2">today</td></tr>
                <tr><td class="border px-2 font-semibold">tegnap</td><td class="border px-2">yesterday</td></tr>
                <tr><td class="border px-2 font-semibold">holnap</td><td class="border px-2">tomorrow</td></tr>
                <tr><td class="border px-2 font-semibold">tegnapelott</td><td class="border px-2">the day before yesterday</td></tr>
                <tr><td class="border px-2 font-semibold">holnaputan</td><td class="border px-2">the day after tomorrow</td></tr>
                <tr><td class="border px-2 font-semibold">most</td><td class="border px-2">now</td></tr>
                <tr><td class="border px-2 font-semibold">kesobb</td><td class="border px-2">later</td></tr>
                <tr><td class="border px-2 font-semibold">korabban</td><td class="border px-2">earlier</td></tr>
                <tr><td class="border px-2 font-semibold">reggel</td><td class="border px-2">morning</td></tr>
                <tr><td class="border px-2 font-semibold">delutan</td><td class="border px-2">afternoon</td></tr>
                <tr><td class="border px-2 font-semibold">este</td><td class="border px-2">evening</td></tr>
                <tr><td class="border px-2 font-semibold">ejjel</td><td class="border px-2">night</td></tr>
            </table>
        </div>

        <div class="bg-slate-50 p-4 rounded-lg mb-4">
            <p class="font-semibold mb-2">Duration Expressions:</p>
            <ul class="list-disc pl-6 space-y-1">
                <li><b>Egy oraja</b> - for an hour / an hour ago</li>
                <li><b>Ket napig</b> - for two days</li>
                <li><b>Egy hete</b> - for a week / a week ago</li>
                <li><b>Egy honapig</b> - for a month</li>
                <li><b>Ket eve</b> - for two years / two years ago</li>
            </ul>
        </div>

        <div class="bg-slate-50 p-4 rounded-lg">
            <p class="font-semibold mb-2">Asking About Time:</p>
            <ul class="list-disc pl-6 space-y-1">
                <li><b>Hany ora van?</b> - What time is it?</li>
                <li><b>Mikor?</b> - When?</li>
                <li><b>Mikor erkezel?</b> - When do you arrive?</li>
                <li><b>Meddig?</b> - Until when? / How long?</li>
                <li><b>Hanyadikan?</b> - On what date?</li>
            </ul>
        </div>
    `;
    main.appendChild(section4);

    // =====================
    // INTERACTIVE EXERCISES
    // =====================

    // Function to create clock SVG
    function createClock(hours, minutes) {
        const hourAngle = (hours % 12 + minutes / 60) * 30 - 90;
        const minuteAngle = minutes * 6 - 90;

        return `
            <div class="clock-face mx-auto">
                <div class="clock-center"></div>
                <div class="clock-hour" style="transform: rotate(${hourAngle + 90}deg);"></div>
                <div class="clock-minute" style="transform: rotate(${minuteAngle + 90}deg);"></div>
                <span class="clock-number" style="top: 8px; left: 50%; transform: translateX(-50%);">12</span>
                <span class="clock-number" style="top: 50%; right: 8px; transform: translateY(-50%);">3</span>
                <span class="clock-number" style="bottom: 8px; left: 50%; transform: translateX(-50%);">6</span>
                <span class="clock-number" style="top: 50%; left: 8px; transform: translateY(-50%);">9</span>
            </div>
        `;
    }

    // =====================
    // STAGE 1: Clock Reading (10 items)
    // =====================
    const stage1Questions = [
        { hours: 1, minutes: 0, answer: 'egy ora', translation: '1:00' },
        { hours: 3, minutes: 0, answer: 'harom ora', translation: '3:00' },
        { hours: 1, minutes: 30, answer: 'fel ketto', translation: '1:30 (half to two)' },
        { hours: 2, minutes: 30, answer: 'fel harom', translation: '2:30 (half to three)' },
        { hours: 1, minutes: 15, answer: 'negyed ketto', translation: '1:15 (quarter to two)' },
        { hours: 5, minutes: 0, answer: 'ot ora', translation: '5:00' },
        { hours: 3, minutes: 45, answer: 'haromnegyed negy', translation: '3:45 (three-quarters to four)' },
        { hours: 6, minutes: 30, answer: 'fel het', translation: '6:30 (half to seven)' },
        { hours: 9, minutes: 15, answer: 'negyed tiz', translation: '9:15 (quarter to ten)' },
        { hours: 11, minutes: 45, answer: 'haromnegyed tizenketto', translation: '11:45 (three-quarters to twelve)' }
    ];

    const stage1Div = document.createElement('section');
    stage1Div.className = 'mb-8';
    stage1Div.innerHTML = `
        <h2 class="text-xl font-semibold text-slate-700 mb-2">Stage 1: Clock Reading</h2>
        <p class="mb-4">Look at each clock and select the correct Hungarian time expression. Remember: Hungarian half hours refer to the NEXT hour!</p>
        <div id="clock-exercise" class="space-y-6"></div>
        <div id="clock-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${stage1Questions.length}</div>
    `;
    main.appendChild(stage1Div);

    const clockExerciseDiv = document.getElementById('clock-exercise');
    let clockCorrect = 0;

    stage1Questions.forEach((q, idx) => {
        // Generate wrong options
        const allOptions = [
            'egy ora', 'ket ora', 'harom ora', 'negy ora', 'ot ora', 'hat ora',
            'fel ketto', 'fel harom', 'fel negy', 'fel het', 'fel nyolc',
            'negyed ketto', 'negyed harom', 'negyed tiz',
            'haromnegyed negy', 'haromnegyed ot', 'haromnegyed tizenketto'
        ];
        const options = [q.answer];
        while (options.length < 4) {
            const randomOpt = allOptions[Math.floor(Math.random() * allOptions.length)];
            if (!options.includes(randomOpt)) {
                options.push(randomOpt);
            }
        }
        options.sort(() => Math.random() - 0.5);

        const wrapper = document.createElement('div');
        wrapper.className = 'bg-slate-50 p-4 rounded-lg';
        wrapper.innerHTML = `
            <div class="flex flex-col md:flex-row items-center gap-4">
                <div class="flex-shrink-0">
                    ${createClock(q.hours, q.minutes)}
                    <p class="text-center text-sm text-slate-500 mt-2">${q.hours}:${q.minutes.toString().padStart(2, '0')}</p>
                </div>
                <div class="flex-grow">
                    <p class="mb-2 font-medium text-slate-700">What time is it in Hungarian?</p>
                    <div class="grid grid-cols-2 gap-2" id="clock-options-${idx}"></div>
                    <div id="clock-feedback-${idx}" class="mt-2 text-sm font-semibold"></div>
                </div>
            </div>
        `;
        clockExerciseDiv.appendChild(wrapper);

        const optionsDiv = document.getElementById(`clock-options-${idx}`);
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'px-3 py-2 border border-slate-300 rounded-md hover:bg-slate-100 transition-colors text-sm';
            btn.textContent = opt;
            btn.addEventListener('click', function() {
                checkClockAnswer(idx, opt, q.answer, q.translation);
            });
            optionsDiv.appendChild(btn);
        });
    });

    function checkClockAnswer(idx, selected, correct, translation) {
        const feedback = document.getElementById(`clock-feedback-${idx}`);
        const optionsDiv = document.getElementById(`clock-options-${idx}`);
        const buttons = optionsDiv.querySelectorAll('button');

        buttons.forEach(btn => {
            btn.disabled = true;
            if (btn.textContent === correct) {
                btn.className = 'px-3 py-2 border border-green-500 rounded-md bg-green-100 text-green-700 text-sm';
            } else if (btn.textContent === selected && selected !== correct) {
                btn.className = 'px-3 py-2 border border-red-500 rounded-md bg-red-100 text-red-700 text-sm';
            }
        });

        if (selected === correct) {
            feedback.textContent = `Correct! ${translation}`;
            feedback.className = 'mt-2 text-green-600 font-semibold';
            clockCorrect++;
        } else {
            feedback.textContent = `Incorrect. The answer is: ${correct} (${translation})`;
            feedback.className = 'mt-2 text-red-600 font-semibold';
        }
        document.getElementById('clock-score').textContent = `Score: ${clockCorrect} / ${stage1Questions.length}`;
    }

    // =====================
    // STAGE 2: Days & Months Vocabulary (14 items)
    // =====================
    const stage2Items = [
        { hungarian: 'hetfo', english: 'Monday', type: 'day' },
        { hungarian: 'kedd', english: 'Tuesday', type: 'day' },
        { hungarian: 'szerda', english: 'Wednesday', type: 'day' },
        { hungarian: 'csutortok', english: 'Thursday', type: 'day' },
        { hungarian: 'pentek', english: 'Friday', type: 'day' },
        { hungarian: 'szombat', english: 'Saturday', type: 'day' },
        { hungarian: 'vasarnap', english: 'Sunday', type: 'day' },
        { hungarian: 'januar', english: 'January', type: 'month' },
        { hungarian: 'marcius', english: 'March', type: 'month' },
        { hungarian: 'majus', english: 'May', type: 'month' },
        { hungarian: 'julius', english: 'July', type: 'month' },
        { hungarian: 'szeptember', english: 'September', type: 'month' },

    const stage2Div = document.createElement('section');
