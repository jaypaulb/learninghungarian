    <main class="max-w-4xl mx-auto bg-white rounded-xl shadow-md p-6" id="main-content">

    </main>

    <footer class="text-center mt-12 py-4 border-t border-slate-300">
        <p class="text-sm text-slate-500">&copy; 2024 Hungarian Language Lessons</p>
    </footer>

    <script>
    // ============================================
    // UTILITY FUNCTIONS
    // ============================================

    function removeAccents(str) {
        return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[oOuU\u0151\u0150\u0171\u0170]/g, function(m) {
            const map = { '\u0151':'o','\u0150':'O','\u0171':'u','\u0170':'U' };
            return map[m] || m;
        });
    }

    function normalizeAnswer(str) {
        return str.trim().toLowerCase();
    }

    function checkAccentAware(userInput, correctAnswer) {
        const normalizedInput = normalizeAnswer(userInput);
        const normalizedCorrect = normalizeAnswer(correctAnswer);

        if (normalizedInput === normalizedCorrect) {
            return 'correct';
        } else if (removeAccents(normalizedInput) === removeAccents(normalizedCorrect)) {
            return 'accent-warning';
        } else {
            return 'incorrect';
        }
    }

    // ============================================
    // VOCABULARY DATA
    // ============================================

    const travelDocuments = [
        { hungarian: 'utlevel', english: 'passport' },
        { hungarian: 'vizum', english: 'visa' },
        { hungarian: 'szemelyi igazolvany', english: 'ID card' },
        { hungarian: 'jogositvany', english: 'driver\'s license' },
        { hungarian: 'biztositas', english: 'insurance' },
        { hungarian: 'repulojegy', english: 'plane ticket' },
        { hungarian: 'vonatjegy', english: 'train ticket' },
        { hungarian: 'buszjegy', english: 'bus ticket' }
    ];

    const accommodationVocabulary = [
        { hungarian: 'szalloda', english: 'hotel' },
        { hungarian: 'szoba', english: 'room' },
        { hungarian: 'panzio', english: 'guesthouse/pension' },
        { hungarian: 'apartman', english: 'apartment' },
        { hungarian: 'hostel', english: 'hostel' },
        { hungarian: 'egyagyas szoba', english: 'single room' },
        { hungarian: 'ketagyas szoba', english: 'double room' },
        { hungarian: 'reggeli', english: 'breakfast' },
        { hungarian: 'felszio', english: 'half board' },
        { hungarian: 'teljes ellátas', english: 'full board' }
    ];

    const bookingPhrases = [
        { hungarian: 'Szeretnek szobat foglalni.', english: 'I would like to book a room.' },
        { hungarian: 'Van szabad szobajuk?', english: 'Do you have any rooms available?' },
        { hungarian: 'Mennyibe kerul egy ejszaka?', english: 'How much is one night?' },
        { hungarian: 'Mikor a bejelentkezes?', english: 'When is check-in?' },
        { hungarian: 'Mikor a kijelentkezes?', english: 'When is check-out?' },
        { hungarian: 'A szoba ar tartalmazza a reggelit?', english: 'Does the room rate include breakfast?' }
    ];

    const touristPhrases = [
        { hungarian: 'Hol van a turistainformacio?', english: 'Where is the tourist information?' },
        { hungarian: 'Van terkepuk?', english: 'Do you have a map?' },
        { hungarian: 'Mikor nyit a muzeum?', english: 'When does the museum open?' },
        { hungarian: 'Mennyibe kerul a belepojegy?', english: 'How much is the entrance ticket?' },
        { hungarian: 'Lehet fotografalni?', english: 'Can I take photos?' },
        { hungarian: 'Hol tudok penzt valtani?', english: 'Where can I exchange money?' }
    ];

    const transportPhrases = [
        { hungarian: 'Mikor indul a kovetkezo vonat?', english: 'When does the next train leave?' },
        { hungarian: 'Melyik vaganyrol?', english: 'From which platform?' },
        { hungarian: 'Szeretnek jegyet venni.', english: 'I would like to buy a ticket.' },
        { hungarian: 'Oda-vissza jegyet kerek.', english: 'A return ticket, please.' },
        { hungarian: 'Csak oda jegyet kerek.', english: 'A one-way ticket, please.' },
        { hungarian: 'Van helyjelzes?', english: 'Is there a seat reservation?' }
    ];

    // ============================================
    // EXERCISE DATA
    // ============================================

    const vocabularyCards = [
        ...travelDocuments.slice(0, 6),
        ...accommodationVocabulary.slice(0, 8),
        { hungarian: 'foglalas', english: 'reservation/booking' },
        { hungarian: 'belepojegy', english: 'entrance ticket' }
    ];

    const accommodationMatching = [
        { description: 'A place to stay that is larger than a room', answer: 'apartman', options: ['apartman', 'szoba', 'szalloda', 'hostel'] },
        { description: 'A budget-friendly shared accommodation', answer: 'hostel', options: ['hostel', 'szalloda', 'panzio', 'apartman'] },
        { description: 'Room for one person', answer: 'egyagyas szoba', options: ['egyagyas szoba', 'ketagyas szoba', 'apartman', 'szoba'] },
        { description: 'A smaller, family-run place to stay', answer: 'panzio', options: ['panzio', 'szalloda', 'hostel', 'apartman'] },
        { description: 'Official document needed for international travel', answer: 'utlevel', options: ['utlevel', 'vizum', 'jogositvany', 'biztositas'] },
        { description: 'Permission to enter a country', answer: 'vizum', options: ['vizum', 'utlevel', 'jogositvany', 'biztositas'] },
        { description: 'The first meal of the day at a hotel', answer: 'reggeli', options: ['reggeli', 'vacsora', 'ebed', 'felszio'] },
        { description: 'Breakfast and dinner included', answer: 'felszio', options: ['felszio', 'reggeli', 'teljes ellátas', 'szoba ar'] }
    ];

    const bookingSentences = [
        { sentence: 'Szeretnek ___ foglalni ket ejszakara.', blank: 'szobat', english: 'I would like to book a room for two nights.' },
        { sentence: 'Van ___ szobajuk?', blank: 'szabad', english: 'Do you have any rooms available?' },
        { sentence: 'Mennyibe ___ egy ejszaka?', blank: 'kerul', english: 'How much is one night?' },
        { sentence: 'A szoba ar ___ a reggelit?', blank: 'tartalmazza', english: 'Does the room rate include breakfast?' },
        { sentence: 'Mikor a ___?', blank: 'bejelentkezes', english: 'When is check-in?' },
        { sentence: 'Szeretnek egy ___ szobat.', blank: 'ketagyas', english: 'I would like a double room.' },
        { sentence: 'Van ___ a szobaban?', blank: 'wifi', english: 'Is there wifi in the room?' },
        { sentence: 'Le szeretnem ___ a foglalast.', blank: 'mondani', english: 'I would like to cancel the reservation.' }
    ];

    const touristSituations = [
        { prompt: 'Ask where the tourist information center is.', answer: 'Hol van a turistainformacio', alternates: ['Hol a turistainformacio', 'Hol talalom a turistainformaciot'] },
        { prompt: 'Ask how much the entrance ticket costs.', answer: 'Mennyibe kerul a belepojegy', alternates: ['Mennyibe kerul a jegy', 'Mi a belepojegy ara'] },
        { prompt: 'Ask when the museum opens.', answer: 'Mikor nyit a muzeum', alternates: ['Mikor nyilik a muzeum'] },
        { prompt: 'Ask if you can take photos.', answer: 'Lehet fotografalni', alternates: ['Szabad fotografalni', 'Fenykepezhetem'] },
        { prompt: 'Ask for a map.', answer: 'Van terkepuk', alternates: ['Kaphatok egy terkepet', 'Kerek egy terkepet'] },
        { prompt: 'Ask where you can exchange money.', answer: 'Hol tudok penzt valtani', alternates: ['Hol lehet penzt valtani'] }
    ];

    const travelDialogues = [
        {
            speaker: 'Recepcio',
            line: 'Jo napot! Miben segithetek?',
            response: 'Jo napot! Szeretnek ___ foglalni.',
            responseEnglish: 'Good day! I would like to book a room.',
            blank: 'szobat'
        },
        {
            speaker: 'Recepcio',
            line: 'Hany ejszakara?',
            response: '___ ejszakara, kerrem.',
            responseEnglish: 'For three nights, please.',
            blank: 'Harom'
        },
        {
            speaker: 'Recepcio',
            line: 'Van szabad ketagyas szobank reggeli vel.',
            response: 'Mennyibe ___ egy ejszaka?',
            responseEnglish: 'How much is one night?',
            blank: 'kerul'
        },
        {
            speaker: 'Jegypenztárnál',
            line: 'Hova utazik?',
            response: '___ szeretnek menni.',
            responseEnglish: 'I would like to go to Budapest.',
            blank: 'Budapestre'
        },
        {
            speaker: 'Jegypenztárnál',
            line: 'Csak oda vagy oda-vissza?',
            response: '___ jegyet kerek.',
            responseEnglish: 'A return ticket, please.',
            blank: 'Oda-vissza'
        },
        {
            speaker: 'Muzeum',
            line: 'Segithetek?',
            response: 'Igen, ___ fotografalni?',
            responseEnglish: 'Yes, can I take photos?',
            blank: 'lehet'
        }
    ];

    // ============================================
    // SCORE TRACKING
    // ============================================

    let scores = {
        stage1: { correct: 0, total: vocabularyCards.length },
        stage2: { correct: 0, total: accommodationMatching.length },
        stage3: { correct: 0, total: bookingSentences.length },
        stage4: { correct: 0, total: touristSituations.length },
        stage5: { correct: 0, total: travelDialogues.length }
    };

    let stage1Revealed = new Set();

    function updateTotalScore() {
        const totalCorrect = Object.values(scores).reduce((sum, s) => sum + s.correct, 0);
        const totalQuestions = Object.values(scores).reduce((sum, s) => sum + s.total, 0);
        const totalScoreEl = document.getElementById('total-score');
        if (totalScoreEl) {
            totalScoreEl.textContent = `Total Score: ${totalCorrect} / ${totalQuestions}`;
        }
    }

    // ============================================
    // BUILD PAGE CONTENT
    // ============================================

    const mainContent = document.getElementById('main-content');

    // Learning Objectives
    const objectivesSection = document.createElement('section');
    objectivesSection.className = 'mb-8';
    objectivesSection.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Learning Objectives</h2>
        <ul class="list-disc pl-6 space-y-2 text-slate-600">
            <li>Learn vocabulary for travel documents and planning</li>
            <li>Master accommodation booking phrases</li>
            <li>Handle tourist situations confidently</li>
            <li>Buy tickets and navigate transportation</li>
        </ul>
    `;
    mainContent.appendChild(objectivesSection);

    // Cultural Note
    const culturalNote = document.createElement('div');
    culturalNote.className = 'cultural-note mb-8';
    culturalNote.innerHTML = `
        <h3 class="font-bold text-amber-800 mb-2">Cultural Note: Tourism in Hungary</h3>
        <p class="text-amber-900">Hungary is a popular tourist destination, especially Budapest with its thermal baths,
        historic architecture, and vibrant culture. Most tourism workers in major cities speak some English, but using
        Hungarian phrases like <strong>"Szeretnek szobat foglalni"</strong> (I would like to book a room) or
        <strong>"Mennyibe kerul?"</strong> (How much does it cost?) is greatly appreciated and may lead to better service!
        The currency is the Hungarian Forint (HUF), and tipping (10-15%) is customary in restaurants and hotels.</p>
    `;
    mainContent.appendChild(culturalNote);

    // Section 1: Travel Documents
    const section1 = document.createElement('section');
    section1.className = 'mb-8';
    section1.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 1: Travel Documents (Utazasi Dokumentumok)</h2>
        <table class="mb-4">
            <thead>
                <tr><th class="text-left">Hungarian</th><th class="text-left">English</th></tr>
            </thead>
            <tbody>
                ${travelDocuments.map(item => `<tr><td class="font-medium travel-highlight">${item.hungarian}</td><td>${item.english}</td></tr>`).join('')}
            </tbody>
        </table>
    `;
    mainContent.appendChild(section1);

    // Section 2: Accommodation
    const section2 = document.createElement('section');
    section2.className = 'mb-8';
    section2.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 2: Accommodation (Szallas)</h2>
        <div class="grid md:grid-cols-2 gap-3 mb-4">
            ${accommodationVocabulary.map(item => `
                <div class="accommodation-card flex items-center gap-3 p-3 bg-sky-50 rounded-lg border border-sky-200">
                    <span class="font-medium travel-highlight">${item.hungarian}</span>
                    <span class="text-slate-600">- ${item.english}</span>
                </div>
            `).join('')}
        </div>
    `;
    mainContent.appendChild(section2);

    // Section 3: Booking Phrases
    const section3 = document.createElement('section');
    section3.className = 'mb-8';
    section3.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 3: Booking Phrases (Foglalasi Kifejezesek)</h2>
        <div class="bg-slate-50 rounded-lg p-4 space-y-3">
            ${bookingPhrases.map(item => `
                <div class="flex flex-col md:flex-row md:items-center gap-2">
                    <span class="font-medium travel-highlight min-w-[320px]">${item.hungarian}</span>
                    <span class="text-slate-600">- ${item.english}</span>
                </div>
            `).join('')}
        </div>
        <div class="scenario-box mt-4">
            <h4 class="font-semibold text-sky-800 mb-2">At the Reception (A Recepcional)</h4>
            <p class="text-sky-700 text-sm">
                <strong>Recepcio:</strong> Jo napot! Miben segithetek?<br>
                <strong>You:</strong> Jo napot! Szeretnek szobat foglalni.<br>
                <strong>Recepcio:</strong> Hany ejszakara?<br>
                <strong>You:</strong> Ket ejszakara. Van szabad ketagyas szobajuk?
            </p>
        </div>
    `;
    mainContent.appendChild(section3);

    // Section 4: Tourist Phrases
    const section4 = document.createElement('section');
    section4.className = 'mb-8';
    section4.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 4: Tourist Phrases (Turista Kifejezesek)</h2>
        <div class="grid md:grid-cols-2 gap-4">
            <div class="bg-blue-50 p-4 rounded-lg">
                <h3 class="font-semibold text-blue-800 mb-3">At Tourist Sites</h3>
                ${touristPhrases.map(item => `
                    <div class="mb-2">
                        <span class="font-medium text-blue-700">${item.hungarian}</span>
                        <span class="text-slate-600 text-sm block">${item.english}</span>
                    </div>
                `).join('')}
            </div>
            <div class="bg-green-50 p-4 rounded-lg">
                <h3 class="font-semibold text-green-800 mb-3">Transportation</h3>
                ${transportPhrases.map(item => `
                    <div class="mb-2">
                        <span class="font-medium text-green-700">${item.hungarian}</span>
                        <span class="text-slate-600 text-sm block">${item.english}</span>
                    </div>
                `).join('')}
            </div>
        </div>
    `;
    mainContent.appendChild(section4);

    // Total Score Display
    const totalScoreSection = document.createElement('div');
    totalScoreSection.className = 'bg-gradient-to-r from-sky-600 to-blue-600 text-white rounded-xl p-4 mb-8 text-center';
    totalScoreSection.innerHTML = `
        <h3 class="text-lg font-semibold mb-1">Interactive Exercises</h3>
        <p id="total-score" class="text-2xl font-bold">Total Score: 0 / 46</p>
    `;
    mainContent.appendChild(totalScoreSection);

    // ============================================
    // STAGE 1: VOCABULARY CARDS (16 items)
    // ============================================

    const stage1Section = document.createElement('section');
    stage1Section.className = 'mb-8';
    stage1Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 1: Travel Vocabulary Cards</h2>
        <p class="text-slate-600 mb-4">Click each card to flip and reveal the English translation. Test yourself first!</p>
        <div id="vocab-cards" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4"></div>
        <div id="stage1-score" class="text-slate-700 font-medium">Cards Revealed: 0 / ${vocabularyCards.length}</div>
    `;
    mainContent.appendChild(stage1Section);

    const vocabCardsContainer = document.getElementById('vocab-cards');
    vocabularyCards.forEach((card, idx) => {
        const cardDiv = document.createElement('div');
        cardDiv.className = 'flip-card h-24';
        cardDiv.setAttribute('data-idx', idx);
        cardDiv.innerHTML = `
            <div class="flip-card-inner">
                <div class="flip-card-front">
                    <span class="text-lg font-bold text-center">${card.hungarian}</span>
                </div>
                <div class="flip-card-back">
                    <span class="text-lg font-semibold text-center">${card.english}</span>
                </div>
            </div>
        `;
        cardDiv.addEventListener('click', function() {
            this.classList.toggle('flipped');
            if (!stage1Revealed.has(idx)) {
                stage1Revealed.add(idx);
                scores.stage1.correct = stage1Revealed.size;
                document.getElementById('stage1-score').textContent = `Cards Revealed: ${stage1Revealed.size} / ${vocabularyCards.length}`;
                updateTotalScore();
            }
        });
        vocabCardsContainer.appendChild(cardDiv);
    });

    // ============================================
    // STAGE 2: ACCOMMODATION MATCHING (8 items)
    // ============================================

    const stage2Section = document.createElement('section');
    stage2Section.className = 'mb-8';
    stage2Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 2: Accommodation Matching</h2>
        <p class="text-slate-600 mb-4">Match the description to the correct Hungarian travel term.</p>
        <div id="accommodation-exercise" class="space-y-4"></div>
        <div id="stage2-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${accommodationMatching.length}</div>
    `;
    mainContent.appendChild(stage2Section);

    const accommodationExercise = document.getElementById('accommodation-exercise');
    accommodationMatching.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col md:flex-row items-start md:items-center gap-2 p-3 bg-slate-50 rounded-lg';

        const label = document.createElement('span');
        label.className = 'min-w-[300px] text-slate-800 font-medium';
        label.textContent = q.description;

        const select = document.createElement('select');
        select.className = 'border border-slate-300 rounded-md px-3 py-2 w-48 focus:ring-2 focus:ring-sky-500 focus:border-sky-500';
        select.innerHTML = '<option value="">Select answer...</option>';

        const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);
        shuffledOptions.forEach(opt => {
            const option = document.createElement('option');
            option.value = opt;
            option.textContent = opt;
            select.appendChild(option);
        });

        const feedback = document.createElement('span');
        feedback.className = 'ml-2 text-sm font-semibold';

        select.addEventListener('change', function() {
            if (this.value === q.answer) {
                feedback.textContent = 'Correct!';
                feedback.className = 'ml-2 text-green-600 font-semibold';
                this.disabled = true;
                this.className = 'border border-green-500 bg-green-50 rounded-md px-3 py-2 w-48';
                scores.stage2.correct++;
                document.getElementById('stage2-score').textContent = `Score: ${scores.stage2.correct} / ${accommodationMatching.length}`;
                updateTotalScore();
            } else if (this.value !== '') {
                feedback.textContent = 'Try again!';
                feedback.className = 'ml-2 text-red-600 font-semibold';
            }
        });

        wrapper.appendChild(label);
        wrapper.appendChild(select);
        wrapper.appendChild(feedback);
        accommodationExercise.appendChild(wrapper);
    });

    // ============================================
    // STAGE 3: BOOKING SENTENCES (8 items)
    // ============================================

    const stage3Section = document.createElement('section');
    stage3Section.className = 'mb-8';
    stage3Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 3: Booking Sentences</h2>
        <p class="text-slate-600 mb-4">Complete these booking-related sentences with the correct word.</p>
        <div id="booking-exercise" class="space-y-4"></div>
        <div id="stage3-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${bookingSentences.length}</div>
    `;
    mainContent.appendChild(stage3Section);

    const bookingExercise = document.getElementById('booking-exercise');
    const stage3Answers = new Array(bookingSentences.length).fill(false);

    bookingSentences.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col gap-2 p-3 bg-sky-50 rounded-lg';

        const row = document.createElement('div');
        row.className = 'flex flex-col md:flex-row items-start md:items-center gap-2';

        const sentenceParts = q.sentence.split('___');
        const sentenceSpan = document.createElement('span');
        sentenceSpan.className = 'text-slate-800';

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-2 py-1 w-36 mx-1 focus:ring-2 focus:ring-sky-500 focus:border-sky-500 inline';
        input.setAttribute('aria-label', `Fill in blank for: ${q.sentence}`);

        sentenceSpan.appendChild(document.createTextNode(sentenceParts[0]));
        sentenceSpan.appendChild(input);
        if (sentenceParts[1]) {
            sentenceSpan.appendChild(document.createTextNode(sentenceParts[1]));
        }

        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold ml-2';

        const translation = document.createElement('div');
        translation.className = 'text-xs text-slate-500 italic';
        translation.textContent = `English: ${q.english}`;

        function checkAnswer() {
            const result = checkAccentAware(input.value, q.blank);

            if (result === 'correct') {
                feedback.textContent = 'Correct!';
                feedback.className = 'text-green-600 font-semibold ml-2';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-2 py-1 w-36 mx-1 inline';
                if (!stage3Answers[idx]) {
                    stage3Answers[idx] = true;
                    scores.stage3.correct++;
                    document.getElementById('stage3-score').textContent = `Score: ${scores.stage3.correct} / ${bookingSentences.length}`;
                    updateTotalScore();
                }
            } else if (result === 'accent-warning') {
                feedback.textContent = 'Almost! Check accents.';
                feedback.className = 'text-yellow-600 font-semibold ml-2';
            } else if (input.value.trim() !== '') {
                feedback.textContent = 'Try again!';
                feedback.className = 'text-red-600 font-semibold ml-2';
            }
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkAnswer();
        });
        input.addEventListener('blur', checkAnswer);

        row.appendChild(sentenceSpan);
        row.appendChild(feedback);
        wrapper.appendChild(row);
        wrapper.appendChild(translation);
        bookingExercise.appendChild(wrapper);
    });

    // ============================================
    // STAGE 4: TOURIST SITUATIONS (6 items)
    // ============================================

    const stage4Section = document.createElement('section');
    stage4Section.className = 'mb-8';
    stage4Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 4: Tourist Situations</h2>
        <p class="text-slate-600 mb-4">How would you say these phrases in Hungarian?</p>
        <div id="tourist-exercise" class="space-y-4"></div>
        <div id="stage4-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${touristSituations.length}</div>
    `;
    mainContent.appendChild(stage4Section);

    const touristExercise = document.getElementById('tourist-exercise');
    const stage4Answers = new Array(touristSituations.length).fill(false);

    touristSituations.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'p-4 bg-blue-50 rounded-lg';

        const promptDiv = document.createElement('div');
        promptDiv.className = 'mb-2';
        promptDiv.innerHTML = `<strong class="text-slate-800">${q.prompt}</strong>`;

        const inputDiv = document.createElement('div');
        inputDiv.className = 'flex flex-col md:flex-row items-start md:items-center gap-2';

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-3 py-2 w-full md:w-80 focus:ring-2 focus:ring-blue-500';
        input.setAttribute('aria-label', `Answer for: ${q.prompt}`);

        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold';

        function checkAnswer() {
            const userAnswer = normalizeAnswer(input.value);
            const correctAnswer = normalizeAnswer(q.answer);
            const alternates = q.alternates ? q.alternates.map(a => normalizeAnswer(a)) : [];
            const allCorrect = [correctAnswer, ...alternates];

            const exactMatch = allCorrect.some(a => a === userAnswer);
            const accentMatch = allCorrect.some(a => removeAccents(a) === removeAccents(userAnswer));

            if (exactMatch) {
                feedback.textContent = 'Correct!';
                feedback.className = 'text-green-600 font-semibold';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-3 py-2 w-full md:w-80';
                if (!stage4Answers[idx]) {
                    stage4Answers[idx] = true;
                    scores.stage4.correct++;
                    document.getElementById('stage4-score').textContent = `Score: ${scores.stage4.correct} / ${touristSituations.length}`;
                    updateTotalScore();
                }
            } else if (accentMatch) {
                feedback.textContent = 'Close! Check your accents.';
                feedback.className = 'text-yellow-600 font-semibold';
            } else if (input.value.trim() !== '') {
                feedback.textContent = `Try again! One answer: ${q.answer}`;
                feedback.className = 'text-red-600 font-semibold';
            }
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkAnswer();
        });
        input.addEventListener('blur', checkAnswer);

        inputDiv.appendChild(input);
        inputDiv.appendChild(feedback);
        wrapper.appendChild(promptDiv);
        wrapper.appendChild(inputDiv);
        touristExercise.appendChild(wrapper);
    });

    // ============================================
    // STAGE 5: TRAVEL DIALOGUES (6 items)
    // ============================================

    const stage5Section = document.createElement('section');
    stage5Section.className = 'mb-8';
    stage5Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 5: Travel Dialogues</h2>
        <p class="text-slate-600 mb-4">Complete these travel conversations by filling in the missing word.</p>
        <div id="dialogue-exercise" class="space-y-6"></div>
        <div id="stage5-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${travelDialogues.length}</div>
    `;
    mainContent.appendChild(stage5Section);

    const dialogueExercise = document.getElementById('dialogue-exercise');
    const stage5Answers = new Array(travelDialogues.length).fill(false);

    travelDialogues.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'bg-gradient-to-r from-slate-50 to-sky-50 rounded-lg p-4 border border-slate-200';

        const questionLine = document.createElement('div');
        questionLine.className = 'mb-3';
        questionLine.innerHTML = `
            <span class="inline-block bg-sky-600 text-white text-xs font-bold px-2 py-1 rounded mr-2">${q.speaker}</span>
            <span class="text-slate-800 font-medium">${q.line}</span>
        `;

        const responseLine = document.createElement('div');
        responseLine.className = 'flex flex-wrap items-center gap-2';

        const speakerYou = document.createElement('span');
        speakerYou.className = 'inline-block bg-slate-600 text-white text-xs font-bold px-2 py-1 rounded';
        speakerYou.textContent = 'You';

        const responseText = q.response.split('___');
        const responseSpan = document.createElement('span');
        responseSpan.className = 'text-slate-800';

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-2 py-1 w-32 focus:ring-2 focus:ring-sky-500 focus:border-sky-500';
        input.setAttribute('aria-label', `Response for dialogue ${idx + 1}`);

        responseSpan.appendChild(document.createTextNode(responseText[0]));
        responseSpan.appendChild(input);
        if (responseText[1]) {
            responseSpan.appendChild(document.createTextNode(responseText[1]));
        }

        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold';

        function checkAnswer() {
            const result = checkAccentAware(input.value, q.blank);

            if (result === 'correct') {
                feedback.textContent = 'Helyes! (Correct!)';
                feedback.className = 'text-green-600 font-semibold';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-2 py-1 w-32';
                if (!stage5Answers[idx]) {
                    stage5Answers[idx] = true;
                    scores.stage5.correct++;
                    document.getElementById('stage5-score').textContent = `Score: ${scores.stage5.correct} / ${travelDialogues.length}`;
                    updateTotalScore();
                }
            } else if (result === 'accent-warning') {
                feedback.textContent = 'Majdnem! (Check accents)';
                feedback.className = 'text-yellow-600 font-semibold';
            } else if (input.value.trim() !== '') {
                feedback.textContent = 'Probald ujra! (Try again)';
                feedback.className = 'text-red-600 font-semibold';
            }
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkAnswer();
        });
        input.addEventListener('blur', checkAnswer);

        responseLine.appendChild(speakerYou);
        responseLine.appendChild(responseSpan);
        responseLine.appendChild(feedback);

        const translationLine = document.createElement('div');
        translationLine.className = 'mt-2 text-xs text-slate-500 italic pl-8';
        translationLine.textContent = `(${q.responseEnglish})`;

        wrapper.appendChild(questionLine);
        wrapper.appendChild(responseLine);
        wrapper.appendChild(translationLine);
        dialogueExercise.appendChild(wrapper);
    });

    // ============================================
    // SUMMARY SECTION
    // ============================================

    const summarySection = document.createElement('section');
    summarySection.className = 'mt-8 p-6 bg-gradient-to-r from-sky-50 to-slate-50 rounded-xl border border-sky-200';
    summarySection.innerHTML = `
        <h2 class="text-xl font-bold text-sky-800 mb-4">Lesson Summary</h2>
        <div class="grid md:grid-cols-2 gap-4 text-sm">
            <div>
                <h3 class="font-semibold text-slate-700 mb-2">Key Travel Vocabulary:</h3>
                <ul class="list-disc pl-5 text-slate-600 space-y-1">
                    <li>Documents: utlevel, vizum, biztositas</li>
                    <li>Accommodation: szalloda, panzio, apartman</li>
                    <li>Room types: egyagyas, ketagyas szoba</li>
                    <li>Meals: reggeli, felszio, teljes ellátas</li>
                </ul>
            </div>
            <div>
                <h3 class="font-semibold text-slate-700 mb-2">Essential Phrases:</h3>
                <ul class="list-disc pl-5 text-slate-600 space-y-1">
                    <li>"Szeretnek szobat foglalni" - I'd like to book a room</li>
                    <li>"Mennyibe kerul?" - How much does it cost?</li>
                    <li>"Van szabad szobajuk?" - Do you have rooms available?</li>
                    <li>"Oda-vissza jegyet kerek" - A return ticket, please</li>
                </ul>
            </div>
        </div>
        <div class="mt-4 p-3 bg-amber-50 rounded-lg border border-amber-200">
            <p class="text-amber-800 text-sm"><strong>Travel Tip:</strong> In Hungary, the currency is the Forint (HUF). Credit cards are widely accepted in cities, but carry some cash for smaller establishments. Tipping 10-15% is customary. The phrase "Koszonom" (thank you) goes a long way!</p>
        </div>
    `;
    mainContent.appendChild(summarySection);

    // Initialize total score
    updateTotalScore();
    </script>
</body>
</html>
