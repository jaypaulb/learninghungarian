    <script>
    // ============================================
    // UTILITY FUNCTIONS
    // ============================================

    function removeAccents(str) {
        const map = {
            'a': 'a', 'e': 'e', 'i': 'i', 'o': 'o', 'u': 'u',
            'A': 'A', 'E': 'E', 'I': 'I', 'O': 'O', 'U': 'U'
        };
        return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[oOuU]/g, function(m) {
            return map[m] || m;
        });
    }

    function normalizeAnswer(str) {
        return str.trim().toLowerCase();
    }

    function checkAccentAware(userInput, correctAnswer) {
        const normalizedInput = normalizeAnswer(userInput);
        const normalizedCorrect = normalizeAnswer(correctAnswer);

        if (normalizedInput === normalizedCorrect) {
            return 'correct';
        } else if (removeAccents(normalizedInput) === removeAccents(normalizedCorrect)) {
            return 'accent-warning';
        } else {
            return 'incorrect';
        }
    }

    function checkMultipleAnswers(userInput, correctAnswers) {
        const normalizedInput = normalizeAnswer(userInput);

        for (const correct of correctAnswers) {
            if (normalizedInput === normalizeAnswer(correct)) {
                return 'correct';
            }
        }

        for (const correct of correctAnswers) {
            if (removeAccents(normalizedInput) === removeAccents(normalizeAnswer(correct))) {
                return 'accent-warning';
            }
        }

        return 'incorrect';
    }

                <div class="p-2 bg-white rounded border"><span class="text-slate-500">your car:</span><br><span class="poss-highlight">autod</span></div>
                <div class="p-2 bg-white rounded border"><span class="text-slate-500">his/her car:</span><br><span class="poss-highlight">autoja</span></div>

    mainContent.appendChild(section3);

    // Section 4: Special Cases
    const section4 = document.createElement('section');
    section4.className = 'mb-8';
    section4.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 4: Special Cases & Family Terms</h2>

        <div class="bg-rose-50 border-l-4 border-rose-500 p-4 mb-4">
            <h3 class="font-bold text-rose-800 mb-2">Family Terms (often irregular)</h3>

            <div class="grid grid-cols-2 md:grid-cols-3 gap-3 text-sm">
                <div><strong>anya</strong> (mother) &rarr; anyam, anyad, anyja</div>

        </div>

            <ul class="list-disc pl-6 text-blue-700 mt-2">

    mainContent.appendChild(section4);

    // Total Score Display
    const totalScoreSection = document.createElement('div');
    totalScoreSection.className = 'bg-gradient-to-r from-purple-600 to-purple-700 text-white rounded-xl p-4 mb-8 text-center';
    totalScoreSection.innerHTML = `
        <h3 class="text-lg font-semibold mb-1">Interactive Exercises</h3>
        <p id="total-score" class="text-2xl font-bold">Total Score: 0 / 44</p>
    `;
    mainContent.appendChild(totalScoreSection);

    // ============================================
    // STAGE 1: Basic First Person (my) - 8 items
    // ============================================

    const stage1Questions = [
        { noun: 'haz', english: 'house', answer: 'hazam', meaning: 'my house' },
        { noun: 'konyv', english: 'book', answer: 'konyvem', meaning: 'my book' },
        { noun: 'auto', english: 'car', answer: 'autom', meaning: 'my car' },
        { noun: 'kert', english: 'garden', answer: 'kertem', meaning: 'my garden' },
        { noun: 'kutya', english: 'dog', answer: 'kutyam', meaning: 'my dog' },
        { noun: 'nev', english: 'name', answer: 'nevem', meaning: 'my name' },
        { noun: 'barat', english: 'friend', answer: 'baratom', meaning: 'my friend' },
        { noun: 'anya', english: 'mother', answer: 'anyam', meaning: 'my mother' }
    ];

    const stage1Section = document.createElement('section');
    stage1Section.className = 'mb-8';
    stage1Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 1: First Person - "My" (-m/-am/-em/-om)</h2>
        <p class="text-slate-600 mb-4">Add the correct possessive suffix to make "my [noun]".</p>
        <div id="stage1-exercise" class="space-y-3"></div>
        <div id="stage1-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${stage1Questions.length}</div>
    `;
    mainContent.appendChild(stage1Section);

    const stage1Exercise = document.getElementById('stage1-exercise');
    const stage1Answers = new Array(stage1Questions.length).fill(false);

    stage1Questions.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col md:flex-row items-start md:items-center gap-2 p-3 bg-purple-50 rounded-lg';

        const label = document.createElement('span');
        label.className = 'min-w-[180px] text-slate-800';
        label.innerHTML = `<strong>${q.noun}</strong> (${q.english}) &rarr; my ${q.english}:`;

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-3 py-1 w-36 focus:ring-2 focus:ring-purple-500 focus:border-purple-500';
        input.setAttribute('aria-label', `My ${q.english} in Hungarian`);

        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold ml-2';

        function checkAnswer() {
            const result = checkAccentAware(input.value, q.answer);
            if (result === 'correct') {
                feedback.textContent = `Correct! (${q.meaning})`;
                feedback.className = 'text-green-600 font-semibold ml-2';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-3 py-1 w-36';
                if (!stage1Answers[idx]) {
                    stage1Answers[idx] = true;
                    scores.stage1.correct++;
                    document.getElementById('stage1-score').textContent = `Score: ${scores.stage1.correct} / ${stage1Questions.length}`;
                    updateTotalScore();
                }
            } else if (result === 'accent-warning') {
                feedback.textContent = 'Almost! Check accents.';
                feedback.className = 'text-yellow-600 font-semibold ml-2';
            } else if (input.value.trim() !== '') {
                feedback.textContent = 'Try again!';
                feedback.className = 'text-red-600 font-semibold ml-2';
            }
        }

        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkAnswer(); });
        input.addEventListener('blur', checkAnswer);

        wrapper.appendChild(label);
        wrapper.appendChild(input);
        wrapper.appendChild(feedback);
        stage1Exercise.appendChild(wrapper);

    // ============================================
    // STAGE 2: Second Person (your) - 10 items
    // ============================================

    const stage2Questions = [
        { noun: 'haz', english: 'house', answer: 'hazad', meaning: 'your house' },
        { noun: 'konyv', english: 'book', answer: 'konyved', meaning: 'your book' },
        { noun: 'auto', english: 'car', answer: 'autod', meaning: 'your car' },
        { noun: 'kert', english: 'garden', answer: 'kerted', meaning: 'your garden' },
        { noun: 'kutya', english: 'dog', answer: 'kutyad', meaning: 'your dog' },
        { noun: 'nev', english: 'name', answer: 'neved', meaning: 'your name' },
        { noun: 'apa', english: 'father', answer: 'apad', meaning: 'your father' },

        { noun: 'szek', english: 'chair', answer: 'széked', alternates: ['szeked'], meaning: 'your chair' },

    const stage2Section = document.createElement('section');
    stage2Section.className = 'mb-8';
    stage2Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 2: Second Person - "Your" (-d/-ad/-ed/-od)</h2>
        <p class="text-slate-600 mb-4">Add the correct possessive suffix to make "your [noun]".</p>
        <div id="stage2-exercise" class="space-y-3"></div>
        <div id="stage2-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${stage2Questions.length}</div>
    `;
    mainContent.appendChild(stage2Section);

    const stage2Exercise = document.getElementById('stage2-exercise');
    const stage2Answers = new Array(stage2Questions.length).fill(false);

    stage2Questions.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col md:flex-row items-start md:items-center gap-2 p-3 bg-teal-50 rounded-lg';

        const label = document.createElement('span');
        label.className = 'min-w-[180px] text-slate-800';
        label.innerHTML = `<strong>${q.noun}</strong> (${q.english}) &rarr; your ${q.english}:`;

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-3 py-1 w-36 focus:ring-2 focus:ring-teal-500 focus:border-teal-500';
        input.setAttribute('aria-label', `Your ${q.english} in Hungarian`);

        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold ml-2';

        function checkAnswer() {
            const allAnswers = [q.answer, ...(q.alternates || [])];
            const result = checkMultipleAnswers(input.value, allAnswers);
            if (result === 'correct') {
                feedback.textContent = `Correct! (${q.meaning})`;
                feedback.className = 'text-green-600 font-semibold ml-2';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-3 py-1 w-36';
                if (!stage2Answers[idx]) {
                    stage2Answers[idx] = true;
                    scores.stage2.correct++;
                    document.getElementById('stage2-score').textContent = `Score: ${scores.stage2.correct} / ${stage2Questions.length}`;
                    updateTotalScore();
                }
            } else if (result === 'accent-warning') {
                feedback.textContent = 'Almost! Check accents.';
                feedback.className = 'text-yellow-600 font-semibold ml-2';
            } else if (input.value.trim() !== '') {
                feedback.textContent = 'Try again!';
                feedback.className = 'text-red-600 font-semibold ml-2';
            }
        }

        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkAnswer(); });
        input.addEventListener('blur', checkAnswer);

        wrapper.appendChild(label);
        wrapper.appendChild(input);
        wrapper.appendChild(feedback);
        stage2Exercise.appendChild(wrapper);
    });

    // ============================================
    // STAGE 3: Third Person (his/her) - 8 items
    // ============================================

    const stage3Questions = [
        { noun: 'haz', english: 'house', answer: 'haza', meaning: 'his/her house' },
        { noun: 'konyv', english: 'book', answer: 'konyve', meaning: 'his/her book' },
        { noun: 'kert', english: 'garden', answer: 'kertje', meaning: 'his/her garden' },
        { noun: 'auto', english: 'car', answer: 'autoja', meaning: 'his/her car' },
        { noun: 'anya', english: 'mother', answer: 'anyja', meaning: 'his/her mother' },
        { noun: 'apa', english: 'father', answer: 'apja', meaning: 'his/her father' },
        { noun: 'nev', english: 'name', answer: 'neve', meaning: 'his/her name' },
        { noun: 'barat', english: 'friend', answer: 'baratja', meaning: 'his/her friend' }
    ];

    const stage3Section = document.createElement('section');
    stage3Section.className = 'mb-8';
    stage3Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 3: Third Person - "His/Her" (-a/-e/-ja/-je)</h2>
        <p class="text-slate-600 mb-4">Add the correct possessive suffix to make "his/her [noun]".</p>
        <div id="stage3-exercise" class="space-y-3"></div>
        <div id="stage3-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${stage3Questions.length}</div>
    `;
    mainContent.appendChild(stage3Section);

    const stage3Exercise = document.getElementById('stage3-exercise');
    const stage3Answers = new Array(stage3Questions.length).fill(false);

    stage3Questions.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col md:flex-row items-start md:items-center gap-2 p-3 bg-rose-50 rounded-lg';

        const label = document.createElement('span');
        label.className = 'min-w-[200px] text-slate-800';
        label.innerHTML = `<strong>${q.noun}</strong> (${q.english}) &rarr; his/her ${q.english}:`;

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-3 py-1 w-36 focus:ring-2 focus:ring-rose-500 focus:border-rose-500';
        input.setAttribute('aria-label', `His/her ${q.english} in Hungarian`);

        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold ml-2';

        function checkAnswer() {
            const result = checkAccentAware(input.value, q.answer);
            if (result === 'correct') {
                feedback.textContent = `Correct! (${q.meaning})`;
                feedback.className = 'text-green-600 font-semibold ml-2';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-3 py-1 w-36';
                if (!stage3Answers[idx]) {
                    stage3Answers[idx] = true;
                    scores.stage3.correct++;
                    document.getElementById('stage3-score').textContent = `Score: ${scores.stage3.correct} / ${stage3Questions.length}`;
                    updateTotalScore();
                }
            } else if (result === 'accent-warning') {
                feedback.textContent = 'Almost! Check accents.';
                feedback.className = 'text-yellow-600 font-semibold ml-2';
            } else if (input.value.trim() !== '') {
                feedback.textContent = 'Try again!';
                feedback.className = 'text-red-600 font-semibold ml-2';
            }
        }

        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkAnswer(); });
        input.addEventListener('blur', checkAnswer);

        wrapper.appendChild(label);
        wrapper.appendChild(input);
        wrapper.appendChild(feedback);
        stage3Exercise.appendChild(wrapper);
    });

    // ============================================
    // STAGE 4: Mixed Practice - 10 items
    // ============================================

    const stage4Questions = [
        { english: 'my house', answer: 'hazam' },
        { english: 'your book', answer: 'konyved' },
        { english: 'his car', answer: 'autoja' },
        { english: 'our garden', answer: 'kertunk' },
        { english: 'their dog', answer: 'kutyajuk', alternates: ['kutyajuk'] },
        { english: 'my mother', answer: 'anyam' },
        { english: 'your father', answer: 'apad' },
        { english: 'her name', answer: 'neve' },
        { english: 'my friend', answer: 'baratom' },
        { english: 'your (pl.) house', answer: 'hazatok' }
    ];

    const stage4Section = document.createElement('section');
    stage4Section.className = 'mb-8';
    stage4Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 4: Mixed Translation Practice</h2>
        <p class="text-slate-600 mb-4">Translate these possessive phrases to Hungarian.</p>
        <div id="stage4-exercise" class="space-y-3"></div>
        <div id="stage4-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${stage4Questions.length}</div>
    `;
    mainContent.appendChild(stage4Section);

    const stage4Exercise = document.getElementById('stage4-exercise');
    const stage4Answers = new Array(stage4Questions.length).fill(false);

    stage4Questions.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col md:flex-row items-start md:items-center gap-2 p-3 bg-slate-50 rounded-lg';

        const label = document.createElement('span');
        label.className = 'min-w-[150px] text-slate-800 font-medium';
        label.textContent = q.english;

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-3 py-1 w-40 focus:ring-2 focus:ring-purple-500 focus:border-purple-500';
        input.setAttribute('aria-label', `Hungarian for: ${q.english}`);

        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold ml-2';

        function checkAnswer() {
            const allAnswers = [q.answer, ...(q.alternates || [])];
            const result = checkMultipleAnswers(input.value, allAnswers);
            if (result === 'correct') {
                feedback.textContent = 'Helyes! (Correct!)';
                feedback.className = 'text-green-600 font-semibold ml-2';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-3 py-1 w-40';
                if (!stage4Answers[idx]) {
                    stage4Answers[idx] = true;
                    scores.stage4.correct++;
                    document.getElementById('stage4-score').textContent = `Score: ${scores.stage4.correct} / ${stage4Questions.length}`;
                    updateTotalScore();
                }
            } else if (result === 'accent-warning') {
                feedback.textContent = 'Almost! Check accents.';
                feedback.className = 'text-yellow-600 font-semibold ml-2';
            } else if (input.value.trim() !== '') {
                feedback.textContent = 'Try again!';
                feedback.className = 'text-red-600 font-semibold ml-2';
            }
        }

        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkAnswer(); });
        input.addEventListener('blur', checkAnswer);

        wrapper.appendChild(label);
        wrapper.appendChild(input);
        wrapper.appendChild(feedback);
        stage4Exercise.appendChild(wrapper);
    });

    // ============================================
    // STAGE 5: Sentence Completion - 8 items
    // ============================================

    const stage5Questions = [
        { sentence: 'A ___ nagy.', blank: 'hazam', english: 'My house is big.' },
        { sentence: 'Hol van a ___?', blank: 'konyved', english: 'Where is your book?' },
        { sentence: 'Az ___ szep.', blank: 'autoja', english: 'His/Her car is beautiful.' },
        { sentence: 'Ez a mi ___.', blank: 'kertunk', english: 'This is our garden.' },
        { sentence: 'A ___ Peter.', blank: 'nevem', english: 'My name is Peter.' },
        { sentence: 'Szeretem az ___.', blank: 'anyamat', alternates: ['anyam'], english: 'I love my mother.' },
        { sentence: 'Latod a ___?', blank: 'kutyamat', alternates: ['kutyam'], english: 'Do you see my dog?' },
        { sentence: 'O a legjobb ___.', blank: 'baratom', english: 'He is my best friend.' }
    ];

    const stage5Section = document.createElement('section');
    stage5Section.className = 'mb-8';
    stage5Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 5: Complete the Sentences</h2>
        <p class="text-slate-600 mb-4">Fill in the blank with the correct possessive form.</p>
        <div id="stage5-exercise" class="space-y-4"></div>
        <div id="stage5-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${stage5Questions.length}</div>
    `;
    mainContent.appendChild(stage5Section);

    const stage5Exercise = document.getElementById('stage5-exercise');
    const stage5Answers = new Array(stage5Questions.length).fill(false);

    stage5Questions.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col gap-2 p-3 bg-slate-50 rounded-lg';

        const row = document.createElement('div');
        row.className = 'flex flex-col md:flex-row items-start md:items-center gap-2';

        const parts = q.sentence.split('___');
        const sentenceSpan = document.createElement('span');
        sentenceSpan.className = 'text-slate-800';

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-2 py-1 w-32 mx-1 focus:ring-2 focus:ring-purple-500 focus:border-purple-500 inline';
        input.setAttribute('aria-label', `Fill in blank for: ${q.sentence}`);

        sentenceSpan.appendChild(document.createTextNode(parts[0]));
        sentenceSpan.appendChild(input);
        if (parts[1]) {
            sentenceSpan.appendChild(document.createTextNode(parts[1]));
        }

        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold ml-2';

        const translation = document.createElement('div');
        translation.className = 'text-xs text-slate-500 italic';
        translation.textContent = `English: ${q.english}`;

        function checkAnswer() {
            const allAnswers = [q.blank, ...(q.alternates || [])];
            const result = checkMultipleAnswers(input.value, allAnswers);

            if (result === 'correct') {
                feedback.textContent = 'Correct!';
                feedback.className = 'text-green-600 font-semibold ml-2';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-2 py-1 w-32 mx-1 inline';
                if (!stage5Answers[idx]) {
                    stage5Answers[idx] = true;
                    scores.stage5.correct++;
                    document.getElementById('stage5-score').textContent = `Score: ${scores.stage5.correct} / ${stage5Questions.length}`;
                    updateTotalScore();
                }
            } else if (result === 'accent-warning') {
                feedback.textContent = 'Check accents!';
                feedback.className = 'text-yellow-600 font-semibold ml-2';
            } else if (input.value.trim() !== '') {
                feedback.textContent = 'Try again!';
                feedback.className = 'text-red-600 font-semibold ml-2';
            }
        }

        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkAnswer(); });
        input.addEventListener('blur', checkAnswer);

        row.appendChild(sentenceSpan);
        row.appendChild(feedback);
        wrapper.appendChild(row);
        wrapper.appendChild(translation);
        stage5Exercise.appendChild(wrapper);
    });

    // ============================================
    // SUMMARY SECTION
    // ============================================

    const summarySection = document.createElement('section');
    summarySection.className = 'mt-8 p-6 bg-gradient-to-r from-purple-50 to-slate-50 rounded-xl border border-purple-200';
    summarySection.innerHTML = `
        <h2 class="text-xl font-bold text-purple-800 mb-4">Lesson Summary</h2>
        <div class="grid md:grid-cols-2 gap-4 text-sm">
            <div>
                <h3 class="font-semibold text-slate-700 mb-2">Possessive Suffix Quick Reference:</h3>
                <table class="text-sm w-full">
                    <tr><td class="font-semibold p-1">my</td><td class="p-1">-m, -am/-em/-om</td></tr>
                    <tr><td class="font-semibold p-1">your</td><td class="p-1">-d, -ad/-ed/-od</td></tr>
                    <tr><td class="font-semibold p-1">his/her</td><td class="p-1">-a/-e, -ja/-je</td></tr>
                    <tr><td class="font-semibold p-1">our</td><td class="p-1">-nk, -unk/-unk</td></tr>
                    <tr><td class="font-semibold p-1">your (pl.)</td><td class="p-1">-tok/-tek/-tok</td></tr>
                    <tr><td class="font-semibold p-1">their</td><td class="p-1">-uk/-uk, -juk/-juk</td></tr>
                </table>
            </div>
            <div>
                <h3 class="font-semibold text-slate-700 mb-2">Key Points:</h3>
                <ul class="list-disc pl-5 text-slate-600 space-y-1">
                    <li>Suffixes follow vowel harmony</li>
                    <li>Third person often adds linking "j"</li>
                    <li>Family terms may be irregular</li>
                    <li>Personal pronouns usually omitted</li>
                    <li>Accusative adds -t after possessive</li>
                </ul>
            </div>
        </div>
        <div class="mt-4 p-3 bg-amber-50 rounded-lg border border-amber-200">
            <p class="text-amber-800 text-sm"><strong>Practice tip:</strong> Start with first and second person singular (my, your) as they are the most common and have the simplest patterns!</p>
        </div>
    `;
    mainContent.appendChild(summarySection);

    // Initialize total score
    updateTotalScore();
    </script>
