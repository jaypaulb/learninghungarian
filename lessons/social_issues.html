<!DOCTYPE html>

        }
    </style>
</head>
<body class="bg-slate-100 p-4 md:p-8">
    <header class="text-center mb-8">
        <div class="mb-4">
            <a href="../index.html" class="inline-flex items-center px-4 py-2 bg-slate-600 text-white text-sm font-medium rounded-lg hover:bg-slate-700 transition-colors">
                <svg class="mr-2 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>

            </a>
        </div>
        <h1 class="text-3xl md:text-4xl font-bold text-slate-700">Lesson 47: Social Issues & Opinions <span class="block text-xl text-slate-500 font-normal">(Tarsadalmi Kerdesek es Velemenyek)</span></h1>
        <p class="text-slate-600 mt-2 max-w-2xl mx-auto">Learn to express opinions, discuss social topics, and engage in polite debate in Hungarian. Master phrases for agreeing, disagreeing, and presenting arguments.</p>
    </header>

    <main class="max-w-4xl mx-auto bg-white rounded-xl shadow-md p-6" id="main-content">
        <!-- Content will be generated by JavaScript -->
    </main>

    <footer class="text-center mt-12 py-4 border-t border-slate-300">
        <p class="text-sm text-slate-500">&copy; 2024 Hungarian Language Lessons</p>
    </footer>

    <script>
    // ============================================
    // UTILITY FUNCTIONS
    // ============================================

    function removeAccents(str) {
        return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[oOuU\u0151\u0150\u0171\u0170]/g, function(m) {
            const map = { '\u0151':'o','\u0150':'O','\u0171':'u','\u0170':'U' };
            return map[m] || m;
        });
    }

    function normalizeAnswer(str) {
        return str.trim().toLowerCase();
    }

    function checkAccentAware(userInput, correctAnswer) {
        const normalizedInput = normalizeAnswer(userInput);
        const normalizedCorrect = normalizeAnswer(correctAnswer);

        if (normalizedInput === normalizedCorrect) {
            return 'correct';
        } else if (removeAccents(normalizedInput) === removeAccents(normalizedCorrect)) {
            return 'accent-warning';
        } else {
            return 'incorrect';
        }
    }

    // ============================================
    // VOCABULARY DATA
    // ============================================

    const opinionPhrases = [
        { hungarian: 'Szerintem', english: 'In my opinion / I think' },
        { hungarian: 'Ugy gondolom', english: 'I think / I believe' },
        { hungarian: 'Velemenyem szerint', english: 'According to my opinion' },
        { hungarian: 'Ugy velem', english: 'I suppose / I think' },
        { hungarian: 'Azt hiszem', english: 'I believe / I think' },
        { hungarian: 'Biztos vagyok benne', english: 'I am sure about it' },
        { hungarian: 'Nem vagyok biztos', english: 'I am not sure' },
        { hungarian: 'Ketsegtelen', english: 'Without a doubt' }
    ];

    const discussionVocabulary = [
        { hungarian: 'velemeny', english: 'opinion' },
        { hungarian: 'erv', english: 'argument' },
        { hungarian: 'vita', english: 'debate/discussion' },
        { hungarian: 'kerdes', english: 'question/issue' },
        { hungarian: 'problema', english: 'problem' },
        { hungarian: 'megoldas', english: 'solution' },
        { hungarian: 'alláspont', english: 'point of view' },
        { hungarian: 'ok', english: 'reason' },
        { hungarian: 'kovetkezmeny', english: 'consequence' },
        { hungarian: 'pelda', english: 'example' }
    ];

    const agreeingPhrases = [
        { hungarian: 'Egyetértek.', english: 'I agree.' },
        { hungarian: 'Teljesen igazad van.', english: 'You are completely right.' },
        { hungarian: 'Pont ezt gondolom en is.', english: 'That is exactly what I think too.' },
        { hungarian: 'Abszolut!', english: 'Absolutely!' },
        { hungarian: 'Ez igaz.', english: 'That is true.' },
        { hungarian: 'Oszinten szolva, igen.', english: 'Honestly, yes.' }
    ];

    const disagreeingPhrases = [
        { hungarian: 'Nem ertek egyet.', english: 'I disagree.' },
        { hungarian: 'Nem igy latom.', english: 'I do not see it that way.' },
        { hungarian: 'Mas a velemenyem.', english: 'I have a different opinion.' },
        { hungarian: 'Ez nem egeszen igaz.', english: 'That is not entirely true.' },
        { hungarian: 'Nem vagyok meggyozodve.', english: 'I am not convinced.' },
        { hungarian: 'De...', english: 'But...' }
    ];

    const socialTopics = [
        { hungarian: 'kornyezetvedelem', english: 'environmental protection' },
        { hungarian: 'munkanelküliseg', english: 'unemployment' },
        { hungarian: 'oktatas', english: 'education' },
        { hungarian: 'egeszsegugy', english: 'healthcare' },
        { hungarian: 'bevándorlas', english: 'immigration' },
        { hungarian: 'szegenyseg', english: 'poverty' },
        { hungarian: 'egyenloseg', english: 'equality' },
        { hungarian: 'technologia', english: 'technology' }
    ];

    // ============================================
    // EXERCISE DATA
    // ============================================

    const vocabularyCards = [
        ...opinionPhrases.slice(0, 6),
        ...discussionVocabulary.slice(0, 6),
        ...agreeingPhrases.slice(0, 4)
    ];

    const phraseMatching = [
        { description: 'How to say "I agree" politely', answer: 'Egyetértek', options: ['Egyetértek', 'Nem ertek egyet', 'Szerintem', 'De'] },
        { description: 'Start a sentence with "In my opinion..."', answer: 'Szerintem', options: ['Szerintem', 'Egyetértek', 'Nem', 'De'] },
        { description: 'How to politely disagree', answer: 'Nem ertek egyet', options: ['Nem ertek egyet', 'Egyetértek', 'Igen', 'Abszolut'] },
        { description: 'Express "I think/believe"', answer: 'Ugy gondolom', options: ['Ugy gondolom', 'Nem tudom', 'Szerintem nem', 'De igen'] },
        { description: 'Say "You are right"', answer: 'Igazad van', options: ['Igazad van', 'Nem igazad van', 'Szerintem', 'Nem ertek egyet'] },
        { description: 'Express uncertainty', answer: 'Nem vagyok biztos', options: ['Nem vagyok biztos', 'Biztos vagyok', 'Egyetértek', 'Abszolut'] },
        { description: 'A polite way to say "but..."', answer: 'De', options: ['De', 'Es', 'Nem', 'Igen'] },
        { description: 'Express strong agreement', answer: 'Abszolut', options: ['Abszolut', 'Nem', 'Talan', 'De'] }
    ];

    const opinionSentences = [
        { sentence: '___, a kornyezetvedelem nagyon fontos.', blank: 'Szerintem', english: 'In my opinion, environmental protection is very important.' },
        { sentence: '___ egyet veled, jo ötlet!', blank: 'Egyetértek', english: 'I agree with you, good idea!' },
        { sentence: '___, ez nem a legjobb megoldas.', blank: 'Ugy gondolom', english: 'I think this is not the best solution.' },
        { sentence: 'Nem ___ egyet ezzel az allásponttal.', blank: 'ertek', english: 'I do not agree with this point of view.' },
        { sentence: 'Teljesen ___ van!', blank: 'igazad', english: 'You are completely right!' },
        { sentence: 'Ez egy jo ___, de...', blank: 'erv', english: 'This is a good argument, but...' },
        { sentence: 'Mi a te ___ errol?', blank: 'velemmenyed', english: 'What is your opinion about this?' },
        { sentence: 'A ___ az, hogy tobbett kell tanulni.', blank: 'megoldas', english: 'The solution is that we need to study more.' }
    ];

    const expressOpinions = [
        { prompt: 'How would you say "I think education is important" in Hungarian?', answer: 'Szerintem az oktatas fontos', alternates: ['Ugy gondolom hogy az oktatas fontos', 'Az oktatas fontos szerintem'] },
        { prompt: 'Express that you disagree politely.', answer: 'Nem ertek egyet', alternates: ['Mas a velemenyem', 'Nem igy latom'] },
        { prompt: 'Say "In my opinion, this is a big problem"', answer: 'Szerintem ez nagy problema', alternates: ['Velemenyem szerint ez nagy problema'] },
        { prompt: 'Express strong agreement with someone.', answer: 'Teljesen igazad van', alternates: ['Abszolut', 'Egyetértek'] },
        { prompt: 'Ask someone for their opinion.', answer: 'Mi a velemenyned', alternates: ['Mit gondolsz', 'Te mit gondolsz'] },
        { prompt: 'Say "I believe we need a solution"', answer: 'Ugy gondolom megoldas kell', alternates: ['Szerintem megoldas kell'] }
    ];

    const debateDialogues = [
        {
            speaker: 'A',
            line: 'Szerintem tobb penzt kellene az oktatasra kolteni.',
            response: '___. Ez nagyon fontos.',
            responseEnglish: 'I agree. This is very important.',
            blank: 'Egyetértek'
        },
        {
            speaker: 'A',
            line: 'A technologia rosszabb életet hoz.',
            response: '___. Sok jo oldala is van.',
            responseEnglish: 'I disagree. It has many good sides too.',
            blank: 'Nem ertek egyet'
        },
        {
            speaker: 'A',
            line: 'Mit gondolsz a klimavaltozasrol?',
            response: '___ ez a legnagyobb problema ma.',
            responseEnglish: 'I think this is the biggest problem today.',
            blank: 'Szerintem'
        },
        {
            speaker: 'A',
            line: 'Az egeszsegugy jo Magyarorszagon?',
            response: '___, de van mit javitani.',
            responseEnglish: 'I am not sure, but there is room for improvement.',
            blank: 'Nem vagyok biztos'
        },
        {
            speaker: 'A',
            line: 'A szegenyseg csokkent az utóbbi evekben.',
            response: '___? Van erre bizonyitekod?',
            responseEnglish: 'Is that true? Do you have proof for this?',
            blank: 'Tenyleg'
        },
        {
            speaker: 'A',
            line: 'Minden problemara van megoldas.',
            response: '___, de neha nagyon nehez megtalalni.',
            responseEnglish: 'That is true, but sometimes it is very difficult to find.',
            blank: 'Ez igaz'
        }
    ];

    // ============================================
    // SCORE TRACKING
    // ============================================

    let scores = {
        stage1: { correct: 0, total: vocabularyCards.length },
        stage2: { correct: 0, total: phraseMatching.length },
        stage3: { correct: 0, total: opinionSentences.length },
        stage4: { correct: 0, total: expressOpinions.length },
        stage5: { correct: 0, total: debateDialogues.length }
    };

    let stage1Revealed = new Set();

    function updateTotalScore() {
        const totalCorrect = Object.values(scores).reduce((sum, s) => sum + s.correct, 0);
        const totalQuestions = Object.values(scores).reduce((sum, s) => sum + s.total, 0);
        const totalScoreEl = document.getElementById('total-score');
        if (totalScoreEl) {
            totalScoreEl.textContent = `Total Score: ${totalCorrect} / ${totalQuestions}`;
        }
    }

    // ============================================
    // BUILD PAGE CONTENT
    // ============================================

    const mainContent = document.getElementById('main-content');

    // Learning Objectives
    const objectivesSection = document.createElement('section');
    objectivesSection.className = 'mb-8';
    objectivesSection.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Learning Objectives</h2>
        <ul class="list-disc pl-6 space-y-2 text-slate-600">
            <li>Express opinions using "Szerintem", "Ugy gondolom" and similar phrases</li>
            <li>Learn vocabulary for discussions and debates</li>
            <li>Agree and disagree politely in Hungarian</li>
            <li>Discuss social topics and present arguments</li>
        </ul>
    `;
    mainContent.appendChild(objectivesSection);

    // Cultural Note
    const culturalNote = document.createElement('div');
    culturalNote.className = 'cultural-note mb-8';
    culturalNote.innerHTML = `
        <h3 class="font-bold text-amber-800 mb-2">Cultural Note: Discussions in Hungarian Society</h3>
        <p class="text-amber-900">Hungarians often enjoy intellectual discussions and debates.
        While expressing opinions directly is common, it is considered polite to use softening phrases like
        <strong>"Szerintem"</strong> (in my opinion) or <strong>"Talán"</strong> (maybe) when disagreeing.
        Topics like politics can be sensitive, so it is wise to gauge the situation before diving into controversial subjects.
        The phrase <strong>"Tisztelettel"</strong> (with respect) can help maintain a cordial tone in debates.</p>
    `;
    mainContent.appendChild(culturalNote);

    // Section 1: Expressing Opinions
    const section1 = document.createElement('section');
    section1.className = 'mb-8';
    section1.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 1: Expressing Opinions (Velemeny Kifejezese)</h2>
        <table class="mb-4">
            <thead>
                <tr><th class="text-left">Hungarian</th><th class="text-left">English</th></tr>
            </thead>
            <tbody>
                ${opinionPhrases.map(item => `<tr><td class="font-medium opinion-highlight">${item.hungarian}</td><td>${item.english}</td></tr>`).join('')}
            </tbody>
        </table>
        <div class="bg-purple-50 border-l-4 border-purple-500 p-4">
            <h4 class="font-semibold text-purple-800 mb-2">Usage Examples</h4>
            <p class="text-purple-700 text-sm">
                <strong>Szerintem jo ötlet.</strong> - I think it is a good idea.<br>
                <strong>Ugy gondolom, hogy igazad van.</strong> - I think you are right.<br>
                <strong>Azt hiszem, kesobb jon.</strong> - I believe he/she will come later.
            </p>
        </div>
    `;
    mainContent.appendChild(section1);

    // Section 2: Discussion Vocabulary
    const section2 = document.createElement('section');
    section2.className = 'mb-8';
    section2.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 2: Discussion Vocabulary (Vitaszavak)</h2>
        <table class="mb-4">
            <thead>
                <tr><th class="text-left">Hungarian</th><th class="text-left">English</th></tr>
            </thead>
            <tbody>
                ${discussionVocabulary.map(item => `<tr><td class="font-medium opinion-highlight">${item.hungarian}</td><td>${item.english}</td></tr>`).join('')}
            </tbody>
        </table>
    `;
    mainContent.appendChild(section2);

    // Section 3: Agreeing and Disagreeing
    const section3 = document.createElement('section');
    section3.className = 'mb-8';
    section3.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 3: Agreeing & Disagreeing</h2>
        <div class="grid md:grid-cols-2 gap-4">
            <div class="agree-box p-4 rounded-lg">
                <h3 class="font-bold text-green-800 mb-3">Agreeing (Egyetertes)</h3>
                ${agreeingPhrases.map(item => `
                    <div class="mb-2">
                        <span class="font-medium text-green-700">${item.hungarian}</span>
                        <span class="text-slate-600 text-sm"> - ${item.english}</span>
                    </div>
                `).join('')}
            </div>
            <div class="disagree-box p-4 rounded-lg">
                <h3 class="font-bold text-red-800 mb-3">Disagreeing (Egyetenem Ertes)</h3>
                ${disagreeingPhrases.map(item => `
                    <div class="mb-2">
                        <span class="font-medium text-red-700">${item.hungarian}</span>
                        <span class="text-slate-600 text-sm"> - ${item.english}</span>
                    </div>
                `).join('')}
            </div>
        </div>
    `;
    mainContent.appendChild(section3);

    // Section 4: Social Topics
    const section4 = document.createElement('section');
    section4.className = 'mb-8';
    section4.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 4: Social Topics (Tarsadalmi Temak)</h2>
        <div class="grid md:grid-cols-2 gap-3">
            ${socialTopics.map(item => `
                <div class="flex items-center gap-3 p-3 bg-slate-50 rounded-lg border border-slate-200">
                    <span class="font-medium opinion-highlight">${item.hungarian}</span>
                    <span class="text-slate-600">- ${item.english}</span>
                </div>
            `).join('')}
        </div>
        <div class="mt-4 neutral-box p-4 rounded-lg">
            <h4 class="font-semibold text-indigo-800 mb-2">Useful Discussion Starters</h4>
            <p class="text-indigo-700 text-sm">
                <strong>Mit gondolsz a(z) ... -rol/-rol?</strong> - What do you think about ...?<br>
                <strong>Mi a velemenyned a(z) ... -rol/-rol?</strong> - What is your opinion about ...?<br>
                <strong>Egyetertesz azzal, hogy ...?</strong> - Do you agree that ...?
            </p>
        </div>
    `;
    mainContent.appendChild(section4);

    // Total Score Display
    const totalScoreSection = document.createElement('div');
    totalScoreSection.className = 'bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-xl p-4 mb-8 text-center';
    totalScoreSection.innerHTML = `
        <h3 class="text-lg font-semibold mb-1">Interactive Exercises</h3>
        <p id="total-score" class="text-2xl font-bold">Total Score: 0 / 46</p>
    `;
    mainContent.appendChild(totalScoreSection);

    // ============================================
    // STAGE 1: VOCABULARY CARDS (16 items)
    // ============================================

    const stage1Section = document.createElement('section');
    stage1Section.className = 'mb-8';
    stage1Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 1: Opinion Vocabulary Cards</h2>
        <p class="text-slate-600 mb-4">Click each card to flip and reveal the English translation. Test yourself first!</p>
        <div id="vocab-cards" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4"></div>
        <div id="stage1-score" class="text-slate-700 font-medium">Cards Revealed: 0 / ${vocabularyCards.length}</div>
    `;
    mainContent.appendChild(stage1Section);

    const vocabCardsContainer = document.getElementById('vocab-cards');
    vocabularyCards.forEach((card, idx) => {
        const cardDiv = document.createElement('div');
        cardDiv.className = 'flip-card h-24';
        cardDiv.setAttribute('data-idx', idx);
        cardDiv.innerHTML = `
            <div class="flip-card-inner">
                <div class="flip-card-front">
                    <span class="text-lg font-bold text-center">${card.hungarian}</span>
                </div>
                <div class="flip-card-back">
                    <span class="text-lg font-semibold text-center">${card.english}</span>
                </div>
            </div>
        `;
        cardDiv.addEventListener('click', function() {
            this.classList.toggle('flipped');
            if (!stage1Revealed.has(idx)) {
                stage1Revealed.add(idx);
                scores.stage1.correct = stage1Revealed.size;
                document.getElementById('stage1-score').textContent = `Cards Revealed: ${stage1Revealed.size} / ${vocabularyCards.length}`;
                updateTotalScore();
            }
        });
        vocabCardsContainer.appendChild(cardDiv);
    });

    // ============================================
    // STAGE 2: PHRASE MATCHING (8 items)
    // ============================================

    const stage2Section = document.createElement('section');
    stage2Section.className = 'mb-8';
    stage2Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 2: Phrase Matching</h2>
        <p class="text-slate-600 mb-4">Match the description to the correct Hungarian phrase.</p>
        <div id="phrase-exercise" class="space-y-4"></div>
        <div id="stage2-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${phraseMatching.length}</div>
    `;
    mainContent.appendChild(stage2Section);

    const phraseExercise = document.getElementById('phrase-exercise');
    phraseMatching.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col md:flex-row items-start md:items-center gap-2 p-3 bg-slate-50 rounded-lg';

        const label = document.createElement('span');
        label.className = 'min-w-[280px] text-slate-800 font-medium';
        label.textContent = q.description;

        const select = document.createElement('select');
        select.className = 'border border-slate-300 rounded-md px-3 py-2 w-48 focus:ring-2 focus:ring-purple-500 focus:border-purple-500';
        select.innerHTML = '<option value="">Select answer...</option>';

        const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);
        shuffledOptions.forEach(opt => {
            const option = document.createElement('option');
            option.value = opt;
            option.textContent = opt;
            select.appendChild(option);
        });

        const feedback = document.createElement('span');
        feedback.className = 'ml-2 text-sm font-semibold';

        select.addEventListener('change', function() {
            if (this.value === q.answer) {
                feedback.textContent = 'Correct!';
                feedback.className = 'ml-2 text-green-600 font-semibold';
                this.disabled = true;
                this.className = 'border border-green-500 bg-green-50 rounded-md px-3 py-2 w-48';
                scores.stage2.correct++;
                document.getElementById('stage2-score').textContent = `Score: ${scores.stage2.correct} / ${phraseMatching.length}`;
                updateTotalScore();
            } else if (this.value !== '') {
                feedback.textContent = 'Try again!';
                feedback.className = 'ml-2 text-red-600 font-semibold';
            }
        });

        wrapper.appendChild(label);
        wrapper.appendChild(select);
        wrapper.appendChild(feedback);
        phraseExercise.appendChild(wrapper);
    });

    // ============================================
    // STAGE 3: OPINION SENTENCES (8 items)
    // ============================================

    const stage3Section = document.createElement('section');
    stage3Section.className = 'mb-8';
    stage3Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 3: Complete the Opinion</h2>
        <p class="text-slate-600 mb-4">Fill in the missing word to complete these opinion sentences.</p>
        <div id="opinion-exercise" class="space-y-4"></div>
        <div id="stage3-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${opinionSentences.length}</div>
    `;
    mainContent.appendChild(stage3Section);

    const opinionExercise = document.getElementById('opinion-exercise');
    const stage3Answers = new Array(opinionSentences.length).fill(false);

    opinionSentences.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col gap-2 p-3 bg-purple-50 rounded-lg';

        const row = document.createElement('div');
        row.className = 'flex flex-col md:flex-row items-start md:items-center gap-2';

        const sentenceParts = q.sentence.split('___');
        const sentenceSpan = document.createElement('span');
        sentenceSpan.className = 'text-slate-800';

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-2 py-1 w-36 mx-1 focus:ring-2 focus:ring-purple-500 focus:border-purple-500 inline';
        input.setAttribute('aria-label', `Fill in blank for: ${q.sentence}`);

        sentenceSpan.appendChild(document.createTextNode(sentenceParts[0]));
        sentenceSpan.appendChild(input);
        if (sentenceParts[1]) {
            sentenceSpan.appendChild(document.createTextNode(sentenceParts[1]));
        }

        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold ml-2';

        const translation = document.createElement('div');
        translation.className = 'text-xs text-slate-500 italic';
        translation.textContent = `English: ${q.english}`;

        function checkAnswer() {
            const result = checkAccentAware(input.value, q.blank);

            if (result === 'correct') {
                feedback.textContent = 'Correct!';
                feedback.className = 'text-green-600 font-semibold ml-2';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-2 py-1 w-36 mx-1 inline';
                if (!stage3Answers[idx]) {
                    stage3Answers[idx] = true;
                    scores.stage3.correct++;
                    document.getElementById('stage3-score').textContent = `Score: ${scores.stage3.correct} / ${opinionSentences.length}`;
                    updateTotalScore();
                }
            } else if (result === 'accent-warning') {
                feedback.textContent = 'Almost! Check accents.';
                feedback.className = 'text-yellow-600 font-semibold ml-2';
            } else if (input.value.trim() !== '') {
                feedback.textContent = 'Try again!';
                feedback.className = 'text-red-600 font-semibold ml-2';
            }
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkAnswer();
        });
        input.addEventListener('blur', checkAnswer);

        row.appendChild(sentenceSpan);
        row.appendChild(feedback);
        wrapper.appendChild(row);
        wrapper.appendChild(translation);
        opinionExercise.appendChild(wrapper);
    });

    // ============================================
    // STAGE 4: EXPRESS OPINIONS (6 items)
    // ============================================

    const stage4Section = document.createElement('section');
    stage4Section.className = 'mb-8';
    stage4Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 4: Express Your Opinion</h2>
        <p class="text-slate-600 mb-4">Translate these opinion expressions into Hungarian.</p>
        <div id="express-exercise" class="space-y-4"></div>
        <div id="stage4-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${expressOpinions.length}</div>
    `;
    mainContent.appendChild(stage4Section);

    const expressExercise = document.getElementById('express-exercise');
    const stage4Answers = new Array(expressOpinions.length).fill(false);

    expressOpinions.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'p-4 bg-indigo-50 rounded-lg';

        const promptDiv = document.createElement('div');
        promptDiv.className = 'mb-2';
        promptDiv.innerHTML = `<strong class="text-slate-800">${q.prompt}</strong>`;

        const inputDiv = document.createElement('div');
        inputDiv.className = 'flex flex-col md:flex-row items-start md:items-center gap-2';

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-3 py-2 w-full md:w-80 focus:ring-2 focus:ring-indigo-500';
        input.setAttribute('aria-label', `Answer for: ${q.prompt}`);

        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold';

        function checkAnswer() {
            const userAnswer = normalizeAnswer(input.value);
            const correctAnswer = normalizeAnswer(q.answer);
            const alternates = q.alternates ? q.alternates.map(a => normalizeAnswer(a)) : [];
            const allCorrect = [correctAnswer, ...alternates];

            const exactMatch = allCorrect.some(a => a === userAnswer);
            const accentMatch = allCorrect.some(a => removeAccents(a) === removeAccents(userAnswer));

            if (exactMatch) {
                feedback.textContent = 'Correct!';
                feedback.className = 'text-green-600 font-semibold';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-3 py-2 w-full md:w-80';
                if (!stage4Answers[idx]) {
                    stage4Answers[idx] = true;
                    scores.stage4.correct++;
                    document.getElementById('stage4-score').textContent = `Score: ${scores.stage4.correct} / ${expressOpinions.length}`;
                    updateTotalScore();
                }
            } else if (accentMatch) {
                feedback.textContent = 'Close! Check your accents.';
                feedback.className = 'text-yellow-600 font-semibold';
            } else if (input.value.trim() !== '') {
                feedback.textContent = `Try again! One answer: ${q.answer}`;
                feedback.className = 'text-red-600 font-semibold';
            }
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkAnswer();
        });
        input.addEventListener('blur', checkAnswer);

        inputDiv.appendChild(input);
        inputDiv.appendChild(feedback);
        wrapper.appendChild(promptDiv);
        wrapper.appendChild(inputDiv);
        expressExercise.appendChild(wrapper);
    });

    // ============================================
    // STAGE 5: DEBATE DIALOGUES (6 items)
    // ============================================

    const stage5Section = document.createElement('section');
    stage5Section.className = 'mb-8';
    stage5Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 5: Debate Dialogues</h2>
        <p class="text-slate-600 mb-4">Complete these debate conversations by filling in the missing word.</p>
        <div id="dialogue-exercise" class="space-y-6"></div>
        <div id="stage5-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${debateDialogues.length}</div>
    `;
    mainContent.appendChild(stage5Section);

    const dialogueExercise = document.getElementById('dialogue-exercise');
    const stage5Answers = new Array(debateDialogues.length).fill(false);

    debateDialogues.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'bg-gradient-to-r from-slate-50 to-purple-50 rounded-lg p-4 border border-slate-200';

        const questionLine = document.createElement('div');
        questionLine.className = 'mb-3';
        questionLine.innerHTML = `
            <span class="inline-block bg-purple-600 text-white text-xs font-bold px-2 py-1 rounded mr-2">A</span>
            <span class="text-slate-800 font-medium">${q.line}</span>
        `;

        const responseLine = document.createElement('div');
        responseLine.className = 'flex flex-wrap items-center gap-2';

        const speakerB = document.createElement('span');
        speakerB.className = 'inline-block bg-slate-600 text-white text-xs font-bold px-2 py-1 rounded';
        speakerB.textContent = 'B';

        const responseText = q.response.split('___');
        const responseSpan = document.createElement('span');
        responseSpan.className = 'text-slate-800';

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-2 py-1 w-40 focus:ring-2 focus:ring-purple-500 focus:border-purple-500';
        input.setAttribute('aria-label', `Response for dialogue ${idx + 1}`);

        responseSpan.appendChild(document.createTextNode(responseText[0]));
        responseSpan.appendChild(input);
        if (responseText[1]) {
            responseSpan.appendChild(document.createTextNode(responseText[1]));
        }

        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold';

        function checkAnswer() {
            const result = checkAccentAware(input.value, q.blank);

            if (result === 'correct') {
                feedback.textContent = 'Helyes! (Correct!)';
                feedback.className = 'text-green-600 font-semibold';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-2 py-1 w-40';
                if (!stage5Answers[idx]) {
                    stage5Answers[idx] = true;
                    scores.stage5.correct++;
                    document.getElementById('stage5-score').textContent = `Score: ${scores.stage5.correct} / ${debateDialogues.length}`;
                    updateTotalScore();
                }
            } else if (result === 'accent-warning') {
                feedback.textContent = 'Majdnem! (Check accents)';
                feedback.className = 'text-yellow-600 font-semibold';
            } else if (input.value.trim() !== '') {
                feedback.textContent = 'Probald ujra! (Try again)';
                feedback.className = 'text-red-600 font-semibold';
            }
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkAnswer();
        });
        input.addEventListener('blur', checkAnswer);

        responseLine.appendChild(speakerB);
        responseLine.appendChild(responseSpan);
        responseLine.appendChild(feedback);

        const translationLine = document.createElement('div');
        translationLine.className = 'mt-2 text-xs text-slate-500 italic pl-8';
        translationLine.textContent = `(${q.responseEnglish})`;

        wrapper.appendChild(questionLine);
        wrapper.appendChild(responseLine);
        wrapper.appendChild(translationLine);
        dialogueExercise.appendChild(wrapper);
    });

    // ============================================
    // SUMMARY SECTION
    // ============================================

    const summarySection = document.createElement('section');
    summarySection.className = 'mt-8 p-6 bg-gradient-to-r from-purple-50 to-slate-50 rounded-xl border border-purple-200';
    summarySection.innerHTML = `
        <h2 class="text-xl font-bold text-purple-800 mb-4">Lesson Summary</h2>
        <div class="grid md:grid-cols-2 gap-4 text-sm">
            <div>
                <h3 class="font-semibold text-slate-700 mb-2">Key Opinion Phrases:</h3>
                <ul class="list-disc pl-5 text-slate-600 space-y-1">
                    <li>Szerintem - In my opinion</li>
                    <li>Ugy gondolom - I think/believe</li>
                    <li>Velemenyem szerint - According to my opinion</li>
                    <li>Biztos vagyok benne - I am sure</li>
                </ul>
            </div>
            <div>
                <h3 class="font-semibold text-slate-700 mb-2">Agreeing & Disagreeing:</h3>
                <ul class="list-disc pl-5 text-slate-600 space-y-1">
                    <li>Egyetértek - I agree</li>
                    <li>Nem ertek egyet - I disagree</li>
                    <li>Igazad van - You are right</li>
                    <li>Mas a velemenyem - I have a different opinion</li>
                </ul>
            </div>
        </div>
        <div class="mt-4 p-3 bg-amber-50 rounded-lg border border-amber-200">
            <p class="text-amber-800 text-sm"><strong>Remember:</strong> Using "Szerintem" or "Ugy gondolom" at the beginning of your opinion makes it sound more polite and less confrontational. When disagreeing, phrases like "Mas a velemenyem" are softer than directly saying "Nem!"</p>
        </div>
    `;
    mainContent.appendChild(summarySection);

    // Initialize total score
    updateTotalScore();
    </script>
</body>
</html>
