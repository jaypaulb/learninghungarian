<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 25: Health & Body Parts - Learning Hungarian</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; }
        th, td { border: 1px solid #e2e8f0; padding: 0.5rem 1rem; text-align: center; }
        th { background: #f1f5f9; }
        .body-part-card { transition: transform 0.2s; }
        .body-part-card:hover { transform: scale(1.02); }
    </style>
</head>
<body class="bg-slate-100 p-4 md:p-8">
    <header class="text-center mb-8">
        <div class="mb-4">
            <a href="../index.html" class="inline-flex items-center px-4 py-2 bg-slate-600 text-white text-sm font-medium rounded-lg hover:bg-slate-700 transition-colors">
                <svg class="mr-2 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                Back to Lessons
            </a>
        </div>
        <h1 class="text-3xl md:text-4xl font-bold text-slate-700">Lesson 25: Health & Body Parts <span class="block text-xl text-slate-500 font-normal">(Egeszseg es testreszek)</span></h1>
        <p class="text-slate-600 mt-2 max-w-2xl mx-auto">Learn to name body parts, describe symptoms, and communicate at the doctor's office and pharmacy in Hungarian.</p>
        <div class="mt-4 inline-block bg-rose-100 text-rose-800 px-3 py-1 rounded-full text-sm font-medium">CEFR Level: A2</div>
    </header>
    <main class="max-w-3xl mx-auto bg-white rounded-xl shadow-md p-6" id="main-content">
        <!-- Content will be generated by JavaScript -->
    </main>
    <footer class="text-center mt-12 py-4 border-t border-slate-300">
        <p class="text-sm text-slate-500">&copy; 2024 Hungarian Language Lessons</p>
    </footer>
    <script>
    const main = document.getElementById('main-content');

    // Helper function for accent-insensitive comparison
    function removeAccents(str) {
        return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[oOuUaAeEiI]/gi, function(m) {
            const map = { 'a':'a','A':'A','e':'e','E':'E','i':'i','I':'I','o':'o','O':'O','u':'u','U':'U' };
            return map[m] || m;
        }).toLowerCase();
    }

    // ==================== SECTION 1: BODY PARTS VOCABULARY ====================
    const bodySection = document.createElement('section');
    bodySection.className = 'mb-10';
    bodySection.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4 border-b-2 border-rose-500 pb-2">Section 1: Body Parts Vocabulary</h2>
        <p class="mb-4 text-slate-600">Learn the essential vocabulary for body parts in Hungarian.</p>
        <div class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-6">
            <div class="body-part-card bg-rose-50 p-3 rounded-lg text-center">
                <p class="font-bold text-slate-800">fej</p>
                <p class="text-sm text-slate-600">head</p>
            </div>
            <div class="body-part-card bg-rose-50 p-3 rounded-lg text-center">
                <p class="font-bold text-slate-800">szem</p>
                <p class="text-sm text-slate-600">eye</p>
            </div>
            <div class="body-part-card bg-rose-50 p-3 rounded-lg text-center">
                <p class="font-bold text-slate-800">ful</p>
                <p class="text-sm text-slate-600">ear</p>
            </div>
            <div class="body-part-card bg-rose-50 p-3 rounded-lg text-center">
                <p class="font-bold text-slate-800">orr</p>
                <p class="text-sm text-slate-600">nose</p>
            </div>
            <div class="body-part-card bg-rose-50 p-3 rounded-lg text-center">
                <p class="font-bold text-slate-800">szaj</p>
                <p class="text-sm text-slate-600">mouth</p>
            </div>
            <div class="body-part-card bg-rose-50 p-3 rounded-lg text-center">
                <p class="font-bold text-slate-800">fog</p>
                <p class="text-sm text-slate-600">tooth</p>
            </div>
            <div class="body-part-card bg-rose-50 p-3 rounded-lg text-center">
                <p class="font-bold text-slate-800">nyak</p>
                <p class="text-sm text-slate-600">neck</p>
            </div>
            <div class="body-part-card bg-rose-50 p-3 rounded-lg text-center">
                <p class="font-bold text-slate-800">vall</p>
                <p class="text-sm text-slate-600">shoulder</p>
            </div>
            <div class="body-part-card bg-rose-50 p-3 rounded-lg text-center">
                <p class="font-bold text-slate-800">kar</p>
                <p class="text-sm text-slate-600">arm</p>
            </div>
            <div class="body-part-card bg-rose-50 p-3 rounded-lg text-center">
                <p class="font-bold text-slate-800">kez</p>
                <p class="text-sm text-slate-600">hand</p>
            </div>
            <div class="body-part-card bg-rose-50 p-3 rounded-lg text-center">
                <p class="font-bold text-slate-800">ujj</p>
                <p class="text-sm text-slate-600">finger</p>
            </div>
            <div class="body-part-card bg-rose-50 p-3 rounded-lg text-center">
                <p class="font-bold text-slate-800">hat</p>
                <p class="text-sm text-slate-600">back</p>
            </div>
            <div class="body-part-card bg-rose-50 p-3 rounded-lg text-center">
                <p class="font-bold text-slate-800">has</p>
                <p class="text-sm text-slate-600">stomach/belly</p>
            </div>
            <div class="body-part-card bg-rose-50 p-3 rounded-lg text-center">
                <p class="font-bold text-slate-800">lab</p>
                <p class="text-sm text-slate-600">leg/foot</p>
            </div>
            <div class="body-part-card bg-rose-50 p-3 rounded-lg text-center">
                <p class="font-bold text-slate-800">sziv</p>
                <p class="text-sm text-slate-600">heart</p>
            </div>
        </div>
        <h3 class="text-lg font-semibold text-slate-700 mb-3">Exercise 1.1: Body Parts Labeling</h3>
        <p class="mb-4 text-sm text-slate-500">Type the Hungarian word for each body part. Press Enter to check.</p>
        <div id="body-parts-exercise" class="space-y-3"></div>
        <div id="body-parts-score" class="mt-4 text-slate-700 font-medium"></div>
    `;
    main.appendChild(bodySection);

    const bodyParts = [
        { english: 'head', hungarian: 'fej' },
        { english: 'eye', hungarian: 'szem' },
        { english: 'ear', hungarian: 'ful' },
        { english: 'nose', hungarian: 'orr' },
        { english: 'mouth', hungarian: 'szaj' },
        { english: 'tooth', hungarian: 'fog' },
        { english: 'neck', hungarian: 'nyak' },
        { english: 'shoulder', hungarian: 'vall' },
        { english: 'arm', hungarian: 'kar' },
        { english: 'hand', hungarian: 'kez' },
        { english: 'finger', hungarian: 'ujj' },
        { english: 'back', hungarian: 'hat' },
        { english: 'stomach', hungarian: 'has' },
        { english: 'leg', hungarian: 'lab' },
        { english: 'heart', hungarian: 'sziv' }
    ];

    const bodyPartsDiv = document.getElementById('body-parts-exercise');
    const bodyPartsScoreDiv = document.getElementById('body-parts-score');

    bodyParts.forEach((item, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col md:flex-row items-start md:items-center gap-2';
        const label = document.createElement('span');
        label.className = 'min-w-[100px] text-slate-800 font-medium';
        label.textContent = item.english;
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = 'Hungarian word...';
        input.className = 'border border-slate-300 rounded-md px-3 py-1 w-36 focus:ring-2 focus:ring-rose-500 focus:border-rose-500';
        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold';
        input.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') checkBodyPart(idx);
        });
        wrapper.appendChild(label);
        wrapper.appendChild(input);
        wrapper.appendChild(feedback);
        bodyPartsDiv.appendChild(wrapper);
    });

    function checkBodyPart(idx) {
        const wrapper = bodyPartsDiv.children[idx];
        const input = wrapper.querySelector('input');
        const feedback = wrapper.querySelector('span:last-child');
        const correct = bodyParts[idx].hungarian;
        const userAnswer = input.value.trim().toLowerCase();

        if (userAnswer === correct.toLowerCase()) {
            feedback.textContent = 'Correct!';
            feedback.className = 'text-sm font-semibold text-green-600';
        } else if (removeAccents(userAnswer) === removeAccents(correct)) {
            feedback.textContent = 'Watch your accents!';
            feedback.className = 'text-sm font-semibold text-yellow-600';
        } else if (userAnswer === '') {
            feedback.textContent = '';
        } else {
            feedback.textContent = `Try again! (${correct})`;
            feedback.className = 'text-sm font-semibold text-red-600';
        }
        updateBodyPartsScore();
    }

    function updateBodyPartsScore() {
        let correct = 0;
        for (let i = 0; i < bodyParts.length; i++) {
            const feedback = bodyPartsDiv.children[i].querySelector('span:last-child');
            if (feedback.textContent === 'Correct!') correct++;
        }
        bodyPartsScoreDiv.textContent = `Score: ${correct} / ${bodyParts.length}`;
    }
    bodyPartsScoreDiv.textContent = `Score: 0 / ${bodyParts.length}`;

    // ==================== SECTION 2: SYMPTOMS AND AILMENTS ====================
    const symptomsSection = document.createElement('section');
    symptomsSection.className = 'mb-10';
    symptomsSection.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4 border-b-2 border-rose-500 pb-2">Section 2: Symptoms & Ailments</h2>
        <p class="mb-4 text-slate-600">Learn to describe common symptoms and health problems.</p>
        <div class="bg-slate-50 p-4 rounded-lg mb-6">
            <h3 class="font-semibold text-slate-700 mb-2">Common Expressions:</h3>
            <ul class="space-y-1 text-sm">
                <li><strong>Faj a fejem.</strong> - My head hurts. (I have a headache.)</li>
                <li><strong>Faj a torkom.</strong> - My throat hurts.</li>
                <li><strong>Faj a hasam.</strong> - My stomach hurts.</li>
                <li><strong>Lazas vagyok.</strong> - I have a fever.</li>
                <li><strong>Kohogoek.</strong> - I am coughing.</li>
                <li><strong>Tusszogok.</strong> - I am sneezing.</li>
                <li><strong>Fázom.</strong> - I am cold / I have chills.</li>
                <li><strong>Rosszul vagyok.</strong> - I feel sick.</li>
                <li><strong>Szédülök.</strong> - I feel dizzy.</li>
            </ul>
        </div>
        <h3 class="text-lg font-semibold text-slate-700 mb-3">Exercise 2.1: Symptom Descriptions</h3>
        <p class="mb-4 text-sm text-slate-500">Complete the sentences describing symptoms. Press Enter to check.</p>
        <div id="symptoms-exercise" class="space-y-3"></div>
        <div id="symptoms-score" class="mt-4 text-slate-700 font-medium"></div>
    `;
    main.appendChild(symptomsSection);

    const symptomQuestions = [
        { sentence: 'Faj a ___.', answer: 'fejem', translation: 'My head hurts.' },
        { sentence: '___ vagyok.', answer: 'lazas', translation: 'I have a fever.' },
        { sentence: 'Faj a ___.', answer: 'torkom', translation: 'My throat hurts.' },
        { sentence: '___ vagyok.', answer: 'rosszul', translation: 'I feel sick.' },
        { sentence: 'Faj a ___.', answer: 'hasam', translation: 'My stomach hurts.' },
        { sentence: '___.', answer: 'kohogok', translation: 'I am coughing.' },
        { sentence: '___.', answer: 'tusszogok', translation: 'I am sneezing.' },
        { sentence: '___.', answer: 'fazom', translation: 'I am cold.' },
        { sentence: '___.', answer: 'szedulok', translation: 'I feel dizzy.' },
        { sentence: 'Faj a ___.', answer: 'hatam', translation: 'My back hurts.' }
    ];

    const symptomsDiv = document.getElementById('symptoms-exercise');
    const symptomsScoreDiv = document.getElementById('symptoms-score');

    symptomQuestions.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col md:flex-row items-start md:items-center gap-2';
        const label = document.createElement('span');
        label.className = 'min-w-[150px] text-slate-800';
        label.textContent = q.sentence;
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-3 py-1 w-36 text-center focus:ring-2 focus:ring-rose-500';
        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold';
        input.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') checkSymptom(idx);
        });
        wrapper.appendChild(label);
        wrapper.appendChild(input);
        wrapper.appendChild(feedback);
        symptomsDiv.appendChild(wrapper);
    });

    function checkSymptom(idx) {
        const wrapper = symptomsDiv.children[idx];
        const input = wrapper.querySelector('input');
        const feedback = wrapper.querySelector('span:last-child');
        const correct = symptomQuestions[idx].answer;
        const userAnswer = input.value.trim().toLowerCase();

        if (userAnswer === correct.toLowerCase()) {
            feedback.textContent = `Correct! (${symptomQuestions[idx].translation})`;
            feedback.className = 'text-sm font-semibold text-green-600';
        } else if (removeAccents(userAnswer) === removeAccents(correct)) {
            feedback.textContent = `Watch accents! (${symptomQuestions[idx].translation})`;
            feedback.className = 'text-sm font-semibold text-yellow-600';
        } else if (userAnswer === '') {
            feedback.textContent = '';
        } else {
            feedback.textContent = `Try again! (${symptomQuestions[idx].translation})`;
            feedback.className = 'text-sm font-semibold text-red-600';
        }
        updateSymptomsScore();
    }

    function updateSymptomsScore() {
        let correct = 0;
        for (let i = 0; i < symptomQuestions.length; i++) {
            const feedback = symptomsDiv.children[i].querySelector('span:last-child');
            if (feedback.textContent.startsWith('Correct!')) correct++;
        }
        symptomsScoreDiv.textContent = `Score: ${correct} / ${symptomQuestions.length}`;
    }
    symptomsScoreDiv.textContent = `Score: 0 / ${symptomQuestions.length}`;

    // ==================== SECTION 3: DOCTOR'S OFFICE ====================
    const doctorSection = document.createElement('section');
    doctorSection.className = 'mb-10';
    doctorSection.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4 border-b-2 border-rose-500 pb-2">Section 3: At the Doctor's Office</h2>
        <p class="mb-4 text-slate-600">Learn essential phrases for visiting the doctor (orvos) in Hungary.</p>
        <div class="bg-blue-50 p-4 rounded-lg mb-6 border border-blue-200">
            <h3 class="font-bold text-blue-800 mb-2">Sample Dialogue:</h3>
            <p class="text-blue-900 mb-1"><strong>Orvos:</strong> Mi a panasz? (What's the problem?)</p>
            <p class="text-blue-900 mb-1"><strong>Beteg:</strong> Faj a fejem es lazas vagyok. (My head hurts and I have a fever.)</p>
            <p class="text-blue-900 mb-1"><strong>Orvos:</strong> Mikor kezdodott? (When did it start?)</p>
            <p class="text-blue-900 mb-1"><strong>Beteg:</strong> Tegnap este. (Yesterday evening.)</p>
            <p class="text-blue-900 mb-1"><strong>Orvos:</strong> Nyissa ki a szajat. (Open your mouth.)</p>
            <p class="text-blue-900"><strong>Orvos:</strong> Felírok egy gyogyszert. (I'll prescribe a medicine.)</p>
        </div>
        <h3 class="text-lg font-semibold text-slate-700 mb-3">Exercise 3.1: Doctor Dialogue Completion</h3>
        <p class="mb-4 text-sm text-slate-500">Complete the doctor-patient dialogues.</p>
        <div id="doctor-exercise" class="space-y-4"></div>
        <div id="doctor-score" class="mt-4 text-slate-700 font-medium"></div>
    `;
    main.appendChild(doctorSection);

    const doctorDialogues = [
        { prompt: 'Doctor: Mi a ___? (What is the problem?)', answer: 'panasz', translation: 'What is the problem?' },
        { prompt: 'Patient: ___ a fejem. (My head hurts.)', answer: 'faj', translation: 'My head hurts.' },
        { prompt: 'Doctor: Mikor ___? (When did it start?)', answer: 'kezdodott', translation: 'When did it start?' },
        { prompt: 'Patient: Tegnap ___. (Yesterday evening.)', answer: 'este', translation: 'Yesterday evening.' },
        { prompt: 'Doctor: Nyissa ki a ___. (Open your mouth.)', answer: 'szajat', translation: 'Open your mouth.' },
        { prompt: 'Doctor: Felirok egy ___. (I will prescribe a medicine.)', answer: 'gyogyszert', translation: 'I will prescribe a medicine.' },
        { prompt: 'Patient: Van ___? (Do you have allergies?)', answer: 'allergiaja', translation: 'Do you have allergies?' },
        { prompt: 'Doctor: ___ maradjon otthon. (Stay home for 3 days.)', answer: 'harom napig', translation: 'Stay home for 3 days.' },
        { prompt: 'Patient: Hol faj? A ___ faj. (Where does it hurt? My ear hurts.)', answer: 'fulem', translation: 'My ear hurts.' },
        { prompt: 'Doctor: Vegyen ___ lelegzetet. (Take a deep breath.)', answer: 'mely', translation: 'Take a deep breath.' }
    ];

    const doctorDiv = document.getElementById('doctor-exercise');
    const doctorScoreDiv = document.getElementById('doctor-score');

    doctorDialogues.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col gap-1';
        const label = document.createElement('span');
        label.className = 'text-slate-800';
        label.textContent = q.prompt;
        const inputRow = document.createElement('div');
        inputRow.className = 'flex items-center gap-2';
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-3 py-1 w-40 focus:ring-2 focus:ring-rose-500';
        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold';
        input.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') checkDoctorAnswer(idx);
        });
        inputRow.appendChild(input);
        inputRow.appendChild(feedback);
        wrapper.appendChild(label);
        wrapper.appendChild(inputRow);
        doctorDiv.appendChild(wrapper);
    });

    function checkDoctorAnswer(idx) {
        const wrapper = doctorDiv.children[idx];
        const input = wrapper.querySelector('input');
        const feedback = wrapper.querySelector('span');
        const correct = doctorDialogues[idx].answer;
        const userAnswer = input.value.trim().toLowerCase();

        if (userAnswer === correct.toLowerCase() || removeAccents(userAnswer) === removeAccents(correct)) {
            feedback.textContent = `Correct! (${doctorDialogues[idx].translation})`;
            feedback.className = 'text-sm font-semibold text-green-600';
        } else if (userAnswer === '') {
            feedback.textContent = '';
        } else {
            feedback.textContent = `Answer: ${correct}`;
            feedback.className = 'text-sm font-semibold text-red-600';
        }
        updateDoctorScore();
    }

    function updateDoctorScore() {
        let correct = 0;
        for (let i = 0; i < doctorDialogues.length; i++) {
            const feedback = doctorDiv.children[i].querySelector('span');
            if (feedback.textContent.startsWith('Correct!')) correct++;
        }
        doctorScoreDiv.textContent = `Score: ${correct} / ${doctorDialogues.length}`;
    }
    doctorScoreDiv.textContent = `Score: 0 / ${doctorDialogues.length}`;

    // ==================== SECTION 4: PHARMACY ====================
    const pharmacySection = document.createElement('section');
    pharmacySection.className = 'mb-10';
    pharmacySection.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4 border-b-2 border-rose-500 pb-2">Section 4: At the Pharmacy</h2>
        <p class="mb-4 text-slate-600">Learn to communicate at the pharmacy (gyogyszertar/patika) in Hungarian.</p>
        <div class="bg-green-50 p-4 rounded-lg mb-6">
            <h3 class="font-semibold text-green-800 mb-2">Useful Pharmacy Vocabulary:</h3>
            <div class="grid grid-cols-2 gap-2 text-sm">
                <p><strong>gyogyszer</strong> - medicine</p>
                <p><strong>tabletta</strong> - tablet/pill</p>
                <p><strong>szirup</strong> - syrup</p>
                <p><strong>krem</strong> - cream</p>
                <p><strong>kotos</strong> - bandage</p>
                <p><strong>recept</strong> - prescription</p>
                <p><strong>fajdalomcsillapito</strong> - painkiller</p>
                <p><strong>laz elleni</strong> - fever reducer</p>
            </div>
        </div>
        <h3 class="text-lg font-semibold text-slate-700 mb-3">Exercise 4.1: Pharmacy Scenarios</h3>
        <p class="mb-4 text-sm text-slate-500">Complete the pharmacy interactions.</p>
        <div id="pharmacy-exercise" class="space-y-4"></div>
        <div id="pharmacy-score" class="mt-4 text-slate-700 font-medium"></div>
    `;
    main.appendChild(pharmacySection);

    const pharmacyScenarios = [
        {
            situation: 'Asking for medicine',
            prompt: 'Customer: Fejfajasra kerek ___. (I want something for headache.)',
            answer: 'gyogyszert',
            translation: 'I want medicine for headache.'
        },
        {
            situation: 'Showing prescription',
            prompt: 'Customer: Itt van a ___. (Here is the prescription.)',
            answer: 'recept',
            translation: 'Here is the prescription.'
        },
        {
            situation: 'Asking about usage',
            prompt: 'Customer: Hogyan kell ___? (How should I take it?)',
            answer: 'szedni',
            translation: 'How should I take it?'
        },
        {
            situation: 'Getting instructions',
            prompt: 'Pharmacist: Naponta ___ tabletta. (3 tablets daily.)',
            answer: 'harom',
            translation: '3 tablets daily.'
        },
        {
            situation: 'Asking for bandages',
            prompt: 'Customer: Van ___? (Do you have bandages?)',
            answer: 'kotszer',
            translation: 'Do you have bandages?'
        },
        {
            situation: 'Asking about side effects',
            prompt: 'Customer: Van ___ mellekhatasa? (Does it have side effects?)',
            answer: 'valamilyen',
            translation: 'Does it have any side effects?'
        },
        {
            situation: 'Pain relief',
            prompt: 'Customer: Kerek egy ___. (I want a painkiller.)',
            answer: 'fajdalomcsillapitot',
            translation: 'I want a painkiller.'
        },
        {
            situation: 'Asking price',
            prompt: 'Customer: ___ kerul? (How much does it cost?)',
            answer: 'mennyibe',
            translation: 'How much does it cost?'
        }
    ];

    const pharmacyDiv = document.getElementById('pharmacy-exercise');
    const pharmacyScoreDiv = document.getElementById('pharmacy-score');

    pharmacyScenarios.forEach((scenario, idx) => {
        const card = document.createElement('div');
        card.className = 'bg-slate-50 p-3 rounded-lg';
        card.innerHTML = `
            <div class="text-xs text-rose-600 font-semibold mb-1">${scenario.situation}</div>
            <p class="text-slate-700 mb-2">${scenario.prompt}</p>
        `;
        const inputRow = document.createElement('div');
        inputRow.className = 'flex items-center gap-2';
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-3 py-1 w-48 focus:ring-2 focus:ring-rose-500';
        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold';
        input.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') checkPharmacyAnswer(idx);
        });
        inputRow.appendChild(input);
        inputRow.appendChild(feedback);
        card.appendChild(inputRow);
        pharmacyDiv.appendChild(card);
    });

    function checkPharmacyAnswer(idx) {
        const card = pharmacyDiv.children[idx];
        const input = card.querySelector('input');
        const feedback = card.querySelector('span');
        const scenario = pharmacyScenarios[idx];
        const userAnswer = input.value.trim().toLowerCase();

        if (userAnswer === scenario.answer.toLowerCase() || removeAccents(userAnswer) === removeAccents(scenario.answer)) {
            feedback.textContent = `Correct! (${scenario.translation})`;
            feedback.className = 'text-sm font-semibold text-green-600';
        } else if (userAnswer === '') {
            feedback.textContent = '';
        } else {
            feedback.textContent = `Answer: ${scenario.answer}`;
            feedback.className = 'text-sm font-semibold text-red-600';
        }
        updatePharmacyScore();
    }

    function updatePharmacyScore() {
        let correct = 0;
        for (let i = 0; i < pharmacyScenarios.length; i++) {
            const feedback = pharmacyDiv.children[i].querySelector('span');
            if (feedback.textContent.startsWith('Correct!')) correct++;
        }
        pharmacyScoreDiv.textContent = `Score: ${correct} / ${pharmacyScenarios.length}`;
    }
    pharmacyScoreDiv.textContent = `Score: 0 / ${pharmacyScenarios.length}`;

    // ==================== SECTION 5: HEALTH ADVICE ====================
    const adviceSection = document.createElement('section');
    adviceSection.className = 'mb-10';
    adviceSection.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4 border-b-2 border-rose-500 pb-2">Section 5: Health Advice Comprehension</h2>
        <p class="mb-4 text-slate-600">Read and understand health advice in Hungarian.</p>
        <div class="bg-amber-50 p-4 rounded-lg mb-6 border border-amber-200">
            <h3 class="font-bold text-amber-800 mb-2">Orvosi tanacs (Medical Advice):</h3>
            <ul class="text-amber-900 space-y-1 text-sm">
                <li>1. Igyon sok vizet! (Drink lots of water!)</li>
                <li>2. Pihenjen sokat! (Rest a lot!)</li>
                <li>3. Maradjon otthon harom napig! (Stay home for 3 days!)</li>
                <li>4. Vegyen be gyogyszert naponta haromszor! (Take medicine 3 times daily!)</li>
                <li>5. Ne menjen dolgozni! (Don't go to work!)</li>
                <li>6. Egyen konnyű eteleket! (Eat light foods!)</li>
                <li>7. Kerülje a fizikai megeroltetest! (Avoid physical exertion!)</li>
                <li>8. Jojjon vissza egy het mulva! (Come back in one week!)</li>
            </ul>
        </div>
        <h3 class="text-lg font-semibold text-slate-700 mb-3">Exercise 5.1: Health Advice Comprehension</h3>
        <p class="mb-4 text-sm text-slate-500">Answer the questions about the health advice above.</p>
        <div id="advice-exercise" class="space-y-4"></div>
        <div id="advice-score" class="mt-4 text-slate-700 font-medium"></div>
    `;
    main.appendChild(adviceSection);

    const adviceQuestions = [
        { question: 'Mit kell inni? (What should you drink?)', answer: 'vizet', hint: 'water' },
        { question: 'Hany napig kell otthon maradni? (How many days to stay home?)', answer: '3', hint: 'number' },
        { question: 'Hanyszor kell gyogyszert bevenni naponta? (How many times to take medicine daily?)', answer: 'haromszor', hint: '3 times' },
        { question: 'Mit ne tegyen? Ne menjen ___. (What not to do? Don\'t go to...)', answer: 'dolgozni', hint: 'work' },
        { question: 'Milyen eteleket kell enni? (What kind of foods to eat?)', answer: 'konnyu', hint: 'light' },
        { question: 'Mit kell kerulni? (What to avoid?)', answer: 'fizikai megeroltetest', hint: 'physical exertion' },
        { question: 'Mikor kell visszamenni? Egy ___ mulva. (When to return?)', answer: 'het', hint: 'week' },
        { question: 'Mit kell csinalni sokat? (What to do a lot?)', answer: 'pihenni', hint: 'rest' }
    ];

    const adviceDiv = document.getElementById('advice-exercise');
    const adviceScoreDiv = document.getElementById('advice-score');

    adviceQuestions.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col gap-1';
        const label = document.createElement('span');
        label.className = 'text-slate-800';
        label.textContent = `${idx + 1}. ${q.question}`;
        const inputRow = document.createElement('div');
        inputRow.className = 'flex items-center gap-2';
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = q.hint;
        input.className = 'border border-slate-300 rounded-md px-3 py-1 w-48 focus:ring-2 focus:ring-rose-500';
        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold';
        input.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') checkAdviceAnswer(idx);
        });
        inputRow.appendChild(input);
        inputRow.appendChild(feedback);
        wrapper.appendChild(label);
        wrapper.appendChild(inputRow);
        adviceDiv.appendChild(wrapper);
    });

    function checkAdviceAnswer(idx) {
        const wrapper = adviceDiv.children[idx];
        const input = wrapper.querySelector('input');
        const feedback = wrapper.querySelector('span');
        const correct = adviceQuestions[idx].answer;
        const userAnswer = input.value.trim().toLowerCase();

        // Handle numeric and text answers
        let isCorrect = userAnswer === correct.toLowerCase() ||
                        removeAccents(userAnswer) === removeAccents(correct) ||
                        (correct === '3' && (userAnswer === '3' || userAnswer === 'harom' || removeAccents(userAnswer) === 'harom'));

        if (isCorrect) {
            feedback.textContent = 'Correct!';
            feedback.className = 'text-sm font-semibold text-green-600';
        } else if (userAnswer === '') {
            feedback.textContent = '';
        } else {
            feedback.textContent = `Answer: ${correct}`;
            feedback.className = 'text-sm font-semibold text-red-600';
        }
        updateAdviceScore();
    }

    function updateAdviceScore() {
        let correct = 0;
        for (let i = 0; i < adviceQuestions.length; i++) {
            const feedback = adviceDiv.children[i].querySelector('span');
            if (feedback.textContent === 'Correct!') correct++;
        }
        adviceScoreDiv.textContent = `Score: ${correct} / ${adviceQuestions.length}`;
    }
    adviceScoreDiv.textContent = `Score: 0 / ${adviceQuestions.length}`;

    // ==================== EMERGENCY PHRASES ====================
    const emergencySection = document.createElement('section');
    emergencySection.className = 'mb-10 bg-red-50 p-6 rounded-xl border-2 border-red-200';
    emergencySection.innerHTML = `
        <h2 class="text-xl font-bold text-red-800 mb-4">Emergency Health Phrases</h2>
        <p class="text-red-700 mb-4">Important phrases for medical emergencies in Hungary:</p>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm">
            <div class="bg-white p-3 rounded">
                <p class="font-bold text-red-800">Segitseg!</p>
                <p class="text-slate-600">Help!</p>
            </div>
            <div class="bg-white p-3 rounded">
                <p class="font-bold text-red-800">Hivja a mentot!</p>
                <p class="text-slate-600">Call an ambulance!</p>
            </div>
            <div class="bg-white p-3 rounded">
                <p class="font-bold text-red-800">Surgos!</p>
                <p class="text-slate-600">It's urgent!</p>
            </div>
            <div class="bg-white p-3 rounded">
                <p class="font-bold text-red-800">Orvosra van szuksegem.</p>
                <p class="text-slate-600">I need a doctor.</p>
            </div>
            <div class="bg-white p-3 rounded">
                <p class="font-bold text-red-800">Allergias vagyok ___-ra.</p>
                <p class="text-slate-600">I am allergic to ___.</p>
            </div>
            <div class="bg-white p-3 rounded">
                <p class="font-bold text-red-800">Cukorbeteg vagyok.</p>
                <p class="text-slate-600">I am diabetic.</p>
            </div>
        </div>
        <div class="mt-4 p-3 bg-white rounded">
            <p class="font-bold text-red-800">Emergency Number in Hungary: 104 (Ambulance) / 112 (General Emergency)</p>
        </div>
    `;
    main.appendChild(emergencySection);

    // ==================== TOTAL SCORE SUMMARY ====================
    const summarySection = document.createElement('section');
    summarySection.className = 'mt-10 p-6 bg-rose-50 rounded-xl';
    summarySection.innerHTML = `
        <h2 class="text-2xl font-bold text-rose-800 mb-4">Lesson Summary</h2>
        <p class="text-rose-700 mb-4">Great work! You've learned essential health and body vocabulary in Hungarian.</p>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
            <div class="bg-white p-3 rounded-lg">
                <p class="font-semibold text-rose-800">Body Parts:</p>
                <p class="text-slate-600">15 essential body part terms</p>
            </div>
            <div class="bg-white p-3 rounded-lg">
                <p class="font-semibold text-rose-800">Symptoms:</p>
                <p class="text-slate-600">Common ailments and expressions</p>
            </div>
            <div class="bg-white p-3 rounded-lg">
                <p class="font-semibold text-rose-800">Medical Dialogue:</p>
                <p class="text-slate-600">Doctor and pharmacy interactions</p>
            </div>
            <div class="bg-white p-3 rounded-lg">
                <p class="font-semibold text-rose-800">Emergency Phrases:</p>
                <p class="text-slate-600">Critical health expressions</p>
            </div>
        </div>
        <div class="mt-4 p-3 bg-white rounded-lg">
            <p class="font-semibold text-rose-800">Total Exercises Completed:</p>
            <p class="text-slate-600">51 interactive exercises across 5 sections</p>
        </div>
    `;
    main.appendChild(summarySection);
    </script>
