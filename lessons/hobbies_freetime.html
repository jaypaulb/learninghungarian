    function removeAccents(str) {
        return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[őŐűŰ]/g, function(m) {
            const map = { 'ő': 'o', 'Ő': 'O', 'ű': 'u', 'Ű': 'U' };
            return map[m] || m;
        });
    }

    function normalizeAnswer(str) {
        return str.trim().toLowerCase();
    }

    function checkAccentAware(userInput, correctAnswer) {
        const normalizedInput = normalizeAnswer(userInput);
        const normalizedCorrect = normalizeAnswer(correctAnswer);

        if (normalizedInput === normalizedCorrect) {
            return 'correct';
        } else if (removeAccents(normalizedInput) === removeAccents(normalizedCorrect)) {
            return 'accent-warning';
        } else {
            return 'incorrect';

        const cardDiv = document.createElement('div');
        cardDiv.className = 'flip-card h-24';
        cardDiv.setAttribute('data-idx', idx);
        cardDiv.innerHTML = `
            <div class="flip-card-inner">
                <div class="flip-card-front">
                    <span class="text-lg font-bold">${card.hungarian}</span>
                </div>
                <div class="flip-card-back">
                    <span class="text-lg font-semibold">${card.english}</span>
                </div>
            </div>
        `;
        cardDiv.addEventListener('click', function() {
            this.classList.toggle('flipped');
            if (!stage1Revealed.has(idx)) {
                stage1Revealed.add(idx);
                scores.stage1.correct = stage1Revealed.size;
                document.getElementById('stage1-score').textContent = `Cards Revealed: ${stage1Revealed.size} / ${vocabularyCards.length}`;
                updateTotalScore();
            }
        });
        vocabCardsContainer.appendChild(cardDiv);
    });

    // ============================================
    // STAGE 2: HOBBY MATCHING (10 items)
    // ============================================

    const stage2Section = document.createElement('section');
    stage2Section.className = 'mb-8';
    stage2Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 2: Hobby Matching</h2>
        <p class="text-slate-600 mb-4">Match the activity description to the correct Hungarian word.</p>
        <div id="hobby-exercise" class="space-y-4"></div>
        <div id="stage2-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${hobbyMatching.length}</div>
    `;
    mainContent.appendChild(stage2Section);

    const hobbyExercise = document.getElementById('hobby-exercise');
    hobbyMatching.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col md:flex-row items-start md:items-center gap-2 p-3 bg-slate-50 rounded-lg';

        const label = document.createElement('span');
        label.className = 'min-w-[280px] text-slate-800 font-medium';
        label.textContent = q.description;

        const select = document.createElement('select');
        select.className = 'border border-slate-300 rounded-md px-3 py-2 w-48 focus:ring-2 focus:ring-blue-500 focus:border-blue-500';
        select.innerHTML = '<option value="">Select answer...</option>';

        const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);
        shuffledOptions.forEach(opt => {
            const option = document.createElement('option');
            option.value = opt;
            option.textContent = opt;
            select.appendChild(option);
        });

        const feedback = document.createElement('span');
        feedback.className = 'ml-2 text-sm font-semibold';

        select.addEventListener('change', function() {
            if (this.value === q.answer) {
                feedback.textContent = 'Correct!';
                feedback.className = 'ml-2 text-green-600 font-semibold';
                this.disabled = true;
                this.className = 'border border-green-500 bg-green-50 rounded-md px-3 py-2 w-48';
                scores.stage2.correct++;
                document.getElementById('stage2-score').textContent = `Score: ${scores.stage2.correct} / ${hobbyMatching.length}`;
                updateTotalScore();
            } else if (this.value !== '') {
                feedback.textContent = 'Try again!';
                feedback.className = 'ml-2 text-red-600 font-semibold';
            }
        });

        wrapper.appendChild(label);
        wrapper.appendChild(select);
        wrapper.appendChild(feedback);
        hobbyExercise.appendChild(wrapper);
    });

    // ============================================
    // STAGE 3: EXPRESSING LIKES FILL-IN (10 items)
    // ============================================

    const stage3Section = document.createElement('section');
    stage3Section.className = 'mb-8';
    stage3Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 3: Expressing Likes</h2>
        <p class="text-slate-600 mb-4">Fill in the infinitive form to complete each sentence about what you like to do.</p>
        <div id="likes-exercise" class="space-y-4"></div>
        <div id="stage3-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${likesFillIn.length}</div>
    `;
    mainContent.appendChild(stage3Section);

    const likesExercise = document.getElementById('likes-exercise');
    const stage3Answers = new Array(likesFillIn.length).fill(false);

    likesFillIn.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col gap-2 p-3 bg-slate-50 rounded-lg';

        const row = document.createElement('div');
        row.className = 'flex flex-col md:flex-row items-start md:items-center gap-2';

        const sentenceParts = q.sentence.split('___');
        const sentenceSpan = document.createElement('span');
        sentenceSpan.className = 'text-slate-800';

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-2 py-1 w-32 mx-1 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 inline';
        input.setAttribute('aria-label', `Fill in blank for: ${q.sentence}`);

        sentenceSpan.appendChild(document.createTextNode(sentenceParts[0]));
        sentenceSpan.appendChild(input);
        if (sentenceParts[1]) {
            sentenceSpan.appendChild(document.createTextNode(sentenceParts[1]));
        }

        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold ml-2';

        const translation = document.createElement('div');
        translation.className = 'text-xs text-slate-500 italic';
        translation.textContent = `English: ${q.english}`;

        function checkAnswer() {
            const result = checkAccentAware(input.value, q.answer);

            if (result === 'correct') {
                feedback.textContent = 'Correct!';
                feedback.className = 'text-green-600 font-semibold ml-2';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-2 py-1 w-32 mx-1 inline';
                if (!stage3Answers[idx]) {
                    stage3Answers[idx] = true;
                    scores.stage3.correct++;
                    document.getElementById('stage3-score').textContent = `Score: ${scores.stage3.correct} / ${likesFillIn.length}`;
                    updateTotalScore();
                }
            } else if (result === 'accent-warning') {
                feedback.textContent = 'Almost! Check accents.';
                feedback.className = 'text-yellow-600 font-semibold ml-2';
            } else if (input.value.trim() !== '') {
                feedback.textContent = 'Try again!';
                feedback.className = 'text-red-600 font-semibold ml-2';
            }
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkAnswer();
        });
        input.addEventListener('blur', checkAnswer);

        row.appendChild(sentenceSpan);
        row.appendChild(feedback);
        wrapper.appendChild(row);
        wrapper.appendChild(translation);
        likesExercise.appendChild(wrapper);
    });

    // ============================================
    // STAGE 4: FREQUENCY PRACTICE (8 items)
    // ============================================

    const stage4Section = document.createElement('section');
    stage4Section.className = 'mb-8';
    stage4Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 4: Frequency Practice</h2>
        <p class="text-slate-600 mb-4">Fill in the correct frequency word to complete each sentence.</p>
        <div id="frequency-exercise" class="space-y-4"></div>
        <div id="stage4-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${frequencyPractice.length}</div>
    `;
    mainContent.appendChild(stage4Section);

    const frequencyExercise = document.getElementById('frequency-exercise');
    const stage4Answers = new Array(frequencyPractice.length).fill(false);

    frequencyPractice.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col gap-2 p-3 bg-blue-50 rounded-lg';

        const row = document.createElement('div');
        row.className = 'flex flex-col md:flex-row items-start md:items-center gap-2';

        const sentenceParts = q.sentence.split('___');
        const sentenceSpan = document.createElement('span');
        sentenceSpan.className = 'text-slate-800';

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-2 py-1 w-32 mx-1 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 inline';
        input.setAttribute('aria-label', `Fill in blank for: ${q.sentence}`);

        sentenceSpan.appendChild(document.createTextNode(sentenceParts[0]));
        sentenceSpan.appendChild(input);
        if (sentenceParts[1]) {
            sentenceSpan.appendChild(document.createTextNode(sentenceParts[1]));
        }

        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold ml-2';

        const translation = document.createElement('div');
        translation.className = 'text-xs text-slate-500 italic';
        translation.textContent = `English: ${q.english}`;

        function checkAnswer() {
            const result = checkAccentAware(input.value, q.blank);

            if (result === 'correct') {
                feedback.textContent = 'Correct!';
                feedback.className = 'text-green-600 font-semibold ml-2';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-2 py-1 w-32 mx-1 inline';
                if (!stage4Answers[idx]) {
                    stage4Answers[idx] = true;
                    scores.stage4.correct++;
                    document.getElementById('stage4-score').textContent = `Score: ${scores.stage4.correct} / ${frequencyPractice.length}`;
                    updateTotalScore();
                }
            } else if (result === 'accent-warning') {
                feedback.textContent = 'Almost! Check accents.';
                feedback.className = 'text-yellow-600 font-semibold ml-2';
            } else if (input.value.trim() !== '') {
                feedback.textContent = 'Try again!';
                feedback.className = 'text-red-600 font-semibold ml-2';
            }
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkAnswer();
        });
        input.addEventListener('blur', checkAnswer);

        row.appendChild(sentenceSpan);
        row.appendChild(feedback);
        wrapper.appendChild(row);
        wrapper.appendChild(translation);
        frequencyExercise.appendChild(wrapper);
    });

    // ============================================
    // STAGE 5: TRANSLATION PRACTICE (8 items)
    // ============================================

    const stage5Section = document.createElement('section');
    stage5Section.className = 'mb-8';
    stage5Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 5: Translation Practice</h2>
        <p class="text-slate-600 mb-4">Translate these sentences about hobbies into Hungarian.</p>
        <div id="translation-exercise" class="space-y-4"></div>
        <div id="stage5-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${translationExercises.length}</div>
    `;
    mainContent.appendChild(stage5Section);

    const translationExerciseContainer = document.getElementById('translation-exercise');
    const stage5Answers = new Array(translationExercises.length).fill(false);

    translationExercises.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'p-4 bg-indigo-50 rounded-lg';

        const promptDiv = document.createElement('div');
        promptDiv.className = 'mb-2';
        promptDiv.innerHTML = `<strong class="text-slate-800">${q.english}</strong>`;

        const inputDiv = document.createElement('div');
        inputDiv.className = 'flex flex-col md:flex-row items-start md:items-center gap-2';

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-3 py-2 w-full md:w-80 focus:ring-2 focus:ring-indigo-500';
        input.setAttribute('aria-label', `Translation for: ${q.english}`);

        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold';

        function checkAnswer() {
            const userAnswer = normalizeAnswer(input.value);
            const allAnswers = [q.answer, ...(q.alternates || [])];

            const exactMatch = allAnswers.some(a => normalizeAnswer(a) === userAnswer);
            const accentMatch = allAnswers.some(a => removeAccents(normalizeAnswer(a)) === removeAccents(userAnswer));

            if (exactMatch) {
                feedback.textContent = 'Correct!';
                feedback.className = 'text-green-600 font-semibold';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-3 py-2 w-full md:w-80';
                if (!stage5Answers[idx]) {
                    stage5Answers[idx] = true;
                    scores.stage5.correct++;
                    document.getElementById('stage5-score').textContent = `Score: ${scores.stage5.correct} / ${translationExercises.length}`;
                    updateTotalScore();
                }
            } else if (accentMatch) {
                feedback.textContent = 'Close! Check your accents.';
                feedback.className = 'text-yellow-600 font-semibold';
            } else if (input.value.trim() !== '') {
                feedback.textContent = `Try again! Answer: ${q.answer}`;
                feedback.className = 'text-red-600 font-semibold';
            }
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkAnswer();
        });
        input.addEventListener('blur', checkAnswer);

        inputDiv.appendChild(input);
        inputDiv.appendChild(feedback);
        wrapper.appendChild(promptDiv);
        wrapper.appendChild(inputDiv);
        translationExerciseContainer.appendChild(wrapper);
    });

    // ============================================
    // STAGE 6: DIALOGUE PRACTICE (6 items)
    // ============================================

    const stage6Section = document.createElement('section');
    stage6Section.className = 'mb-8';
    stage6Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 6: Dialogue Practice</h2>
        <p class="text-slate-600 mb-4">Complete these conversations about hobbies by filling in the missing word.</p>
        <div id="dialogue-exercise" class="space-y-6"></div>
        <div id="stage6-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${dialoguePractice.length}</div>
    `;
    mainContent.appendChild(stage6Section);

    const dialogueExercise = document.getElementById('dialogue-exercise');
    const stage6Answers = new Array(dialoguePractice.length).fill(false);

    dialoguePractice.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'bg-gradient-to-r from-slate-50 to-slate-100 rounded-lg p-4 border border-slate-200';

        const questionLine = document.createElement('div');
        questionLine.className = 'mb-3';
        questionLine.innerHTML = `
            <span class="inline-block bg-blue-600 text-white text-xs font-bold px-2 py-1 rounded mr-2">A</span>
            <span class="text-slate-800 font-medium">${q.line}</span>
        `;

        const responseLine = document.createElement('div');
        responseLine.className = 'flex flex-wrap items-center gap-2';

        const speakerB = document.createElement('span');
        speakerB.className = 'inline-block bg-slate-600 text-white text-xs font-bold px-2 py-1 rounded';
        speakerB.textContent = 'B';

        const responseText = q.response.split('___');
        const responseSpan = document.createElement('span');
        responseSpan.className = 'text-slate-800';

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-2 py-1 w-32 focus:ring-2 focus:ring-blue-500 focus:border-blue-500';
        input.setAttribute('aria-label', `Response for dialogue ${idx + 1}`);

        responseSpan.appendChild(document.createTextNode(responseText[0]));
        responseSpan.appendChild(input);
        if (responseText[1]) {
            responseSpan.appendChild(document.createTextNode(responseText[1]));
        }

        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold';

        function checkAnswer() {
            const result = checkAccentAware(input.value, q.blank);

            if (result === 'correct') {
                feedback.textContent = 'Helyes! (Correct!)';
                feedback.className = 'text-green-600 font-semibold';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-2 py-1 w-32';
                if (!stage6Answers[idx]) {
                    stage6Answers[idx] = true;
                    scores.stage6.correct++;
                    document.getElementById('stage6-score').textContent = `Score: ${scores.stage6.correct} / ${dialoguePractice.length}`;
                    updateTotalScore();
                }
            } else if (result === 'accent-warning') {
                feedback.textContent = 'Majdnem! (Check accents)';
                feedback.className = 'text-yellow-600 font-semibold';
            } else if (input.value.trim() !== '') {
                feedback.textContent = 'Probald ujra! (Try again)';
                feedback.className = 'text-red-600 font-semibold';
            }
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkAnswer();
        });
        input.addEventListener('blur', checkAnswer);

        responseLine.appendChild(speakerB);
        responseLine.appendChild(responseSpan);
        responseLine.appendChild(feedback);

        const translationLine = document.createElement('div');
        translationLine.className = 'mt-2 text-xs text-slate-500 italic pl-8';
        translationLine.textContent = `(${q.responseEnglish})`;

        wrapper.appendChild(questionLine);
        wrapper.appendChild(responseLine);
        wrapper.appendChild(translationLine);
        dialogueExercise.appendChild(wrapper);
    });

    // ============================================
    // SUMMARY SECTION
    // ============================================

    const summarySection = document.createElement('section');
    summarySection.className = 'mt-8 p-6 bg-gradient-to-r from-blue-50 to-slate-50 rounded-xl border border-blue-200';
    summarySection.innerHTML = `
        <h2 class="text-xl font-bold text-blue-800 mb-4">Lesson Summary</h2>
        <div class="grid md:grid-cols-2 gap-4 text-sm">
            <div>
                <h3 class="font-semibold text-slate-700 mb-2">Key Vocabulary Learned:</h3>
                <ul class="list-disc pl-5 text-slate-600 space-y-1">
                    <li>Hobbies: olvasas, uszas, fozes, zeneles, utazas</li>
                    <li>Sports: foci, tenisz, tanc, joga, sieles</li>
                    <li>Frequency: naponta, hetente, gyakran, neha</li>
                </ul>
            </div>
            <div>
                <h3 class="font-semibold text-slate-700 mb-2">Key Patterns:</h3>
                <ul class="list-disc pl-5 text-slate-600 space-y-1">
                    <li>"Szeretek + infinitive" - I like to...</li>
                    <li>"A hobbim a..." - My hobby is...</li>
                    <li>"Szabad idomben..." - In my free time...</li>
                    <li>Frequency + activity - Naponta sportolok</li>
                </ul>
            </div>
        </div>
        <div class="mt-4 p-3 bg-amber-50 rounded-lg border border-amber-200">
            <p class="text-amber-800 text-sm"><strong>Remember:</strong> Use <strong>szeretek</strong> + infinitive (-ni form) to express what you like to do: <strong>Szeretek olvasni!</strong> (I like to read!)</p>
        </div>
    `;
    mainContent.appendChild(summarySection);

    // Initialize total score
    updateTotalScore();
    </script>
</body>
</html>
