<body class="bg-slate-100 p-4 md:p-8">

        <h1 class="text-3xl md:text-4xl font-bold text-slate-700">Lesson 45: Environment & Nature <span class="block text-xl text-slate-500 font-normal">(Kornyezet es Termeszet)</span></h1>

    </header>

    <main class="max-w-4xl mx-auto bg-white rounded-xl shadow-md p-6" id="main-content">
        <!-- Content will be generated by JavaScript -->
    </main>

    <footer class="text-center mt-12 py-4 border-t border-slate-300">
        <p class="text-sm text-slate-500">&copy; 2024 Hungarian Language Lessons</p>
    </footer>

    <script>
    // ============================================
    // UTILITY FUNCTIONS
    // ============================================

    function removeAccents(str) {
        return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[oOuU\u0151\u0150\u0171\u0170]/g, function(m) {
            const map = { '\u0151':'o','\u0150':'O','\u0171':'u','\u0170':'U' };
            return map[m] || m;
        });
    }

    function normalizeAnswer(str) {
        return str.trim().toLowerCase();
    }

    function checkAccentAware(userInput, correctAnswer) {
        const normalizedInput = normalizeAnswer(userInput);
        const normalizedCorrect = normalizeAnswer(correctAnswer);

        if (normalizedInput === normalizedCorrect) {
            return 'correct';
        } else if (removeAccents(normalizedInput) === removeAccents(normalizedCorrect)) {
            return 'accent-warning';
        } else {
            return 'incorrect';
        }
    }

    // ============================================
    // VOCABULARY DATA
    // ============================================

    const natureVocabulary = [
        { hungarian: 'erdo', english: 'forest' },
        { hungarian: 'folyo', english: 'river' },
        { hungarian: 'hegy', english: 'mountain' },
        { hungarian: 'to', english: 'lake' },
        { hungarian: 'virag', english: 'flower' },
        { hungarian: 'fa', english: 'tree' },
        { hungarian: 'mezo', english: 'field/meadow' },
        { hungarian: 'voelgy', english: 'valley' },
        { hungarian: 'part', english: 'shore/coast' },
        { hungarian: 'sziget', english: 'island' }
    ];

    const environmentVocabulary = [
        { hungarian: 'kornyezet', english: 'environment' },
        { hungarian: 'szennyezes', english: 'pollution' },
        { hungarian: 'ujrahasznositás', english: 'recycling' },
        { hungarian: 'klimavaltozas', english: 'climate change' },
        { hungarian: 'fenntarthato', english: 'sustainable' },
        { hungarian: 'megujulo energia', english: 'renewable energy' },
        { hungarian: 'hulladek', english: 'waste/garbage' },
        { hungarian: 'kornyezetvedelem', english: 'environmental protection' },
        { hungarian: 'uveghazhatás', english: 'greenhouse effect' },
        { hungarian: 'ozonreteg', english: 'ozone layer' }
    ];

    const animalsNature = [
        { hungarian: 'madar', english: 'bird' },
        { hungarian: 'hal', english: 'fish' },
        { hungarian: 'rovar', english: 'insect' },
        { hungarian: 'szarvas', english: 'deer' },
        { hungarian: 'medve', english: 'bear' },
        { hungarian: 'farkas', english: 'wolf' },
        { hungarian: 'nyul', english: 'rabbit' },
        { hungarian: 'roka', english: 'fox' }
    ];

    const weatherNature = [
        { hungarian: 'eso', english: 'rain' },
        { hungarian: 'ho', english: 'snow' },
        { hungarian: 'nap', english: 'sun' },
        { hungarian: 'szel', english: 'wind' },
        { hungarian: 'felho', english: 'cloud' },
        { hungarian: 'vihar', english: 'storm' },
        { hungarian: 'kod', english: 'fog' },
        { hungarian: 'szivarvany', english: 'rainbow' }
    ];

    // ============================================
    // EXERCISE DATA
    // ============================================

    const vocabularyCards = [
        ...natureVocabulary.slice(0, 6),
        ...environmentVocabulary.slice(0, 6),
        ...animalsNature.slice(0, 4),
        ...weatherNature.slice(0, 4)
    ];

    const landscapeMatching = [
        { description: 'A large body of water surrounded by land', answer: 'to', options: ['to', 'folyo', 'tenger', 'part'] },
        { description: 'A tall natural elevation of land', answer: 'hegy', options: ['hegy', 'voelgy', 'domb', 'mezo'] },
        { description: 'An area with many trees', answer: 'erdo', options: ['erdo', 'mezo', 'kert', 'park'] },
        { description: 'Water flowing continuously in one direction', answer: 'folyo', options: ['folyo', 'to', 'patak', 'tenger'] },
        { description: 'Low land between hills or mountains', answer: 'voelgy', options: ['voelgy', 'hegy', 'domb', 'sikság'] },
        { description: 'An area of open grassland', answer: 'mezo', options: ['mezo', 'erdo', 'kert', 'park'] },
        { description: 'Land surrounded by water', answer: 'sziget', options: ['sziget', 'part', 'folyo', 'to'] },
        { description: 'The edge of land next to water', answer: 'part', options: ['part', 'sziget', 'hid', 'gát'] }
    ];

    const environmentFillIn = [
        { sentence: 'A ___ nagyon fontos a jovoert.', blank: 'kornyezetvedelem', english: 'Environmental protection is very important for the future.' },
        { sentence: 'Minden nap ___ a muanyagot.', blank: 'ujrahasznositjuk', english: 'We recycle plastic every day.' },
        { sentence: 'A ___ komoly problema a nagyvarosokban.', blank: 'szennyezes', english: 'Pollution is a serious problem in big cities.' },
        { sentence: 'A ___ miatt melegszik a Fold.', blank: 'klimavaltozas', english: 'The Earth is warming because of climate change.' },
        { sentence: 'Tobb ___ kellene hasznalni.', blank: 'megujulo energiat', english: 'We should use more renewable energy.' },
        { sentence: 'A ___ mennyiseget csokkenteni kell.', blank: 'hulladek', english: 'The amount of waste needs to be reduced.' },
        { sentence: 'A ___ fejlodes fontos a jovonek.', blank: 'fenntarthato', english: 'Sustainable development is important for the future.' },
        { sentence: 'Az ___ vedi a Foldet a sugarzastol.', blank: 'ozonreteg', english: 'The ozone layer protects Earth from radiation.' }
    ];

    const describeNatureQuestions = [
        { prompt: 'How would you say "The forest is beautiful" in Hungarian?', answer: 'az erdo gyonyoru', alternates: ['az erdo szep', 'gyonyoru az erdo'] },
        { prompt: 'How would you say "The mountain is tall" in Hungarian?', answer: 'a hegy magas', alternates: ['magas a hegy'] },
        { prompt: 'How would you say "The river is long" in Hungarian?', answer: 'a folyo hosszu', alternates: ['hosszu a folyo'] },
        { prompt: 'How would you say "The lake is deep" in Hungarian?', answer: 'a to mely', alternates: ['mely a to'] },
        { prompt: 'How would you say "The flowers are colorful" in Hungarian?', answer: 'a viragok szinesek', alternates: ['szinesek a viragok'] },
        { prompt: 'How would you say "The trees are green" in Hungarian?', answer: 'a fak zoldek', alternates: ['zoldek a fak'] }
    ];

    const dialoguePractice = [
        {
            speaker: 'A',
            line: 'Milyen szep az erdo!',
            response: 'Igen, ___ a termeszet.',
            responseEnglish: 'Yes, I love nature.',
            blank: 'szeretem'
        },
        {
            speaker: 'A',
            line: 'Mit gondolsz a klimavaltozasrol?',
            response: 'Szerintem nagyon ___ problema.',
            responseEnglish: 'I think it is a very serious problem.',
            blank: 'komoly'
        },
        {
            speaker: 'A',
            line: 'Ujrahasznositasz otthon?',
            response: 'Igen, minden nap ___ a szemetet.',
            responseEnglish: 'Yes, I sort the garbage every day.',
            blank: 'szelektalom'
        },
        {
            speaker: 'A',
            line: 'Hol van a legszebb to Magyarorszagon?',
            response: 'A ___ a legnagyobb es legszebb.',
            responseEnglish: 'Lake Balaton is the largest and most beautiful.',
            blank: 'Balaton'
        },
        {
            speaker: 'A',
            line: 'Szeretsz turazni?',
            response: 'Igen, gyakran megyek a ___.',
            responseEnglish: 'Yes, I often go to the mountains.',
            blank: 'hegyekbe'
        },
        {
            speaker: 'A',
            line: 'Milyen ido van ma?',
            response: 'Sut a ___ es meleg van.',
            responseEnglish: 'The sun is shining and it is warm.',
            blank: 'nap'
        }
    ];

    // ============================================
    // SCORE TRACKING
    // ============================================

    let scores = {
        stage1: { correct: 0, total: vocabularyCards.length },
        stage2: { correct: 0, total: landscapeMatching.length },
        stage3: { correct: 0, total: environmentFillIn.length },
        stage4: { correct: 0, total: describeNatureQuestions.length },
        stage5: { correct: 0, total: dialoguePractice.length }
    };

    let stage1Revealed = new Set();

    function updateTotalScore() {
        const totalCorrect = Object.values(scores).reduce((sum, s) => sum + s.correct, 0);
        const totalQuestions = Object.values(scores).reduce((sum, s) => sum + s.total, 0);
        const totalScoreEl = document.getElementById('total-score');
        if (totalScoreEl) {
            totalScoreEl.textContent = `Total Score: ${totalCorrect} / ${totalQuestions}`;
        }
    }

    // ============================================
    // BUILD PAGE CONTENT
    // ============================================

    const mainContent = document.getElementById('main-content');

    // Learning Objectives
    const objectivesSection = document.createElement('section');
    objectivesSection.className = 'mb-8';
    objectivesSection.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Learning Objectives</h2>
        <ul class="list-disc pl-6 space-y-2 text-slate-600">
            <li>Learn vocabulary for natural landscapes and features</li>
            <li>Understand environmental and ecological terminology</li>
            <li>Describe nature scenes and landscapes in Hungarian</li>
            <li>Discuss environmental issues and sustainability</li>
        </ul>
    `;
    mainContent.appendChild(objectivesSection);

    // Cultural Note
    const culturalNote = document.createElement('div');
    culturalNote.className = 'cultural-note mb-8';
    culturalNote.innerHTML = `
        <h3 class="font-bold text-amber-800 mb-2">Cultural Note: Nature in Hungary</h3>
        <p class="text-amber-900">Hungary is famous for its natural beauty, including <strong>a Balaton</strong> (Lake Balaton),
        Europe's largest freshwater lake, and the <strong>Hortobagy</strong>, a vast plain and UNESCO World Heritage site.
        The country has 10 national parks (<strong>nemzeti parkok</strong>) protecting diverse ecosystems.
        Hungarians have a strong tradition of <strong>turazas</strong> (hiking) and nature appreciation.</p>
    `;
    mainContent.appendChild(culturalNote);

    // Section 1: Nature Vocabulary
    const section1 = document.createElement('section');
    section1.className = 'mb-8';
    section1.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 1: Nature Vocabulary (Termeszet Szokincse)</h2>
        <table class="mb-4">
            <thead>
                <tr><th class="text-left">Hungarian</th><th class="text-left">English</th></tr>
            </thead>
            <tbody>
                ${natureVocabulary.map(item => `<tr><td class="font-medium eco-highlight">${item.hungarian}</td><td>${item.english}</td></tr>`).join('')}
            </tbody>
        </table>
    `;
    mainContent.appendChild(section1);

    // Section 2: Environment Vocabulary
    const section2 = document.createElement('section');
    section2.className = 'mb-8';
    section2.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 2: Environment Vocabulary (Kornyezeti Szavak)</h2>
        <table class="mb-4">
            <thead>
                <tr><th class="text-left">Hungarian</th><th class="text-left">English</th></tr>
            </thead>
            <tbody>
                ${environmentVocabulary.map(item => `<tr><td class="font-medium eco-highlight">${item.hungarian}</td><td>${item.english}</td></tr>`).join('')}
            </tbody>
        </table>
    `;
    mainContent.appendChild(section2);

    // Section 3: Animals in Nature
    const section3 = document.createElement('section');
    section3.className = 'mb-8';
    section3.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 3: Wildlife (Vadon Elo Allatok)</h2>
        <div class="grid md:grid-cols-2 gap-4">
            <div class="bg-green-50 p-4 rounded-lg">
                <h3 class="font-semibold text-green-800 mb-2">Animals</h3>
                <table class="text-sm">
                    <tbody>
                        ${animalsNature.map(item => `<tr><td class="font-medium eco-highlight pr-4">${item.hungarian}</td><td>${item.english}</td></tr>`).join('')}
                    </tbody>
                </table>
            </div>
            <div class="bg-blue-50 p-4 rounded-lg">
                <h3 class="font-semibold text-blue-800 mb-2">Weather</h3>
                <table class="text-sm">
                    <tbody>
                        ${weatherNature.map(item => `<tr><td class="font-medium text-blue-700 pr-4">${item.hungarian}</td><td>${item.english}</td></tr>`).join('')}
                    </tbody>
                </table>
            </div>
        </div>
    `;
    mainContent.appendChild(section3);

    // Section 4: Useful Phrases
    const section4 = document.createElement('section');
    section4.className = 'mb-8';
    section4.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 4: Useful Phrases</h2>
        <div class="bg-slate-50 rounded-lg p-4 space-y-3">
            <div class="flex flex-col md:flex-row md:items-center gap-2">
                <span class="font-medium eco-highlight min-w-[280px]">Milyen gyonyoru a termeszet!</span>
                <span class="text-slate-600">- How beautiful nature is!</span>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2">
                <span class="font-medium eco-highlight min-w-[280px]">Vedeni kell a kornyezetet.</span>
                <span class="text-slate-600">- We must protect the environment.</span>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2">
                <span class="font-medium eco-highlight min-w-[280px]">Szelektalod a szemetet?</span>
                <span class="text-slate-600">- Do you sort your garbage?</span>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2">
                <span class="font-medium eco-highlight min-w-[280px]">Az erdoket ki kell vagni.</span>
                <span class="text-slate-600">- The forests are being cut down.</span>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2">
                <span class="font-medium eco-highlight min-w-[280px]">A levego tiszta a hegyekben.</span>
                <span class="text-slate-600">- The air is clean in the mountains.</span>
            </div>
        </div>
    `;
    mainContent.appendChild(section4);

    // Total Score Display
    const totalScoreSection = document.createElement('div');
    totalScoreSection.className = 'bg-gradient-to-r from-green-600 to-green-700 text-white rounded-xl p-4 mb-8 text-center';
    totalScoreSection.innerHTML = `
        <h3 class="text-lg font-semibold mb-1">Interactive Exercises</h3>
        <p id="total-score" class="text-2xl font-bold">Total Score: 0 / 48</p>
    `;
    mainContent.appendChild(totalScoreSection);

    // ============================================
    // STAGE 1: VOCABULARY CARDS (20 items)
    // ============================================

    const stage1Section = document.createElement('section');
    stage1Section.className = 'mb-8';
    stage1Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 1: Vocabulary Cards</h2>
        <p class="text-slate-600 mb-4">Click each card to flip and reveal the English translation. Test yourself before flipping!</p>
        <div id="vocab-cards" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4"></div>
        <div id="stage1-score" class="text-slate-700 font-medium">Cards Revealed: 0 / ${vocabularyCards.length}</div>
    `;
    mainContent.appendChild(stage1Section);

    const vocabCardsContainer = document.getElementById('vocab-cards');
    vocabularyCards.forEach((card, idx) => {
        const cardDiv = document.createElement('div');
        cardDiv.className = 'flip-card h-24';
        cardDiv.setAttribute('data-idx', idx);
        cardDiv.innerHTML = `
            <div class="flip-card-inner">
                <div class="flip-card-front">
                    <span class="text-lg font-bold">${card.hungarian}</span>
                </div>
                <div class="flip-card-back">
                    <span class="text-lg font-semibold">${card.english}</span>
                </div>
            </div>
        `;
        cardDiv.addEventListener('click', function() {
            this.classList.toggle('flipped');
            if (!stage1Revealed.has(idx)) {
                stage1Revealed.add(idx);
                scores.stage1.correct = stage1Revealed.size;
                document.getElementById('stage1-score').textContent = `Cards Revealed: ${stage1Revealed.size} / ${vocabularyCards.length}`;
                updateTotalScore();
            }
        });
        vocabCardsContainer.appendChild(cardDiv);
    });

    // ============================================
    // STAGE 2: LANDSCAPE MATCHING (8 items)
    // ============================================

    const stage2Section = document.createElement('section');
    stage2Section.className = 'mb-8';
    stage2Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 2: Landscape Matching</h2>
        <p class="text-slate-600 mb-4">Match the English description to the correct Hungarian landscape term.</p>
        <div id="landscape-exercise" class="space-y-4"></div>
        <div id="stage2-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${landscapeMatching.length}</div>
    `;
    mainContent.appendChild(stage2Section);

    const landscapeExercise = document.getElementById('landscape-exercise');
    landscapeMatching.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col md:flex-row items-start md:items-center gap-2 p-3 bg-slate-50 rounded-lg';

        const label = document.createElement('span');
        label.className = 'min-w-[280px] text-slate-800 font-medium';
        label.textContent = q.description;

        const select = document.createElement('select');
        select.className = 'border border-slate-300 rounded-md px-3 py-2 w-40 focus:ring-2 focus:ring-green-500 focus:border-green-500';
        select.innerHTML = '<option value="">Select answer...</option>';

        const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);
        shuffledOptions.forEach(opt => {
            const option = document.createElement('option');
            option.value = opt;
            option.textContent = opt;
            select.appendChild(option);
        });

        const feedback = document.createElement('span');
        feedback.className = 'ml-2 text-sm font-semibold';

        select.addEventListener('change', function() {
            if (this.value === q.answer) {
                feedback.textContent = 'Correct!';
                feedback.className = 'ml-2 text-green-600 font-semibold';
                this.disabled = true;
                this.className = 'border border-green-500 bg-green-50 rounded-md px-3 py-2 w-40';
                scores.stage2.correct++;
                document.getElementById('stage2-score').textContent = `Score: ${scores.stage2.correct} / ${landscapeMatching.length}`;
                updateTotalScore();
            } else if (this.value !== '') {
                feedback.textContent = 'Try again!';
                feedback.className = 'ml-2 text-red-600 font-semibold';
            }
        });

        wrapper.appendChild(label);
        wrapper.appendChild(select);
        wrapper.appendChild(feedback);
        landscapeExercise.appendChild(wrapper);
    });

    // ============================================
    // STAGE 3: ENVIRONMENT FILL-IN (8 items)
    // ============================================

    const stage3Section = document.createElement('section');
    stage3Section.className = 'mb-8';
    stage3Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 3: Environment Fill-in</h2>
        <p class="text-slate-600 mb-4">Complete the sentences with the correct environmental vocabulary.</p>
        <div id="environment-exercise" class="space-y-4"></div>
        <div id="stage3-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${environmentFillIn.length}</div>
    `;
    mainContent.appendChild(stage3Section);

    const environmentExercise = document.getElementById('environment-exercise');
    const stage3Answers = new Array(environmentFillIn.length).fill(false);

    environmentFillIn.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col gap-2 p-3 bg-green-50 rounded-lg';

        const row = document.createElement('div');
        row.className = 'flex flex-col md:flex-row items-start md:items-center gap-2';

        const sentenceParts = q.sentence.split('___');
        const sentenceSpan = document.createElement('span');
        sentenceSpan.className = 'text-slate-800';

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-2 py-1 w-40 mx-1 focus:ring-2 focus:ring-green-500 focus:border-green-500 inline';
        input.setAttribute('aria-label', `Fill in blank for: ${q.sentence}`);

        sentenceSpan.appendChild(document.createTextNode(sentenceParts[0]));
        sentenceSpan.appendChild(input);
        if (sentenceParts[1]) {
            sentenceSpan.appendChild(document.createTextNode(sentenceParts[1]));
        }

        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold ml-2';

        const translation = document.createElement('div');
        translation.className = 'text-xs text-slate-500 italic';
        translation.textContent = `English: ${q.english}`;

        function checkAnswer() {
            const result = checkAccentAware(input.value, q.blank);

            if (result === 'correct') {
                feedback.textContent = 'Correct!';
                feedback.className = 'text-green-600 font-semibold ml-2';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-2 py-1 w-40 mx-1 inline';
                if (!stage3Answers[idx]) {
                    stage3Answers[idx] = true;
                    scores.stage3.correct++;
                    document.getElementById('stage3-score').textContent = `Score: ${scores.stage3.correct} / ${environmentFillIn.length}`;
                    updateTotalScore();
                }
            } else if (result === 'accent-warning') {
                feedback.textContent = 'Almost! Check accents.';
                feedback.className = 'text-yellow-600 font-semibold ml-2';
            } else if (input.value.trim() !== '') {
                feedback.textContent = 'Try again!';
                feedback.className = 'text-red-600 font-semibold ml-2';
            }
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkAnswer();
        });
        input.addEventListener('blur', checkAnswer);

        row.appendChild(sentenceSpan);
        row.appendChild(feedback);
        wrapper.appendChild(row);
        wrapper.appendChild(translation);
        environmentExercise.appendChild(wrapper);
    });

    // ============================================
    // STAGE 4: DESCRIBE NATURE (6 items)
    // ============================================

    const stage4Section = document.createElement('section');
    stage4Section.className = 'mb-8';
    stage4Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 4: Describe Nature</h2>
        <p class="text-slate-600 mb-4">Translate the descriptions of nature into Hungarian.</p>
        <div id="describe-exercise" class="space-y-4"></div>
        <div id="stage4-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${describeNatureQuestions.length}</div>
    `;
    mainContent.appendChild(stage4Section);

    const describeExercise = document.getElementById('describe-exercise');
    const stage4Answers = new Array(describeNatureQuestions.length).fill(false);

    describeNatureQuestions.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'p-4 bg-blue-50 rounded-lg';

        const promptDiv = document.createElement('div');
        promptDiv.className = 'mb-2';
        promptDiv.innerHTML = `<strong class="text-slate-800">${q.prompt}</strong>`;

        const inputDiv = document.createElement('div');
        inputDiv.className = 'flex flex-col md:flex-row items-start md:items-center gap-2';

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-3 py-2 w-full md:w-80 focus:ring-2 focus:ring-blue-500';
        input.setAttribute('aria-label', `Answer for: ${q.prompt}`);

        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold';

        function checkAnswer() {
            const userAnswer = normalizeAnswer(input.value);
            const correctAnswer = normalizeAnswer(q.answer);
            const alternates = q.alternates ? q.alternates.map(a => normalizeAnswer(a)) : [];
            const allCorrect = [correctAnswer, ...alternates];

            const exactMatch = allCorrect.some(a => a === userAnswer);
            const accentMatch = allCorrect.some(a => removeAccents(a) === removeAccents(userAnswer));

            if (exactMatch) {
                feedback.textContent = 'Correct!';
                feedback.className = 'text-green-600 font-semibold';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-3 py-2 w-full md:w-80';
                if (!stage4Answers[idx]) {
                    stage4Answers[idx] = true;
                    scores.stage4.correct++;
                    document.getElementById('stage4-score').textContent = `Score: ${scores.stage4.correct} / ${describeNatureQuestions.length}`;
                    updateTotalScore();
                }
            } else if (accentMatch) {
                feedback.textContent = 'Close! Check your accents.';
                feedback.className = 'text-yellow-600 font-semibold';
            } else if (input.value.trim() !== '') {
                feedback.textContent = `Try again! One answer: ${q.answer}`;
                feedback.className = 'text-red-600 font-semibold';
            }
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkAnswer();
        });
        input.addEventListener('blur', checkAnswer);

        inputDiv.appendChild(input);
        inputDiv.appendChild(feedback);
        wrapper.appendChild(promptDiv);
        wrapper.appendChild(inputDiv);
        describeExercise.appendChild(wrapper);
    });

    // ============================================
    // STAGE 5: DIALOGUE PRACTICE (6 items)
    // ============================================

    const stage5Section = document.createElement('section');
    stage5Section.className = 'mb-8';
    stage5Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 5: Dialogue Practice</h2>
        <p class="text-slate-600 mb-4">Complete these nature-related conversations by filling in the missing word.</p>
        <div id="dialogue-exercise" class="space-y-6"></div>
        <div id="stage5-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${dialoguePractice.length}</div>
    `;
    mainContent.appendChild(stage5Section);

    const dialogueExercise = document.getElementById('dialogue-exercise');
    const stage5Answers = new Array(dialoguePractice.length).fill(false);

    dialoguePractice.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'bg-gradient-to-r from-slate-50 to-green-50 rounded-lg p-4 border border-slate-200';

        const questionLine = document.createElement('div');
        questionLine.className = 'mb-3';
        questionLine.innerHTML = `
            <span class="inline-block bg-green-600 text-white text-xs font-bold px-2 py-1 rounded mr-2">A</span>
            <span class="text-slate-800 font-medium">${q.line}</span>
        `;

        const responseLine = document.createElement('div');
        responseLine.className = 'flex flex-wrap items-center gap-2';

        const speakerB = document.createElement('span');
        speakerB.className = 'inline-block bg-slate-600 text-white text-xs font-bold px-2 py-1 rounded';
        speakerB.textContent = 'B';

        const responseText = q.response.split('___');
        const responseSpan = document.createElement('span');
        responseSpan.className = 'text-slate-800';

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-2 py-1 w-32 focus:ring-2 focus:ring-green-500 focus:border-green-500';
        input.setAttribute('aria-label', `Response for dialogue ${idx + 1}`);

        responseSpan.appendChild(document.createTextNode(responseText[0]));
        responseSpan.appendChild(input);
        if (responseText[1]) {
            responseSpan.appendChild(document.createTextNode(responseText[1]));
        }

        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold';

        function checkAnswer() {
            const result = checkAccentAware(input.value, q.blank);

            if (result === 'correct') {
                feedback.textContent = 'Helyes! (Correct!)';
                feedback.className = 'text-green-600 font-semibold';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-2 py-1 w-32';
                if (!stage5Answers[idx]) {
                    stage5Answers[idx] = true;
                    scores.stage5.correct++;
                    document.getElementById('stage5-score').textContent = `Score: ${scores.stage5.correct} / ${dialoguePractice.length}`;
                    updateTotalScore();
                }
            } else if (result === 'accent-warning') {
                feedback.textContent = 'Majdnem! (Check accents)';
                feedback.className = 'text-yellow-600 font-semibold';
            } else if (input.value.trim() !== '') {
                feedback.textContent = 'Probald ujra! (Try again)';
                feedback.className = 'text-red-600 font-semibold';
            }
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkAnswer();
        });
        input.addEventListener('blur', checkAnswer);

        responseLine.appendChild(speakerB);
        responseLine.appendChild(responseSpan);
        responseLine.appendChild(feedback);

        const translationLine = document.createElement('div');
        translationLine.className = 'mt-2 text-xs text-slate-500 italic pl-8';
        translationLine.textContent = `(${q.responseEnglish})`;

        wrapper.appendChild(questionLine);
        wrapper.appendChild(responseLine);
        wrapper.appendChild(translationLine);
        dialogueExercise.appendChild(wrapper);
    });

    // ============================================
    // SUMMARY SECTION
    // ============================================

    const summarySection = document.createElement('section');
    summarySection.className = 'mt-8 p-6 bg-gradient-to-r from-green-50 to-slate-50 rounded-xl border border-green-200';
    summarySection.innerHTML = `
        <h2 class="text-xl font-bold text-green-800 mb-4">Lesson Summary</h2>
        <div class="grid md:grid-cols-2 gap-4 text-sm">
            <div>
                <h3 class="font-semibold text-slate-700 mb-2">Key Nature Vocabulary:</h3>
                <ul class="list-disc pl-5 text-slate-600 space-y-1">
                    <li>Landscapes: erdo, hegy, folyo, to, mezo, voelgy</li>
                    <li>Wildlife: madar, hal, szarvas, medve, farkas</li>
                    <li>Weather: eso, ho, nap, szel, felho, vihar</li>
                </ul>
            </div>
            <div>
                <h3 class="font-semibold text-slate-700 mb-2">Key Environment Vocabulary:</h3>
                <ul class="list-disc pl-5 text-slate-600 space-y-1">
                    <li>kornyezet - environment</li>
                    <li>szennyezes - pollution</li>
                    <li>ujrahasznositás - recycling</li>
                    <li>klimavaltozas - climate change</li>
                    <li>fenntarthato - sustainable</li>
                </ul>
            </div>
        </div>
        <div class="mt-4 p-3 bg-amber-50 rounded-lg border border-amber-200">
            <p class="text-amber-800 text-sm"><strong>Remember:</strong> Hungary's natural treasures include Lake Balaton, the Hortobagy plains, and the Bukk Mountains. Environmental awareness (kornyezettudatossag) is increasingly important in Hungarian society!</p>
        </div>
    `;
    mainContent.appendChild(summarySection);

    // Initialize total score
    updateTotalScore();
    </script>
</body>
</html>
