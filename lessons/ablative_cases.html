<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 32: Ablative & Location Cases - Learning Hungarian</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; }
        th, td { border: 1px solid #e2e8f0; padding: 0.5rem 1rem; text-align: center; }
        th { background: #f1f5f9; }
        .grammar-note {
            background: linear-gradient(135deg, #f0fdfa 0%, #e0f2fe 100%);
            border-left: 4px solid #0f766e;
        }
        .case-box { border: 2px solid #0f766e; background: #f0fdfa; }
    </style>
</head>
<body class="bg-slate-100 p-4 md:p-8">
    <header class="text-center mb-8">
        <div class="mb-4">
            <a href="../index.html" class="inline-flex items-center px-4 py-2 bg-slate-600 text-white text-sm font-medium rounded-lg hover:bg-slate-700 transition-colors">
                <svg class="mr-2 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                Back to Lessons
            </a>
        </div>
        <h1 class="text-3xl md:text-4xl font-bold text-slate-700">Lesson 32: Ablative & Location Cases</h1>
        <p class="text-slate-600 mt-1 max-w-2xl mx-auto">Master Hungarian's location case system - expressing "from" with ablative suffixes and understanding the complete three-way directional system (where, where to, where from).</p>
    </header>
    <main class="max-w-3xl mx-auto bg-white rounded-xl shadow-md p-6" id="main-content">
    </main>
    <footer class="text-center mt-12 py-4 border-t border-slate-300">
        <p class="text-sm text-slate-500">&copy; 2024 Hungarian Language Lessons</p>
    </footer>
    <script>
    const mainContent = document.getElementById('main-content');

    function removeAccents(str) {
        return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[oOuUaAeEiI]/g, m => ({ 'a':'a','A':'A','e':'e','E':'E','i':'i','I':'I','o':'o','O':'O','u':'u','U':'U' }[m] || m));
    }
    function normalizeHungarian(str) { return str.trim().toLowerCase(); }
    function checkWithAccentWarning(input, correct) {
        const inputVal = normalizeHungarian(input), correctVal = normalizeHungarian(correct);
        if (inputVal === correctVal) return 'correct';
        if (removeAccents(inputVal) === removeAccents(correctVal)) return 'accent-warning';
        return 'incorrect';
    }

    // ==================== SECTION 1: THREE-WAY SYSTEM ====================
    const section1 = document.createElement('section');
    section1.className = 'mb-8';
    section1.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 1: The Three-Way Location System</h2>
        <p class="mb-4 text-slate-600">Hungarian expresses location with a systematic three-way distinction for each type of location:</p>

        <div class="case-box p-4 rounded-lg mb-4">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-center">
                <div>
                    <h4 class="font-bold text-teal-700">WHERE? (Static)</h4>
                    <p class="text-sm text-slate-600">Hol?</p>
                </div>
                <div>
                    <h4 class="font-bold text-teal-700">WHERE TO? (Motion to)</h4>
                    <p class="text-sm text-slate-600">Hova?</p>
                </div>
                <div>
                    <h4 class="font-bold text-teal-700">WHERE FROM? (Motion from)</h4>
                    <p class="text-sm text-slate-600">Honnan?</p>
                </div>
            </div>
        </div>

        <h3 class="text-lg font-semibold text-slate-700 mb-2">Complete Case System Overview</h3>
        <table class="mb-4 w-full border text-sm">
            <tr><th class="border px-2">Type</th><th class="border px-2">Where? (Hol?)</th><th class="border px-2">Where to? (Hova?)</th><th class="border px-2">Where from? (Honnan?)</th></tr>
            <tr><td class="border px-2 font-medium">Inside (in)</td><td class="border px-2">-ban/-ben</td><td class="border px-2">-ba/-be</td><td class="border px-2 font-bold text-teal-700">-bol/-bol</td></tr>
            <tr><td class="border px-2 font-medium">Surface (on)</td><td class="border px-2">-on/-en/-on</td><td class="border px-2">-ra/-re</td><td class="border px-2 font-bold text-teal-700">-rol/-rol</td></tr>
            <tr><td class="border px-2 font-medium">Proximity (at)</td><td class="border px-2">-nal/-nel</td><td class="border px-2">-hoz/-hez/-hoz</td><td class="border px-2 font-bold text-teal-700">-tol/-tol</td></tr>
        </table>

        <div class="grammar-note p-4 rounded-lg mb-4">
            <h4 class="font-semibold text-teal-800 mb-2">This Lesson Focus: Ablative (From)</h4>
            <p class="text-slate-700 text-sm">This lesson focuses on the <strong>ablative cases</strong> (where from?) - the suffixes used to express movement away from a location: <strong>-bol/-bol</strong> (from inside), <strong>-rol/-rol</strong> (from surface), <strong>-tol/-tol</strong> (from proximity).</p>
        </div>
    `;
    mainContent.appendChild(section1);

    // ==================== SECTION 2: ELATIVE (-BOL/-BOL) ====================
    const section2 = document.createElement('section');
    section2.className = 'mb-8';
    section2.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 2: Elative Case (-bol/-bol) - From Inside</h2>
        <p class="mb-4 text-slate-600">The elative case expresses movement <strong>out of</strong> an enclosed space.</p>

        <table class="mb-4 w-full border text-sm">
            <tr><th class="border px-2">Vowel Type</th><th class="border px-2">Suffix</th><th class="border px-2">Example</th></tr>
            <tr><td class="border px-2">Back vowels</td><td class="border px-2 font-medium">-bol</td><td class="border px-2">haz → hazbol (from the house)</td></tr>
            <tr><td class="border px-2">Front vowels</td><td class="border px-2 font-medium">-bol</td><td class="border px-2">szoba → szobabol (from the room)</td></tr>
        </table>

        <h3 class="text-lg font-semibold text-slate-700 mb-2">Usage Examples</h3>
        <ul class="list-disc pl-6 mb-4 text-slate-600">
            <li><strong>Kijovok a hazbol.</strong> (I come out of the house.)</li>
            <li><strong>A vonat Budapestrol indul.</strong> (The train departs from Budapest.)</li>
            <li><strong>Vizet iszom az uvegbol.</strong> (I drink water from the bottle.)</li>
            <li><strong>Kiveszem a konyvet a taskambol.</strong> (I take the book out of my bag.)</li>
        </ul>

        <h3 class="text-lg font-semibold text-slate-700 mb-2">Common Nouns with Elative</h3>
        <table class="mb-4 w-full border text-sm">
            <tr><th class="border px-2">Noun</th><th class="border px-2">Meaning</th><th class="border px-2">Elative</th></tr>
            <tr><td class="border px-2">haz</td><td class="border px-2">house</td><td class="border px-2 font-medium">hazbol</td></tr>
            <tr><td class="border px-2">szoba</td><td class="border px-2">room</td><td class="border px-2 font-medium">szobabol</td></tr>
            <tr><td class="border px-2">iroda</td><td class="border px-2">office</td><td class="border px-2 font-medium">irodabol</td></tr>
            <tr><td class="border px-2">iskola</td><td class="border px-2">school</td><td class="border px-2 font-medium">iskolabol</td></tr>
            <tr><td class="border px-2">uveg</td><td class="border px-2">bottle</td><td class="border px-2 font-medium">uvegbol</td></tr>
            <tr><td class="border px-2">Budapest</td><td class="border px-2">Budapest</td><td class="border px-2 font-medium">Budapestrol</td></tr>
        </table>
    `;
    mainContent.appendChild(section2);

    // ==================== SECTION 3: DELATIVE (-ROL/-ROL) ====================
    const section3 = document.createElement('section');
    section3.className = 'mb-8';
    section3.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 3: Delative Case (-rol/-rol) - From Surface</h2>
        <p class="mb-4 text-slate-600">The delative case expresses movement <strong>off of</strong> a surface, or origin from geographic locations.</p>

        <table class="mb-4 w-full border text-sm">
            <tr><th class="border px-2">Vowel Type</th><th class="border px-2">Suffix</th><th class="border px-2">Example</th></tr>
            <tr><td class="border px-2">Back vowels</td><td class="border px-2 font-medium">-rol</td><td class="border px-2">asztal → asztalrol (from the table)</td></tr>
            <tr><td class="border px-2">Front vowels</td><td class="border px-2 font-medium">-rol</td><td class="border px-2">szek → szekrol (from the chair)</td></tr>
        </table>

        <h3 class="text-lg font-semibold text-slate-700 mb-2">Usage Examples</h3>
        <ul class="list-disc pl-6 mb-4 text-slate-600">
            <li><strong>Leveszem a konyvet az asztalrol.</strong> (I take the book from the table.)</li>
            <li><strong>Leszallok a buszrol.</strong> (I get off the bus.)</li>
            <li><strong>Magyarorszagrol jovok.</strong> (I come from Hungary.)</li>
            <li><strong>A kepet leveszem a falrol.</strong> (I take the picture from the wall.)</li>
        </ul>

        <div class="grammar-note p-4 rounded-lg mb-4">
            <h4 class="font-semibold text-teal-800 mb-2">Geographic Locations</h4>
            <p class="text-slate-700 text-sm">Many countries and some cities use the delative for "from": <strong>Magyarorszagrol</strong> (from Hungary), <strong>Amerikabol</strong> (from America - uses elative because of different noun class).</p>
        </div>
    `;
    mainContent.appendChild(section3);

    // ==================== SECTION 4: ABLATIVE (-TOL/-TOL) ====================
    const section4 = document.createElement('section');
    section4.className = 'mb-8';
    section4.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 4: Ablative Case (-tol/-tol) - From Proximity</h2>
        <p class="mb-4 text-slate-600">The ablative case expresses movement <strong>away from</strong> a person or the vicinity of something.</p>

        <table class="mb-4 w-full border text-sm">
            <tr><th class="border px-2">Vowel Type</th><th class="border px-2">Suffix</th><th class="border px-2">Example</th></tr>
            <tr><td class="border px-2">Back vowels</td><td class="border px-2 font-medium">-tol</td><td class="border px-2">orvos → orvostol (from the doctor)</td></tr>
            <tr><td class="border px-2">Front vowels</td><td class="border px-2 font-medium">-tol</td><td class="border px-2">Peter → Petertol (from Peter)</td></tr>
        </table>

        <h3 class="text-lg font-semibold text-slate-700 mb-2">Usage Examples</h3>
        <ul class="list-disc pl-6 mb-4 text-slate-600">
            <li><strong>Levelet kaptam Petertol.</strong> (I got a letter from Peter.)</li>
            <li><strong>Kerdezem az orvostol.</strong> (I ask from the doctor.)</li>
            <li><strong>Tavol vagyok a hazamtol.</strong> (I am far from my house.)</li>
            <li><strong>Mettol meddig?</strong> (From when to when? / From where to where?)</li>
        </ul>

        <h3 class="text-lg font-semibold text-slate-700 mb-2">Pronoun Forms</h3>
        <table class="mb-4 w-full border text-sm">
            <tr><th class="border px-2">Pronoun</th><th class="border px-2">Ablative</th><th class="border px-2">Example</th></tr>
            <tr><td class="border px-2">en</td><td class="border px-2 font-medium">tolem</td><td class="border px-2">Ker tolem valamit. (Ask something from me.)</td></tr>
            <tr><td class="border px-2">te</td><td class="border px-2 font-medium">toled</td><td class="border px-2">Varok toled valaszt. (I expect an answer from you.)</td></tr>
            <tr><td class="border px-2">o</td><td class="border px-2 font-medium">tole</td><td class="border px-2">Hallottam tole. (I heard from him/her.)</td></tr>
            <tr><td class="border px-2">mi</td><td class="border px-2 font-medium">tolunk</td><td class="border px-2">Tavol van tolunk. (It's far from us.)</td></tr>
            <tr><td class="border px-2">ti</td><td class="border px-2 font-medium">toletek</td><td class="border px-2">Kerek toletek segitseget. (I ask help from you.)</td></tr>
            <tr><td class="border px-2">ok</td><td class="border px-2 font-medium">toluk</td><td class="border px-2">Kaptam toluk. (I received from them.)</td></tr>
        </table>
    `;
    mainContent.appendChild(section4);

    // ==================== STAGE 1: SUFFIX SELECTION (12 items) ====================
    const stage1Data = [
        { noun: 'haz', answer: 'hazbol', meaning: 'from the house', type: 'elative' },
        { noun: 'asztal', answer: 'asztalrol', meaning: 'from the table', type: 'delative' },
        { noun: 'orvos', answer: 'orvostol', meaning: 'from the doctor', type: 'ablative' },
        { noun: 'szoba', answer: 'szobabol', meaning: 'from the room', type: 'elative' },
        { noun: 'fal', answer: 'falrol', meaning: 'from the wall', type: 'delative' },
        { noun: 'Peter', answer: 'Petertol', meaning: 'from Peter', type: 'ablative' },
        { noun: 'iskola', answer: 'iskolabol', meaning: 'from school', type: 'elative' },
        { noun: 'szek', answer: 'szekrol', meaning: 'from the chair', type: 'delative' },
        { noun: 'barat', answer: 'barattol', meaning: 'from friend', type: 'ablative' },
        { noun: 'iroda', answer: 'irodabol', meaning: 'from the office', type: 'elative' },
        { noun: 'fold', answer: 'foldrol', meaning: 'from the ground', type: 'delative' },
        { noun: 'tanar', answer: 'tanartol', meaning: 'from the teacher', type: 'ablative' }
    ];

    const stage1Section = document.createElement('section');
    stage1Section.className = 'mb-8';
    stage1Section.innerHTML = `
        <h2 class="text-xl font-semibold text-slate-700 mb-2">Stage 1: Form the Ablative</h2>
        <p class="mb-4 text-slate-600">Add the correct "from" suffix based on context. Press Enter to check.</p>
        <div id="stage1-exercise" class="space-y-4"></div>
        <div id="stage1-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${stage1Data.length}</div>
    `;
    mainContent.appendChild(stage1Section);

    const stage1Exercise = document.getElementById('stage1-exercise');
    const stage1Score = document.getElementById('stage1-score');
    let stage1Results = new Array(stage1Data.length).fill(null);

    stage1Data.forEach((item, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col gap-2 bg-slate-50 p-4 rounded-lg';
        wrapper.innerHTML = `
            <p class="font-medium text-slate-700">${idx + 1}. ${item.noun} → "${item.meaning}"</p>
            <div class="flex flex-col md:flex-row items-start md:items-center gap-2">
                <input type="text" class="border border-slate-300 rounded-md px-3 py-2 w-full md:w-48 focus:ring-2 focus:ring-teal-500" placeholder="Type form...">
                <span class="text-sm font-semibold stage1-feedback"></span>
            </div>
        `;
        stage1Exercise.appendChild(wrapper);
        const input = wrapper.querySelector('input');
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkStage1(idx, input, wrapper); });
    });

    function checkStage1(idx, input, wrapper) {
        const feedback = wrapper.querySelector('.stage1-feedback');
        const item = stage1Data[idx];
        const result = checkWithAccentWarning(input.value, item.answer);
        if (result === 'correct') {
            feedback.textContent = `Correct! "${item.answer}" (${item.type})`;
            feedback.className = 'text-sm font-semibold text-green-600 stage1-feedback';
            stage1Results[idx] = true;
        } else if (result === 'accent-warning') {
            feedback.textContent = `Almost! "${item.answer}"`;
            feedback.className = 'text-sm font-semibold text-yellow-600 stage1-feedback';
            stage1Results[idx] = 'partial';
        } else if (input.value.trim() === '') {
            feedback.textContent = ''; stage1Results[idx] = null;
        } else {
            feedback.textContent = `Expected: "${item.answer}"`;
            feedback.className = 'text-sm font-semibold text-red-600 stage1-feedback';
            stage1Results[idx] = false;
        }
        stage1Score.textContent = `Score: ${stage1Results.filter(r => r === true).length} / ${stage1Data.length}`;
    }

    // ==================== STAGE 2: PRONOUNS (8 items) ====================
    const stage2Data = [
        { prompt: 'from me', answer: 'tolem' },
        { prompt: 'from you (sg)', answer: 'toled' },
        { prompt: 'from him/her', answer: 'tole' },
        { prompt: 'from us', answer: 'tolunk' },
        { prompt: 'from you (pl)', answer: 'toletek' },
        { prompt: 'from them', answer: 'toluk' },
        { prompt: 'from you (formal)', answer: 'Ontol' },
        { prompt: 'from it', answer: 'attol' }
    ];

    const stage2Section = document.createElement('section');
    stage2Section.className = 'mb-8';
    stage2Section.innerHTML = `
        <h2 class="text-xl font-semibold text-slate-700 mb-2">Stage 2: Pronoun Ablatives</h2>
        <p class="mb-4 text-slate-600">Write the ablative form of each pronoun. Press Enter to check.</p>
        <div id="stage2-exercise" class="space-y-4"></div>
        <div id="stage2-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${stage2Data.length}</div>
    `;
    mainContent.appendChild(stage2Section);

    const stage2Exercise = document.getElementById('stage2-exercise');
    const stage2Score = document.getElementById('stage2-score');
    let stage2Results = new Array(stage2Data.length).fill(null);

    stage2Data.forEach((item, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col gap-2 bg-slate-50 p-4 rounded-lg';
        wrapper.innerHTML = `
            <p class="font-medium text-slate-700">${idx + 1}. ${item.prompt}</p>
            <div class="flex flex-col md:flex-row items-start md:items-center gap-2">
                <input type="text" class="border border-slate-300 rounded-md px-3 py-2 w-full md:w-48 focus:ring-2 focus:ring-teal-500" placeholder="Type pronoun...">
                <span class="text-sm font-semibold stage2-feedback"></span>
            </div>
        `;
        stage2Exercise.appendChild(wrapper);
        const input = wrapper.querySelector('input');
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkStage2(idx, input, wrapper); });
    });

    function checkStage2(idx, input, wrapper) {
        const feedback = wrapper.querySelector('.stage2-feedback');
        const item = stage2Data[idx];
        const result = checkWithAccentWarning(input.value, item.answer);
        if (result === 'correct') {
            feedback.textContent = `Correct! "${item.answer}"`;
            feedback.className = 'text-sm font-semibold text-green-600 stage2-feedback';
            stage2Results[idx] = true;
        } else if (result === 'accent-warning') {
            feedback.textContent = `Almost! "${item.answer}"`;
            feedback.className = 'text-sm font-semibold text-yellow-600 stage2-feedback';
            stage2Results[idx] = 'partial';
        } else if (input.value.trim() === '') {
            feedback.textContent = ''; stage2Results[idx] = null;
        } else {
            feedback.textContent = `Expected: "${item.answer}"`;
            feedback.className = 'text-sm font-semibold text-red-600 stage2-feedback';
            stage2Results[idx] = false;
        }
        stage2Score.textContent = `Score: ${stage2Results.filter(r => r === true).length} / ${stage2Data.length}`;
    }

    // ==================== STAGE 3: SENTENCE COMPLETION (10 items) ====================
    const stage3Data = [
        { sentence: 'Kijovok a _____.', blank: 'hazbol', translation: 'I come out of the house.' },
        { sentence: 'Leveszem a konyvet az _____.', blank: 'asztalrol', translation: 'I take the book from the table.' },
        { sentence: 'Levelet kaptam _____.', blank: 'Petertol', translation: 'I got a letter from Peter.' },
        { sentence: 'Leszallok a _____.', blank: 'buszrol', translation: 'I get off the bus.' },
        { sentence: 'Ker _____ segitseget.', blank: 'tolem', translation: 'Ask help from me.' },
        { sentence: 'Magyarorszag_____ jovok.', blank: 'rol', translation: 'I come from Hungary.' },
        { sentence: 'Hallottam _____.', blank: 'tole', translation: 'I heard from him/her.' },
        { sentence: 'Kiveszem a penzt a _____.', blank: 'taskambol', translation: 'I take money from my bag.' },
        { sentence: 'Tavol vagyok _____.', blank: 'toluk', translation: 'I am far from them.' },
        { sentence: 'A kep leesett a _____.', blank: 'falrol', translation: 'The picture fell from the wall.' }
    ];

    const stage3Section = document.createElement('section');
    stage3Section.className = 'mb-8';
    stage3Section.innerHTML = `
        <h2 class="text-xl font-semibold text-slate-700 mb-2">Stage 3: Complete the Sentence</h2>
        <p class="mb-4 text-slate-600">Fill in the blank with the correct ablative form. Press Enter to check.</p>
        <div id="stage3-exercise" class="space-y-4"></div>
        <div id="stage3-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${stage3Data.length}</div>
    `;
    mainContent.appendChild(stage3Section);

    const stage3Exercise = document.getElementById('stage3-exercise');
    const stage3Score = document.getElementById('stage3-score');
    let stage3Results = new Array(stage3Data.length).fill(null);

    stage3Data.forEach((item, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col gap-2 bg-slate-50 p-4 rounded-lg';
        wrapper.innerHTML = `
            <p class="font-medium text-slate-700">${idx + 1}. ${item.sentence}</p>
            <p class="text-sm text-slate-500">(${item.translation})</p>
            <div class="flex flex-col md:flex-row items-start md:items-center gap-2">
                <input type="text" class="border border-slate-300 rounded-md px-3 py-2 w-full md:w-48 focus:ring-2 focus:ring-teal-500" placeholder="Fill in blank...">
                <span class="text-sm font-semibold stage3-feedback"></span>
            </div>
        `;
        stage3Exercise.appendChild(wrapper);
        const input = wrapper.querySelector('input');
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkStage3(idx, input, wrapper); });
    });

    function checkStage3(idx, input, wrapper) {
        const feedback = wrapper.querySelector('.stage3-feedback');
        const item = stage3Data[idx];
        const result = checkWithAccentWarning(input.value, item.blank);
        if (result === 'correct') {
            feedback.textContent = `Correct!`;
            feedback.className = 'text-sm font-semibold text-green-600 stage3-feedback';
            stage3Results[idx] = true;
        } else if (result === 'accent-warning') {
            feedback.textContent = `Almost! "${item.blank}"`;
            feedback.className = 'text-sm font-semibold text-yellow-600 stage3-feedback';
            stage3Results[idx] = 'partial';
        } else if (input.value.trim() === '') {
            feedback.textContent = ''; stage3Results[idx] = null;
        } else {
            feedback.textContent = `Expected: "${item.blank}"`;
            feedback.className = 'text-sm font-semibold text-red-600 stage3-feedback';
            stage3Results[idx] = false;
        }
        stage3Score.textContent = `Score: ${stage3Results.filter(r => r === true).length} / ${stage3Data.length}`;
    }

    // ==================== STAGE 4: TRANSLATION (10 items) ====================
    const stage4Data = [
        { english: 'I come from Hungary.', hungarian: 'Magyarorszagrol jovok.' },
        { english: 'Take the book from the table.', hungarian: 'Vedd le a konyvet az asztalrol.' },
        { english: 'I got a letter from her.', hungarian: 'Levelet kaptam tole.' },
        { english: 'I exit the house.', hungarian: 'Kijovok a hazbol.' },
        { english: 'Ask from him!', hungarian: 'Kerdezd tole!' },
        { english: 'I get off the train.', hungarian: 'Leszallok a vonatrol.' },
        { english: 'Far from here.', hungarian: 'Tavol innen.' },
        { english: 'From morning to evening.', hungarian: 'Reggeltol estig.' },
        { english: 'I take it out of my pocket.', hungarian: 'Kiveszem a zsebembol.' },
        { english: 'From them I heard.', hungarian: 'Toluk hallottam.' }
    ];

    const stage4Section = document.createElement('section');
    stage4Section.className = 'mb-8';
    stage4Section.innerHTML = `
        <h2 class="text-xl font-semibold text-slate-700 mb-2">Stage 4: Translation</h2>
        <p class="mb-4 text-slate-600">Translate each sentence into Hungarian. Press Enter to check.</p>
        <div id="stage4-exercise" class="space-y-4"></div>
        <div id="stage4-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${stage4Data.length}</div>
    `;
    mainContent.appendChild(stage4Section);

    const stage4Exercise = document.getElementById('stage4-exercise');
    const stage4Score = document.getElementById('stage4-score');
    let stage4Results = new Array(stage4Data.length).fill(null);

    stage4Data.forEach((item, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col gap-2 bg-slate-50 p-4 rounded-lg';
        wrapper.innerHTML = `
            <p class="font-medium text-slate-700">${idx + 1}. "${item.english}"</p>
            <div class="flex flex-col md:flex-row items-start md:items-center gap-2">
                <input type="text" class="border border-slate-300 rounded-md px-3 py-2 w-full focus:ring-2 focus:ring-teal-500" placeholder="Type Hungarian...">
                <span class="text-sm font-semibold stage4-feedback"></span>
            </div>
        `;
        stage4Exercise.appendChild(wrapper);
        const input = wrapper.querySelector('input');
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkStage4(idx, input, wrapper); });
    });

    function checkStage4(idx, input, wrapper) {
        const feedback = wrapper.querySelector('.stage4-feedback');
        const item = stage4Data[idx];
        const result = checkWithAccentWarning(input.value, item.hungarian);
        if (result === 'correct') {
            feedback.textContent = `Correct!`;
            feedback.className = 'text-sm font-semibold text-green-600 stage4-feedback';
            stage4Results[idx] = true;
        } else if (result === 'accent-warning') {
            feedback.textContent = `Almost!`;
            feedback.className = 'text-sm font-semibold text-yellow-600 stage4-feedback';
            stage4Results[idx] = 'partial';
        } else if (input.value.trim() === '') {
            feedback.textContent = ''; stage4Results[idx] = null;
        } else {
            feedback.textContent = `Expected: "${item.hungarian}"`;
            feedback.className = 'text-sm font-semibold text-red-600 stage4-feedback';
            stage4Results[idx] = false;
        }
        stage4Score.textContent = `Score: ${stage4Results.filter(r => r === true).length} / ${stage4Data.length}`;
    }

    // ==================== FINAL SUMMARY ====================
    const summarySection = document.createElement('section');
    summarySection.className = 'mb-8 mt-12 bg-gradient-to-r from-teal-50 to-slate-50 p-6 rounded-xl';
    summarySection.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Lesson Summary</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <h3 class="font-semibold text-teal-700 mb-2">Elative (-bol/-bol)</h3>
                <p class="text-sm text-slate-700">From inside: hazbol, szobabol</p>
            </div>
            <div>
                <h3 class="font-semibold text-teal-700 mb-2">Delative (-rol/-rol)</h3>
                <p class="text-sm text-slate-700">From surface: asztalrol, falrol</p>
            </div>
            <div>
                <h3 class="font-semibold text-teal-700 mb-2">Ablative (-tol/-tol)</h3>
                <p class="text-sm text-slate-700">From proximity: orvostol, tolem</p>
            </div>
        </div>
    `;
    mainContent.appendChild(summarySection);
    </script>
</body>
</html>
