<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 27: Future Tense & Intentions - Learning Hungarian</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; }
        th, td { border: 1px solid #e2e8f0; padding: 0.5rem 1rem; text-align: center; }
        th { background: #f1f5f9; }
    </style>
</head>
<body class="bg-slate-100 p-4 md:p-8">
    <header class="text-center mb-8">
        <div class="mb-4">
            <a href="../index.html" class="inline-flex items-center px-4 py-2 bg-slate-600 text-white text-sm font-medium rounded-lg hover:bg-slate-700 transition-colors">
                <svg class="mr-2 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                Back to Lessons
            </a>
        </div>
        <h1 class="text-3xl md:text-4xl font-bold text-slate-700">Lesson 27: Future Tense & Intentions <span class="block text-xl text-slate-500 font-normal">(Jovoidoo es szandekok)</span></h1>
        <p class="text-slate-600 mt-2 max-w-2xl mx-auto">Learn to express future actions and intentions in Hungarian using fog + infinitive and intention verbs.</p>
        <div class="mt-4 inline-block bg-purple-100 text-purple-800 px-3 py-1 rounded-full text-sm font-medium">CEFR Level: B1</div>
    </header>
    <main class="max-w-3xl mx-auto bg-white rounded-xl shadow-md p-6" id="main-content">
        <!-- Content will be generated by JavaScript -->
    </main>
    <footer class="text-center mt-12 py-4 border-t border-slate-300">
        <p class="text-sm text-slate-500">&copy; 2024 Hungarian Language Lessons</p>
    </footer>
    <script>
    const main = document.getElementById('main-content');

    // Helper function for accent-insensitive comparison
    function removeAccents(str) {
        return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[oOuUaAeEiI]/gi, function(m) {
            const map = { 'a':'a','A':'A','e':'e','E':'E','i':'i','I':'I','o':'o','O':'O','u':'u','U':'U' };
            return map[m] || m;
        }).toLowerCase();
    }

    // ==================== INTRODUCTION ====================
    const introSection = document.createElement('section');
    introSection.className = 'mb-10';
    introSection.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4 border-b-2 border-purple-500 pb-2">Introduction: Future Tense in Hungarian</h2>
        <p class="mb-4 text-slate-600">Hungarian has two main ways to express future:</p>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div class="bg-purple-50 p-4 rounded-lg">
                <h3 class="font-bold text-purple-800 mb-2">1. Fog + Infinitive</h3>
                <p class="text-purple-700 text-sm">Used for predictions and general future</p>
                <p class="text-purple-900 mt-2"><strong>Example:</strong> Holnap esni <em>fog</em>.</p>
                <p class="text-purple-600 text-sm">(It will rain tomorrow.)</p>
            </div>
            <div class="bg-blue-50 p-4 rounded-lg">
                <h3 class="font-bold text-blue-800 mb-2">2. Present Tense</h3>
                <p class="text-blue-700 text-sm">Used for scheduled/planned events</p>
                <p class="text-blue-900 mt-2"><strong>Example:</strong> Holnap utazom.</p>
                <p class="text-blue-600 text-sm">(I'm traveling tomorrow.)</p>
            </div>
        </div>
        <div class="bg-slate-50 p-4 rounded-lg">
            <h3 class="font-semibold text-slate-700 mb-2">Conjugation of "fog" (will):</h3>
            <table class="text-sm">
                <tr><th>Pronoun</th><th>Hungarian</th><th>Example</th></tr>
                <tr><td>en</td><td>fogok</td><td>Fogok tanulni. (I will study.)</td></tr>
                <tr><td>te</td><td>fogsz</td><td>Fogsz jonni? (Will you come?)</td></tr>
                <tr><td>o</td><td>fog</td><td>O fog segiteni. (He/She will help.)</td></tr>
                <tr><td>mi</td><td>fogunk</td><td>Fogunk utazni. (We will travel.)</td></tr>
                <tr><td>ti</td><td>fogtok</td><td>Fogtok enni? (Will you eat?)</td></tr>
                <tr><td>ok</td><td>fognak</td><td>Ok fognak varni. (They will wait.)</td></tr>
            </table>
        </div>
    `;
    main.appendChild(introSection);

    // ==================== SECTION 1: FUTURE FORMATION ====================
    const futureSection = document.createElement('section');
    futureSection.className = 'mb-10';
    futureSection.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4 border-b-2 border-purple-500 pb-2">Section 1: Future Formation with "fog"</h2>
        <p class="mb-4 text-slate-600">Practice forming future tense sentences using fog + infinitive.</p>
        <h3 class="text-lg font-semibold text-slate-700 mb-3">Exercise 1.1: Complete the Future Tense</h3>
        <p class="mb-4 text-sm text-slate-500">Fill in the correct form of "fog" to complete the future tense.</p>
        <div id="future-exercise" class="space-y-3"></div>
        <div id="future-score" class="mt-4 text-slate-700 font-medium"></div>
    `;
    main.appendChild(futureSection);

    const futureQuestions = [
        { sentence: 'En ___ tanulni holnap.', answer: 'fogok', translation: 'I will study tomorrow.' },
        { sentence: 'Te ___ jonni a bulira?', answer: 'fogsz', translation: 'Will you come to the party?' },
        { sentence: 'O ___ dolgozni este.', answer: 'fog', translation: 'He/She will work in the evening.' },
        { sentence: 'Mi ___ utazni nyaron.', answer: 'fogunk', translation: 'We will travel in summer.' },
        { sentence: 'Ti ___ enni a etteremben?', answer: 'fogtok', translation: 'Will you eat at the restaurant?' },
        { sentence: 'Ok ___ varni a megallonal.', answer: 'fognak', translation: 'They will wait at the stop.' },
        { sentence: 'Holnap ___ esni az eso.', answer: 'fog', translation: 'It will rain tomorrow.' },
        { sentence: 'En ___ segiteni neked.', answer: 'fogok', translation: 'I will help you.' },
        { sentence: 'Te mikor ___ erkezni?', answer: 'fogsz', translation: 'When will you arrive?' },
        { sentence: 'A gyerekek ___ jatszani.', answer: 'fognak', translation: 'The children will play.' },
        { sentence: 'Mi ___ megnezni a filmet.', answer: 'fogunk', translation: 'We will watch the movie.' },
        { sentence: 'Te ___ hivni engem?', answer: 'fogsz', translation: 'Will you call me?' }
    ];

    const futureDiv = document.getElementById('future-exercise');
    const futureScoreDiv = document.getElementById('future-score');

    futureQuestions.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col md:flex-row items-start md:items-center gap-2';
        const label = document.createElement('span');
        label.className = 'min-w-[260px] text-slate-800';
        label.textContent = q.sentence;
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-3 py-1 w-28 text-center focus:ring-2 focus:ring-purple-500';
        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold';
        input.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') checkFutureAnswer(idx);
        });
        wrapper.appendChild(label);
        wrapper.appendChild(input);
        wrapper.appendChild(feedback);
        futureDiv.appendChild(wrapper);
    });

    function checkFutureAnswer(idx) {
        const wrapper = futureDiv.children[idx];
        const input = wrapper.querySelector('input');
        const feedback = wrapper.querySelector('span:last-child');
        const correct = futureQuestions[idx].answer;
        const userAnswer = input.value.trim().toLowerCase();

        if (userAnswer === correct.toLowerCase()) {
            feedback.textContent = `Correct!`;
            feedback.className = 'text-sm font-semibold text-green-600';
        } else if (removeAccents(userAnswer) === removeAccents(correct)) {
            feedback.textContent = `Watch accents!`;
            feedback.className = 'text-sm font-semibold text-yellow-600';
        } else if (userAnswer === '') {
            feedback.textContent = '';
        } else {
            feedback.textContent = `Answer: ${correct}`;
            feedback.className = 'text-sm font-semibold text-red-600';
        }
        updateFutureScore();
    }

    function updateFutureScore() {
        let correct = 0;
        for (let i = 0; i < futureQuestions.length; i++) {
            const feedback = futureDiv.children[i].querySelector('span:last-child');
            if (feedback.textContent === 'Correct!') correct++;
        }
        futureScoreDiv.textContent = `Score: ${correct} / ${futureQuestions.length}`;
    }
    futureScoreDiv.textContent = `Score: 0 / ${futureQuestions.length}`;

    // ==================== SECTION 2: INTENTION VS PREDICTION ====================
    const intentionSection = document.createElement('section');
    intentionSection.className = 'mb-10';
    intentionSection.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4 border-b-2 border-purple-500 pb-2">Section 2: Intentions vs Predictions</h2>
        <p class="mb-4 text-slate-600">Learn to distinguish between expressing intentions and predictions.</p>
        <div class="bg-slate-50 p-4 rounded-lg mb-6">
            <h3 class="font-semibold text-slate-700 mb-2">Key Verbs for Intentions:</h3>
            <ul class="text-sm space-y-1">
                <li><strong>akarok</strong> - I want (to)</li>
                <li><strong>szeretnek</strong> - I would like (to)</li>
                <li><strong>tervezem</strong> - I plan (to)</li>
                <li><strong>szandekozom</strong> - I intend (to)</li>
            </ul>
        </div>
        <h3 class="text-lg font-semibold text-slate-700 mb-3">Exercise 2.1: Intention or Prediction?</h3>
        <p class="mb-4 text-sm text-slate-500">Identify whether each sentence expresses an intention or a prediction.</p>
        <div id="intention-exercise" class="space-y-3"></div>
        <div id="intention-score" class="mt-4 text-slate-700 font-medium"></div>
    `;
    main.appendChild(intentionSection);

    const intentionQuestions = [
        { sentence: 'Holnap esni fog. (It will rain tomorrow.)', answer: 'prediction', translation: 'Weather prediction' },
        { sentence: 'Akarok tanulni magyarul. (I want to learn Hungarian.)', answer: 'intention', translation: 'Personal intention' },
        { sentence: 'A vonat 8-kor indul. (The train leaves at 8.)', answer: 'prediction', translation: 'Scheduled event' },
        { sentence: 'Szeretnek utazni Olaszorszagba. (I would like to travel to Italy.)', answer: 'intention', translation: 'Personal desire' },
        { sentence: 'Tervezem, hogy hazat veszek. (I plan to buy a house.)', answer: 'intention', translation: 'Personal plan' },
        { sentence: 'A meccs erdekes lesz. (The match will be interesting.)', answer: 'prediction', translation: 'General prediction' },
        { sentence: 'Szandekozom lemonani. (I intend to resign.)', answer: 'intention', translation: 'Personal intention' },
        { sentence: 'A nap fel fog kelni 6-kor. (The sun will rise at 6.)', answer: 'prediction', translation: 'Natural event' },
        { sentence: 'El akarom mondani az igazat. (I want to tell the truth.)', answer: 'intention', translation: 'Personal intention' },
        { sentence: 'Szerintem nyerni fogunk. (I think we will win.)', answer: 'prediction', translation: 'Prediction/opinion' }
    ];

    const intentionDiv = document.getElementById('intention-exercise');
    const intentionScoreDiv = document.getElementById('intention-score');

    intentionQuestions.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col md:flex-row items-start md:items-center gap-2';
        const label = document.createElement('span');
        label.className = 'min-w-[300px] text-slate-800';
        label.textContent = q.sentence;
        const select = document.createElement('select');
        select.className = 'border border-slate-300 rounded-md px-3 py-1 w-36 focus:ring-2 focus:ring-purple-500';
        select.innerHTML = `
            <option value="">Select...</option>
            <option value="intention">Intention</option>
            <option value="prediction">Prediction</option>
        `;
        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold';
        select.addEventListener('change', function() {
            checkIntentionAnswer(idx);
        });
        wrapper.appendChild(label);
        wrapper.appendChild(select);
        wrapper.appendChild(feedback);
        intentionDiv.appendChild(wrapper);
    });

    function checkIntentionAnswer(idx) {
        const wrapper = intentionDiv.children[idx];
        const select = wrapper.querySelector('select');
        const feedback = wrapper.querySelector('span:last-child');
        const correct = intentionQuestions[idx].answer;

        if (select.value === correct) {
            feedback.textContent = `Correct! (${intentionQuestions[idx].translation})`;
            feedback.className = 'text-sm font-semibold text-green-600';
        } else if (select.value === '') {
            feedback.textContent = '';
        } else {
            feedback.textContent = `Try again!`;
            feedback.className = 'text-sm font-semibold text-red-600';
        }
        updateIntentionScore();
    }

    function updateIntentionScore() {
        let correct = 0;
        for (let i = 0; i < intentionQuestions.length; i++) {
            const feedback = intentionDiv.children[i].querySelector('span:last-child');
            if (feedback.textContent.startsWith('Correct!')) correct++;
        }
        intentionScoreDiv.textContent = `Score: ${correct} / ${intentionQuestions.length}`;
    }
    intentionScoreDiv.textContent = `Score: 0 / ${intentionQuestions.length}`;

    // ==================== SECTION 3: TIME MARKERS ====================
    const timeSection = document.createElement('section');
    timeSection.className = 'mb-10';
    timeSection.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4 border-b-2 border-purple-500 pb-2">Section 3: Future Time Markers</h2>
        <p class="mb-4 text-slate-600">Learn common time expressions used with future tense.</p>
        <div class="bg-purple-50 p-4 rounded-lg mb-6">
            <h3 class="font-semibold text-purple-800 mb-2">Future Time Expressions:</h3>
            <div class="grid grid-cols-2 gap-2 text-sm">
                <p><strong>holnap</strong> - tomorrow</p>
                <p><strong>holnaputan</strong> - day after tomorrow</p>
                <p><strong>jovo heten</strong> - next week</p>
                <p><strong>jovo honapban</strong> - next month</p>
                <p><strong>jovo evben</strong> - next year</p>
                <p><strong>kesobb</strong> - later</p>
                <p><strong>hamarosan</strong> - soon</p>
                <p><strong>egy ora mulva</strong> - in one hour</p>
            </div>
        </div>
        <h3 class="text-lg font-semibold text-slate-700 mb-3">Exercise 3.1: Select the Correct Time Marker</h3>
        <p class="mb-4 text-sm text-slate-500">Choose the appropriate time marker for each sentence.</p>
        <div id="time-exercise" class="space-y-3"></div>
        <div id="time-score" class="mt-4 text-slate-700 font-medium"></div>
    `;
    main.appendChild(timeSection);

    const timeQuestions = [
        { sentence: '___ fogok utazni Parizsba. (tomorrow)', answer: 'holnap', translation: 'Tomorrow I will travel to Paris.' },
        { sentence: 'A koncert ___ lesz. (next week)', answer: 'jovo heten', translation: 'The concert will be next week.' },
        { sentence: '___ erkezik a vonat. (soon)', answer: 'hamarosan', translation: 'The train will arrive soon.' },
        { sentence: 'A megbeszeles ___ kezdodik. (in one hour)', answer: 'egy ora mulva', translation: 'The meeting starts in one hour.' },
        { sentence: '___ meglátogatom a szuleimet. (next month)', answer: 'jovo honapban', translation: 'Next month I will visit my parents.' },
        { sentence: 'Majd ___ beszelunk. (later)', answer: 'kesobb', translation: 'We will talk later.' },
        { sentence: '___ utazunk Gorogorszagba. (next year)', answer: 'jovo evben', translation: 'Next year we will travel to Greece.' },
        { sentence: '___ visszajonnek. (day after tomorrow)', answer: 'holnaputan', translation: 'They will come back the day after tomorrow.' },
        { sentence: 'A busz ___ indul. (in 10 minutes)', answer: 'tiz perc mulva', translation: 'The bus leaves in 10 minutes.' },
        { sentence: '___ vacsorazunk. (later tonight)', answer: 'kesobb', translation: 'We will have dinner later.' }
    ];

    const timeDiv = document.getElementById('time-exercise');
    const timeScoreDiv = document.getElementById('time-score');

    timeQuestions.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col md:flex-row items-start md:items-center gap-2';
        const label = document.createElement('span');
        label.className = 'min-w-[300px] text-slate-800';
        label.textContent = q.sentence;
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = 'Time marker...';
        input.className = 'border border-slate-300 rounded-md px-3 py-1 w-40 focus:ring-2 focus:ring-purple-500';
        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold';
        input.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') checkTimeAnswer(idx);
        });
        wrapper.appendChild(label);
        wrapper.appendChild(input);
        wrapper.appendChild(feedback);
        timeDiv.appendChild(wrapper);
    });

    function checkTimeAnswer(idx) {
        const wrapper = timeDiv.children[idx];
        const input = wrapper.querySelector('input');
        const feedback = wrapper.querySelector('span:last-child');
        const correct = timeQuestions[idx].answer;
        const userAnswer = input.value.trim().toLowerCase();

        if (userAnswer === correct.toLowerCase() || removeAccents(userAnswer) === removeAccents(correct)) {
            feedback.textContent = `Correct!`;
            feedback.className = 'text-sm font-semibold text-green-600';
        } else if (userAnswer === '') {
            feedback.textContent = '';
        } else {
            feedback.textContent = `Answer: ${correct}`;
            feedback.className = 'text-sm font-semibold text-red-600';
        }
        updateTimeScore();
    }

    function updateTimeScore() {
        let correct = 0;
        for (let i = 0; i < timeQuestions.length; i++) {
            const feedback = timeDiv.children[i].querySelector('span:last-child');
            if (feedback.textContent === 'Correct!') correct++;
        }
        timeScoreDiv.textContent = `Score: ${correct} / ${timeQuestions.length}`;
    }
    timeScoreDiv.textContent = `Score: 0 / ${timeQuestions.length}`;

    // ==================== SECTION 4: FUTURE PLANS DIALOGUES ====================
    const dialogueSection = document.createElement('section');
    dialogueSection.className = 'mb-10';
    dialogueSection.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4 border-b-2 border-purple-500 pb-2">Section 4: Future Plans Dialogues</h2>
        <p class="mb-4 text-slate-600">Practice having conversations about future plans.</p>
        <h3 class="text-lg font-semibold text-slate-700 mb-3">Exercise 4.1: Complete the Dialogues</h3>
        <div id="dialogue-exercise" class="space-y-5"></div>
        <div id="dialogue-score" class="mt-4 text-slate-700 font-medium"></div>
    `;
    main.appendChild(dialogueSection);

    const dialogueScenarios = [
        { context: 'Weekend plans', prompt: 'A: Mit fogsz csinalni a hetvegen?', yourLine: 'Say you will visit your grandmother', answer: 'meg fogom latogatni a nagymamam', alternatives: ['nagymamamat fogom meglátogatni'] },
        { context: 'Vacation', prompt: 'A: Hova fogtok menni nyaron?', yourLine: 'Say you will go to the seaside', answer: 'a tengerpartra fogunk menni', alternatives: ['tengerpartra megyunk'] },
        { context: 'Career', prompt: 'A: Mit akarsz csinalni a jovoben?', yourLine: 'Say you want to become a doctor', answer: 'orvos akarok lenni', alternatives: ['orvos szeretnek lenni'] },
        { context: 'Studies', prompt: 'A: Mit fogsz tanulni az egyetemen?', yourLine: 'Say you will study economics', answer: 'kozgazdasagtant fogok tanulni', alternatives: ['gazdasagtant fogok tanulni'] },
        { context: 'Evening plans', prompt: 'A: Mit fogtok csinalni este?', yourLine: 'Say you will watch a movie', answer: 'filmet fogunk nezni', alternatives: ['moziba megyunk'] },
        { context: 'Tomorrow', prompt: 'A: Mit tervezel holnapra?', yourLine: 'Say you plan to go shopping', answer: 'vasarolni tervezek menni', alternatives: ['bevasarolni megyek'] },
        { context: 'Party', prompt: 'A: El fogsz jonni a bulira?', yourLine: 'Say yes, you will come', answer: 'igen el fogok jonni', alternatives: ['igen megyek', 'persze ott leszek'] },
        { context: 'Weather', prompt: 'A: Milyen ido lesz holnap?', yourLine: 'Say it will be sunny', answer: 'napos ido lesz', alternatives: ['napos lesz'] },
        { context: 'Job', prompt: 'A: Hol fogsz dolgozni?', yourLine: 'Say you will work at a hospital', answer: 'korhazban fogok dolgozni', alternatives: ['korhazban dolgozom majd'] },
        { context: 'Meeting', prompt: 'A: Mikor fogunk talalkozni?', yourLine: 'Say you will meet tomorrow at 3', answer: 'holnap haromkor fogunk talalkozni', alternatives: ['holnap 3-kor talalkozunk'] }
    ];

    const dialogueDiv = document.getElementById('dialogue-exercise');
    const dialogueScoreDiv = document.getElementById('dialogue-score');

    dialogueScenarios.forEach((scenario, idx) => {
        const card = document.createElement('div');
        card.className = 'bg-slate-50 p-4 rounded-lg';
        card.innerHTML = `
            <div class="text-xs font-semibold text-purple-600 mb-1">${scenario.context}</div>
            <p class="text-slate-700 mb-1">${scenario.prompt}</p>
            <p class="text-slate-500 text-sm italic mb-2">(${scenario.yourLine})</p>
        `;
        const inputRow = document.createElement('div');
        inputRow.className = 'flex flex-col md:flex-row items-start md:items-center gap-2';
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = 'Your response in Hungarian...';
        input.className = 'border border-slate-300 rounded-md px-3 py-2 w-full md:w-80 focus:ring-2 focus:ring-purple-500';
        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold';
        input.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') checkDialogueAnswer(idx);
        });
        inputRow.appendChild(input);
        inputRow.appendChild(feedback);
        card.appendChild(inputRow);
        dialogueDiv.appendChild(card);
    });

    function checkDialogueAnswer(idx) {
        const card = dialogueDiv.children[idx];
        const input = card.querySelector('input');
        const feedback = card.querySelector('span');
        const scenario = dialogueScenarios[idx];
        const userAnswer = input.value.trim().toLowerCase().replace(/[?.!,]/g, '');
        const normalizedUser = removeAccents(userAnswer);

        const allCorrect = [scenario.answer, ...scenario.alternatives];
        const isExact = allCorrect.some(a => userAnswer === a.toLowerCase().replace(/[?.!,]/g, ''));
        const isAccent = allCorrect.some(a => normalizedUser === removeAccents(a.replace(/[?.!,]/g, '')));

        if (isExact) {
            feedback.textContent = `Correct!`;
            feedback.className = 'text-sm font-semibold text-green-600';
        } else if (isAccent) {
            feedback.textContent = `Watch accents!`;
            feedback.className = 'text-sm font-semibold text-yellow-600';
        } else if (userAnswer === '') {
            feedback.textContent = '';
        } else {
            feedback.textContent = `Try: ${scenario.answer}`;
            feedback.className = 'text-sm font-semibold text-red-600';
        }
        updateDialogueScore();
    }

    function updateDialogueScore() {
        let correct = 0;
        for (let i = 0; i < dialogueScenarios.length; i++) {
            const feedback = dialogueDiv.children[i].querySelector('span');
            if (feedback.textContent === 'Correct!') correct++;
        }
        dialogueScoreDiv.textContent = `Score: ${correct} / ${dialogueScenarios.length}`;
    }
    dialogueScoreDiv.textContent = `Score: 0 / ${dialogueScenarios.length}`;

    // ==================== SECTION 5: TRANSLATION PRACTICE ====================
    const translationSection = document.createElement('section');
    translationSection.className = 'mb-10';
    translationSection.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4 border-b-2 border-purple-500 pb-2">Section 5: Translation Practice</h2>
        <p class="mb-4 text-slate-600">Translate these sentences into Hungarian using future tense.</p>
        <h3 class="text-lg font-semibold text-slate-700 mb-3">Exercise 5.1: English to Hungarian</h3>
        <div id="translation-exercise" class="space-y-4"></div>
        <div id="translation-score" class="mt-4 text-slate-700 font-medium"></div>
    `;
    main.appendChild(translationSection);

    const translationQuestions = [
        { english: 'I will call you tomorrow.', answer: 'holnap fogok hivni teged', alternatives: ['holnap hivlak', 'fel foglak hivni holnap'] },
        { english: 'She will cook dinner.', answer: 'o fog fozni vacsorat', alternatives: ['vacsorat fog fozni', 'o vacsorat fog kesziteni'] },
        { english: 'We will learn Hungarian.', answer: 'mi fogunk tanulni magyarul', alternatives: ['magyarul fogunk tanulni', 'tanulni fogunk magyarul'] },
        { english: 'They will arrive at 6.', answer: 'hatkor fognak erkezni', alternatives: ['6-kor erkeznek', 'ok hatkor fognak jonni'] },
        { english: 'Will you help me?', answer: 'fogsz segiteni nekem', alternatives: ['segitesz nekem', 'fogsz nekem segiteni'] },
        { english: 'It will be cold tomorrow.', answer: 'holnap hideg lesz', alternatives: ['hideg fog lenni holnap'] },
        { english: 'I want to travel to Spain.', answer: 'spanyolorszagba akarok utazni', alternatives: ['szeretnek spanyolorszagba menni'] },
        { english: 'The train will leave soon.', answer: 'a vonat hamarosan indul', alternatives: ['hamarosan indul a vonat', 'a vonat hamarosan el fog indulni'] }
    ];

    const translationDiv = document.getElementById('translation-exercise');
    const translationScoreDiv = document.getElementById('translation-score');

    translationQuestions.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'bg-slate-50 p-3 rounded-lg';
        wrapper.innerHTML = `<p class="text-slate-700 mb-2 font-medium">${idx + 1}. "${q.english}"</p>`;
        const inputRow = document.createElement('div');
        inputRow.className = 'flex flex-col md:flex-row items-start md:items-center gap-2';
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = 'Hungarian translation...';
        input.className = 'border border-slate-300 rounded-md px-3 py-2 w-full md:w-96 focus:ring-2 focus:ring-purple-500';
        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold';
        input.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') checkTranslationAnswer(idx);
        });
        inputRow.appendChild(input);
        inputRow.appendChild(feedback);
        wrapper.appendChild(inputRow);
        translationDiv.appendChild(wrapper);
    });

    function checkTranslationAnswer(idx) {
        const wrapper = translationDiv.children[idx];
        const input = wrapper.querySelector('input');
        const feedback = wrapper.querySelector('span');
        const q = translationQuestions[idx];
        const userAnswer = input.value.trim().toLowerCase().replace(/[?.!,]/g, '');
        const normalizedUser = removeAccents(userAnswer);

        const allCorrect = [q.answer, ...q.alternatives];
        const isExact = allCorrect.some(a => userAnswer === a.toLowerCase().replace(/[?.!,]/g, ''));
        const isAccent = allCorrect.some(a => normalizedUser === removeAccents(a.replace(/[?.!,]/g, '')));

        if (isExact) {
            feedback.textContent = `Correct!`;
            feedback.className = 'text-sm font-semibold text-green-600';
        } else if (isAccent) {
            feedback.textContent = `Watch accents!`;
            feedback.className = 'text-sm font-semibold text-yellow-600';
        } else if (userAnswer === '') {
            feedback.textContent = '';
        } else {
            feedback.textContent = `Possible: ${q.answer}`;
            feedback.className = 'text-sm font-semibold text-red-600';
        }
        updateTranslationScore();
    }

    function updateTranslationScore() {
        let correct = 0;
        for (let i = 0; i < translationQuestions.length; i++) {
            const feedback = translationDiv.children[i].querySelector('span');
            if (feedback.textContent === 'Correct!') correct++;
        }
        translationScoreDiv.textContent = `Score: ${correct} / ${translationQuestions.length}`;
    }
    translationScoreDiv.textContent = `Score: 0 / ${translationQuestions.length}`;

    // ==================== LESSON SUMMARY ====================
    const summarySection = document.createElement('section');
    summarySection.className = 'mt-10 p-6 bg-purple-50 rounded-xl';
    summarySection.innerHTML = `
        <h2 class="text-2xl font-bold text-purple-800 mb-4">Lesson Summary</h2>
        <p class="text-purple-700 mb-4">Excellent work! You've learned to express future tense and intentions in Hungarian.</p>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
            <div class="bg-white p-3 rounded-lg">
                <p class="font-semibold text-purple-800">Future with "fog":</p>
                <p class="text-slate-600">fog + infinitive for predictions</p>
            </div>
            <div class="bg-white p-3 rounded-lg">
                <p class="font-semibold text-purple-800">Intention Verbs:</p>
                <p class="text-slate-600">akar, szeretne, tervez, szandekozik</p>
            </div>
            <div class="bg-white p-3 rounded-lg">
                <p class="font-semibold text-purple-800">Time Markers:</p>
                <p class="text-slate-600">holnap, jovo heten, hamarosan</p>
            </div>
            <div class="bg-white p-3 rounded-lg">
                <p class="font-semibold text-purple-800">Key Distinction:</p>
                <p class="text-slate-600">Present tense for scheduled events</p>
            </div>
        </div>
        <div class="mt-4 p-3 bg-white rounded-lg">
            <p class="font-semibold text-purple-800">Total Exercises Completed:</p>
            <p class="text-slate-600">50 interactive exercises across 5 sections</p>
        </div>
    `;
    main.appendChild(summarySection);
    </script>
</body>
</html>
