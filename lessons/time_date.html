    // ============================================
    // UTILITY FUNCTIONS

    function removeAccents(str) {
        const map = {
            'a': 'a', 'e': 'e', 'i': 'i', 'o': 'o', 'u': 'u',
            'A': 'A', 'E': 'E', 'I': 'I', 'O': 'O', 'U': 'U'
        };
        return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[oOuU]/g, function(m) {
            return map[m] || m;
        });
    }

    function normalizeAnswer(str) {
        return str.trim().toLowerCase();
    }

    function checkAccentAware(userInput, correctAnswer) {
        const normalizedInput = normalizeAnswer(userInput);
        const normalizedCorrect = normalizeAnswer(correctAnswer);

        if (normalizedInput === normalizedCorrect) {
            return 'correct';
        } else if (removeAccents(normalizedInput) === removeAccents(normalizedCorrect)) {
            return 'accent-warning';
        } else {
            return 'incorrect';
        }
    }

    function checkMultipleAnswers(userInput, correctAnswers) {
        const normalizedInput = normalizeAnswer(userInput);

        for (const correct of correctAnswers) {
            if (normalizedInput === normalizeAnswer(correct)) {
                return 'correct';
            }
        }

        for (const correct of correctAnswers) {
            if (removeAccents(normalizedInput) === removeAccents(normalizeAnswer(correct))) {
                return 'accent-warning';
            }
        }

        return 'incorrect';
    }

        input.className = 'border border-slate-300 rounded-md px-3 py-2 w-full text-center focus:ring-2 focus:ring-teal-500 focus:border-teal-500';
        input.placeholder = 'Type the time in Hungarian...';
        input.setAttribute('aria-label', `Hungarian for ${q.display}`);

        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold';

        function checkAnswer() {
            const result = checkMultipleAnswers(input.value, q.answer);
            if (result === 'correct') {
                feedback.textContent = 'Helyes! (Correct!)';
                feedback.className = 'text-green-600 font-semibold';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-3 py-2 w-full text-center';
                if (!stage2Answers[idx]) {
                    stage2Answers[idx] = true;
                    scores.stage2.correct++;
                    document.getElementById('stage2-score').textContent = `Score: ${scores.stage2.correct} / ${stage2Questions.length}`;
                    updateTotalScore();
                }
            } else if (result === 'accent-warning') {
                feedback.textContent = 'Almost! Check accents.';
                feedback.className = 'text-yellow-600 font-semibold';
            } else if (input.value.trim() !== '') {
                feedback.textContent = `Try again! (Hint: ${q.answer[0]})`;
                feedback.className = 'text-red-600 font-semibold';
            }
        }

        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkAnswer(); });
        input.addEventListener('blur', checkAnswer);

        wrapper.appendChild(timeDisplay);
        wrapper.appendChild(input);
        wrapper.appendChild(feedback);
        stage2Exercise.appendChild(wrapper);
    });

    // ============================================
    // STAGE 3: Months & Seasons (12 items)
    // ============================================

    const stage3Questions = [
        { english: 'January', answer: 'januar', type: 'month' },
        { english: 'April', answer: 'aprilis', type: 'month' },
        { english: 'July', answer: 'julius', type: 'month' },
        { english: 'October', answer: 'oktober', type: 'month' },
        { english: 'December', answer: 'december', type: 'month' },
        { english: 'March', answer: 'marcius', type: 'month' },
        { english: 'August', answer: 'augusztus', type: 'month' },
        { english: 'November', answer: 'november', type: 'month' },
        { english: 'spring', answer: 'tavasz', type: 'season' },
        { english: 'summer', answer: 'nyar', type: 'season' },
        { english: 'autumn', answer: 'osz', type: 'season' },
        { english: 'winter', answer: 'tel', type: 'season' }
    ];

    const stage3Section = document.createElement('section');
    stage3Section.className = 'mb-8';
    stage3Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 3: Months & Seasons</h2>
        <p class="text-slate-600 mb-4">Type the Hungarian translation for each month and season.</p>
        <div id="stage3-exercise" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
        <div id="stage3-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${stage3Questions.length}</div>
    `;
    mainContent.appendChild(stage3Section);

    const stage3Exercise = document.getElementById('stage3-exercise');
    const stage3Answers = new Array(stage3Questions.length).fill(false);

    stage3Questions.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = `flex flex-col md:flex-row items-start md:items-center gap-2 p-3 rounded-lg ${q.type === 'season' ? 'bg-green-50' : 'bg-blue-50'}`;

        const label = document.createElement('span');
        label.className = 'min-w-[100px] text-slate-800 font-medium';
        label.textContent = q.english;

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-3 py-1 w-36 focus:ring-2 focus:ring-teal-500 focus:border-teal-500';
        input.setAttribute('aria-label', `Hungarian for ${q.english}`);

        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold ml-2';

        function checkAnswer() {
            const result = checkAccentAware(input.value, q.answer);
            if (result === 'correct') {
                feedback.textContent = 'Correct!';
                feedback.className = 'text-green-600 font-semibold ml-2';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-3 py-1 w-36';
                if (!stage3Answers[idx]) {
                    stage3Answers[idx] = true;
                    scores.stage3.correct++;
                    document.getElementById('stage3-score').textContent = `Score: ${scores.stage3.correct} / ${stage3Questions.length}`;
                    updateTotalScore();
                }
            } else if (result === 'accent-warning') {
                feedback.textContent = 'Check accents!';
                feedback.className = 'text-yellow-600 font-semibold ml-2';
            } else if (input.value.trim() !== '') {
                feedback.textContent = 'Try again!';
                feedback.className = 'text-red-600 font-semibold ml-2';
            }
        }

        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkAnswer(); });
        input.addEventListener('blur', checkAnswer);

        wrapper.appendChild(label);
        wrapper.appendChild(input);
        wrapper.appendChild(feedback);
        stage3Exercise.appendChild(wrapper);
    });

    // ============================================
    // STAGE 4: Date Expressions (8 items)
    // ============================================

    const stage4Questions = [
        { prompt: 'What time is it?', answer: 'hany ora', alternates: ['hany ora van'] },
        { prompt: 'today', answer: 'ma' },
        { prompt: 'tomorrow', answer: 'holnap' },
        { prompt: 'yesterday', answer: 'tegnap' },
        { prompt: "What's today's date?", answer: 'hanyiadika van ma', alternates: ['hanyadika van ma'] },
        { prompt: 'at noon', answer: 'delben' },
        { prompt: 'in the morning', answer: 'reggel' },
        { prompt: 'in the evening', answer: 'este' }
    ];

    const stage4Section = document.createElement('section');
    stage4Section.className = 'mb-8';
    stage4Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 4: Time Expressions</h2>
        <p class="text-slate-600 mb-4">Translate these common time-related expressions to Hungarian.</p>
        <div id="stage4-exercise" class="space-y-3"></div>
        <div id="stage4-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${stage4Questions.length}</div>
    `;
    mainContent.appendChild(stage4Section);

    const stage4Exercise = document.getElementById('stage4-exercise');
    const stage4Answers = new Array(stage4Questions.length).fill(false);

    stage4Questions.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col md:flex-row items-start md:items-center gap-2 p-3 bg-slate-50 rounded-lg';

        const label = document.createElement('span');
        label.className = 'min-w-[180px] text-slate-800 font-medium';
        label.textContent = q.prompt;

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-3 py-1 w-48 focus:ring-2 focus:ring-teal-500 focus:border-teal-500';
        input.setAttribute('aria-label', `Hungarian for: ${q.prompt}`);

        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold ml-2';

        function checkAnswer() {
            const allAnswers = [q.answer, ...(q.alternates || [])];
            const result = checkMultipleAnswers(input.value, allAnswers);

            if (result === 'correct') {
                feedback.textContent = 'Correct!';
                feedback.className = 'text-green-600 font-semibold ml-2';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-3 py-1 w-48';
                if (!stage4Answers[idx]) {
                    stage4Answers[idx] = true;
                    scores.stage4.correct++;
                    document.getElementById('stage4-score').textContent = `Score: ${scores.stage4.correct} / ${stage4Questions.length}`;
                    updateTotalScore();
                }
            } else if (result === 'accent-warning') {
                feedback.textContent = 'Check accents!';
                feedback.className = 'text-yellow-600 font-semibold ml-2';
            } else if (input.value.trim() !== '') {
                feedback.textContent = 'Try again!';
                feedback.className = 'text-red-600 font-semibold ml-2';
            }
        }

        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkAnswer(); });
        input.addEventListener('blur', checkAnswer);

        wrapper.appendChild(label);
        wrapper.appendChild(input);
        wrapper.appendChild(feedback);
        stage4Exercise.appendChild(wrapper);
    });

    // ============================================
    // STAGE 5: Complete Sentences (8 items)
    // ============================================

    const stage5Questions = [
        { sentence: 'Ma ___ van.', blank: 'hetfo', english: 'Today is Monday.' },
        { sentence: 'Holnap ___ lesz.', blank: 'szerda', english: 'Tomorrow will be Wednesday.' },
        { sentence: 'A szuletesnapom ___ van.', blank: 'majusban', alternates: ['majus'], english: 'My birthday is in May.' },
        { sentence: '___ ora van.', blank: 'ket', alternates: ['ketto'], english: "It's two o'clock." },
        { sentence: 'Fel ___ van.', blank: 'het', english: "It's half past six (half seven)." },
        { sentence: '___-on hideg van.', blank: 'telen', alternates: ['tel'], english: "It's cold in winter." },
        { sentence: '___ meleg van.', blank: 'nyaron', alternates: ['nyar'], english: "It's hot in summer." },
        { sentence: 'A vonat ___ indul.', blank: 'haromkor', alternates: ['3-kor'], english: 'The train leaves at three.' }
    ];

    const stage5Section = document.createElement('section');
    stage5Section.className = 'mb-8';
    stage5Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 5: Complete the Sentences</h2>
        <p class="text-slate-600 mb-4">Fill in the blank with the correct Hungarian time/date word.</p>
        <div id="stage5-exercise" class="space-y-4"></div>
        <div id="stage5-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${stage5Questions.length}</div>
    `;
    mainContent.appendChild(stage5Section);

    const stage5Exercise = document.getElementById('stage5-exercise');
    const stage5Answers = new Array(stage5Questions.length).fill(false);

    stage5Questions.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col gap-2 p-3 bg-slate-50 rounded-lg';

        const row = document.createElement('div');
        row.className = 'flex flex-col md:flex-row items-start md:items-center gap-2';

        const parts = q.sentence.split('___');
        const sentenceSpan = document.createElement('span');
        sentenceSpan.className = 'text-slate-800';

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-2 py-1 w-28 mx-1 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 inline';
        input.setAttribute('aria-label', `Fill in blank for: ${q.sentence}`);

        sentenceSpan.appendChild(document.createTextNode(parts[0]));
        sentenceSpan.appendChild(input);
        if (parts[1]) {
            sentenceSpan.appendChild(document.createTextNode(parts[1]));
        }

        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold ml-2';

        const translation = document.createElement('div');
        translation.className = 'text-xs text-slate-500 italic';
        translation.textContent = `English: ${q.english}`;

        function checkAnswer() {
            const allAnswers = [q.blank, ...(q.alternates || [])];
            const result = checkMultipleAnswers(input.value, allAnswers);

            if (result === 'correct') {
                feedback.textContent = 'Correct!';
                feedback.className = 'text-green-600 font-semibold ml-2';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-2 py-1 w-28 mx-1 inline';
                if (!stage5Answers[idx]) {
                    stage5Answers[idx] = true;
                    scores.stage5.correct++;
                    document.getElementById('stage5-score').textContent = `Score: ${scores.stage5.correct} / ${stage5Questions.length}`;
                    updateTotalScore();
                }
            } else if (result === 'accent-warning') {
                feedback.textContent = 'Check accents!';
                feedback.className = 'text-yellow-600 font-semibold ml-2';
            } else if (input.value.trim() !== '') {
                feedback.textContent = 'Try again!';
                feedback.className = 'text-red-600 font-semibold ml-2';
            }
        }

        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkAnswer(); });
        input.addEventListener('blur', checkAnswer);

        row.appendChild(sentenceSpan);
        row.appendChild(feedback);
        wrapper.appendChild(row);
        wrapper.appendChild(translation);
        stage5Exercise.appendChild(wrapper);
    });

    // ============================================
    // SUMMARY SECTION
    // ============================================

    const summarySection = document.createElement('section');
    summarySection.className = 'mt-8 p-6 bg-gradient-to-r from-teal-50 to-slate-50 rounded-xl border border-teal-200';
    summarySection.innerHTML = `
        <h2 class="text-xl font-bold text-teal-800 mb-4">Lesson Summary</h2>
        <div class="grid md:grid-cols-2 gap-4 text-sm">
            <div>
                <h3 class="font-semibold text-slate-700 mb-2">Key Time Concepts:</h3>
                <ul class="list-disc pl-5 text-slate-600 space-y-1">
                    <li><strong>Hany ora?</strong> - What time is it?</li>
                    <li>Full hour: "X ora" (e.g., harom ora = 3:00)</li>
                    <li>Half hour: "fel X" refers to NEXT hour (fel harom = 2:30)</li>
                    <li>Quarter: "negyed X" = quarter to X hour (negyed harom = 2:15)</li>
                    <li>Three-quarters: "haromnegyed X" (haromnegyed harom = 2:45)</li>
                </ul>
            </div>
            <div>
                <h3 class="font-semibold text-slate-700 mb-2">Date Format:</h3>
                <ul class="list-disc pl-5 text-slate-600 space-y-1">
                    <li>Year. Month Day. (2024. januar 15.)</li>
                    <li>Days and months are NOT capitalized</li>
                    <li>Use -ban/-ben for "in" with months</li>
                    <li>Use -on/-en/-n for "in" with seasons</li>
                </ul>
            </div>
        </div>
        <div class="mt-4 p-3 bg-amber-50 rounded-lg border border-amber-200">
            <p class="text-amber-800 text-sm"><strong>Remember:</strong> Hungarian time-telling is relative to the NEXT hour for half, quarter, and three-quarter times. "Fel harom" (half three) means 2:30, not 3:30!</p>
        </div>
    `;
    mainContent.appendChild(summarySection);

    // Initialize total score
    updateTotalScore();
    </script>
</body>
</html>
