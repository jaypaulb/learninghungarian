    <style>

</head>
<body class="bg-slate-100 p-4 md:p-8">
    <header class="text-center mb-8">
        <div class="mb-4">
            <a href="../index.html" class="inline-flex items-center px-4 py-2 bg-slate-600 text-white text-sm font-medium rounded-lg hover:bg-slate-700 transition-colors">
                <svg class="mr-2 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                Back to Lessons
            </a>
        </div>
        <h1 class="text-3xl md:text-4xl font-bold text-slate-700">Lesson 46: Emotions & Feelings <span class="block text-xl text-slate-500 font-normal">(Erzelmek es Erzesek)</span></h1>
        <p class="text-slate-600 mt-2 max-w-2xl mx-auto">Learn to express emotions and feelings in Hungarian. Master vocabulary for describing how you feel and asking others about their emotional state.</p>
    </header>

    <main class="max-w-4xl mx-auto bg-white rounded-xl shadow-md p-6" id="main-content">
        <!-- Content will be generated by JavaScript -->
    </main>

    <footer class="text-center mt-12 py-4 border-t border-slate-300">
        <p class="text-sm text-slate-500">&copy; 2024 Hungarian Language Lessons</p>
    </footer>

    <script>
    // ============================================
    // UTILITY FUNCTIONS
    // ============================================

    function removeAccents(str) {
        return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[oOuU\u0151\u0150\u0171\u0170]/g, function(m) {
            const map = { '\u0151':'o','\u0150':'O','\u0171':'u','\u0170':'U' };
            return map[m] || m;
        });
    }

    function normalizeAnswer(str) {
        return str.trim().toLowerCase();
    }

    function checkAccentAware(userInput, correctAnswer) {
        const normalizedInput = normalizeAnswer(userInput);
        const normalizedCorrect = normalizeAnswer(correctAnswer);

        if (normalizedInput === normalizedCorrect) {
            return 'correct';
        } else if (removeAccents(normalizedInput) === removeAccents(normalizedCorrect)) {
            return 'accent-warning';
        } else {
            return 'incorrect';
        }
    }

    // ============================================
    // VOCABULARY DATA
    // ============================================

    const positiveEmotions = [
        { hungarian: 'boldog', english: 'happy' },
        { hungarian: 'vidám', english: 'cheerful' },
        { hungarian: 'izgatott', english: 'excited' },
        { hungarian: 'elégezett', english: 'satisfied' },
        { hungarian: 'hálás', english: 'grateful' },
        { hungarian: 'szerelmes', english: 'in love' },
        { hungarian: 'büszke', english: 'proud' },
        { hungarian: 'nyugodt', english: 'calm' },
        { hungarian: 'lelkes', english: 'enthusiastic' },
        { hungarian: 'megkönnyebbült', english: 'relieved' }
    ];

    const negativeEmotions = [
        { hungarian: 'szomorú', english: 'sad' },
        { hungarian: 'mérges', english: 'angry' },
        { hungarian: 'fáradt', english: 'tired' },
        { hungarian: 'ideges', english: 'nervous' },
        { hungarian: 'aggódó', english: 'worried' },
        { hungarian: 'félek', english: 'afraid/scared' },
        { hungarian: 'csalódott', english: 'disappointed' },
        { hungarian: 'magányos', english: 'lonely' },
        { hungarian: 'stresszes', english: 'stressed' },
        { hungarian: 'unott', english: 'bored' }
    ];

    const expressingFeelings = [
        { hungarian: 'Örülök.', english: 'I am glad/happy.' },
        { hungarian: 'Aggódom.', english: 'I am worried.' },
        { hungarian: 'Félek.', english: 'I am afraid.' },
        { hungarian: 'Szeretem.', english: 'I love it/him/her.' },
        { hungarian: 'Utálom.', english: 'I hate it.' },
        { hungarian: 'Sajnálom.', english: 'I am sorry.' },
        { hungarian: 'Remélem.', english: 'I hope.' },
        { hungarian: 'Hiányzol.', english: 'I miss you.' }
    ];

    const askingAboutFeelings = [
        { hungarian: 'Hogyan érzed magad?', english: 'How do you feel?' },
        { hungarian: 'Mi a baj?', english: 'What is wrong?' },
        { hungarian: 'Jól vagy?', english: 'Are you okay?' },
        { hungarian: 'Miert vagy szomorú?', english: 'Why are you sad?' },
        { hungarian: 'Boldog vagy?', english: 'Are you happy?' },
        { hungarian: 'Mi történt?', english: 'What happened?' }
    ];

    // ============================================
    // EXERCISE DATA
    // ============================================

    const vocabularyCards = [
        ...positiveEmotions.slice(0, 8),
        ...negativeEmotions.slice(0, 8)
    ];

    const emotionMatching = [
        { description: 'The opposite of sad', answer: 'boldog', options: ['boldog', 'szomorú', 'mérges', 'fáradt'] },
        { description: 'The opposite of calm', answer: 'ideges', options: ['ideges', 'nyugodt', 'boldog', 'fáradt'] },
        { description: 'How you feel when you achieve something', answer: 'büszke', options: ['büszke', 'szomorú', 'mérges', 'unott'] },
        { description: 'How you feel when you have nothing to do', answer: 'unott', options: ['unott', 'izgatott', 'boldog', 'fáradt'] },
        { description: 'The opposite of happy', answer: 'szomorú', options: ['szomorú', 'boldog', 'vidám', 'lelkes'] },
        { description: 'How you feel before an exam', answer: 'ideges', options: ['ideges', 'nyugodt', 'unott', 'boldog'] },
        { description: 'How you feel when alone for too long', answer: 'magányos', options: ['magányos', 'boldog', 'izgatott', 'vidám'] },
        { description: 'How you feel when something bad might happen', answer: 'aggódó', options: ['aggódó', 'boldog', 'nyugodt', 'lelkes'] }
    ];

    const fillInFeelings = [
        { sentence: '___ vagyok, mert holnap utazunk.', blank: 'Izgatott', english: 'I am excited because we are traveling tomorrow.' },
        { sentence: 'Nagyon ___ vagyok, egész nap dolgoztam.', blank: 'fáradt', english: 'I am very tired, I worked all day.' },
        { sentence: 'Miért vagy ilyen ___?', blank: 'szomorú', english: 'Why are you so sad?' },
        { sentence: '___, hogy minden jól lesz.', blank: 'Remélem', english: 'I hope everything will be fine.' },
        { sentence: 'Ne légy ___, minden rendben lesz!', blank: 'ideges', english: 'Do not be nervous, everything will be fine!' },
        { sentence: 'Nagyon ___ vagyok rád!', blank: 'büszke', english: 'I am very proud of you!' },
        { sentence: '___ a sötétben.', blank: 'Félek', english: 'I am afraid of the dark.' },
        { sentence: 'Nagyon ___, hogy nem jöhetsz.', blank: 'sajnálom', english: 'I am very sorry you cannot come.' }
    ];

    const situationResponses = [
        { situation: 'Your friend asks "Hogyan érzed magad?" and you feel great.', answer: 'Nagyon jól érzem magam', alternates: ['jól vagyok', 'nagyon jól'] },
        { situation: 'You want to tell someone you miss them.', answer: 'Hiányzol', alternates: ['hiányzol nekem'] },
        { situation: 'Express that you are worried about something.', answer: 'Aggódom', alternates: ['aggódok', 'aggódó vagyok'] },
        { situation: 'Say you are happy about the news.', answer: 'Örülök a hírnek', alternates: ['örülök', 'boldog vagyok'] },
        { situation: 'Ask someone why they are angry.', answer: 'Miért vagy mérges', alternates: ['miert vagy merges'] },
        { situation: 'Tell someone not to be sad.', answer: 'Ne légy szomorú', alternates: ['ne legy szomoru'] }
    ];

    const dialoguePractice = [
        {
            speaker: 'A',
            line: 'Hogyan érzed magad ma?',
            response: '___ vagyok, mert jó hírt kaptam.',
            responseEnglish: 'I am happy because I got good news.',
            blank: 'Boldog'
        },
        {
            speaker: 'A',
            line: 'Mi a baj? Rosszul nézel ki.',
            response: 'Nagyon ___ vagyok, nem aludtam jól.',
            responseEnglish: 'I am very tired, I did not sleep well.',
            blank: 'fáradt'
        },
        {
            speaker: 'A',
            line: 'Miért vagy ilyen ideges?',
            response: '___ a vizsgám miatt.',
            responseEnglish: 'I am worried about my exam.',
            blank: 'Aggódom'
        },
        {
            speaker: 'A',
            line: 'Gratulálok a sikeredhez!',
            response: 'Köszönöm, nagyon ___ vagyok.',
            responseEnglish: 'Thank you, I am very proud.',
            blank: 'büszke'
        },
        {
            speaker: 'A',
            line: 'Holnap lesz az interjú. Félsz?',
            response: 'Igen, egy kicsit ___ vagyok.',
            responseEnglish: 'Yes, I am a little nervous.',
            blank: 'ideges'
        },
        {
            speaker: 'A',
            line: 'Régen találkoztunk!',
            response: 'Igen, nagyon ___!',
            responseEnglish: 'Yes, I miss you very much!',
            blank: 'hiányzol'
        }
    ];

    // ============================================
    // SCORE TRACKING
    // ============================================

    let scores = {
        stage1: { correct: 0, total: vocabularyCards.length },
        stage2: { correct: 0, total: emotionMatching.length },
        stage3: { correct: 0, total: fillInFeelings.length },
        stage4: { correct: 0, total: situationResponses.length },
        stage5: { correct: 0, total: dialoguePractice.length }
    };

    let stage1Revealed = new Set();

    function updateTotalScore() {
        const totalCorrect = Object.values(scores).reduce((sum, s) => sum + s.correct, 0);
        const totalQuestions = Object.values(scores).reduce((sum, s) => sum + s.total, 0);
        const totalScoreEl = document.getElementById('total-score');
        if (totalScoreEl) {
            totalScoreEl.textContent = `Total Score: ${totalCorrect} / ${totalQuestions}`;
        }
    }

    // ============================================
    // BUILD PAGE CONTENT
    // ============================================

    const mainContent = document.getElementById('main-content');

    // Learning Objectives
    const objectivesSection = document.createElement('section');
    objectivesSection.className = 'mb-8';
    objectivesSection.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Learning Objectives</h2>
        <ul class="list-disc pl-6 space-y-2 text-slate-600">
            <li>Learn vocabulary for positive and negative emotions</li>
            <li>Express how you feel using common Hungarian phrases</li>
            <li>Ask others about their feelings and emotional state</li>
            <li>Respond appropriately in emotional situations</li>
        </ul>
    `;
    mainContent.appendChild(objectivesSection);

    // Cultural Note
    const culturalNote = document.createElement('div');
    culturalNote.className = 'cultural-note mb-8';
    culturalNote.innerHTML = `
        <h3 class="font-bold text-amber-800 mb-2">Cultural Note: Expressing Emotions in Hungarian Culture</h3>
        <p class="text-amber-900">Hungarians are often described as reserved or melancholic, but this is a stereotype.
        While formal situations call for restraint, Hungarians express emotions openly with close friends and family.
        The phrase <strong>"Jól vagyok"</strong> (I am fine) is commonly used even when one is not entirely well,
        similar to English. For deeper conversations, <strong>"Hogyan érzed magad?"</strong> invites more honest responses.</p>
    `;
    mainContent.appendChild(culturalNote);

    // Section 1: Positive Emotions
    const section1 = document.createElement('section');
    section1.className = 'mb-8';
    section1.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 1: Positive Emotions (Pozitív Érzelmek)</h2>
        <div class="grid md:grid-cols-2 gap-3">
            ${positiveEmotions.map(item => `
                <div class="emotion-card flex items-center gap-3 p-3 bg-green-50 rounded-lg border border-green-200">
                    <span class="text-2xl">:)</span>
                    <div>
                        <span class="emotion-positive">${item.hungarian}</span>
                        <span class="text-slate-600"> - ${item.english}</span>
                    </div>
                </div>
            `).join('')}
        </div>
    `;
    mainContent.appendChild(section1);

    // Section 2: Negative Emotions
    const section2 = document.createElement('section');
    section2.className = 'mb-8';
    section2.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 2: Negative Emotions (Negatív Érzelmek)</h2>
        <div class="grid md:grid-cols-2 gap-3">
            ${negativeEmotions.map(item => `
                <div class="emotion-card flex items-center gap-3 p-3 bg-red-50 rounded-lg border border-red-200">
                    <span class="text-2xl">:(</span>
                    <div>
                        <span class="emotion-negative">${item.hungarian}</span>
                        <span class="text-slate-600"> - ${item.english}</span>
                    </div>
                </div>
            `).join('')}
        </div>
    `;
    mainContent.appendChild(section2);

    // Section 3: Expressing Feelings
    const section3 = document.createElement('section');
    section3.className = 'mb-8';
    section3.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 3: Expressing Feelings (Érzések Kifejezése)</h2>
        <table class="mb-4">
            <thead>
                <tr><th class="text-left">Hungarian</th><th class="text-left">English</th></tr>
            </thead>
            <tbody>
                ${expressingFeelings.map(item => `<tr><td class="font-medium text-blue-700">${item.hungarian}</td><td>${item.english}</td></tr>`).join('')}
            </tbody>
        </table>
        <div class="bg-blue-50 border-l-4 border-blue-500 p-4">
            <h4 class="font-semibold text-blue-800 mb-2">Grammar Note: Adjective + "vagyok"</h4>
            <p class="text-blue-700 text-sm">To express how you feel, use an adjective + <strong>"vagyok"</strong> (I am):
            <br>- <strong>Boldog vagyok.</strong> = I am happy.
            <br>- <strong>Fáradt vagyok.</strong> = I am tired.
            <br>- <strong>Ideges vagyok.</strong> = I am nervous.</p>
        </div>
    `;
    mainContent.appendChild(section3);

    // Section 4: Asking About Feelings
    const section4 = document.createElement('section');
    section4.className = 'mb-8';
    section4.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 4: Asking About Feelings (Kérdések az Érzésekrol)</h2>
        <div class="bg-slate-50 rounded-lg p-4 space-y-3">
            ${askingAboutFeelings.map(item => `
                <div class="flex flex-col md:flex-row md:items-center gap-2">
                    <span class="font-medium emotion-neutral min-w-[250px]">${item.hungarian}</span>
                    <span class="text-slate-600">- ${item.english}</span>
                </div>
            `).join('')}
        </div>
        <div class="mt-4 p-4 bg-purple-50 rounded-lg border border-purple-200">
            <h4 class="font-semibold text-purple-800 mb-2">Responding to "Hogyan érzed magad?"</h4>
            <p class="text-purple-700 text-sm">
                <strong>Jól érzem magam.</strong> - I feel good.<br>
                <strong>Rosszul érzem magam.</strong> - I feel bad.<br>
                <strong>Nem túl jól.</strong> - Not too well.<br>
                <strong>Kiválóan!</strong> - Excellent!
            </p>
        </div>
    `;
    mainContent.appendChild(section4);

    // Total Score Display
    const totalScoreSection = document.createElement('div');
    totalScoreSection.className = 'bg-gradient-to-r from-orange-500 to-red-500 text-white rounded-xl p-4 mb-8 text-center';
    totalScoreSection.innerHTML = `
        <h3 class="text-lg font-semibold mb-1">Interactive Exercises</h3>
        <p id="total-score" class="text-2xl font-bold">Total Score: 0 / 46</p>
    `;
    mainContent.appendChild(totalScoreSection);

    // ============================================
    // STAGE 1: VOCABULARY CARDS (16 items)
    // ============================================

    const stage1Section = document.createElement('section');
    stage1Section.className = 'mb-8';
    stage1Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 1: Emotion Vocabulary Cards</h2>
        <p class="text-slate-600 mb-4">Click each card to flip and reveal the English translation. Try to guess before flipping!</p>
        <div id="vocab-cards" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4"></div>
        <div id="stage1-score" class="text-slate-700 font-medium">Cards Revealed: 0 / ${vocabularyCards.length}</div>
    `;
    mainContent.appendChild(stage1Section);

    const vocabCardsContainer = document.getElementById('vocab-cards');
    vocabularyCards.forEach((card, idx) => {
        const cardDiv = document.createElement('div');
        cardDiv.className = 'flip-card h-24';
        cardDiv.setAttribute('data-idx', idx);
        cardDiv.innerHTML = `
            <div class="flip-card-inner">
                <div class="flip-card-front">
                    <span class="text-lg font-bold">${card.hungarian}</span>
                </div>
                <div class="flip-card-back">
                    <span class="text-lg font-semibold">${card.english}</span>
                </div>
            </div>
        `;
        cardDiv.addEventListener('click', function() {
            this.classList.toggle('flipped');
            if (!stage1Revealed.has(idx)) {
                stage1Revealed.add(idx);
                scores.stage1.correct = stage1Revealed.size;
                document.getElementById('stage1-score').textContent = `Cards Revealed: ${stage1Revealed.size} / ${vocabularyCards.length}`;
                updateTotalScore();
            }
        });
        vocabCardsContainer.appendChild(cardDiv);
    });

    // ============================================
    // STAGE 2: EMOTION MATCHING (8 items)
    // ============================================

    const stage2Section = document.createElement('section');
    stage2Section.className = 'mb-8';
    stage2Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 2: Emotion Matching</h2>
        <p class="text-slate-600 mb-4">Match the description to the correct Hungarian emotion word.</p>
        <div id="emotion-exercise" class="space-y-4"></div>
        <div id="stage2-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${emotionMatching.length}</div>
    `;
    mainContent.appendChild(stage2Section);

    const emotionExercise = document.getElementById('emotion-exercise');
    emotionMatching.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col md:flex-row items-start md:items-center gap-2 p-3 bg-slate-50 rounded-lg';

        const label = document.createElement('span');
        label.className = 'min-w-[280px] text-slate-800 font-medium';
        label.textContent = q.description;

        const select = document.createElement('select');
        select.className = 'border border-slate-300 rounded-md px-3 py-2 w-40 focus:ring-2 focus:ring-orange-500 focus:border-orange-500';
        select.innerHTML = '<option value="">Select answer...</option>';

        const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);
        shuffledOptions.forEach(opt => {
            const option = document.createElement('option');
            option.value = opt;
            option.textContent = opt;
            select.appendChild(option);
        });

        const feedback = document.createElement('span');
        feedback.className = 'ml-2 text-sm font-semibold';

        select.addEventListener('change', function() {
            if (this.value === q.answer) {
                feedback.textContent = 'Correct!';
                feedback.className = 'ml-2 text-green-600 font-semibold';
                this.disabled = true;
                this.className = 'border border-green-500 bg-green-50 rounded-md px-3 py-2 w-40';
                scores.stage2.correct++;
                document.getElementById('stage2-score').textContent = `Score: ${scores.stage2.correct} / ${emotionMatching.length}`;
                updateTotalScore();
            } else if (this.value !== '') {
                feedback.textContent = 'Try again!';
                feedback.className = 'ml-2 text-red-600 font-semibold';
            }
        });

        wrapper.appendChild(label);
        wrapper.appendChild(select);
        wrapper.appendChild(feedback);
        emotionExercise.appendChild(wrapper);
    });

    // ============================================
    // STAGE 3: FILL IN FEELINGS (8 items)
    // ============================================

    const stage3Section = document.createElement('section');
    stage3Section.className = 'mb-8';
    stage3Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 3: Express Your Feelings</h2>
        <p class="text-slate-600 mb-4">Complete the sentences with the correct emotion word.</p>
        <div id="fillin-exercise" class="space-y-4"></div>
        <div id="stage3-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${fillInFeelings.length}</div>
    `;
    mainContent.appendChild(stage3Section);

    const fillinExercise = document.getElementById('fillin-exercise');
    const stage3Answers = new Array(fillInFeelings.length).fill(false);

    fillInFeelings.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col gap-2 p-3 bg-orange-50 rounded-lg';

        const row = document.createElement('div');
        row.className = 'flex flex-col md:flex-row items-start md:items-center gap-2';

        const sentenceParts = q.sentence.split('___');
        const sentenceSpan = document.createElement('span');
        sentenceSpan.className = 'text-slate-800';

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-2 py-1 w-32 mx-1 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 inline';
        input.setAttribute('aria-label', `Fill in blank for: ${q.sentence}`);

        sentenceSpan.appendChild(document.createTextNode(sentenceParts[0]));
        sentenceSpan.appendChild(input);
        if (sentenceParts[1]) {
            sentenceSpan.appendChild(document.createTextNode(sentenceParts[1]));
        }

        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold ml-2';

        const translation = document.createElement('div');
        translation.className = 'text-xs text-slate-500 italic';
        translation.textContent = `English: ${q.english}`;

        function checkAnswer() {
            const result = checkAccentAware(input.value, q.blank);

            if (result === 'correct') {
                feedback.textContent = 'Correct!';
                feedback.className = 'text-green-600 font-semibold ml-2';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-2 py-1 w-32 mx-1 inline';
                if (!stage3Answers[idx]) {
                    stage3Answers[idx] = true;
                    scores.stage3.correct++;
                    document.getElementById('stage3-score').textContent = `Score: ${scores.stage3.correct} / ${fillInFeelings.length}`;
                    updateTotalScore();
                }
            } else if (result === 'accent-warning') {
                feedback.textContent = 'Almost! Check accents.';
                feedback.className = 'text-yellow-600 font-semibold ml-2';
            } else if (input.value.trim() !== '') {
                feedback.textContent = 'Try again!';
                feedback.className = 'text-red-600 font-semibold ml-2';
            }
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkAnswer();
        });
        input.addEventListener('blur', checkAnswer);

        row.appendChild(sentenceSpan);
        row.appendChild(feedback);
        wrapper.appendChild(row);
        wrapper.appendChild(translation);
        fillinExercise.appendChild(wrapper);
    });

    // ============================================
    // STAGE 4: SITUATION RESPONSES (6 items)
    // ============================================

    const stage4Section = document.createElement('section');
    stage4Section.className = 'mb-8';
    stage4Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 4: Respond to Situations</h2>
        <p class="text-slate-600 mb-4">How would you respond in Hungarian to these emotional situations?</p>
        <div id="situation-exercise" class="space-y-4"></div>
        <div id="stage4-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${situationResponses.length}</div>
    `;
    mainContent.appendChild(stage4Section);

    const situationExercise = document.getElementById('situation-exercise');
    const stage4Answers = new Array(situationResponses.length).fill(false);

    situationResponses.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'p-4 bg-purple-50 rounded-lg';

        const promptDiv = document.createElement('div');
        promptDiv.className = 'mb-2';
        promptDiv.innerHTML = `<strong class="text-slate-800">${q.situation}</strong>`;

        const inputDiv = document.createElement('div');
        inputDiv.className = 'flex flex-col md:flex-row items-start md:items-center gap-2';

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-3 py-2 w-full md:w-80 focus:ring-2 focus:ring-purple-500';
        input.setAttribute('aria-label', `Answer for: ${q.situation}`);

        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold';

        function checkAnswer() {
            const userAnswer = normalizeAnswer(input.value);
            const correctAnswer = normalizeAnswer(q.answer);
            const alternates = q.alternates ? q.alternates.map(a => normalizeAnswer(a)) : [];
            const allCorrect = [correctAnswer, ...alternates];

            const exactMatch = allCorrect.some(a => a === userAnswer);
            const accentMatch = allCorrect.some(a => removeAccents(a) === removeAccents(userAnswer));

            if (exactMatch) {
                feedback.textContent = 'Correct!';
                feedback.className = 'text-green-600 font-semibold';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-3 py-2 w-full md:w-80';
                if (!stage4Answers[idx]) {
                    stage4Answers[idx] = true;
                    scores.stage4.correct++;
                    document.getElementById('stage4-score').textContent = `Score: ${scores.stage4.correct} / ${situationResponses.length}`;
                    updateTotalScore();
                }
            } else if (accentMatch) {
                feedback.textContent = 'Close! Check your accents.';
                feedback.className = 'text-yellow-600 font-semibold';
            } else if (input.value.trim() !== '') {
                feedback.textContent = `Try again! One answer: ${q.answer}`;
                feedback.className = 'text-red-600 font-semibold';
            }
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkAnswer();
        });
        input.addEventListener('blur', checkAnswer);

        inputDiv.appendChild(input);
        inputDiv.appendChild(feedback);
        wrapper.appendChild(promptDiv);
        wrapper.appendChild(inputDiv);
        situationExercise.appendChild(wrapper);
    });

    // ============================================
    // STAGE 5: DIALOGUE PRACTICE (6 items)
    // ============================================

    const stage5Section = document.createElement('section');
    stage5Section.className = 'mb-8';
    stage5Section.innerHTML = `
        <h2 class="text-xl font-bold text-slate-700 mb-2">Stage 5: Emotional Dialogues</h2>
        <p class="text-slate-600 mb-4">Complete these conversations about feelings by filling in the missing word.</p>
        <div id="dialogue-exercise" class="space-y-6"></div>
        <div id="stage5-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${dialoguePractice.length}</div>
    `;
    mainContent.appendChild(stage5Section);

    const dialogueExercise = document.getElementById('dialogue-exercise');
    const stage5Answers = new Array(dialoguePractice.length).fill(false);

    dialoguePractice.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'bg-gradient-to-r from-slate-50 to-orange-50 rounded-lg p-4 border border-slate-200';

        const questionLine = document.createElement('div');
        questionLine.className = 'mb-3';
        questionLine.innerHTML = `
            <span class="inline-block bg-orange-500 text-white text-xs font-bold px-2 py-1 rounded mr-2">A</span>
            <span class="text-slate-800 font-medium">${q.line}</span>
        `;

        const responseLine = document.createElement('div');
        responseLine.className = 'flex flex-wrap items-center gap-2';

        const speakerB = document.createElement('span');
        speakerB.className = 'inline-block bg-slate-600 text-white text-xs font-bold px-2 py-1 rounded';
        speakerB.textContent = 'B';

        const responseText = q.response.split('___');
        const responseSpan = document.createElement('span');
        responseSpan.className = 'text-slate-800';

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'border border-slate-300 rounded-md px-2 py-1 w-32 focus:ring-2 focus:ring-orange-500 focus:border-orange-500';
        input.setAttribute('aria-label', `Response for dialogue ${idx + 1}`);

        responseSpan.appendChild(document.createTextNode(responseText[0]));
        responseSpan.appendChild(input);
        if (responseText[1]) {
            responseSpan.appendChild(document.createTextNode(responseText[1]));
        }

        const feedback = document.createElement('span');
        feedback.className = 'text-sm font-semibold';

        function checkAnswer() {
            const result = checkAccentAware(input.value, q.blank);

            if (result === 'correct') {
                feedback.textContent = 'Helyes! (Correct!)';
                feedback.className = 'text-green-600 font-semibold';
                input.disabled = true;
                input.className = 'border border-green-500 bg-green-50 rounded-md px-2 py-1 w-32';
                if (!stage5Answers[idx]) {
                    stage5Answers[idx] = true;
                    scores.stage5.correct++;
                    document.getElementById('stage5-score').textContent = `Score: ${scores.stage5.correct} / ${dialoguePractice.length}`;
                    updateTotalScore();
                }
            } else if (result === 'accent-warning') {
                feedback.textContent = 'Majdnem! (Check accents)';
                feedback.className = 'text-yellow-600 font-semibold';
            } else if (input.value.trim() !== '') {
                feedback.textContent = 'Próbáld újra! (Try again)';
                feedback.className = 'text-red-600 font-semibold';
            }
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkAnswer();
        });
        input.addEventListener('blur', checkAnswer);

        responseLine.appendChild(speakerB);
        responseLine.appendChild(responseSpan);
        responseLine.appendChild(feedback);

        const translationLine = document.createElement('div');
        translationLine.className = 'mt-2 text-xs text-slate-500 italic pl-8';
        translationLine.textContent = `(${q.responseEnglish})`;

        wrapper.appendChild(questionLine);
        wrapper.appendChild(responseLine);
        wrapper.appendChild(translationLine);
        dialogueExercise.appendChild(wrapper);
    });

    // ============================================
    // SUMMARY SECTION
    // ============================================

    const summarySection = document.createElement('section');
    summarySection.className = 'mt-8 p-6 bg-gradient-to-r from-orange-50 to-slate-50 rounded-xl border border-orange-200';
    summarySection.innerHTML = `
        <h2 class="text-xl font-bold text-orange-800 mb-4">Lesson Summary</h2>
        <div class="grid md:grid-cols-2 gap-4 text-sm">
            <div>
                <h3 class="font-semibold text-slate-700 mb-2">Key Emotions Learned:</h3>
                <ul class="list-disc pl-5 text-slate-600 space-y-1">
                    <li>Positive: boldog, vidám, izgatott, büszke, nyugodt</li>
                    <li>Negative: szomorú, mérges, fáradt, ideges, aggódó</li>
                    <li>Physical states: fáradt, stresszes, magányos</li>
                </ul>
            </div>
            <div>
                <h3 class="font-semibold text-slate-700 mb-2">Key Phrases:</h3>
                <ul class="list-disc pl-5 text-slate-600 space-y-1">
                    <li>"Hogyan érzed magad?" - How do you feel?</li>
                    <li>"... vagyok" - I am ...</li>
                    <li>"Örülök / Aggódom / Félek" - I am glad / worried / afraid</li>
                    <li>"Mi a baj?" - What is wrong?</li>
                </ul>
            </div>
        </div>
        <div class="mt-4 p-3 bg-amber-50 rounded-lg border border-amber-200">
            <p class="text-amber-800 text-sm"><strong>Remember:</strong> In Hungarian, use adjective + "vagyok" to express your feelings. For more nuanced expressions, use verbs like "örülök" (I am glad), "aggódom" (I am worried), or "félek" (I am afraid)!</p>
        </div>
    `;
    mainContent.appendChild(summarySection);

    // Initialize total score
    updateTotalScore();
    </script>
</body>
</html>
