<!DOCTYPE html>

</head>
<body class="bg-slate-100 p-4 md:p-8">
    <header class="text-center mb-8">
        <div class="mb-4">
            <a href="../index.html" class="inline-flex items-center px-4 py-2 bg-slate-600 text-white text-sm font-medium rounded-lg hover:bg-slate-700 transition-colors">
                <svg class="mr-2 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                Back to Lessons
            </a>
        </div>
        <h1 class="text-3xl md:text-4xl font-bold text-slate-700">Lesson 18: Shopping & Money <span class="block text-xl text-slate-500 font-normal">(Vasarlas es penz)</span></h1>
        <p class="text-slate-600 mt-1 max-w-2xl mx-auto">Learn essential vocabulary for shopping in Hungary, including prices, currency, and common transaction phrases. Master the art of buying, selling, and even negotiating!</p>
    </header>
    <main class="max-w-3xl mx-auto bg-white rounded-xl shadow-md p-6" id="main-content">
    </main>
    <footer class="text-center mt-12 py-4 border-t border-slate-300">
        <p class="text-sm text-slate-500">&copy; 2024 Hungarian Language Lessons</p>
    </footer>
    <script>
    const mainContent = document.getElementById('main-content');

    // Accent handling utilities
    function removeAccents(str) {
        return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[oOuUaAeEiI]/g, function(m) {
            const map = { 'a':'a','A':'A','e':'e','E':'E','i':'i','I':'I','o':'o','O':'O','u':'u','U':'U' };
            return map[m] || m;
        }).replace(/[oOuUaAeEiI]/g, function(m) {
            return m;
        }).replace(/[oOuUaAeEiI]/g, function(m) {
            return m;
        }).replace(/[oOuUaAeEiI]/g, function(m) {
            return m;
        });
    }

    function normalizeHungarian(str) {
        return str.trim().toLowerCase();
    }

    function checkWithAccentWarning(input, correct) {
        const inputVal = normalizeHungarian(input);
        const correctVal = normalizeHungarian(correct);
        if (inputVal === correctVal) {
            return 'correct';
        } else if (removeAccents(inputVal) === removeAccents(correctVal)) {
            return 'accent-warning';
        }
        return 'incorrect';
    }

    // ==================== SECTION 1: HUNGARIAN CURRENCY ====================
    const section1 = document.createElement('section');
    section1.className = 'mb-8';
    section1.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 1: Hungarian Currency (Magyar penz)</h2>
        <p class="mb-4 text-slate-600">Hungary uses the <strong>Forint (Ft)</strong> as its currency. The international code is <strong>HUF</strong>. Let's learn the essential money vocabulary.</p>
        <table class="mb-4 w-full border text-sm">
            <tr><th class="border px-2">Hungarian</th><th class="border px-2">English</th><th class="border px-2">Notes</th></tr>
            <tr><td class="border px-2 font-medium">forint (Ft)</td><td class="border px-2">Hungarian Forint</td><td class="border px-2">Official currency</td></tr>
            <tr><td class="border px-2 font-medium">penz</td><td class="border px-2">money</td><td class="border px-2">General term</td></tr>
            <tr><td class="border px-2 font-medium">keszpenz</td><td class="border px-2">cash</td><td class="border px-2">Physical money</td></tr>
            <tr><td class="border px-2 font-medium">bankjegy</td><td class="border px-2">banknote</td><td class="border px-2">Paper money</td></tr>
            <tr><td class="border px-2 font-medium">erme</td><td class="border px-2">coin</td><td class="border px-2">Metal money</td></tr>
            <tr><td class="border px-2 font-medium">bankkartya</td><td class="border px-2">bank card</td><td class="border px-2">Debit/credit card</td></tr>
            <tr><td class="border px-2 font-medium">hitelkartya</td><td class="border px-2">credit card</td><td class="border px-2">Credit specifically</td></tr>
            <tr><td class="border px-2 font-medium">visszajaro</td><td class="border px-2">change (money back)</td><td class="border px-2">When paying more</td></tr>
            <tr><td class="border px-2 font-medium">apriopenz</td><td class="border px-2">small change</td><td class="border px-2">Coins</td></tr>
            <tr><td class="border px-2 font-medium">szamla</td><td class="border px-2">bill / receipt</td><td class="border px-2">Document of purchase</td></tr>
        </table>
        <div class="cultural-note p-4 rounded-lg mb-4">
            <h4 class="font-semibold text-teal-800 mb-2">Cultural Note: Hungarian Forint</h4>
            <p class="text-slate-700 text-sm">Common banknotes: 500 Ft, 1000 Ft, 2000 Ft, 5000 Ft, 10000 Ft, 20000 Ft. Coins: 5 Ft, 10 Ft, 20 Ft, 50 Ft, 100 Ft, 200 Ft. Prices are often rounded to the nearest 5 Ft. Card payment is widely accepted in cities, but smaller shops and markets may prefer cash.</p>
        </div>
    `;
    mainContent.appendChild(section1);

    // ==================== SECTION 2: SHOP TYPES ====================
    const section2 = document.createElement('section');
    section2.className = 'mb-8';
    section2.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 2: Types of Shops (Boltok tipusai)</h2>
        <p class="mb-4 text-slate-600">Hungary has various types of shops, from large supermarkets to small specialized stores.</p>
        <table class="mb-4 w-full border text-sm">
            <tr><th class="border px-2">Hungarian</th><th class="border px-2">English</th></tr>
            <tr><td class="border px-2 font-medium">bolt / uzlet</td><td class="border px-2">shop / store</td></tr>
            <tr><td class="border px-2 font-medium">aruhaz</td><td class="border px-2">department store</td></tr>
            <tr><td class="border px-2 font-medium">szupermarket</td><td class="border px-2">supermarket</td></tr>
            <tr><td class="border px-2 font-medium">piac</td><td class="border px-2">market</td></tr>
            <tr><td class="border px-2 font-medium">pekseg</td><td class="border px-2">bakery</td></tr>
            <tr><td class="border px-2 font-medium">hentes</td><td class="border px-2">butcher</td></tr>
            <tr><td class="border px-2 font-medium">zoldseges</td><td class="border px-2">greengrocer</td></tr>
            <tr><td class="border px-2 font-medium">gyogyszertar / patika</td><td class="border px-2">pharmacy</td></tr>
            <tr><td class="border px-2 font-medium">konyvbolt</td><td class="border px-2">bookshop</td></tr>
            <tr><td class="border px-2 font-medium">ruhazati bolt</td><td class="border px-2">clothing store</td></tr>
            <tr><td class="border px-2 font-medium">cipobolt</td><td class="border px-2">shoe shop</td></tr>
            <tr><td class="border px-2 font-medium">ekszerbolt</td><td class="border px-2">jewelry shop</td></tr>
            <tr><td class="border px-2 font-medium">ajandekbolt</td><td class="border px-2">gift shop</td></tr>
            <tr><td class="border px-2 font-medium">elektronikai bolt</td><td class="border px-2">electronics store</td></tr>
        </table>
    `;
    mainContent.appendChild(section2);

    // ==================== SECTION 3: PRICE EXPRESSIONS ====================
    const section3 = document.createElement('section');
    section3.className = 'mb-8';
    section3.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 3: Asking About Prices (Arak)</h2>
        <p class="mb-4 text-slate-600">Learn how to ask about prices and understand the responses.</p>
        <table class="mb-4 w-full border text-sm">
            <tr><th class="border px-2">Hungarian</th><th class="border px-2">English</th></tr>
            <tr><td class="border px-2 font-medium">Mennyibe kerul?</td><td class="border px-2">How much does it cost?</td></tr>
            <tr><td class="border px-2 font-medium">Mennyibe kerul ez?</td><td class="border px-2">How much does this cost?</td></tr>
            <tr><td class="border px-2 font-medium">Mi az ara?</td><td class="border px-2">What is the price?</td></tr>
            <tr><td class="border px-2 font-medium">Ez mennyit er?</td><td class="border px-2">How much is this worth?</td></tr>
            <tr><td class="border px-2 font-medium">... forintba kerul</td><td class="border px-2">It costs ... forints</td></tr>
            <tr><td class="border px-2 font-medium">olcso</td><td class="border px-2">cheap</td></tr>
            <tr><td class="border px-2 font-medium">draga</td><td class="border px-2">expensive</td></tr>
            <tr><td class="border px-2 font-medium">kedvezmeny</td><td class="border px-2">discount</td></tr>
            <tr><td class="border px-2 font-medium">akcio</td><td class="border px-2">sale / special offer</td></tr>
            <tr><td class="border px-2 font-medium">ingyenes</td><td class="border px-2">free (no cost)</td></tr>
            <tr><td class="border px-2 font-medium">ar</td><td class="border px-2">price</td></tr>
            <tr><td class="border px-2 font-medium">osszesen</td><td class="border px-2">total / altogether</td></tr>
        </table>
        <div class="bg-slate-50 p-4 rounded-lg mb-4">
            <p class="font-semibold mb-2">Price Examples:</p>
            <ul class="list-disc pl-6 space-y-1 text-slate-700">
                <li><strong>500 Ft</strong> - otszaz forint (five hundred forints)</li>
                <li><strong>1 200 Ft</strong> - ezerkettoszaz forint (one thousand two hundred forints)</li>
                <li><strong>3 500 Ft</strong> - haromezerotsszaz forint (three thousand five hundred forints)</li>
                <li><strong>10 000 Ft</strong> - tizezer forint (ten thousand forints)</li>
            </ul>
        </div>
    `;
    mainContent.appendChild(section3);

    // ==================== SECTION 4: SHOPPING PHRASES ====================
    const section4 = document.createElement('section');
    section4.className = 'mb-8';
    section4.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 4: Shopping Phrases (Vasarlasi kifejezesek)</h2>
        <p class="mb-4 text-slate-600">Essential phrases for shopping transactions.</p>
        <table class="mb-4 w-full border text-sm">
            <tr><th class="border px-2">Hungarian</th><th class="border px-2">English</th><th class="border px-2">Context</th></tr>
            <tr><td class="border px-2 font-medium">Miben segithetek?</td><td class="border px-2">How can I help you?</td><td class="border px-2">Shop assistant</td></tr>
            <tr><td class="border px-2 font-medium">Csak nezelodok.</td><td class="border px-2">I'm just looking.</td><td class="border px-2">Customer</td></tr>
            <tr><td class="border px-2 font-medium">Szeretnek venni...</td><td class="border px-2">I would like to buy...</td><td class="border px-2">Customer</td></tr>
            <tr><td class="border px-2 font-medium">Kerek egy...</td><td class="border px-2">I'd like a/one...</td><td class="border px-2">Customer</td></tr>
            <tr><td class="border px-2 font-medium">Van...?</td><td class="border px-2">Do you have...?</td><td class="border px-2">Customer</td></tr>
            <tr><td class="border px-2 font-medium">Nincs. / Elfogyott.</td><td class="border px-2">We don't have it. / Sold out.</td><td class="border px-2">Shop assistant</td></tr>
            <tr><td class="border px-2 font-medium">Mas szin/meret?</td><td class="border px-2">Another color/size?</td><td class="border px-2">Customer</td></tr>
            <tr><td class="border px-2 font-medium">Kiprobálhatom?</td><td class="border px-2">Can I try it?</td><td class="border px-2">Customer</td></tr>
            <tr><td class="border px-2 font-medium">Hol van a probafülke?</td><td class="border px-2">Where is the fitting room?</td><td class="border px-2">Customer</td></tr>
            <tr><td class="border px-2 font-medium">Jo lesz ez?</td><td class="border px-2">Will this be okay?</td><td class="border px-2">Either</td></tr>
            <tr><td class="border px-2 font-medium">Ezt kerem.</td><td class="border px-2">I'll take this one.</td><td class="border px-2">Customer</td></tr>
            <tr><td class="border px-2 font-medium">Megveszem.</td><td class="border px-2">I'll buy it.</td><td class="border px-2">Customer</td></tr>
            <tr><td class="border px-2 font-medium">Nem kell, koszonom.</td><td class="border px-2">No, thank you.</td><td class="border px-2">Customer</td></tr>
        </table>
    `;
    mainContent.appendChild(section4);

    // ==================== SECTION 5: PAYMENT PHRASES ====================
    const section5 = document.createElement('section');
    section5.className = 'mb-8';
    section5.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 5: Payment (Fizetes)</h2>
        <p class="mb-4 text-slate-600">Vocabulary and phrases for completing your purchase.</p>
        <table class="mb-4 w-full border text-sm">
            <tr><th class="border px-2">Hungarian</th><th class="border px-2">English</th></tr>
            <tr><td class="border px-2 font-medium">Hol fizethetek?</td><td class="border px-2">Where can I pay?</td></tr>
            <tr><td class="border px-2 font-medium">penztár</td><td class="border px-2">cash register / checkout</td></tr>
            <tr><td class="border px-2 font-medium">Keszpenzzel vagy kartyaval?</td><td class="border px-2">Cash or card?</td></tr>
            <tr><td class="border px-2 font-medium">Keszpenzzel kerem.</td><td class="border px-2">Cash, please.</td></tr>
            <tr><td class="border px-2 font-medium">Kartyaval fizetek.</td><td class="border px-2">I'll pay by card.</td></tr>
            <tr><td class="border px-2 font-medium">Elfogadnak kartyat?</td><td class="border px-2">Do you accept cards?</td></tr>
            <tr><td class="border px-2 font-medium">Tessek!</td><td class="border px-2">Here you go!</td></tr>
            <tr><td class="border px-2 font-medium">A visszajaro.</td><td class="border px-2">Here's your change.</td></tr>
            <tr><td class="border px-2 font-medium">Kerek szamlat.</td><td class="border px-2">I'd like a receipt.</td></tr>
            <tr><td class="border px-2 font-medium">Kell zacsko?</td><td class="border px-2">Do you need a bag?</td></tr>
            <tr><td class="border px-2 font-medium">Igen, kerek. / Nem, koszonom.</td><td class="border px-2">Yes, please. / No, thank you.</td></tr>
        </table>
        <div class="cultural-note p-4 rounded-lg mb-4">
            <h4 class="font-semibold text-teal-800 mb-2">Cultural Note: Shopping Bags</h4>
            <p class="text-slate-700 text-sm">In Hungary, shopping bags (zacsko or szatyor) usually cost extra. Many people bring their own reusable bags. When asked "Kell zacsko?" you can politely decline with "Nem, koszonom" if you have your own.</p>
        </div>
    `;
    mainContent.appendChild(section5);

    // ==================== STAGE 1: VOCABULARY RECOGNITION (12 items) ====================
    const stage1Data = [
        { hungarian: 'penz', english: 'money' },
        { hungarian: 'bolt', english: 'shop' },
        { hungarian: 'ar', english: 'price' },
        { hungarian: 'olcso', english: 'cheap' },
        { hungarian: 'draga', english: 'expensive' },
        { hungarian: 'penztár', english: 'cash register' },
        { hungarian: 'visszajaro', english: 'change' },
        { hungarian: 'szamla', english: 'receipt' },
        { hungarian: 'kedvezmeny', english: 'discount' },
        { hungarian: 'piac', english: 'market' },
        { hungarian: 'keszpenz', english: 'cash' },
        { hungarian: 'bankkartya', english: 'bank card' }
    ];

    let stage1Revealed = new Set();

    const stage1Section = document.createElement('section');
    stage1Section.className = 'mb-8';
    stage1Section.innerHTML = `
        <h2 class="text-xl font-semibold text-slate-700 mb-2">Stage 1: Vocabulary Recognition</h2>
        <p class="mb-4 text-slate-600">Click each card to reveal the English translation. Try to guess before clicking!</p>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3" id="stage1-exercise"></div>
        <div id="stage1-score" class="mt-4 text-slate-700 font-medium">Cards revealed: 0 / ${stage1Data.length}</div>
    `;
    mainContent.appendChild(stage1Section);

    const stage1Exercise = document.getElementById('stage1-exercise');
    const stage1Score = document.getElementById('stage1-score');

    stage1Data.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'vocab-card border-2 border-slate-300 rounded-lg p-4 text-center bg-white min-h-[80px] flex flex-col justify-center';
        card.innerHTML = `
            <span class="font-bold text-teal-700">${item.hungarian}</span>
            <span class="text-sm text-slate-500 hidden" id="stage1-english-${idx}">${item.english}</span>
        `;
        card.addEventListener('click', () => {
            if (!stage1Revealed.has(idx)) {
                stage1Revealed.add(idx);
                card.classList.add('revealed');
                document.getElementById(`stage1-english-${idx}`).classList.remove('hidden');
                stage1Score.textContent = `Cards revealed: ${stage1Revealed.size} / ${stage1Data.length}`;
            }
        });
        stage1Exercise.appendChild(card);
    });

    // ==================== STAGE 2: SHOP TYPE MATCHING (8 items) ====================
    const stage2Data = [
        { hungarian: 'pekseg', english: 'bakery' },
        { hungarian: 'hentes', english: 'butcher' },
        { hungarian: 'gyogyszertar', english: 'pharmacy' },
        { hungarian: 'konyvbolt', english: 'bookshop' },
        { hungarian: 'cipobolt', english: 'shoe shop' },
        { hungarian: 'zoldseges', english: 'greengrocer' },
        { hungarian: 'ekszerbolt', english: 'jewelry shop' },
        { hungarian: 'aruhaz', english: 'department store' }
    ];

    let stage2Selected = null;
    let stage2Matches = new Set();

    const stage2Section = document.createElement('section');
    stage2Section.className = 'mb-8';
    stage2Section.innerHTML = `
        <h2 class="text-xl font-semibold text-slate-700 mb-2">Stage 2: Shop Type Matching</h2>
        <p class="mb-4 text-slate-600">Match the Hungarian shop names with their English translations. Click a card on the left, then click its match on the right.</p>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="stage2-exercise">
            <div id="stage2-hungarian" class="space-y-2"></div>
            <div id="stage2-english" class="space-y-2"></div>
        </div>
        <div id="stage2-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${stage2Data.length}</div>
    `;
    mainContent.appendChild(stage2Section);

    const stage2Hungarian = document.getElementById('stage2-hungarian');
    const stage2English = document.getElementById('stage2-english');
    const stage2Score = document.getElementById('stage2-score');

    const shuffledStage2English = [...stage2Data].sort(() => Math.random() - 0.5);

    stage2Data.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'match-card border-2 border-slate-300 rounded-lg p-3 text-center bg-white';
        card.textContent = item.hungarian;
        card.dataset.index = idx;
        card.dataset.type = 'hungarian';
        card.addEventListener('click', () => handleStage2Click(card, 'hungarian', idx));
        stage2Hungarian.appendChild(card);
    });

    shuffledStage2English.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'match-card border-2 border-slate-300 rounded-lg p-3 text-center bg-white';
        card.textContent = item.english;
        card.dataset.originalIndex = stage2Data.findIndex(d => d.english === item.english);
        card.dataset.type = 'english';
        card.addEventListener('click', () => handleStage2Click(card, 'english', parseInt(card.dataset.originalIndex)));
        stage2English.appendChild(card);
    });

    function handleStage2Click(card, type, index) {
        if (card.classList.contains('correct')) return;

        if (stage2Selected === null) {
            stage2Selected = { card, type, index };
            card.classList.add('selected');
        } else if (stage2Selected.type === type) {
            stage2Selected.card.classList.remove('selected');
            stage2Selected = { card, type, index };
            card.classList.add('selected');
        } else {
            if (stage2Selected.index === index) {
                stage2Selected.card.classList.remove('selected');
                stage2Selected.card.classList.add('correct');
                card.classList.add('correct');
                stage2Matches.add(index);
                stage2Score.textContent = `Score: ${stage2Matches.size} / ${stage2Data.length}`;
            } else {

    const stage7Score = document.getElementById('stage7-score');
    let stage7Correct = 0;

    stage7Data.forEach((item, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'bg-slate-50 p-4 rounded-lg';
        wrapper.innerHTML = `
            <p class="font-medium text-slate-700 mb-3">${idx + 1}. ${item.situation}</p>
            <div class="flex flex-wrap gap-2" id="stage7-options-${idx}">
                ${item.options.map(opt => `
                    <button class="px-4 py-2 border-2 border-slate-300 rounded-lg bg-white hover:bg-slate-50 transition-colors stage7-btn" data-answer="${opt}">
                        ${opt}
                    </button>
                `).join('')}
            </div>
            <p class="mt-2 text-sm font-semibold stage7-feedback hidden"></p>
        `;
        stage7Exercise.appendChild(wrapper);

        const buttons = wrapper.querySelectorAll('.stage7-btn');
        buttons.forEach(btn => {
            btn.addEventListener('click', () => checkStage7(idx, btn, wrapper, buttons));
        });
    });

    function checkStage7(idx, btn, wrapper, buttons) {
        const feedback = wrapper.querySelector('.stage7-feedback');
        const correct = stage7Data[idx].correct;
        const wasCorrect = Array.from(buttons).some(b => b.classList.contains('bg-green-100'));

        buttons.forEach(b => {
            b.disabled = true;
            b.classList.remove('bg-green-100', 'border-green-500', 'bg-red-100', 'border-red-500', 'hover:bg-slate-50');
        });

        if (btn.dataset.answer === correct) {
            btn.classList.add('bg-green-100', 'border-green-500');
            feedback.textContent = `Correct! ${stage7Data[idx].explanation}`;
            feedback.className = 'mt-2 text-sm font-semibold text-green-600 stage7-feedback';
            if (!wasCorrect) stage7Correct++;
        } else {
            btn.classList.add('bg-red-100', 'border-red-500');
            buttons.forEach(b => {
                if (b.dataset.answer === correct) {
                    b.classList.add('bg-green-100', 'border-green-500');
                }
            });
            feedback.textContent = `Not quite. ${stage7Data[idx].explanation}`;
            feedback.className = 'mt-2 text-sm font-semibold text-red-600 stage7-feedback';
        }
        feedback.classList.remove('hidden');
        stage7Score.textContent = `Score: ${stage7Correct} / ${stage7Data.length}`;
    }

    // ==================== STAGE 8: FULL TRANSACTION WRITING (4 items) ====================
    const stage8Data = [
        { english: 'How much does this cost?', hungarian: 'Mennyibe kerul ez?' },
        { english: 'I would like to buy this bag.', hungarian: 'Szeretnek venni ezt a taskat.' },
        { english: 'Do you have a bigger size?', hungarian: 'Van nagyobb meret?' },
        { english: 'I\'ll pay by cash.', hungarian: 'Keszpenzzel fizetek.' }
    ];

    const stage8Section = document.createElement('section');
    stage8Section.className = 'mb-8';
    stage8Section.innerHTML = `
        <h2 class="text-xl font-semibold text-slate-700 mb-2">Stage 8: Translation Practice</h2>
        <p class="mb-4 text-slate-600">Translate these shopping sentences into Hungarian. Press Enter to check.</p>
        <div id="stage8-exercise" class="space-y-4"></div>
        <div id="stage8-score" class="mt-4 text-slate-700 font-medium">Score: 0 / ${stage8Data.length}</div>
    `;
    mainContent.appendChild(stage8Section);

    const stage8Exercise = document.getElementById('stage8-exercise');
    const stage8Score = document.getElementById('stage8-score');
    let stage8Results = new Array(stage8Data.length).fill(null);

    stage8Data.forEach((item, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'bg-slate-50 p-4 rounded-lg';
        wrapper.innerHTML = `
            <p class="font-medium text-slate-700 mb-2">${idx + 1}. "${item.english}"</p>
            <input type="text" class="border border-slate-300 rounded-md px-3 py-2 w-full focus:ring-2 focus:ring-teal-500 focus:border-teal-500"
                   placeholder="Type the Hungarian translation..." aria-label="Hungarian translation">
            <p class="mt-2 text-sm font-semibold stage8-feedback"></p>
        `;
        stage8Exercise.appendChild(wrapper);

        const input = wrapper.querySelector('input');
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') checkStage8(idx, input, wrapper);
        });
    });

    function checkStage8(idx, input, wrapper) {
        const feedback = wrapper.querySelector('.stage8-feedback');
        const item = stage8Data[idx];
        const userAnswer = normalizeHungarian(input.value).replace(/[!.,?]/g, '');
        const correctAnswer = normalizeHungarian(item.hungarian).replace(/[!.,?]/g, '');

        if (userAnswer === correctAnswer) {
            feedback.textContent = `Correct! "${item.hungarian}"`;
            feedback.className = 'mt-2 text-sm font-semibold text-green-600 stage8-feedback';
            stage8Results[idx] = true;
        } else if (removeAccents(userAnswer) === removeAccents(correctAnswer)) {
            feedback.textContent = `Almost! Watch accents: "${item.hungarian}"`;
            feedback.className = 'mt-2 text-sm font-semibold text-yellow-600 stage8-feedback';
            stage8Results[idx] = 'partial';
        } else if (input.value.trim() === '') {
            feedback.textContent = '';
            stage8Results[idx] = null;
        } else {
            feedback.textContent = `Try again. Expected: "${item.hungarian}"`;
            feedback.className = 'mt-2 text-sm font-semibold text-red-600 stage8-feedback';
            stage8Results[idx] = false;
        }

        const correct = stage8Results.filter(r => r === true).length;
        stage8Score.textContent = `Score: ${correct} / ${stage8Data.length}`;
    }

    // ==================== FINAL SUMMARY ====================
    const summarySection = document.createElement('section');
    summarySection.className = 'mb-8 mt-12 bg-gradient-to-r from-teal-50 to-slate-50 p-6 rounded-xl';
    summarySection.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Lesson Summary</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <h3 class="font-semibold text-teal-700 mb-2">Key Shopping Phrases</h3>
                <ul class="text-slate-700 space-y-1 text-sm">
                    <li><strong>Mennyibe kerul?</strong> - How much does it cost?</li>
                    <li><strong>Csak nezelodok</strong> - I'm just looking</li>
                    <li><strong>Szeretnek venni...</strong> - I would like to buy...</li>
                    <li><strong>Ezt kerem</strong> - I'll take this one</li>
                    <li><strong>Van kedvezmeny?</strong> - Is there a discount?</li>
                </ul>
            </div>
            <div>
                <h3 class="font-semibold text-teal-700 mb-2">Payment Phrases</h3>
                <ul class="text-slate-700 space-y-1 text-sm">
                    <li><strong>Hol fizethetek?</strong> - Where can I pay?</li>
                    <li><strong>Keszpenzzel kerem</strong> - Cash, please</li>
                    <li><strong>Kartyaval fizetek</strong> - I'll pay by card</li>
                    <li><strong>Kerek szamlat</strong> - I'd like a receipt</li>
                    <li><strong>A visszajaro</strong> - Here's your change</li>
                </ul>
            </div>
        </div>
        <div class="mt-4">
            <h3 class="font-semibold text-teal-700 mb-2">Remember</h3>
            <ul class="text-slate-700 space-y-1 text-sm">
                <li>Hungary uses the <strong>Forint (Ft / HUF)</strong> as currency</li>
                <li>Prices are often rounded to the nearest 5 Ft</li>
                <li>Shopping bags usually cost extra - bring your own!</li>
                <li>At markets, negotiation is sometimes possible</li>
            </ul>
        </div>
    `;
    mainContent.appendChild(summarySection);

    // ==================== VOCABULARY REFERENCE ====================
    const vocabSection = document.createElement('section');
    vocabSection.className = 'mb-8';
    vocabSection.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Complete Vocabulary Reference</h2>
        <p class="mb-4 text-slate-600">All vocabulary from this lesson for review:</p>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-slate-50 p-4 rounded-lg">
                <h4 class="font-semibold text-teal-700 mb-2">Money & Currency</h4>
                <ul class="text-sm space-y-1">
                    <li><strong>forint</strong> - Hungarian Forint</li>
                    <li><strong>penz</strong> - money</li>
                    <li><strong>keszpenz</strong> - cash</li>
                    <li><strong>bankjegy</strong> - banknote</li>
                    <li><strong>erme</strong> - coin</li>
                    <li><strong>bankkartya</strong> - bank card</li>
                    <li><strong>visszajaro</strong> - change</li>
                    <li><strong>szamla</strong> - receipt</li>
                </ul>
            </div>
            <div class="bg-slate-50 p-4 rounded-lg">
                <h4 class="font-semibold text-teal-700 mb-2">Shop Types</h4>
                <ul class="text-sm space-y-1">
                    <li><strong>bolt / uzlet</strong> - shop</li>
                    <li><strong>aruhaz</strong> - department store</li>
                    <li><strong>piac</strong> - market</li>
                    <li><strong>pekseg</strong> - bakery</li>
                    <li><strong>hentes</strong> - butcher</li>
                    <li><strong>gyogyszertar</strong> - pharmacy</li>
                    <li><strong>konyvbolt</strong> - bookshop</li>
                </ul>
            </div>
            <div class="bg-slate-50 p-4 rounded-lg">
                <h4 class="font-semibold text-teal-700 mb-2">Price Words</h4>
                <ul class="text-sm space-y-1">
                    <li><strong>ar</strong> - price</li>
                    <li><strong>olcso</strong> - cheap</li>
                    <li><strong>draga</strong> - expensive</li>
                    <li><strong>kedvezmeny</strong> - discount</li>
                    <li><strong>akcio</strong> - sale</li>
                    <li><strong>ingyenes</strong> - free</li>
                    <li><strong>osszesen</strong> - total</li>
                </ul>
            </div>
            <div class="bg-slate-50 p-4 rounded-lg">
                <h4 class="font-semibold text-teal-700 mb-2">Useful Items</h4>
                <ul class="text-sm space-y-1">
                    <li><strong>taska</strong> - bag (handbag)</li>
                    <li><strong>zacsko</strong> - bag (shopping)</li>
                    <li><strong>meret</strong> - size</li>
                    <li><strong>szin</strong> - color</li>
                    <li><strong>probafülke</strong> - fitting room</li>
                    <li><strong>penztár</strong> - checkout</li>
                </ul>
            </div>
        </div>
    `;
    mainContent.appendChild(vocabSection);

    </script>
</body>
</html>
