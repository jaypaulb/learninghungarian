<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 18: Shopping & Money - Learning Hungarian</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; }
        th, td { border: 1px solid #e2e8f0; padding: 0.5rem 1rem; text-align: center; }
        th { background: #f1f5f9; }
        .shop-highlight { color: #059669; font-weight: 600; }
    </style>
</head>
<body class="bg-slate-100 p-4 md:p-8">
    <header class="text-center mb-8">
        <div class="mb-4">
            <a href="../index.html" class="inline-flex items-center px-4 py-2 bg-slate-600 text-white text-sm font-medium rounded-lg hover:bg-slate-700 transition-colors">
                <svg class="mr-2 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                Back to Lessons
            </a>
        </div>
        <h1 class="text-3xl md:text-4xl font-bold text-slate-700">Lesson 18: Shopping & Money</h1>
        <p class="text-slate-600 mt-2 max-w-2xl mx-auto">Learn to shop and handle money transactions in Hungarian.</p>
    </header>
    <main class="max-w-4xl mx-auto bg-white rounded-xl shadow-md p-6" id="main-content"></main>
    <footer class="text-center mt-12 py-4 border-t border-slate-300">
        <p class="text-sm text-slate-500">&copy; 2024 Hungarian Language Lessons</p>
    </footer>
    <script>
    function normalizeHungarian(str) { return str.trim().toLowerCase(); }

    const mainContent = document.getElementById('main-content');

    // SECTION 1: Shop Types
    const section1 = document.createElement('section');
    section1.className = 'mb-8';
    section1.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 1: Types of Shops</h2>
        <div class="overflow-x-auto">
            <table class="text-sm">
                <thead><tr><th>Hungarian</th><th>English</th><th>What they sell</th></tr></thead>
                <tbody>
                    <tr><td class="shop-highlight">bolt</td><td>shop/store</td><td>general</td></tr>
                    <tr><td class="shop-highlight">aruhaz</td><td>department store</td><td>everything</td></tr>
                    <tr><td class="shop-highlight">szupermarket</td><td>supermarket</td><td>food, household</td></tr>
                    <tr><td class="shop-highlight">pekseg</td><td>bakery</td><td>bread, pastries</td></tr>
                    <tr><td class="shop-highlight">hentesuzlet</td><td>butcher shop</td><td>meat</td></tr>
                    <tr><td class="shop-highlight">gyogyszertar</td><td>pharmacy</td><td>medicine</td></tr>
                    <tr><td class="shop-highlight">konyvbolt</td><td>bookshop</td><td>books</td></tr>
                    <tr><td class="shop-highlight">ruhabolt</td><td>clothing store</td><td>clothes</td></tr>
                    <tr><td class="shop-highlight">piac</td><td>market</td><td>fresh produce</td></tr>
                </tbody>
            </table>
        </div>
    `;
    mainContent.appendChild(section1);

    // SECTION 2: Money & Currency
    const section2 = document.createElement('section');
    section2.className = 'mb-8';
    section2.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 2: Money & Currency</h2>
        <div class="bg-green-50 border-l-4 border-green-500 p-4 mb-4">
            <p class="text-slate-700">Hungarian currency is the <strong class="shop-highlight">forint (Ft / HUF)</strong></p>
        </div>
        <div class="overflow-x-auto">
            <table class="text-sm">
                <thead><tr><th>Hungarian</th><th>English</th></tr></thead>
                <tbody>
                    <tr><td class="shop-highlight">penz</td><td>money</td></tr>
                    <tr><td class="shop-highlight">forint</td><td>forint (currency)</td></tr>
                    <tr><td class="shop-highlight">bankjegy</td><td>banknote</td></tr>
                    <tr><td class="shop-highlight">erme</td><td>coin</td></tr>
                    <tr><td class="shop-highlight">aprópenz</td><td>small change</td></tr>
                    <tr><td class="shop-highlight">bankkartya</td><td>bank card</td></tr>
                    <tr><td class="shop-highlight">hitelkartya</td><td>credit card</td></tr>
                    <tr><td class="shop-highlight">keszpenz</td><td>cash</td></tr>
                </tbody>
            </table>
        </div>
    `;
    mainContent.appendChild(section2);

    // SECTION 3: Shopping Phrases
    const section3 = document.createElement('section');
    section3.className = 'mb-8';
    section3.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 3: Shopping Phrases</h2>
        <div class="space-y-3">
            <div class="bg-blue-50 p-4 rounded-lg">
                <h3 class="font-semibold text-blue-800 mb-2">Asking for Help</h3>
                <ul class="text-sm space-y-1">
                    <li><span class="shop-highlight">Segithetnek?</span> - Can I help you?</li>
                    <li><span class="shop-highlight">Keresek...</span> - I'm looking for...</li>
                    <li><span class="shop-highlight">Van...?</span> - Do you have...?</li>
                    <li><span class="shop-highlight">Hol talalok...?</span> - Where can I find...?</li>
                </ul>
            </div>
            <div class="bg-purple-50 p-4 rounded-lg">
                <h3 class="font-semibold text-purple-800 mb-2">Asking About Price</h3>
                <ul class="text-sm space-y-1">
                    <li><span class="shop-highlight">Mennyibe kerul?</span> - How much does it cost?</li>
                    <li><span class="shop-highlight">Mi az ara?</span> - What's the price?</li>
                    <li><span class="shop-highlight">Tul draga.</span> - Too expensive.</li>
                    <li><span class="shop-highlight">Van olcsobb?</span> - Is there a cheaper one?</li>
                </ul>
            </div>
            <div class="bg-orange-50 p-4 rounded-lg">
                <h3 class="font-semibold text-orange-800 mb-2">Buying & Paying</h3>
                <ul class="text-sm space-y-1">
                    <li><span class="shop-highlight">Ezt kerem.</span> - I'll take this.</li>
                    <li><span class="shop-highlight">Keszpenzzel fizetek.</span> - I'll pay with cash.</li>
                    <li><span class="shop-highlight">Kartyaval fizetek.</span> - I'll pay by card.</li>
                    <li><span class="shop-highlight">Adhat blokkot?</span> - Can I have a receipt?</li>
                </ul>
            </div>
        </div>
    `;
    mainContent.appendChild(section3);

    // SECTION 4: Numbers Review (Prices)
    const section4 = document.createElement('section');
    section4.className = 'mb-8';
    section4.innerHTML = `
        <h2 class="text-2xl font-bold text-slate-700 mb-4">Section 4: Prices & Numbers</h2>
        <div class="overflow-x-auto">
            <table class="text-sm">
                <thead><tr><th>Price</th><th>Hungarian</th></tr></thead>
                <tbody>
                    <tr><td>100 Ft</td><td class="shop-highlight">szaz forint</td></tr>
                    <tr><td>500 Ft</td><td class="shop-highlight">otszaz forint</td></tr>
                    <tr><td>1,000 Ft</td><td class="shop-highlight">ezer forint</td></tr>
                    <tr><td>2,500 Ft</td><td class="shop-highlight">ketezor-otszaz forint</td></tr>
                    <tr><td>5,000 Ft</td><td class="shop-highlight">otezer forint</td></tr>
                    <tr><td>10,000 Ft</td><td class="shop-highlight">tizezer forint</td></tr>
                </tbody>
            </table>
        </div>
    `;
    mainContent.appendChild(section4);

    // STAGE 1: Shop Vocabulary
    const stage1Questions = [
        { hungarian: 'bolt', english: 'shop' },
        { hungarian: 'pekseg', english: 'bakery' },
        { hungarian: 'gyogyszertar', english: 'pharmacy' },
        { hungarian: 'piac', english: 'market' },
        { hungarian: 'aruhaz', english: 'department store' },
        { hungarian: 'ruhabolt', english: 'clothing store' },
        { hungarian: 'konyvbolt', english: 'bookshop' },
        { hungarian: 'szupermarket', english: 'supermarket' }
    ];

    const stage1Section = document.createElement('section');
    stage1Section.className = 'mb-8';
    stage1Section.innerHTML = '<h2 class="text-2xl font-bold text-slate-700 mb-2">Stage 1: Shop Vocabulary</h2><p class="mb-4 text-slate-600">What type of shop is it?</p><div id="stage1-exercises" class="space-y-3"></div><div id="stage1-score" class="mt-4 text-slate-700 font-medium"></div>';
    mainContent.appendChild(stage1Section);

    const stage1Container = document.getElementById('stage1-exercises');
    stage1Questions.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col md:flex-row items-start md:items-center gap-2 p-3 bg-green-50 rounded-lg';
        wrapper.innerHTML = '<span class="min-w-[150px] font-semibold text-green-700">' + q.hungarian + '</span><input type="text" class="border border-slate-300 rounded-md px-3 py-1 w-48 focus:ring-2 focus:ring-green-500" placeholder="English meaning..."><span class="text-sm font-semibold"></span>';
        wrapper.querySelector('input').addEventListener('keydown', (e) => { if (e.key === 'Enter') checkStage1(idx); });
        stage1Container.appendChild(wrapper);
    });

    function checkStage1(idx) {
        const input = stage1Container.children[idx].querySelector('input');
        const feedback = stage1Container.children[idx].querySelector('span:last-child');
        const user = normalizeHungarian(input.value);
        const correct = stage1Questions[idx].english;
        if (user === correct || user.includes(correct)) { feedback.textContent = 'Correct!'; feedback.className = 'text-sm text-green-600 font-semibold'; }
        else if (user === '') { feedback.textContent = ''; }
        else { feedback.textContent = 'Answer: ' + correct; feedback.className = 'text-sm text-red-600 font-semibold'; }
        updateStage1Score();
    }

    function updateStage1Score() {
        let correct = 0;
        for (let i = 0; i < stage1Questions.length; i++) {
            let user = normalizeHungarian(stage1Container.children[i].querySelector('input').value);
            if (user === stage1Questions[i].english || user.includes(stage1Questions[i].english)) correct++;
        }
        document.getElementById('stage1-score').textContent = 'Score: ' + correct + ' / ' + stage1Questions.length;
    }

    // STAGE 2: Money Vocabulary
    const stage2Questions = [
        { english: 'money', hungarian: 'penz' },
        { english: 'cash', hungarian: 'keszpenz' },
        { english: 'credit card', hungarian: 'hitelkartya' },
        { english: 'bank card', hungarian: 'bankkartya' },
        { english: 'coin', hungarian: 'erme' },
        { english: 'banknote', hungarian: 'bankjegy' }
    ];

    const stage2Section = document.createElement('section');
    stage2Section.className = 'mb-8';
    stage2Section.innerHTML = '<h2 class="text-2xl font-bold text-slate-700 mb-2">Stage 2: Money Vocabulary</h2><p class="mb-4 text-slate-600">Write the Hungarian word.</p><div id="stage2-exercises" class="space-y-3"></div><div id="stage2-score" class="mt-4 text-slate-700 font-medium"></div>';
    mainContent.appendChild(stage2Section);

    const stage2Container = document.getElementById('stage2-exercises');
    stage2Questions.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col md:flex-row items-start md:items-center gap-2 p-3 bg-blue-50 rounded-lg';
        wrapper.innerHTML = '<span class="min-w-[150px] font-semibold text-blue-700">' + q.english + '</span><input type="text" class="border border-slate-300 rounded-md px-3 py-1 w-40 focus:ring-2 focus:ring-blue-500" placeholder="Hungarian..."><span class="text-sm font-semibold"></span>';
        wrapper.querySelector('input').addEventListener('keydown', (e) => { if (e.key === 'Enter') checkStage2(idx); });
        stage2Container.appendChild(wrapper);
    });

    function checkStage2(idx) {
        const input = stage2Container.children[idx].querySelector('input');
        const feedback = stage2Container.children[idx].querySelector('span:last-child');
        const user = normalizeHungarian(input.value);
        const correct = stage2Questions[idx].hungarian;
        if (user === correct) { feedback.textContent = 'Correct!'; feedback.className = 'text-sm text-green-600 font-semibold'; }
        else if (user === '') { feedback.textContent = ''; }
        else { feedback.textContent = 'Answer: ' + correct; feedback.className = 'text-sm text-red-600 font-semibold'; }
        updateStage2Score();
    }

    function updateStage2Score() {
        let correct = 0;
        for (let i = 0; i < stage2Questions.length; i++) {
            if (normalizeHungarian(stage2Container.children[i].querySelector('input').value) === stage2Questions[i].hungarian) correct++;
        }
        document.getElementById('stage2-score').textContent = 'Score: ' + correct + ' / ' + stage2Questions.length;
    }

    // STAGE 3: Shopping Phrases
    const stage3Questions = [
        { english: 'How much does it cost?', hungarian: 'Mennyibe kerul?', hint: 'Mennyibe...' },
        { english: 'I\'m looking for...', hungarian: 'Keresek...', hint: 'Keresek' },
        { english: 'I\'ll take this.', hungarian: 'Ezt kerem.', hint: 'Ezt...' },
        { english: 'Too expensive.', hungarian: 'Tul draga.', hint: 'Tul...' },
        { english: 'I\'ll pay by card.', hungarian: 'Kartyaval fizetek.', hint: 'Kartyaval...' },
        { english: 'Can I have a receipt?', hungarian: 'Adhat blokkot?', hint: 'Adhat...' }
    ];

    const stage3Section = document.createElement('section');
    stage3Section.className = 'mb-8';
    stage3Section.innerHTML = '<h2 class="text-2xl font-bold text-slate-700 mb-2">Stage 3: Shopping Phrases</h2><p class="mb-4 text-slate-600">Translate the shopping phrases.</p><div id="stage3-exercises" class="space-y-4"></div><div id="stage3-score" class="mt-4 text-slate-700 font-medium"></div>';
    mainContent.appendChild(stage3Section);

    const stage3Container = document.getElementById('stage3-exercises');
    stage3Questions.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'p-4 bg-purple-50 rounded-lg';
        wrapper.innerHTML = '<p class="font-semibold text-slate-800 mb-1">' + q.english + '</p><p class="text-xs text-slate-500 mb-2 italic">Hint: ' + q.hint + '</p><div class="flex flex-col md:flex-row items-start md:items-center gap-2"><input type="text" class="border border-slate-300 rounded-md px-3 py-2 w-full md:w-80 focus:ring-2 focus:ring-purple-500" placeholder="Type Hungarian..."><span class="text-sm font-semibold"></span></div>';
        wrapper.querySelector('input').addEventListener('keydown', (e) => { if (e.key === 'Enter') checkStage3(idx); });
        stage3Container.appendChild(wrapper);
    });

    function checkStage3(idx) {
        const input = stage3Container.children[idx].querySelector('input');
        const feedback = stage3Container.children[idx].querySelector('span');
        const user = normalizeHungarian(input.value);
        const correct = normalizeHungarian(stage3Questions[idx].hungarian);
        if (user === correct) { feedback.textContent = 'Correct!'; feedback.className = 'text-sm text-green-600 font-semibold'; }
        else if (user === '') { feedback.textContent = ''; }
        else { feedback.textContent = 'Answer: ' + stage3Questions[idx].hungarian; feedback.className = 'text-sm text-red-600 font-semibold'; }
        updateStage3Score();
    }

    function updateStage3Score() {
        let correct = 0;
        for (let i = 0; i < stage3Questions.length; i++) {
            if (normalizeHungarian(stage3Container.children[i].querySelector('input').value) === normalizeHungarian(stage3Questions[i].hungarian)) correct++;
        }
        document.getElementById('stage3-score').textContent = 'Score: ' + correct + ' / ' + stage3Questions.length;
    }

    // STAGE 4: Shopping Dialogue
    const stage4Questions = [
        { seller: 'Segithetnek?', response: 'Igen, keresek egy feher polot.', english: 'Can I help? -> Yes, I\'m looking for a white t-shirt.' },
        { seller: 'Mennyibe kerul ez?', response: 'Hatezer forint.', english: 'How much? -> 6,000 forints.' },
        { seller: 'Hogyan fizet?', response: 'Kartyaval fizetek.', english: 'How will you pay? -> I\'ll pay by card.' },
        { seller: 'Parancsol meg valamit?', response: 'Nem, koszonom.', english: 'Anything else? -> No, thank you.' }
    ];

    const stage4Section = document.createElement('section');
    stage4Section.className = 'mb-8';
    stage4Section.innerHTML = '<h2 class="text-2xl font-bold text-slate-700 mb-2">Stage 4: Shopping Dialogue</h2><p class="mb-4 text-slate-600">Complete the shopping dialogue.</p><div id="stage4-exercises" class="space-y-4"></div><div id="stage4-score" class="mt-4 text-slate-700 font-medium"></div>';
    mainContent.appendChild(stage4Section);

    const stage4Container = document.getElementById('stage4-exercises');
    stage4Questions.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'p-4 bg-orange-50 rounded-lg';
        wrapper.innerHTML = '<p class="font-semibold text-orange-700 mb-1">Seller: "' + q.seller + '"</p><p class="text-xs text-slate-500 mb-2 italic">' + q.english + '</p><div class="flex flex-col md:flex-row items-start md:items-center gap-2"><span class="font-semibold">You:</span><input type="text" class="border border-slate-300 rounded-md px-3 py-2 w-full md:w-80 focus:ring-2 focus:ring-orange-500" placeholder="Your response..."><span class="text-sm font-semibold"></span></div>';
        wrapper.querySelector('input').addEventListener('keydown', (e) => { if (e.key === 'Enter') checkStage4(idx); });
        stage4Container.appendChild(wrapper);
    });

    function checkStage4(idx) {
        const input = stage4Container.children[idx].querySelector('input');
        const feedback = stage4Container.children[idx].querySelector('span:last-child');
        const user = normalizeHungarian(input.value);
        const correct = normalizeHungarian(stage4Questions[idx].response);
        if (user === correct) { feedback.textContent = 'Correct!'; feedback.className = 'text-sm text-green-600 font-semibold'; }
        else if (user === '') { feedback.textContent = ''; }
        else { feedback.textContent = 'Answer: ' + stage4Questions[idx].response; feedback.className = 'text-sm text-red-600 font-semibold'; }
        updateStage4Score();
    }

    function updateStage4Score() {
        let correct = 0;
        for (let i = 0; i < stage4Questions.length; i++) {
            if (normalizeHungarian(stage4Container.children[i].querySelector('input').value) === normalizeHungarian(stage4Questions[i].response)) correct++;
        }
        document.getElementById('stage4-score').textContent = 'Score: ' + correct + ' / ' + stage4Questions.length;
    }

    // SUMMARY
    const summarySection = document.createElement('section');
    summarySection.className = 'mb-8 p-6 bg-gradient-to-r from-green-50 to-blue-50 rounded-lg border border-green-200';
    summarySection.innerHTML = '<h2 class="text-2xl font-bold text-slate-700 mb-4">Summary: Shopping & Money</h2><div class="grid md:grid-cols-2 gap-4"><div><h3 class="font-semibold text-green-800 mb-2">Key Phrases:</h3><ul class="list-disc pl-6 space-y-1 text-sm text-slate-700"><li>Mennyibe kerul? (How much?)</li><li>Ezt kerem. (I\'ll take this.)</li><li>Kartyaval fizetek. (Card payment.)</li><li>Van olcsobb? (Cheaper one?)</li></ul></div><div><h3 class="font-semibold text-green-800 mb-2">Currency:</h3><ul class="list-disc pl-6 space-y-1 text-sm text-slate-700"><li>forint (Ft) - Hungarian currency</li><li>ezer = 1,000</li><li>tizezer = 10,000</li><li>szazforint = 100 Ft</li></ul></div></div><p class="mt-4 text-sm text-slate-600">Continue to Lesson 19 for modal verbs!</p>';
    mainContent.appendChild(summarySection);

    </script>
</body>
</html>
