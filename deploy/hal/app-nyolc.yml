# Copy target on hal: ~/docker/appdata/traefik3/rules/hal2020/app-nyolc.yml
# Learning site at magyarul.nyolc.cc ("in Hungarian") — app-based
# subdomain per stack convention (apex left free for a future domain
# landing page). Covered by the existing *.DOMAINNAME_1 wildcard DNS.
#
# TESTING GATE (2026-07-05, Jaypaul's call): chain-oauth — the stack's
# existing Google forward-auth, whitelisted to Jaypaul's account — so only
# he can reach the site while it's under construction. Swap back to
# chain-no-auth at public launch.
http:
  routers:
    nyolc-rtr:
      rule: 'Host(`magyarul.{{env "DOMAINNAME_1"}}`)'
      entryPoints:
        - websecure-external
        - websecure-internal
      middlewares:
        # Unbundled chain-oauth (rate-limit + secure-headers + oauth) so the
        # headers middleware can be a nyolc-specific copy allowing the
        # microphone (speaking exercises). Global middlewares untouched.
        - middlewares-rate-limit
        - middlewares-nyolc-headers
        - middlewares-oauth
      service: nyolc-svc
      tls:
        certResolver: dns-cloudflare

  services:
    nyolc-svc:
      loadBalancer:
        servers:
          - url: "http://nyolc:3000"

  middlewares:
    # Copy of middlewares-secure-headers with microphone=(self) for the
    # speaking exercises. Scoped to the nyolc router only.
    middlewares-nyolc-headers:
      headers:
        accessControlAllowMethods: [GET, OPTIONS, PUT, POST, DELETE, PATCH]
        accessControlMaxAge: 100
        hostsProxyHeaders: ["X-Forwarded-Host"]
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        customFrameOptionsValue: SAMEORIGIN
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "same-origin"
        permissionsPolicy: "camera=(), microphone=(self), geolocation=(), payment=(), usb=()"
        customResponseHeaders:
          X-Robots-Tag: "none,noindex,nofollow,noarchive,nosnippet,notranslate,noimageindex"
          server: ""
        customRequestHeaders:
          X-Forwarded-Proto: https
